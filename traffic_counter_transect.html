<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Traffic Counter — Transect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap');

  :root {
    --bg:        #f0f0ec;
    --panel:     #ffffff;
    --border:    #b0b0a8;
    --text:      #111111;
    --dim:       #555555;
    --subdim:    #888880;
    --car-col:   #c8000a;
    --truck-col: #b35c00;
    --moto-col:  #5500cc;
    --bike-col:  #007a7a;
    --ped-col:   #1a7a00;
    --green:     #0a8a30;
    --red:       #c8000a;
    --orange:    #b35c00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Oswald', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    gap: 10px;
  }

  /* ── Header ── */
  header {
    width: 100%; max-width: 520px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 3px solid var(--text);
  }
  header h1 { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  header h1 .mode-badge {
    display: inline-block;
    background: var(--moto-col);
    color: #fff;
    font-size: 0.6rem;
    letter-spacing: 2px;
    padding: 2px 7px;
    border-radius: 3px;
    vertical-align: middle;
    margin-left: 6px;
  }
  .header-links { display: flex; gap: 8px; align-items: center; }
  .header-link {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--dim); text-decoration: none;
    border: 2px solid var(--border); border-radius: 4px; padding: 4px 8px;
    transition: color 0.15s, border-color 0.15s;
  }
  .header-link:hover { color: var(--text); border-color: var(--text); }

  #session-time {
    font-family: 'Share Tech Mono', monospace; font-size: 0.95rem; font-weight: 700;
    color: var(--dim); transition: color 0.3s;
  }
  #session-time.running { color: var(--green); }
  #session-time.ended   { color: var(--orange); }

  /* ── Session bar ── */
  .session-bar { width: 100%; max-width: 520px; display: flex; gap: 8px; align-items: stretch; }
  .session-info {
    flex: 1; background: var(--panel); border: 2px solid var(--border); border-radius: 6px;
    display: flex; flex-direction: column; justify-content: center; padding: 6px 12px; gap: 3px;
  }
  .session-info .row { display: flex; justify-content: space-between; font-size: 0.65rem; letter-spacing: 1px; }
  .session-info .row .k { color: var(--dim); text-transform: uppercase; font-weight: 500; }
  .session-info .row .v { font-family: 'Share Tech Mono', monospace; color: var(--text); font-weight: 700; font-size: 0.65rem; }
  .session-info .row .v.empty { color: var(--subdim); font-weight: 400; }

  .btn-session {
    width: 70px; border: none; border-radius: 6px;
    font-family: 'Oswald', sans-serif; font-size: 0.75rem; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    transition: filter 0.1s, transform 0.1s; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .btn-session:active { transform: scale(0.95); }
  .btn-session:disabled { opacity: 0.25; cursor: default; }
  .btn-start { background: var(--green); color: #fff; border: 2px solid #065e20; }
  .btn-start:hover:not(:disabled) { filter: brightness(1.1); }
  .btn-end   { background: var(--red);   color: #fff; border: 2px solid #8a0007; }
  .btn-end:hover:not(:disabled)   { filter: brightness(1.1); }

  /* ── Status badge ── */
  .status-badge {
    width: 100%; max-width: 520px; border-radius: 6px; padding: 8px 14px;
    font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; text-align: center; font-weight: 700;
  }
  .status-badge.idle    { background: #e0e0d8; color: var(--dim);    border: 2px solid var(--border); }
  .status-badge.running { background: #d4f0da; color: var(--green);  border: 2px solid #7dcc90; }
  .status-badge.ended   { background: #fde8cc; color: var(--orange); border: 2px solid #e8b070; }

  /* ── Notes & direction config ── */
  .notes-row, .dir-config {
    width: 100%; max-width: 520px; display: flex; gap: 8px; align-items: center;
  }
  .notes-row label, .dir-config label {
    font-size: 0.65rem; letter-spacing: 2px; color: var(--dim);
    text-transform: uppercase; white-space: nowrap; font-weight: 700;
  }
  .notes-input, .dir-input {
    flex: 1; background: var(--panel); border: 2px solid var(--border); border-radius: 4px;
    color: var(--text); font-family: 'Oswald', sans-serif; font-size: 0.85rem; font-weight: 500;
    padding: 7px 10px; letter-spacing: 0.5px; min-width: 0;
  }
  .notes-input:focus, .dir-input:focus { outline: none; border-color: var(--text); }
  .notes-input::placeholder { color: var(--subdim); font-weight: 400; }
  .dir-input { text-align: center; font-weight: 700; }

  .btn-compass {
    padding: 7px 10px; border: 2px solid var(--border); border-radius: 4px;
    background: var(--panel); color: var(--dim); font-family: 'Oswald', sans-serif;
    font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; white-space: nowrap; transition: color 0.15s, border-color 0.15s;
  }
  .btn-compass:hover { color: var(--text); border-color: var(--text); }
  .btn-compass.active { color: var(--green); border-color: var(--green); background: #d4f0da; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: var(--text);
    color: #fff;
    border-radius: 10px;
    padding: 20px 24px;
    min-width: 280px;
    max-width: 360px;
    text-align: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast .toast-label { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #aaa; margin-bottom: 12px; }
  #toast .toast-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  #toast .toast-row:last-child { margin-bottom: 0; }
  #toast .toast-dir { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #aaa; min-width: 36px; text-align: right; }
  #toast .toast-val { font-size: 0.95rem; font-weight: 700; letter-spacing: 1px; color: #fff; text-align: left; line-height: 1.25; }

  /* ── Total bar ── */
  .total-bar {
    width: 100%; max-width: 520px; background: var(--text); border-radius: 6px;
    padding: 9px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .total-bar .label { font-size: 0.7rem; letter-spacing: 2px; color: #aaa; text-transform: uppercase; font-weight: 500; }
  .total-bar .value { font-family: 'Share Tech Mono', monospace; font-size: 1.9rem; font-weight: 700; color: #fff; }

  /* ── Counter cards — compact horizontal layout ── */
  .counters { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 7px; }

  .counter-card {
    background: var(--panel); border: 2px solid var(--border); border-radius: 8px;
    display: flex; align-items: stretch; overflow: hidden; height: 72px; transition: opacity 0.2s;
  }
  .counter-card.locked { opacity: 0.35; pointer-events: none; }

  .car   { --accent: var(--car-col); }
  .truck { --accent: var(--truck-col); }
  .moto  { --accent: var(--moto-col); }
  .bike  { --accent: var(--bike-col); }
  .ped   { --accent: var(--ped-col); }

  .btn-dir {
    width: 76px; min-width: 76px; height: 100%;
    border: none; background: var(--accent); color: #fff;
    font-family: 'Oswald', sans-serif; font-weight: 700;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: filter 0.1s, transform 0.1s; text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding: 0; flex-shrink: 0;
  }
  .btn-dir .dir-sym  { font-size: 0.65rem; font-family: 'Share Tech Mono', monospace; letter-spacing: -1px; opacity: 0.85; line-height: 1.3; }
  .btn-dir .dir-plus { font-size: 1.4rem; line-height: 1; }
  .btn-dir:active { transform: scale(0.92); filter: brightness(0.85); }

  .btn-min {
    width: 30px; min-width: 30px; height: 100%;
    border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    background: #eaeae6; color: var(--dim);
    font-size: 1rem; font-weight: 700;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: background 0.1s, color 0.1s; flex-shrink: 0;
  }
  .btn-min:active { color: var(--red); background: #fde0e0; }

  .side-count {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; min-width: 0;
  }

  .dir-count {
    font-family: 'Share Tech Mono', monospace; font-size: 2rem; font-weight: 700;
    line-height: 1; color: var(--accent); transition: transform 0.1s ease;
  }
  .dir-count.bump { transform: scale(1.3); }

  .card-center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 4px; background: #f7f7f3;
    border-top: 4px solid var(--accent);
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    min-width: 32px; max-width: 38px; flex-shrink: 0;
  }
  .card-center .lbl {
    font-size: 1.2rem; line-height: 1; text-align: center;
  }

  /* ── Map ── */
  .map-container {
    width: 100%; max-width: 520px;
    border: 2px solid var(--border); border-radius: 8px; overflow: hidden;
    display: none; /* hidden until session starts */
  }
  .map-container.visible { display: block; }
  #map { height: 260px; width: 100%; }
  .map-legend {
    background: var(--panel); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 10px;
    border-top: 1px solid var(--border); align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .btn-save-map {
    margin-left: auto;
    padding: 5px 12px;
    border: 2px solid var(--border); border-radius: 4px;
    background: var(--panel); color: var(--dim);
    font-family: 'Oswald', sans-serif; font-size: 0.65rem; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .btn-save-map:hover { color: var(--text); border-color: var(--text); }
  .btn-save-map:disabled { opacity: 0.4; cursor: default; }

  /* ── Footer ── */
  footer { width: 100%; max-width: 520px; display: flex; gap: 8px; }
  .btn-action {
    flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--dim); font-family: 'Oswald', sans-serif;
    font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    font-weight: 700; transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .btn-action:hover { color: var(--text); border-color: var(--text); }
  .btn-action.danger:hover { color: var(--red); border-color: var(--red); background: #fff0f0; }
  .btn-action.undo:hover { color: var(--orange); border-color: var(--orange); background: #fff8ee; }
  .btn-action:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  /* ── Log ── */
  #log {
    width: 100%; max-width: 520px; background: var(--panel); border: 2px solid var(--border);
    border-radius: 6px; padding: 8px 12px; font-family: 'Share Tech Mono', monospace;
    font-size: 0.67rem; color: var(--dim); max-height: 110px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px;
  }
  #log .entry { display: flex; justify-content: space-between; gap: 8px; }
  #log .entry .msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log .entry .ts  { color: var(--subdim); white-space: nowrap; }

  /* ── Branding ── */
  .branding {
    width: 100%; max-width: 520px; display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 0 4px; border-top: 2px solid var(--border); margin-top: 2px;
  }
  .branding-logo {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #cc785c, #a05a3c);
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0;
    box-shadow: 0 0 8px rgba(160,90,60,0.35);
  }
  .branding-text { display: flex; flex-direction: column; gap: 1px; }
  .branding-text .built { font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase; color: var(--subdim); }
  .branding-text .name  {
    font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, #a05a3c, #cc785c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
</style>
</head>
<body>

<header>
  <h1>Traffic Counter <span class="mode-badge">TRANSECT</span></h1>
  <div class="header-links">
    <a class="header-link" href="index.html">&#8592; Menu</a>
    <div id="session-time">00:00:00</div>
  </div>
</header>

<div class="session-bar">
  <div class="session-info">
    <div class="row"><span class="k">Start</span>    <span class="v empty" id="disp-start">--</span></div>
    <div class="row"><span class="k">End</span>      <span class="v empty" id="disp-end">--</span></div>
    <div class="row"><span class="k">Duration</span> <span class="v empty" id="disp-dur">--</span></div>
    <div class="row"><span class="k">GPS</span>      <span class="v empty" id="disp-gps">--</span></div>
    <div class="row"><span class="k">Route pts</span><span class="v empty" id="disp-pts">--</span></div>
  </div>
  <button class="btn-session btn-start" id="btn-start" onclick="startSession()">START</button>
  <button class="btn-session btn-end"   id="btn-end"   onclick="endSession()" disabled>END</button>
</div>

<div class="status-badge idle" id="status-badge">Press Start to begin your transect</div>

<div class="notes-row">
  <label>Location / Notes</label>
  <input class="notes-input" id="notes" placeholder="e.g. Dune path Zandvoort north, sunny">
</div>

<div class="dir-config">
  <label>Dir A</label>
  <input class="dir-input" id="lbl-a" value="Tegemoet" oninput="updateDirLabels()">
  <label>Dir B</label>
  <input class="dir-input" id="lbl-b" value="Meegaand" oninput="updateDirLabels()">
  <button class="btn-compass" id="btn-compass" onclick="autoDirections()" title="Fill directions from compass">Compass</button>
</div>

<div class="total-bar">
  <span class="label">Total counted</span>
  <span class="value" id="grand-total">0</span>
</div>

<div class="counters" id="counters"></div>

<!-- Leaflet map — shown once session starts -->
<div class="map-container" id="map-container">
  <div id="map"></div>
  <div class="map-legend" id="map-legend">
    <button class="btn-save-map" id="btn-save-map" onclick="saveMapImage()">Save PNG</button>
  </div>
</div>

<footer>
  <button class="btn-action undo" id="btn-undo-last" onclick="undoLast()" disabled>Undo Last</button>
  <button class="btn-action" onclick="exportCSV()">Export CSV</button>
  <button class="btn-action" onclick="exportZip()">Export ZIP</button>
  <button class="btn-action danger" onclick="resetAll()">Reset</button>
</footer>

<div id="log"></div>

<div id="toast">
  <div class="toast-label">Directions set</div>
  <div class="toast-row"><span class="toast-dir">Dir A</span><span class="toast-val" id="toast-a"></span></div>
  <div class="toast-row"><span class="toast-dir">Dir B</span><span class="toast-val" id="toast-b"></span></div>
</div>

<div class="branding">
  <div class="branding-logo">*</div>
  <div class="branding-text">
    <span class="built">Built with AI by</span>
    <span class="name">Claude - Anthropic</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const SEP = ';';

  const TYPES = [
    { id: 'car',   label: '🚗',  color: '#cc0000' },
    { id: 'truck', label: '🚛',  color: '#e07800' },
    { id: 'moto',  label: '🏍',  color: '#e6b800' },
    { id: 'bike',  label: '🚲',  color: '#7700cc' },
    { id: 'ped',   label: '🚶',  color: '#d4007a' },
  ];

  const counts = {};
  TYPES.forEach(t => { counts[t.id] = { a: 0, b: 0 }; });

  let history    = [];   // { type, dir, ts, lat, lon, acc }
  let routeLog   = [];   // { ts, lat, lon, acc } — one point every ROUTE_INTERVAL_MS
  let startTime  = null;
  let endTime    = null;
  let timerInterval   = null;
  let routeInterval   = null;
  let gpsWatchId      = null;
  let wakeLock        = null;

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', reacquireWakeLock);
    } catch (e) { /* not critical, ignore */ }
  }

  async function reacquireWakeLock() {
    if (wakeLock !== null && document.visibilityState === 'visible' && state === 'running') {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    document.removeEventListener('visibilitychange', reacquireWakeLock);
  }
  let state      = 'idle';

  // Current GPS position (updated continuously during session)
  let currentPos = null; // { lat, lon, acc }

  const ROUTE_INTERVAL_MS   = 10000; // log route point every 10 seconds
  const GPS_ACCURACY_GOOD   = 25;    // meters — consider reliable

  // ── Leaflet map ──
  let map        = null;
  let routeLine  = null;
  let routeCoords = [];
  const countMarkers = [];

  const HELP_LINK = `<a href="traffic_counter_help.html" target="_blank" style="font-size:0.85rem;font-weight:700;color:var(--dim);text-decoration:none;border:2px solid var(--border);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:6px;letter-spacing:0;" title="Help">?</a>`;

  // ── Local datetime formatter ──
  function fmtLocalDateTime(date) {
    if (!date) return 'n/a';
    const p = n => String(n).padStart(2,'0');
    return date.getFullYear() + '-' + p(date.getMonth()+1) + '-' + p(date.getDate())
      + ' ' + p(date.getHours()) + ':' + p(date.getMinutes()) + ':' + p(date.getSeconds());
  }

  function fmt(date) { return date ? date.toTimeString().slice(0,8) : '--'; }

  function fmtDuration(ms) {
    const s = Math.floor(ms / 1000);
    return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
      .map(n => String(n).padStart(2,'0')).join(':');
  }

  // ── Build cards ──
  function buildCards() {
    const container = document.getElementById('counters');
    container.innerHTML = '';
    TYPES.forEach(t => {
      const card = document.createElement('div');
      card.className = 'counter-card ' + t.id + ' locked';
      card.id = 'card-' + t.id;
      card.innerHTML =
        '<button class="btn-dir" onclick="adjust(\'' + t.id + '\',\'a\',1)"><span class="dir-sym">&gt;&lt;</span><span class="dir-plus">+1</span></button>' +
        '<div class="side-count"><div class="dir-count" id="cnt-' + t.id + '-a">0</div></div>' +
        '<button class="btn-min" onclick="adjust(\'' + t.id + '\',\'a\',-1)">-</button>' +
        '<div class="card-center"><div class="lbl">' + t.label + '</div></div>' +
        '<button class="btn-min" onclick="adjust(\'' + t.id + '\',\'b\',-1)">-</button>' +
        '<div class="side-count"><div class="dir-count" id="cnt-' + t.id + '-b">0</div></div>' +
        '<button class="btn-dir" onclick="adjust(\'' + t.id + '\',\'b\',1)"><span class="dir-sym">&gt;&gt;</span><span class="dir-plus">+1</span></button>';
      container.appendChild(card);
    });
    updateDirLabels();
    buildLegend();
  }

  function updateDirLabels() {
    // Direction labels shown in input fields above cards only
  }

  function buildLegend() {
    const el = document.getElementById('map-legend');
    // Keep the save button, rebuild only the legend items before it
    const btn = document.getElementById('btn-save-map');
    el.innerHTML = '<div class="legend-item"><div class="legend-dot" style="background:#3388ff;"></div>Route</div>';
    TYPES.forEach(t => {
      el.innerHTML += '<div class="legend-item"><div class="legend-dot" style="background:' + t.color + ';"></div>' + t.label + '</div>';
    });
    el.appendChild(btn);
  }

  function saveMapImage() {
    if (!map) return;
    const btn = document.getElementById('btn-save-map');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const mapEl  = document.getElementById('map');
    const mapRect = mapEl.getBoundingClientRect();
    const size   = map.getSize();

    const canvas = document.createElement('canvas');
    canvas.width  = size.x;
    canvas.height = size.y;
    const ctx = canvas.getContext('2d');

    // 1. Draw all visible map tiles at their exact screen positions
    const tiles = Array.from(mapEl.querySelectorAll('.leaflet-tile')).filter(t => t.complete && t.src);
    let pending = tiles.length;

    function onTilesDone() {
      drawVectors(ctx, size);
      const ts = fmtLocalDateTime(new Date()).replace(/[: ]/g, '-');
      const a  = document.createElement('a');
      a.href     = canvas.toDataURL('image/png');
      a.download = 'transect_map_' + ts + '.png';
      a.click();
      btn.disabled = false;
      btn.textContent = 'Save PNG';
    }

    if (pending === 0) {
      onTilesDone();
      return;
    }

    tiles.forEach(tile => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = img.onerror = () => {
        if (img.naturalWidth) {
          const r = tile.getBoundingClientRect();
          ctx.drawImage(img, Math.round(r.left - mapRect.left), Math.round(r.top - mapRect.top),
                             Math.round(r.width), Math.round(r.height));
        }
        if (--pending === 0) onTilesDone();
      };
      // Force re-fetch with crossOrigin by appending innocuous query param
      img.src = tile.src.includes('?') ? tile.src : tile.src + '?export=1';
    });
  }

  function drawVectors(ctx) {
    // Route polyline
    if (routeCoords.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = '#3388ff';
      ctx.lineWidth   = 4;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      routeCoords.forEach((ll, i) => {
        const p = map.latLngToContainerPoint(ll);
        i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();
    }

    // Count dots — drawn in order so later ones appear on top
    history.forEach(h => {
      if (h.lat === null) return;
      const t = TYPES.find(x => x.id === h.type);
      const p = map.latLngToContainerPoint([h.lat, h.lon]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fillStyle   = t.color;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2;
      ctx.stroke();
    });

    // Start marker (green)
    if (routeCoords.length > 0) {
      const p = map.latLngToContainerPoint(routeCoords[0]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
      ctx.fillStyle   = '#0a8a30';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2.5;
      ctx.stroke();
    }

    // End marker (red) — only once session has ended
    if (endTime && routeCoords.length > 1) {
      const p = map.latLngToContainerPoint(routeCoords[routeCoords.length - 1]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
      ctx.fillStyle   = '#cc0000';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth   = 2.5;
      ctx.stroke();
    }
  }

  // ── GPS (continuous during session) ──
  function startGPS() {
    if (!navigator.geolocation) {
      document.getElementById('disp-gps').textContent = 'Not supported';
      return;
    }
    document.getElementById('disp-gps').textContent = 'Acquiring...';
    document.getElementById('disp-gps').classList.add('empty');

    gpsWatchId = navigator.geolocation.watchPosition(
      pos => {
        currentPos = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          acc: Math.round(pos.coords.accuracy),
          heading: pos.coords.heading
        };
        const accStr = currentPos.acc <= GPS_ACCURACY_GOOD
          ? currentPos.acc + 'm'
          : currentPos.acc + 'm (low)';
        document.getElementById('disp-gps').textContent = accStr;
        document.getElementById('disp-gps').classList.remove('empty');

        // Update map with current position
        if (map) updateMapPosition(currentPos.lat, currentPos.lon);
      },
      err => {
        document.getElementById('disp-gps').textContent = 'GPS error';
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 }
    );
  }

  function stopGPS() {
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
  }

  // ── Map ──
  function initMap(lat, lon) {
    const container = document.getElementById('map-container');
    container.classList.add('visible');

    map = L.map('map', { zoomControl: true, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    map.setView([lat, lon], 16);

    routeCoords = [[lat, lon]];
    routeLine = L.polyline(routeCoords, { color: '#3388ff', weight: 4, opacity: 0.85 }).addTo(map);

    // Start marker
    L.circleMarker([lat, lon], {
      radius: 8, fillColor: var_green(), color: '#fff', weight: 2, fillOpacity: 1
    }).bindTooltip('Start').addTo(map);
  }

  function var_green() { return '#0a8a30'; }

  function updateMapPosition(lat, lon) {
    if (!routeLine) return;
    routeCoords.push([lat, lon]);
    routeLine.setLatLngs(routeCoords);
    map.panTo([lat, lon], { animate: true, duration: 0.5 });
  }

  function addCountMarker(lat, lon, type) {
    if (!map) return;
    const t = TYPES.find(x => x.id === type);
    const marker = L.circleMarker([lat, lon], {
      radius: 7, fillColor: t.color, color: '#fff', weight: 2, fillOpacity: 0.9
    }).bindTooltip(t.label).addTo(map);
    countMarkers.push(marker);
  }

  // ── Session ──
  function startSession() {
    if (state !== 'idle') return;
    startTime = new Date();
    state = 'running';

    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-end').disabled   = false;
    document.getElementById('disp-start').textContent = fmt(startTime);
    document.getElementById('disp-start').classList.remove('empty');
    document.getElementById('disp-pts').textContent = '0';
    document.getElementById('disp-pts').classList.remove('empty');

    const badge = document.getElementById('status-badge');
    badge.className = 'status-badge running';
    badge.textContent = 'Transect in progress — walk your route...';
    document.getElementById('session-time').className = 'running';
    TYPES.forEach(t => document.getElementById('card-' + t.id).classList.remove('locked'));

    // Start GPS watch
    startGPS();

    // Session clock
    timerInterval = setInterval(() => {
      const elapsed = Date.now() - startTime.getTime();
      document.getElementById('session-time').textContent = fmtDuration(elapsed);
      document.getElementById('disp-dur').textContent = fmtDuration(elapsed);
      document.getElementById('disp-dur').classList.remove('empty');
    }, 1000);

    // Route logging — every 10 seconds, capture current GPS point
    routeInterval = setInterval(() => {
      if (!currentPos) return;
      const pt = { ts: fmtLocalDateTime(new Date()), lat: currentPos.lat, lon: currentPos.lon, acc: currentPos.acc };
      routeLog.push(pt);
      document.getElementById('disp-pts').textContent = routeLog.length;
      // Init map on first route point
      if (routeLog.length === 1) initMap(pt.lat, pt.lon);
    }, ROUTE_INTERVAL_MS);

    requestWakeLock();
  }

  function endSession() {
    if (state !== 'running') return;
    endTime = new Date();
    state = 'ended';
    clearInterval(timerInterval);
    clearInterval(routeInterval);
    stopGPS();
    releaseWakeLock();
    if (currentPos) {
      const pt = { ts: fmtLocalDateTime(new Date()), lat: currentPos.lat, lon: currentPos.lon, acc: currentPos.acc };
      routeLog.push(pt);
      document.getElementById('disp-pts').textContent = routeLog.length;
      if (map) {
        updateMapPosition(pt.lat, pt.lon);
        // End marker
        L.circleMarker([pt.lat, pt.lon], {
          radius: 8, fillColor: '#c8000a', color: '#fff', weight: 2, fillOpacity: 1
        }).bindTooltip('End').addTo(map);
        // Fit map to route
        if (routeCoords.length > 1) map.fitBounds(routeLine.getBounds(), { padding: [20, 20] });
      }
    }

    document.getElementById('btn-end').disabled = true;
    document.getElementById('disp-end').textContent = fmt(endTime);
    document.getElementById('disp-end').classList.remove('empty');

    const elapsed = endTime - startTime;
    document.getElementById('session-time').textContent = fmtDuration(elapsed);
    document.getElementById('session-time').className = 'ended';
    document.getElementById('disp-dur').textContent = fmtDuration(elapsed);

    const badge = document.getElementById('status-badge');
    badge.className = 'status-badge ended';
    badge.textContent = 'Transect ended — ' + fmtDuration(elapsed) + ' — downloading CSV...';

    TYPES.forEach(t => document.getElementById('card-' + t.id).classList.add('locked'));
    setTimeout(() => exportCSV(), 300);
  }

  // ── Vibration ──
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  // ── Counting ──
  var LS_KEY = 'transect_draft';

  function saveDraft() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        counts:    counts,
        history:   history,
        routeLog:  routeLog,
        startTime: startTime ? startTime.toISOString() : null,
        dirA:  document.getElementById('lbl-a').value,
        dirB:  document.getElementById('lbl-b').value,
        notes: document.getElementById('notes').value,
      }));
    } catch(e) {}
  }

  function clearDraft() {
    try { localStorage.removeItem(LS_KEY); } catch(e) {}
  }

  function restoreDraft() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || !d.history || !d.history.length) return;
      if (!confirm('Niet-opgeslagen telling gevonden (' + d.history.length + ' observaties). Herstellen?')) {
        clearDraft(); return;
      }
      counts    = d.counts;
      history   = d.history;
      routeLog  = d.routeLog || [];
      startTime = d.startTime ? new Date(d.startTime) : new Date();
      if (d.dirA) document.getElementById('lbl-a').value = d.dirA;
      if (d.dirB) document.getElementById('lbl-b').value = d.dirB;
      if (d.notes) document.getElementById('notes').value = d.notes;
      state = 'running';
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-end').disabled   = false;
      document.getElementById('btn-undo-last').disabled = !history.length;
      buildCards();
      updateGrandTotal();
      updateDirLabels();
      updateSessionDisplay();
      startTimer();
      setStatus('Telling hersteld uit opslag.');
    } catch(e) {}
  }

  function adjust(type, dir, delta) {
    if (state !== 'running') return;
    counts[type][dir] = Math.max(0, counts[type][dir] + delta);
    saveDraft();
    const el = document.getElementById('cnt-' + type + '-' + dir);
    el.textContent = counts[type][dir];
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 150);

    let total = 0;
    TYPES.forEach(t => { total += counts[t.id].a + counts[t.id].b; });
    document.getElementById('grand-total').textContent = total;

    if (delta > 0) {
      vibrate(25);
      const ts = fmtLocalDateTime(new Date());
      const tsShort = new Date().toTimeString().slice(0,8);
      const lbl  = TYPES.find(t => t.id === type).label;
      const dVal = dir === 'a' ? document.getElementById('lbl-a').value : document.getElementById('lbl-b').value;
      const lat  = currentPos ? currentPos.lat : null;
      const lon  = currentPos ? currentPos.lon : null;
      const acc  = currentPos ? currentPos.acc : null;
      history.push({ type, dir, ts, lat, lon, acc });
      document.getElementById('btn-undo-last').disabled = false;
      if (lat !== null) {
        addCountMarker(lat, lon, type);
        addLog('+1 ' + lbl + ' - ' + dVal + ' @ ' + lat.toFixed(4) + ',' + lon.toFixed(4), tsShort);
      } else {
        addLog('+1 ' + lbl + ' - ' + dVal + ' (no GPS)', tsShort);
      }
    } else {
      // Remove the most recent matching entry so it won't appear in CSV log
      const idx = history.map((h, i) => (h.type === type && h.dir === dir) ? i : -1)
                         .filter(i => i >= 0).pop();
      if (idx !== undefined) {
        history.splice(idx, 1);
        // Also remove the corresponding map marker
        if (countMarkers.length) { const m = countMarkers.pop(); if (map) map.removeLayer(m); }
      }
      document.getElementById('btn-undo-last').disabled = history.length === 0;
    }
  }

  function addLog(msg, ts) {
    const log = document.getElementById('log');
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = '<span class="msg">' + msg + '</span><span class="ts">' + ts + '</span>';
    log.prepend(div);
    if (log.children.length > 80) log.removeChild(log.lastChild);
  }

  // ── Undo last ──
  function undoLast() {
    if (!history.length) return;
    const last = history.pop();
    counts[last.type][last.dir] = Math.max(0, counts[last.type][last.dir] - 1);
    document.getElementById('cnt-' + last.type + '-' + last.dir).textContent = counts[last.type][last.dir];
    let total = 0;
    TYPES.forEach(t => { total += counts[t.id].a + counts[t.id].b; });
    document.getElementById('grand-total').textContent = total;
    // Strike log entry
    const log = document.getElementById('log');
    if (log.firstChild) { log.firstChild.style.opacity = '0.35'; log.firstChild.style.textDecoration = 'line-through'; }
    // Remove last map marker
    if (countMarkers.length) { const m = countMarkers.pop(); if (map) map.removeLayer(m); }
    document.getElementById('btn-undo-last').disabled = history.length === 0;
    vibrate(30);
  }

  // ── Reset ──
  function resetAll() {
    if (!confirm('Reset everything and start over?')) return;
    clearInterval(timerInterval);
    clearInterval(routeInterval);
    stopGPS();
    releaseWakeLock();
    clearDraft();
    state = 'idle'; startTime = null; endTime = null;
    history = []; routeLog = []; routeCoords = []; currentPos = null;

    TYPES.forEach(t => {
      counts[t.id] = { a: 0, b: 0 };
      document.getElementById('cnt-' + t.id + '-a').textContent = '0';
      document.getElementById('cnt-' + t.id + '-b').textContent = '0';
      document.getElementById('card-' + t.id).classList.add('locked');
    });
    document.getElementById('grand-total').textContent = '0';
    document.getElementById('log').innerHTML = '';
    document.getElementById('session-time').textContent = '00:00:00';
    document.getElementById('session-time').className = '';
    ['disp-start','disp-end','disp-dur','disp-gps','disp-pts'].forEach(id => {
      document.getElementById(id).textContent = '--';
      document.getElementById(id).classList.add('empty');
    });
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-end').disabled   = true;
    document.getElementById('btn-undo-last').disabled = true;

    const badge = document.getElementById('status-badge');
    badge.className = 'status-badge idle';
    badge.textContent = 'Press Start to begin your transect';

    // Destroy and hide map
    if (map) { map.remove(); map = null; routeLine = null; }
    countMarkers.length = 0;
    document.getElementById('map-container').classList.remove('visible');
  }

  // ── Compass & auto directions ──

  function destinationPoint(lat, lon, bearingDeg, distanceKm) {
    const R    = 6371;
    const d    = distanceKm / R;
    const lat1 = lat * Math.PI / 180;
    const lon1 = lon * Math.PI / 180;
    const brng = bearingDeg * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(brng));
    const lon2 = lon1 + Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
    return { lat: lat2*180/Math.PI, lon: ((lon2*180/Math.PI)+540)%360-180 };
  }

  function placeNameAt(lat, lon) {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=10&addressdetails=1';
    return fetch(url, { headers: { 'Accept-Language': 'nl', 'User-Agent': 'TrafficCounter/1.0' } })
      .then(r => r.json())
      .then(data => {
        const a = data.address || {};
        return a.city || a.town || a.village || a.hamlet || a.municipality || a.suburb || null;
      })
      .catch(() => null);
  }

  function cardinalNL(deg) {
    const dirs = ['Noord','Noordoost','Oost','Zuidoost','Zuid','Zuidwest','West','Noordwest'];
    return dirs[Math.round(((deg%360)+360)%360/45)%8];
  }

  function applyHeading(heading, lat, lon) {
    const btn = document.getElementById('btn-compass');
    const ahead  = (heading + 360) % 360;
    const behind = (heading + 180) % 360;
    const cardAhead  = cardinalNL(ahead);
    const cardBehind = cardinalNL(behind);

    function setLabels(placeAhead, placeBehind) {
      const a = placeAhead  || cardAhead;
      const b = placeBehind || cardBehind;
      document.getElementById('lbl-b').value = 'Van ' + b + ' naar ' + a;
      document.getElementById('lbl-a').value = 'Van ' + a + ' naar ' + b;
      updateDirLabels();
      btn.textContent = a + ' / ' + b;
      btn.classList.add('active');
      showDirToast('Van ' + a + ' naar ' + b, 'Van ' + b + ' naar ' + a);
    }

    if (lat != null && lon != null) {
      btn.textContent = 'Looking up...';
      const ptAhead  = destinationPoint(lat, lon, ahead,  5);
      const ptBehind = destinationPoint(lat, lon, behind, 5);
      Promise.all([placeNameAt(ptAhead.lat, ptAhead.lon), placeNameAt(ptBehind.lat, ptBehind.lon)])
        .then(([a, b]) => setLabels(a !== b ? a : null, a !== b ? b : null));
    } else {
      setLabels(null, null);
    }
  }

  function autoDirections() {
    const btn = document.getElementById('btn-compass');
    btn.textContent = 'Reading...';
    btn.classList.remove('active');

    const lat = currentPos ? currentPos.lat : null;
    const lon = currentPos ? currentPos.lon : null;

    if (currentPos && currentPos.heading != null && !isNaN(currentPos.heading)) {
      applyHeading(currentPos.heading, lat, lon); return;
    }

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(p => { if (p === 'granted') listenCompass(lat, lon); else { btn.textContent = 'Compass'; alert('Permission denied.'); } })
        .catch(() => { btn.textContent = 'Compass'; });
    } else { listenCompass(lat, lon); }
  }

  function listenCompass(lat, lon) {
    const btn = document.getElementById('btn-compass');
    let readings = [], done = false;
    function onOri(e) {
      if (done) return;
      let h = null;
      if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
      else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;
      else if (e.alpha != null) h = (360 - e.alpha) % 360;
      if (h == null) return;
      readings.push(h);
      if (readings.length >= 5) {
        done = true;
        window.removeEventListener('deviceorientation', onOri, true);
        window.removeEventListener('deviceorientationabsolute', onOri, true);
        const sinS = readings.reduce((s,v) => s + Math.sin(v*Math.PI/180), 0);
        const cosS = readings.reduce((s,v) => s + Math.cos(v*Math.PI/180), 0);
        applyHeading((Math.atan2(sinS, cosS)*180/Math.PI+360)%360, lat, lon);
      }
    }
    window.addEventListener('deviceorientationabsolute', onOri, true);
    window.addEventListener('deviceorientation', onOri, true);
    setTimeout(() => {
      if (!done) {
        done = true;
        window.removeEventListener('deviceorientation', onOri, true);
        window.removeEventListener('deviceorientationabsolute', onOri, true);
        btn.textContent = 'Compass';
        alert('No compass data. Make sure you are on a mobile device.');
      }
    }, 4000);
  }

  // ── Export CSV ──
  function exportCSV() {
    const D   = SEP;
    const dirA = document.getElementById('lbl-a').value || 'Direction A';
    const dirB = document.getElementById('lbl-b').value || 'Direction B';
    const t0  = startTime;
    const t1  = endTime || (state === 'running' ? new Date() : null);
    const elapsedSec = (t0 && t1) ? (t1 - t0) / 1000 : null;
    const factor     = (elapsedSec && elapsedSec >= 30) ? 3600 / elapsedSec : null;
    const exportTs   = fmtLocalDateTime(new Date());
    const row = (...cells) => cells.join(D) + '\n';

    let csv = 'sep=' + D + '\n';
    csv += row('Traffic Count Export — Transect Mode');
    csv += row('Exported at', exportTs);
    csv += row('Location / Notes', document.getElementById('notes').value || 'n/a');
    csv += row('Start time', t0 ? fmtLocalDateTime(t0) : 'n/a');
    csv += row('End time',   t1 ? fmtLocalDateTime(t1) : 'n/a');
    csv += row('Observed duration', elapsedSec ? fmtDuration(elapsedSec * 1000) : 'n/a');
    csv += row('Route points logged', routeLog.length);
    if (factor) {
      csv += row('Extrapolation factor', factor.toFixed(4), '= 3600 / ' + Math.round(elapsedSec) + ' seconds');
    } else {
      csv += row('Extrapolation', 'Not calculated');
    }
    csv += '\n';

    // Summary table
    csv += row('SUMMARY');
    csv += row('Vehicle Type', dirA + ' counted', dirB + ' counted', 'Total counted',
               ...(factor ? [dirA + ' per hour', dirB + ' per hour', 'Total per hour'] : []));
    let sumA = 0, sumB = 0;
    TYPES.forEach(t => {
      const a = counts[t.id].a, b = counts[t.id].b;
      sumA += a; sumB += b;
      csv += row(t.label, a, b, a + b,
                 ...(factor ? [Math.round(a*factor), Math.round(b*factor), Math.round((a+b)*factor)] : []));
    });
    csv += row('TOTAL', sumA, sumB, sumA + sumB,
               ...(factor ? [Math.round(sumA*factor), Math.round(sumB*factor), Math.round((sumA+sumB)*factor)] : []));
    csv += '\n';

    // Count log with GPS coords
    csv += row('COUNT LOG');
    csv += row('Timestamp', 'Vehicle', 'Direction', 'Latitude', 'Longitude', 'GPS accuracy (m)');
    history.forEach(h => {
      const lbl   = TYPES.find(t => t.id === h.type).label;
      const dname = h.dir === 'a' ? dirA : dirB;
      csv += row(h.ts, lbl, dname,
        h.lat !== null ? h.lat.toFixed(6) : 'n/a',
        h.lon !== null ? h.lon.toFixed(6) : 'n/a',
        h.acc !== null ? h.acc : 'n/a');
    });
    csv += '\n';

    // Route log
    if (routeLog.length) {
      csv += row('ROUTE LOG (every 10 seconds)');
      csv += row('Timestamp', 'Latitude', 'Longitude', 'GPS accuracy (m)');
      routeLog.forEach(p => {
        csv += row(p.ts, p.lat.toFixed(6), p.lon.toFixed(6), p.acc);
      });
    }

    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'transect_' + exportTs.replace(/[: ]/g, '-') + '.csv';
    a.click();
    clearDraft();
  }

  function generateSessionId() {
    var now = new Date();
    var pad = function(n,l){ return String(n).padStart(l,'0'); };
    var chars = 'abcdefghijklmnopqrstuvwxyz';
    var rnd = Array.from({length:3},()=>chars[Math.floor(Math.random()*26)]).join('');
    return pad(now.getFullYear(),4)+pad(now.getMonth()+1,2)+pad(now.getDate(),2)
      +'_'+pad(now.getHours(),2)+pad(now.getMinutes(),2)+pad(now.getSeconds(),2)
      +'_'+rnd;
  }

  function exportZip() {
    if (!history.length) return;
    const dirA   = document.getElementById('lbl-a').value || 'A';
    const dirB   = document.getElementById('lbl-b').value || 'B';
    const t0     = startTime;
    const t1     = endTime || new Date();
    const datum  = t0 ? t0.toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
    const startStr = t0 ? fmtLocalDateTime(t0).slice(0,16) : '';
    const eindStr  = t1 ? fmtLocalDateTime(t1).slice(0,16) : '';
    const sid    = generateSessionId() + '_trn';
    const n      = history.length;

    // sessie.csv
    var sessieCsv = 'sessie_id;teller;datum;start_tijd;eind_tijd;app_type;n_waarnemingen\n';
    sessieCsv += [sid, document.getElementById('notes').value||'', datum, startStr, eindStr, 'transect', n].join(';');

    // telregels.csv — per observatie: type, richting, lat, lon
    var telregelsCsv = 'sessie_id;nr;tijdstip;type;richting;lat;lon;nauwkeurigheid\n';
    history.forEach(function(h, i) {
      var richting = h.dir === 'a' ? dirA : dirB;
      telregelsCsv += [sid, i+1, h.ts, h.type, richting,
        h.lat !== null ? h.lat.toFixed(6) : '',
        h.lon !== null ? h.lon.toFixed(6) : '',
        h.acc !== null ? h.acc : ''].join(';') + '\n';
    });

    // samenvatting.csv — per type + richting
    var samenvattingCsv = 'sessie_id;type;richting_a;richting_b;totaal\n';
    var totA = 0, totB = 0;
    TYPES.forEach(function(t) {
      var a = counts[t.id].a, b = counts[t.id].b;
      totA += a; totB += b;
      samenvattingCsv += [sid, t.id, a, b, a+b].join(';') + '\n';
    });
    samenvattingCsv += [sid, 'TOTAAL', totA, totB, totA+totB].join(';') + '\n';

    // gps.csv
    var gpsCsv = 'sessie_id;tijdstip;lat;lon;nauwkeurigheid\n';
    routeLog.forEach(function(p) {
      gpsCsv += [sid, p.ts, p.lat.toFixed(6), p.lon.toFixed(6), p.acc].join(';') + '\n';
    });

    // GPX
    var gpxLines = ['<?xml version="1.0" encoding="UTF-8"?>',
      '<gpx version="1.1" creator="TrafficCounterSuite">',
      '  <trk><name>Transect ' + datum + '</name><trkseg>'];
    routeLog.forEach(function(p) {
      gpxLines.push('    <trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lon.toFixed(6) + '">');
      gpxLines.push('      <time>' + p.ts + '</time></trkpt>');
    });
    gpxLines.push('  </trkseg></trk></gpx>');

    var zip = new JSZip();
    zip.file(sid + '_sessie.csv',      sessieCsv);
    zip.file(sid + '_telregels.csv',   telregelsCsv);
    zip.file(sid + '_samenvatting.csv',samenvattingCsv);
    zip.file(sid + '_gps.csv',         gpsCsv);
    zip.file(sid + '.gpx',             gpxLines.join('\n'));

    zip.generateAsync({type:'blob'}).then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a   = document.createElement('a');
      a.href  = url;
      clearDraft();
      a.download = sid + '.zip';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    });
  }

  // ── Keyboard shortcuts ──
  const keyMap = {
    q:['car','a'],   a:['car','b'],
    w:['truck','a'], s:['truck','b'],
    e:['moto','a'],  d:['moto','b'],
    r:['bike','a'],  f:['bike','b'],
    t:['ped','a'],   g:['ped','b'],
  };
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT') return;
    if (ev.key === ' ' || ev.key === 'Enter') {
      if (state === 'idle') startSession(); else if (state === 'running') endSession(); return;
    }
    if (ev.key.toLowerCase() === 'z') { undoLast(); return; }
    const m = keyMap[ev.key.toLowerCase()];
    if (m) adjust(m[0], m[1], 1);
  });

  // ── Direction toast ──
  let toastTimer = null;
  function showDirToast(valA, valB) {
    document.getElementById('toast-a').textContent = valA;
    document.getElementById('toast-b').textContent = valB;
    const el = document.getElementById('toast');
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, 5000);
  }

  buildCards();


  restoreDraft();
</script>
</body>
</html>
