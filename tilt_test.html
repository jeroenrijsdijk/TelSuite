<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kanteltik – test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg:    #f0f0ec;
    --text:  #1a1918;
    --muted: #888880;
    --bord:  #b0b0a8;
    --L:     #2471a3;
    --R:     #c0392b;
    --N:     #888880;
    --font:  'Oswald', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font), sans-serif; user-select: none; overflow: hidden; }

  /* ── TAPLAYER ── heel scherm, vangen alle tikken */
  #taplayer {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
  }

  /* ── ZIJDE-INDICATOR ── bovenste 35% */
  #zijde-bar {
    flex: 0 0 38%;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px; font-weight: 700; letter-spacing: -2px;
    transition: color 0.1s, background 0.1s;
    border-bottom: 2px solid var(--bord);
  }
  #zijde-bar.L { color: var(--L); background: rgba(36,113,163,0.08); }
  #zijde-bar.R { color: var(--R); background: rgba(192,57,43,0.08); }
  #zijde-bar.N { color: var(--N); background: transparent; }

  /* ── GAMMA METER ── */
  #gamma-wrap {
    padding: 10px 24px 0;
    display: flex; align-items: center; gap: 10px;
  }
  #gamma-label { font-size: 11px; color: var(--muted); letter-spacing: 1px;
    text-transform: uppercase; flex-shrink: 0; }
  #gamma-track {
    flex: 1; height: 6px; background: var(--bord); border-radius: 3px;
    position: relative; overflow: visible;
  }
  #gamma-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--N);
    position: absolute; top: -4px; left: 50%;
    transform: translateX(-50%); transition: left 0.05s, background 0.1s;
  }
  #gamma-line {
    position: absolute; left: 50%; top: -6px; bottom: -6px;
    width: 1px; background: var(--bord);
  }
  #gamma-val { font-size: 12px; color: var(--muted); width: 38px; text-align: right; flex-shrink: 0; }

  /* ── TYPE SELECTOR ── */
  #type-row {
    display: flex; gap: 8px; padding: 12px 16px 0;
  }
  .type-btn {
    flex: 1; padding: 10px 0; border: 1.5px solid var(--bord);
    background: white; border-radius: 4px; font-family: var(--font), sans-serif;
    font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
    transition: all 0.15s;
  }
  .type-btn.sel { border-color: var(--text); color: var(--text); background: var(--bg); }

  /* ── DREMPEL INSTELLING ── */
  #drempel-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px 0;
  }
  #drempel-row label { font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; flex-shrink: 0; }
  #drempel-slider { flex: 1; accent-color: var(--text); }
  #drempel-val { font-size: 12px; color: var(--text); width: 32px; text-align: right; flex-shrink: 0; }

  /* ── FEEDBACK FLASH ── */
  #flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 20;
    opacity: 0; transition: opacity 0.05s;
  }
  #flash.pop { opacity: 0.18; transition: none; }

  /* ── LOG ── */
  #log-wrap {
    flex: 1; overflow-y: auto; border-top: 1px solid var(--bord); margin-top: 10px;
  }
  #log-wrap::-webkit-scrollbar { width: 3px; }
  #log-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px; border-bottom: 1px solid var(--bord);
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
  }
  #log-clear { cursor: pointer; color: var(--muted); font-size: 11px; padding: 2px 6px;
    border: 1px solid var(--bord); border-radius: 3px; background: none;
    font-family: inherit; }
  #log-clear:hover { color: var(--text); border-color: var(--text); }
  #log { padding: 4px 0; }
  .log-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 16px; border-bottom: 1px solid rgba(0,0,0,0.04);
    font-size: 13px;
  }
  .log-row .lr { font-weight: 700; width: 20px; }
  .log-row .lr.L { color: var(--L); }
  .log-row .lr.R { color: var(--R); }
  .log-row .lr.N { color: var(--N); }
  .log-row .tp { color: var(--text); width: 60px; }
  .log-row .gm { font-size: 11px; color: var(--muted); }
  .log-row .ts { font-size: 10px; color: var(--muted); margin-left: auto; }

  /* ── TOESTEMMING OVERLAY ── */
  #perm-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 32px;
  }
  #perm-overlay.hidden { display: none; }
  #perm-overlay p { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.5; }
  #perm-btn {
    padding: 14px 32px; background: var(--text); color: var(--bg);
    border: none; border-radius: 4px; font-family: var(--font), sans-serif;
    font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 1px;
  }

  /* tellers bovenin */
  #counters {
    display: flex; gap: 0; border-bottom: 1px solid var(--bord); flex-shrink: 0;
  }
  .cnt { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid var(--bord); }
  .cnt:last-child { border-right: none; }
  .cnt .n { font-size: 22px; font-weight: 700; }
  .cnt .l { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .cnt.L .n { color: var(--L); }
  .cnt.R .n { color: var(--R); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="perm-overlay">
  <p>Kanteltik-test<br><br>
    Houd de telefoon in looprichting.<br>
    Kantel <strong>links</strong> voor L, <strong>rechts</strong> voor R.<br>
    Tik overal op het scherm om te registreren.<br><br>
    Oriëntatie-toegang nodig (iOS).
  </p>
  <button id="perm-btn">Starten</button>
</div>

<div id="flash"></div>

<div id="taplayer">
  <div id="counters">
    <div class="cnt L"><div class="n" id="cnt-L">0</div><div class="l">Links</div></div>
    <div class="cnt" style="color:var(--muted)"><div class="n" id="cnt-tot">0</div><div class="l">Totaal</div></div>
    <div class="cnt R"><div class="n" id="cnt-R">0</div><div class="l">Rechts</div></div>
  </div>

  <div id="zijde-bar" class="N">·</div>

  <div id="gamma-wrap">
    <span id="gamma-label">kant</span>
    <div id="gamma-track">
      <div id="gamma-line"></div>
      <div id="gamma-thumb"></div>
    </div>
    <span id="gamma-val">0°</span>
  </div>

  <div id="type-row">
    <button class="type-btn sel" data-type="fiets">fiets</button>
    <button class="type-btn"     data-type="wrak">wrak</button>
    <button class="type-btn"     data-type="brommer">brom</button>
    <button class="type-btn"     data-type="breed">breed</button>
  </div>

  <div id="drempel-row">
    <label>drempel</label>
    <input type="range" id="drempel-slider" min="5" max="40" value="15" step="1">
    <span id="drempel-val">15°</span>
  </div>

  <div id="log-wrap">
    <div id="log-head">
      <span>Log</span>
      <button id="log-clear">wis</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
  let gamma      = 0;
  let drempel    = 15;
  let selectedType = 'fiets';
  let cntL = 0, cntR = 0;
  let lastTap    = 0;
  const TAP_DEBOUNCE = 600; // ms

  // ── ORIËNTATIE ──────────────────────────────────────────────────
  function onOrientation(e) {
    gamma = e.gamma || 0;
    updateGammaUI();
  }

  function updateGammaUI() {
    const g   = Math.max(-60, Math.min(60, gamma));
    const pct = (g + 60) / 120 * 100;
    const thumb = document.getElementById('gamma-thumb');
    thumb.style.left = pct + '%';

    const zijde = getSijde();
    thumb.style.background = zijde === 'L' ? getComputedStyle(document.documentElement)
      .getPropertyValue('--L').trim()
      : zijde === 'R' ? getComputedStyle(document.documentElement)
      .getPropertyValue('--R').trim()
      : getComputedStyle(document.documentElement).getPropertyValue('--N').trim();

    const bar = document.getElementById('zijde-bar');
    bar.className = zijde;
    bar.textContent = zijde === 'N' ? '·' : zijde;
    document.getElementById('gamma-val').textContent = Math.round(gamma) + '°';
  }

  function getSijde() {
    if (gamma < -drempel) return 'L';
    if (gamma >  drempel) return 'R';
    return 'N';
  }

  // ── TAP ─────────────────────────────────────────────────────────
  document.getElementById('taplayer').addEventListener('touchend', function(e) {
    // Negeer taps op knoppen
    if (e.target.closest('.type-btn, #drempel-slider, #log-clear, #perm-btn')) return;
    e.preventDefault();
    const now = Date.now();
    if (now - lastTap < TAP_DEBOUNCE) return;
    lastTap = now;
    registreer();
  });

  function registreer() {
    const zijde = getSijde();
    const type  = selectedType;
    const g     = Math.round(gamma);
    const t     = new Date().toTimeString().slice(0,8);

    // Feedback
    const flash = document.getElementById('flash');
    flash.style.background = zijde === 'L' ? '#2471a3' : zijde === 'R' ? '#c0392b' : '#888';
    flash.classList.add('pop');
    setTimeout(() => flash.classList.remove('pop'), 80);
    if (navigator.vibrate) navigator.vibrate(zijde === 'N' ? [30,30,30] : 40);

    // Tellers
    if (zijde === 'L') { cntL++; document.getElementById('cnt-L').textContent = cntL; }
    if (zijde === 'R') { cntR++; document.getElementById('cnt-R').textContent = cntR; }
    document.getElementById('cnt-tot').textContent = cntL + cntR;

    // Log
    addLog(zijde, type, g, t);
  }

  function addLog(zijde, type, gamma, ts) {
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = `
      <span class="lr ${zijde}">${zijde}</span>
      <span class="tp">${type}</span>
      <span class="gm">${gamma}°</span>
      <span class="ts">${ts}</span>`;
    const log = document.getElementById('log');
    log.insertBefore(row, log.firstChild);
  }

  // ── TYPE BUTTONS ─────────────────────────────────────────────────
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('sel'));
      this.classList.add('sel');
      selectedType = this.dataset.type;
    });
  });

  // ── DREMPEL ──────────────────────────────────────────────────────
  document.getElementById('drempel-slider').addEventListener('input', function() {
    drempel = +this.value;
    document.getElementById('drempel-val').textContent = drempel + '°';
    updateGammaUI();
  });

  // ── LOG WISSEN ───────────────────────────────────────────────────
  document.getElementById('log-clear').addEventListener('click', () => {
    document.getElementById('log').innerHTML = '';
    cntL = 0; cntR = 0;
    document.getElementById('cnt-L').textContent = '0';
    document.getElementById('cnt-R').textContent = '0';
    document.getElementById('cnt-tot').textContent = '0';
  });

  // ── IOS PERMISSION ───────────────────────────────────────────────
  function startOrientation() {
    window.addEventListener('deviceorientation', onOrientation);
    document.getElementById('perm-overlay').classList.add('hidden');
  }

  document.getElementById('perm-btn').addEventListener('click', () => {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(r => {
        if (r === 'granted') startOrientation();
      }).catch(console.error);
    } else {
      startOrientation();
    }
  });

  // Android: direct starten
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission !== 'function') {
    startOrientation();
  }
</script>
</body>
</html>
