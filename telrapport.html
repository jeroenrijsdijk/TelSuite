<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telrapport</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #1a1c1e;
    --panel:   #22252a;
    --border:  #333840;
    --text:    #d4d8de;
    --muted:   #6b7280;
    --accent:  #4a9eff;
    --panel-w: 300px;
  }
  html, body { height: 100%; font-family: 'Courier New', monospace; font-size: 13px;
    background: var(--bg); color: var(--text); }
  #layout { display: flex; height: 100vh; }

  #sidebar { width: var(--panel-w); min-width: var(--panel-w); background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  #sidebar-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; flex-shrink: 0; }
  #sidebar-header strong { display: block; font-size: 15px; color: var(--text);
    text-transform: none; letter-spacing: 0; margin-bottom: 2px; }

  #dropzone { margin: 12px; border: 1.5px dashed var(--border); border-radius: 6px;
    padding: 14px 10px; text-align: center; color: var(--muted); cursor: pointer;
    transition: border-color 0.2s, color 0.2s; flex-shrink: 0; }
  #dropzone.over, #dropzone:hover { border-color: var(--accent); color: var(--text); }
  #dropzone input { display: none; }
  #dropzone .dz-icon { font-size: 22px; margin-bottom: 4px; }
  #dropzone .dz-text { font-size: 11px; }

  #statsbar { margin: 0 12px 6px; display: flex; gap: 8px; flex-shrink: 0; }
  .stat-pill { flex: 1; background: var(--bg); border-radius: 4px; padding: 6px 8px; text-align: center; }
  .stat-pill .n { font-size: 16px; font-weight: bold; color: var(--accent); }
  .stat-pill .l { font-size: 10px; color: var(--muted); }

  .toggle-section { margin: 0 12px 4px; flex-shrink: 0; }
  .toggle-label { font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; padding: 4px 0 3px; }
  .toggle-row { display: flex; gap: 5px; align-items: center; margin-bottom: 4px; }
  .dot-btn { display: flex; align-items: center; gap: 4px; padding: 3px 7px;
    border-radius: 3px; border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; font-size: 11px; font-family: inherit; transition: all 0.15s;
    color: var(--muted); flex-shrink: 0; }
  .dot-btn .dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.35; flex-shrink: 0; }
  .dot-btn.active { border-color: currentColor; }
  .dot-btn.active .dot { opacity: 1; }

  #gap-row { margin: 0 12px 8px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #gap-row label { font-size: 10px; color: var(--muted); white-space: nowrap; }
  #gap-slider { flex: 1; accent-color: var(--accent); }
  #gap-val { font-size: 11px; color: var(--text); min-width: 26px; text-align: right; }

  .section-title { padding: 4px 16px; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    border-top: 1px solid var(--border); flex-shrink: 0; }

  #sessions-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  #sessions-list::-webkit-scrollbar { width: 4px; }
  #sessions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .session-row { display: flex; align-items: center; padding: 6px 12px; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.03); }
  .session-row:hover { background: rgba(255,255,255,0.04); }
  .session-toggle { width: 12px; height: 12px; border-radius: 2px;
    border: 1.5px solid var(--border); flex-shrink: 0; position: relative; cursor: pointer; }
  .session-toggle.on { background: var(--accent); border-color: var(--accent); }
  .session-toggle.on::after { content: '✓'; position: absolute; top: -3px; left: 1px;
    font-size: 10px; color: white; }
  .session-info { flex: 1; min-width: 0; }
  .session-datum { font-size: 12px; }
  .session-id { font-size: 10px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .session-n { font-size: 11px; color: var(--muted); flex-shrink: 0; }

  #detail-panel { border-top: 1px solid var(--border); background: var(--bg);
    padding: 12px; max-height: 340px; overflow-y: auto; flex-shrink: 0; }
  #detail-panel::-webkit-scrollbar { width: 4px; }
  #detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  #detail-panel.hidden { display: none; }
  #detail-close { float: right; cursor: pointer; color: var(--muted); line-height: 1; }
  #detail-close:hover { color: var(--text); }
  #detail-title { font-size: 13px; font-weight: bold; color: var(--accent); margin-bottom: 2px; }
  #detail-sub { font-size: 10px; color: var(--muted); margin-bottom: 10px; }

  .cmp-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .cmp-table th { color: var(--muted); font-weight: normal; padding: 2px 6px 5px;
    border-bottom: 1px solid var(--border); text-align: right; }
  .cmp-table th:first-child { text-align: left; }
  .cmp-table td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); text-align: right; }
  .cmp-table td:first-child { text-align: left; color: var(--muted); font-size: 10px; }
  .cmp-table .sum-row td { border-top: 1px solid var(--border); font-weight: bold; border-bottom: none; }

  #map { flex: 1; }

  .cluster-label {
    background: rgba(20, 22, 25, 0.82) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    border-radius: 4px !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5) !important;
    padding: 3px 6px !important;
    font-family: 'Courier New', monospace;
    font-size: 11px; color: #c8cdd4; white-space: nowrap;
    pointer-events: none; line-height: 1.5;
  }
  .way-hover-tip {
    background: rgba(20, 22, 25, 0.90) !important;
    color: #e8eaed !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    border-radius: 4px;
    font-size: 12px;
    padding: 6px 10px;
    white-space: nowrap;
    line-height: 1.7;
  }
  .way-hover-tip strong { font-size: 13px; font-weight: 600; }
  .cluster-label::before { display: none !important; }
  .cluster-label .cl-total { font-size: 14px; font-weight: bold; color: #ffffff; }

  #legend { position: absolute; bottom: 24px; right: 10px; z-index: 1000;
    background: rgba(26,28,30,0.9); border: 1px solid var(--border);
    border-radius: 5px; padding: 8px 12px; font-size: 11px; color: var(--muted);
    pointer-events: none; }
  .legend-block { margin-bottom: 6px; }
  .legend-block:last-child { margin-bottom: 0; }
  .legend-bar { width: 120px; height: 8px; border-radius: 4px; margin: 4px 0 2px; }
  .legend-bar.fiets-bar { background: linear-gradient(to right, #22c55e, #eab308, #ef4444); }
  .legend-bar.auto-bar  { background: linear-gradient(to right, #22c55e, #eab308, #ef4444); }
  .legend-labels { display: flex; justify-content: space-between; }

  #empty-state { position: absolute; top: 50%; left: calc(50% + var(--panel-w)/2);
    transform: translate(-50%,-50%); text-align: center; color: var(--muted);
    font-size: 13px; pointer-events: none; z-index: 500; }
  #empty-state .big { font-size: 36px; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <div id="sidebar-header">
      <strong>Telrapport</strong>parkeertellingen
    </div>

    <div id="dropzone">
      <div class="dz-icon">📂</div>
      <div class="dz-text">Sleep ZIP-bestanden hier<br>of klik om te kiezen</div>
      <input type="file" id="file-input" multiple accept=".zip">
    </div>

    <div id="statsbar" style="display:none">
      <div class="stat-pill"><div class="n" id="s-sessies">0</div><div class="l">sessies</div></div>
      <div class="stat-pill"><div class="n" id="s-locaties">0</div><div class="l">locaties</div></div>
      <div class="stat-pill" id="pill-fiets" style="display:none"><div class="n" id="s-fietsen">0</div><div class="l">fietsen</div></div>
      <div class="stat-pill" id="pill-bezet" style="display:none"><div class="n" id="s-bezet">0</div><div class="l">plaatsen bezet</div></div>
    </div>

    <div id="toggles-fiets" class="toggle-section" style="display:none">
      <div class="toggle-label">fiets – type</div>
      <div class="toggle-row">
        <button class="dot-btn active" data-apptype="fiets" data-type="fiets"   style="color:#22c55e"><span class="dot" style="background:#22c55e"></span>fiets</button>
        <button class="dot-btn active" data-apptype="fiets" data-type="wrak"    style="color:#eab308"><span class="dot" style="background:#eab308"></span>wrak</button>
        <button class="dot-btn active" data-apptype="fiets" data-type="brommer" style="color:#60a5fa"><span class="dot" style="background:#60a5fa"></span>brom</button>
        <button class="dot-btn active" data-apptype="fiets" data-type="breed"   style="color:#c084fc"><span class="dot" style="background:#c084fc"></span>breed</button>
      </div>
    </div>

    <div id="toggles-auto" class="toggle-section" style="display:none">
      <div class="toggle-label">auto – bezetting</div>
      <div class="toggle-row">
        <button class="dot-btn active" data-apptype="auto" data-type="goed" style="color:#22c55e"><span class="dot" style="background:#22c55e"></span>goed</button>
        <button class="dot-btn active" data-apptype="auto" data-type="fout" style="color:#eab308"><span class="dot" style="background:#eab308"></span>fout</button>
        <button class="dot-btn active" data-apptype="auto" data-type="leeg" style="color:#94a3b8"><span class="dot" style="background:#94a3b8"></span>leeg</button>
        <button class="dot-btn active" data-apptype="auto" data-type="spec" style="color:#c084fc"><span class="dot" style="background:#c084fc"></span>spec</button>
      </div>
    </div>

    <div id="cluster-toggle-row" class="toggle-section" style="display:none">
      <div class="toggle-row">
        <button class="dot-btn active" id="cluster-toggle" style="color:#fff; flex:1">
          <span class="dot" style="background:#fff; border:1px solid #888"></span>locaties
        </button>
      </div>
    </div>

    <div id="gap-row" style="display:none">
      <label>gap-drempel</label>
      <input type="range" id="gap-slider" min="2" max="40" value="8" step="1">
      <span id="gap-val">8 m</span>
    </div>

    <div id="section-title" class="section-title" style="display:none">Sessies</div>
    <div id="sessions-list"></div>

    <div id="detail-panel" class="hidden">
      <span id="detail-close">✕</span>
      <div id="detail-title"></div>
      <div id="detail-sub"></div>
      <div id="detail-body"></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div id="empty-state">
  <div class="big">🗺️</div>
  Sleep een tellings-ZIP om te beginnen
</div>

<div id="legend" style="display:none">
  <div id="legend-fiets" class="legend-block" style="display:none">
    <div>Fiets – dichtheid</div>
    <div class="legend-bar fiets-bar"></div>
    <div class="legend-labels"><span>0</span><span id="leg-fiets-max">?</span></div>
  </div>
  <div id="legend-auto" class="legend-block" style="display:none">
    <div>Auto – bezetting</div>
    <div class="legend-bar auto-bar"></div>
    <div class="legend-labels"><span>0%</span><span>100%</span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
// ── CONFIG PER APP-TYPE ───────────────────────────────────────────
const APP_CONFIG = {
  fiets: {
    types:  ['fiets','wrak','brommer','breed'],
    colors: { fiets:'#22c55e', wrak:'#eab308', brommer:'#60a5fa', breed:'#c084fc' },
    labels: { fiets:'fiets', wrak:'wrak', brommer:'brom', breed:'breed' },
    heatVal: function(s) { return Math.sqrt(s.totaal || 0); },
    detailCols: ['fiets','wrak','brommer','breed','totaal'],
    detailLabels: { fiets:'fiets', wrak:'wrak', brommer:'brom', breed:'breed', totaal:'tot' },
    detailClasses: { fiets:'c-fiets', wrak:'c-wrak', brommer:'c-brom', breed:'c-breed', totaal:'c-tot' },
  },
  auto: {
    types:  ['goed','fout','leeg','spec'],
    colors: { goed:'#22c55e', fout:'#eab308', leeg:'#94a3b8', spec:'#c084fc' },
    labels: { goed:'goed', fout:'fout', leeg:'leeg', spec:'spec' },
    heatVal: function(s) { return (s.bezettingsgraad_pct || 0) / 100; },
    detailCols: ['goed','fout','leeg','spec','bezet','vrij','bezettingsgraad_pct'],
    detailLabels: { goed:'goed', fout:'fout', leeg:'leeg', spec:'spec',
                    bezet:'bezet', vrij:'vrij', bezettingsgraad_pct:'%' },
    detailClasses: { goed:'c-fiets', fout:'c-wrak', leeg:'c-muted', spec:'c-breed',
                     bezet:'c-tot', vrij:'c-muted', bezettingsgraad_pct:'c-tot' },
  }
};

// ── MAP ───────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([52.1, 5.1], 8);
map.createPane('clusters');
map.getPane('clusters').style.zIndex = 550;
map.createPane('capaciteit');
map.getPane('capaciteit').style.zIndex = 350;
map.getPane('capaciteit').style.pointerEvents = 'auto';
map.createPane('capnetwerk');
map.getPane('capnetwerk').style.zIndex = 210; // net boven tiles (200), onder alles

// ── Capaciteitsreferentielaag ─────────────────────────────────────────────
(function loadCapNetwerk() {
  fetch('/cap_netwerk.csv')
    .then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function(txt) {
      var lines = txt.trim().split('\n');
      var header = lines[0].split(';').map(function(h){ return h.trim(); });
      var wktIdx = header.indexOf('geometrie_wkt');
      if (wktIdx < 0) return;
      lines.slice(1).forEach(function(line) {
        if (!line.trim()) return;
        var cols = line.split(';');
        var wkt = cols.slice(wktIdx).join(';').trim();
        var isPoly = wkt.startsWith('POLYGON');
        var inner = wkt
          .replace(/^POLYGON\s*\(\(/, '').replace(/^LINESTRING\s*\(/, '')
          .replace(/\)\)$/, '').replace(/\)$/, '');
        var coords = inner.split(',').map(function(p) {
          var parts = p.trim().split(' ').map(Number);
          return [parts[1], parts[0]]; // [lat, lon]
        }).filter(function(c){ return !isNaN(c[0]) && !isNaN(c[1]); });
        if (coords.length < 2) return;
        var wid = (cols[0]||'').trim();
        window._capNetwerkCoords = window._capNetwerkCoords || [];
        window._capNetwerkCoords.push({ wayId: wid, coords: coords });
        if (isPoly) {
          L.polygon(coords, {
            pane: 'capnetwerk',
            color: '#1a1918', weight: 1.5, opacity: 0.7,
            fillColor: '#8e44ad', fillOpacity: 0.08,
            interactive: false
          }).addTo(map);
        } else {
          L.polyline(coords, {
            pane: 'capnetwerk',
            color: '#1a1918', weight: 4, opacity: 0.45,
            interactive: false
          }).addTo(map);
        }
      });
      window._capNetwerkReady = true;
    })
    .catch(function() {}); // stilzwijgend falen
})();

// ── Capaciteitsaantallen laden (cap_capaciteit.csv) ───────────────────────
(function loadCapCapaciteit() {
  var capCap = {};  // osm_way_id → totaal
  fetch('/cap_capaciteit.csv')
    .then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function(txt) {
      var lines = txt.trim().split('\n');
      var hdr = lines[0].split(';').map(function(h){ return h.trim(); });
      var widIdx = hdr.indexOf('osm_way_id');
      var capIdx = hdr.indexOf('capaciteit');
      if (widIdx < 0 || capIdx < 0) return;
      lines.slice(1).forEach(function(line) {
        var cols = line.split(';');
        var wid = (cols[widIdx]||'').trim();
        var n   = parseInt(cols[capIdx]) || 0;
        if (wid) capCap[wid] = (capCap[wid]||0) + n;
      });
      // Teken labels op cap_netwerk geometrie
      // Wacht tot capNetwerk al geladen is (100ms retry)
      function drawCapLabels(attempt) {
        if (!window._capNetwerkReady && attempt < 20) {
          return setTimeout(function(){ drawCapLabels(attempt+1); }, 150);
        }
        (window._capNetwerkCoords||[]).forEach(function(el) {
          var totaal = capCap[el.wayId];
          if (!totaal) return;
          // Centroïd
          var lats = el.coords.map(function(c){ return c[0]; });
          var lons = el.coords.map(function(c){ return c[1]; });
          var cLat = lats.reduce(function(a,b){return a+b;},0)/lats.length;
          var cLon = lons.reduce(function(a,b){return a+b;},0)/lons.length;
          var lbl = L.marker([cLat, cLon], {
            pane: 'capnetwerk',
            icon: L.divIcon({
              className: '',
              html: '<div style="font-family:Oswald,sans-serif;font-size:11px;font-weight:600;'
                  + 'color:#1a1918;background:rgba(255,255,255,0.82);padding:1px 5px;'
                  + 'border-radius:3px;white-space:nowrap;transform:translate(-50%,-50%);">'
                  + totaal + '</div>',
              iconSize: [0,0], iconAnchor: [0,0]
            }),
            interactive: false
          }).addTo(map);
        });
      }
      drawCapLabels(0);
    })
    .catch(function() {});
})();

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 21,
}).addTo(map);

// ── STATE ─────────────────────────────────────────────────────────
const sessions      = {};
const wayData       = {};   // wid → { geometry, highway, sessions:[] }
const wayLayers     = {};
const gpsLayers     = {};
const dotLayers     = {};   // sid → { type → [marker] }
const clusterLayers    = {};   // sid → [marker]
const capLayers      = {};   // sid → [marker] voor capaciteitssessies
const capTelData    = {};   // sid → [telregels] voor capaciteitssessies
const telData       = {};   // sid → filtered snapped telregels
let   capSpotLayers = [];   // tijdelijke spot-markers bij klik capaciteit
const globalPolyMap = {};   // wayId → [[lat,lon],...] voor spatial join


const dotVisible    = { fiets:true, wrak:true, brommer:true, breed:true,
                        goed:true, fout:true, leeg:true, spec:true };
let clustersVisible = true;
let gapThreshold    = 8;
let maxFietsTotaal  = 1;

// ── UTILS ─────────────────────────────────────────────────────────
const parseCSV = txt =>
  Papa.parse(txt.trim(), { header:true, delimiter:';', skipEmptyLines:true }).data;

function pointInPolygon(lat, lon, poly) {
  // Ray-casting algoritme
  var inside = false;
  for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    var xi = poly[i][1], yi = poly[i][0];
    var xj = poly[j][1], yj = poly[j][0];
    var intersect = ((yi > lat) !== (yj > lat))
      && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function parseWKT(wkt) {
  return wkt.replace(/^LINESTRING\s*\(/, '').replace(/\)$/, '')
    .split(',').map(p => { const [lo,la]=p.trim().split(' ').map(Number); return [la,lo]; });
}

function fmtDatum(d, t) {
  if (!d) d = t || '';
  d = String(d).split(' ')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return `${d.slice(8,10)}-${d.slice(5,7)}-${d.slice(0,4)}`;
  if (/^\d{8}$/.test(d))             return `${d.slice(6,8)}-${d.slice(4,6)}-${d.slice(0,4)}`;
  return d.slice(0,10);
}

function cleanNaam(s) {
  if (!s) return '—';
  return s.split(',')[0].trim() || s;
}

// ── HEAT COLOUR ───────────────────────────────────────────────────
function heatColor(t) {
  // t = 0..1
  const r = Math.round(255 * Math.min(2*t, 1));
  const g = Math.round(255 * Math.min(2*(1-t), 1));
  return `rgb(${r},${g},0)`;
}

function wayHeat(wid) {
  const wd = wayData[wid]; if (!wd || !wd.sessions.length) return null;
  const visSessions = wd.sessions.filter(s => sessions[s.sid]?.visible);
  if (!visSessions.length) return null;
  // Determine dominant appType for this way
  const appType = visSessions[0].appType;
  const cfg = APP_CONFIG[appType] || APP_CONFIG.fiets;
  if (appType === 'auto') {
    // Gemiddelde bezettingsgraad over zichtbare sessies
    const avg = visSessions.reduce((a,s) => a + (s.bezettingsgraad_pct||0), 0) / visSessions.length;
    return { t: avg / 100, appType };
  } else {
    // √-schaal op totaal
    const total = visSessions.reduce((a,s) => a + (s.totaal||0), 0);
    return { t: Math.min(Math.sqrt(total) / Math.sqrt(maxFietsTotaal), 1), appType, total };
  }
}

function recolorAll() {
  // Herbereken maxFietsTotaal
  let mx = 1;
  Object.keys(wayData).forEach(wid => {
    const wd = wayData[wid];
    const fietsTotal = wd.sessions.filter(s => s.appType==='fiets' && sessions[s.sid]?.visible)
                                  .reduce((a,s) => a + (s.totaal||0), 0);
    if (fietsTotal > mx) mx = fietsTotal;
  });
  maxFietsTotaal = mx;
  document.getElementById('leg-fiets-max').textContent = mx;
  Object.keys(wayLayers).forEach(recolorOne);
}

function recolorOne(wid) {
  const line = wayLayers[wid]; if (!line) return;
  const heat = wayHeat(wid);
  if (!heat) { line.setStyle({ color:'#3a3d42', opacity:0.5, weight:2 }); return; }
  line.setStyle({ color: heatColor(heat.t), opacity:0.9, weight:4 });
}

// ── PROJECTION ────────────────────────────────────────────────────
function projectOnPolyline(lat, lon, geometry) {
  const LAT_M = 111320;
  const LON_M = 111320 * Math.cos(geometry[0][0] * Math.PI / 180);
  const px = lon*LON_M, py = lat*LAT_M;
  let bestDist=Infinity, bestPos=0, cumLen=0;
  for (let i=0; i<geometry.length-1; i++) {
    const ax=geometry[i][1]*LON_M, ay=geometry[i][0]*LAT_M;
    const bx=geometry[i+1][1]*LON_M, by=geometry[i+1][0]*LAT_M;
    const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy, segLen=Math.sqrt(len2);
    if (len2>0) {
      const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len2));
      const dist=Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
      if (dist<bestDist) { bestDist=dist; bestPos=cumLen+t*segLen; }
    }
    cumLen+=segLen;
  }
  return bestPos;
}

// ── GAP CLUSTERING ────────────────────────────────────────────────
function gapCluster(items, threshold) {
  if (!items.length) return [];
  items.sort((a,b)=>a.pos-b.pos);
  const clusters=[]; let group=[items[0]];
  for (let i=1; i<items.length; i++) {
    if (items[i].pos - items[i-1].pos > threshold) { clusters.push(group); group=[]; }
    group.push(items[i]);
  }
  clusters.push(group);
  return clusters;
}

// ── DRAW CLUSTERS ─────────────────────────────────────────────────
function drawClusters(sid) {
  (clusterLayers[sid]||[]).forEach(m=>map.removeLayer(m));
  clusterLayers[sid]=[];
  if (!clustersVisible || !sessions[sid]?.visible) return;
  const rows = telData[sid]; if (!rows || !rows.length) return;
  const appType = sessions[sid].appType;
  const cfg = APP_CONFIG[appType] || APP_CONFIG.fiets;

  const groups = {};
  rows.forEach(r => {
    const wid=r.osm_way_id, zijde=r.zijde||'X';
    const geometry=wayData[wid]?.geometry; if (!geometry) return;
    const la=+r.lat_marker, lo=+r.lon_marker; if (isNaN(la)||isNaN(lo)) return;
    const key=`${wid}|${zijde}`;
    if (!groups[key]) groups[key]={ wid, zijde, items:[] };
    groups[key].items.push({
      pos: projectOnPolyline(la,lo,geometry),
      lat:la, lon:lo,
      type: (r.type||'').toLowerCase()
    });
  });

  Object.values(groups).forEach(({items}) => {
    gapCluster(items, gapThreshold).forEach(group => {
      const centLat=group.reduce((a,p)=>a+p.lat,0)/group.length;
      const centLon=group.reduce((a,p)=>a+p.lon,0)/group.length;
      const counts={};
      group.forEach(p=>{ counts[p.type]=(counts[p.type]||0)+1; });
      const total=group.length;
      const dominant=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
      const radius=5+Math.sqrt(total)*2.8;
      const typeLine = Object.entries(counts).sort((a,b)=>b[1]-a[1])
        .map(([t,n]) => t+': '+n).join(' · ');
      const fillColor = cfg.colors[dominant]||'#aaa';
      const size = Math.round((5 + Math.sqrt(total)*2.8) * 2);
      const fontSize = total < 10 ? 13 : total < 100 ? 11 : 9;
      const icon = L.divIcon({
        className: '',
        html: '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;'
            + 'background:'+fillColor+';border:1.5px solid #000;opacity:0.85;'
            + 'display:flex;align-items:center;justify-content:center;'
            + 'font-family:Oswald,sans-serif;font-size:'+fontSize+'px;font-weight:700;'
            + 'color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.6);'
            + 'transform:translate(-50%,-50%);box-sizing:border-box;">'
            + total + '</div>',
        iconSize: [0,0], iconAnchor: [0,0]
      });
      const m = L.marker([centLat, centLon], { icon, pane:'clusters', interactive:true })
        .bindTooltip(typeLine, { permanent:false, direction:'top', offset:[0,-size/2],
          className:'cluster-label' })
        .on('click', ()=>showClusterDetail(counts, total, sid, appType));
      m.addTo(map);
      clusterLayers[sid].push(m);
    });
  });
  updateStats();
}

function redrawAllClusters() {
  Object.keys(sessions).forEach(sid=>drawClusters(sid));
}

        cols.forEach(c=>{ html+=`<td class="${classes[c]||''}">${s[c]??''}</td>`; });

/* ── Capaciteitssessies ──────────────────────────────────── */
function loadCapaciteitZip(sid, sm, capCSV, gpsCSV, netCSV, telCSV) {
  if (telCSV) capTelData[sid] = parseCSV(telCSV);
  sessions[sid] = { meta:sm, visible:true, appType:'capaciteit' };
  capLayers[sid] = [];

  if (!capCSV) { renderSessions(); updateUI(); return; }

  // Lees parkeer-polygonen uit netwerk.csv (highway='parking', WKT=POLYGON)
  const polyMap = {};
  if (netCSV) {
    parseCSV(netCSV).forEach(r => {
      if (r.highway === 'parking' && r.geometrie_wkt && r.geometrie_wkt.trim().startsWith('POLYGON')) {
        const inner = r.geometrie_wkt.trim().replace(/^POLYGON\s*\(\(/, '').replace(/\)\)$/, '');
        const coords = inner.split(',').map(p => {
          const parts = p.trim().split(' ').map(Number);
          return [parts[1], parts[0]]; // [lat, lon] voor Leaflet
        });
        polyMap[r.osm_way_id] = coords;
        globalPolyMap[r.osm_way_id] = coords;
      }
    });
  }

  // Auto-detectie column-offset: in oudere exports staat osmType als 3e kolom
  const SOORTEN = ['regulier','gehandicapt','laadpaal','gereserveerd'];
  const rows = parseCSV(capCSV);
  const groups = {};
  rows.forEach(r => {
    let naam, soort, cap;
    if (r.soort && !SOORTEN.includes(r.soort) && SOORTEN.includes(r.capaciteit)) {
      // Oud formaat: osmType in kolom 'naam', naam in 'zijde', soort in 'capaciteit', n in 'eerste_waarneming'
      naam = r.zijde || '—';
      soort = r.capaciteit;
      cap  = parseInt(r.eerste_waarneming) || 0;
    } else {
      naam = r.naam || '—';
      soort = r.soort;
      cap  = parseInt(r.capaciteit) || 0;
    }
    const key = r.osm_way_id || '_onbekend';
    if (!groups[key]) groups[key] = { naam, osmType:'way', soorten:{}, wayId:key };
    if (cap > 0 && soort) groups[key].soorten[soort] = (groups[key].soorten[soort]||0) + cap;
  });

  // GPS-centroïd als fallback
  let centLat=null, centLon=null;
  if (gpsCSV) {
    const gps = parseCSV(gpsCSV).filter(r=>r.lat&&r.lon);
    if (gps.length) {
      centLat = gps.reduce((a,r)=>a+parseFloat(r.lat),0)/gps.length;
      centLon = gps.reduce((a,r)=>a+parseFloat(r.lon),0)/gps.length;
    }
  }

  const datum = fmtDatum(sm.datum, sm.start_tijd);

  // Haal OSM-geometrie op voor alle way-IDs
  const wayIds = Object.values(groups)
    .filter(g=>g.osmType==='way' && g.wayId && g.wayId!=='_onbekend')
    .map(g=>g.wayId);

  const drawGroups = (geomMap) => {
    Object.values(groups).forEach((g, i) => {
      const total = Object.values(g.soorten).reduce((a,n)=>a+n,0);
      const geom  = polyMap[g.wayId] || geomMap[g.wayId];
      const labelHtml = '<div style="font-family:Oswald,sans-serif;background:#8e44ad;color:#fff;border-radius:50%;width:36px;height:36px;line-height:36px;text-align:center;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.4);transform:translate(-50%,-50%);cursor:pointer;">' + total + '</div>';

      if (geom && geom.length > 2) {
        // Polygoon tekenen
        const poly = L.polygon(geom, {
          color:'#8e44ad', weight:2.5, fillColor:'#8e44ad', fillOpacity:0.18
        })
        .on('mouseover', function(e) {
          this.setStyle({weight:4, fillOpacity:0.30});
          const poly = globalPolyMap[g.wayId] || geom;
          // Spatial join: tel stippen per sessie die binnen de polygoon vallen
          const sessieTips = [];
          Object.entries(sessions).forEach(function(entry) {
            const tsid = entry[0], sess = entry[1];
            if (!sess.visible) return;
            if (sess.appType === 'capaciteit') return;
            const rows = telData[tsid];
            if (!rows || !rows.length) return;
            const sm2 = sess.meta;
            const d2 = fmtDatum(sm2.datum, sm2.start_tijd);
            const tel2 = sm2.teller ? ' · ' + sm2.teller : '';
            const binnen = rows.filter(function(r) {
              var la = +r.lat_marker, lo = +r.lon_marker;
              return !isNaN(la) && !isNaN(lo) && pointInPolygon(la, lo, poly);
            });
            if (!binnen.length) return;
            const typeCounts = {};
            binnen.forEach(function(r) {
              var t = (r.type||'?').toLowerCase();
              typeCounts[t] = (typeCounts[t]||0) + 1;
            });
            const typeStr = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])
              .map(([t,n]) => t+':'+n).join(' · ');
            sessieTips.push(d2 + tel2 + ' — ' + binnen.length + ' obs (' + typeStr + ')');
          });
          const capTotal = Object.values(g.soorten).reduce((a,n)=>a+n,0);
          const capStr = Object.entries(g.soorten).sort((a,b)=>b[1]-a[1])
            .map(([s,n]) => s+':'+n).join(' · ');
          const teller = sm.teller ? ' · ' + sm.teller : '';
          var tip = '<strong>' + g.naam + '</strong><br>'
            + datum + teller + ' — capaciteit: ' + capTotal
            + (capStr ? ' (' + capStr + ')' : '');
          if (sessieTips.length) {
            tip += '<br><span style="opacity:0.7;font-size:11px;">geteld:</span><br>'
              + sessieTips.join('<br>');
          }
          this.bindTooltip(tip, {sticky:true, direction:'top', className:'way-hover-tip'}).openTooltip(e.latlng);
        })
        .on('mouseout', function() {
          this.closeTooltip();
          this.setStyle({weight:2.5, fillOpacity:0.18});
        })
        .on('click', ()=>showCapDetail(g, datum, sm.teller||'', sid));
        poly.addTo(map);
        poly.bringToBack();
        capLayers[sid].push(poly);

        // Label op centroïd van polygoon
        const bounds = poly.getBounds();
        const midLat = (bounds.getNorth()+bounds.getSouth())/2;
        const midLon = (bounds.getEast()+bounds.getWest())/2;
        const lbl = L.marker([midLat, midLon], {
          icon: L.divIcon({ className:'', html:labelHtml, iconSize:[0,0], iconAnchor:[0,0] })
        }).on('click', ()=>showCapDetail(g, datum, sm.teller||'', sid));
        lbl.addTo(map);
        capLayers[sid].push(lbl);
      } else {
        // Fallback: punt op GPS-centroïd
        const lat = centLat ? centLat+(i*0.00005) : 52.0;
        const lon = centLon ? centLon+(i*0.00005) : 4.5;
        const m = L.marker([lat,lon], {
          icon: L.divIcon({ className:'', html:labelHtml, iconSize:[0,0], iconAnchor:[0,0] })
        }).on('click', ()=>showCapDetail(g, datum, sm.teller||'', sid));
        m.addTo(map);
        capLayers[sid].push(m);
      }
    });

    if (capLayers[sid].length) {
      map.fitBounds(L.featureGroup(capLayers[sid]).getBounds().pad(0.4));
    }
    renderSessions(); updateUI(); updateStats();
    document.getElementById('empty-state').style.display='none';
  };

  // Filteren: alleen IDs ophalen die NIET in polyMap zitten
  const missingIds = wayIds.filter(id => !polyMap[id]);
  if (!missingIds.length) { drawGroups({}); return; }

  // Overpass: haal geometrie op voor ontbrekende way-IDs
  const query = '[out:json][timeout:10];way(id:'+missingIds.join(',')+');out geom;';
  const tryOverpass = (idx) => {
    if (idx >= ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'].length) {
      drawGroups({}); return;
    }
    const endpoints = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
    fetch(endpoints[idx]+'?data='+encodeURIComponent(query))
      .then(r=>r.json())
      .then(data => {
        const geomMap = {};
        (data.elements||[]).forEach(el => {
          if (el.type==='way' && el.geometry) {
            geomMap[String(el.id)] = el.geometry.map(p=>[p.lat, p.lon]);
          }
        });
        drawGroups(geomMap);
      })
      .catch(()=>tryOverpass(idx+1));
  };
  tryOverpass(0);
}

function showCapDetail(g, datum, teller, sid) {
  document.getElementById('detail-title').textContent = g.naam;
  document.getElementById('detail-sub').textContent = 'capaciteit · '+datum+(teller?' · '+teller:'');
  const soortKleur = { regulier:'#2471a3', gehandicapt:'#27ae60', laadpaal:'#e67e22', gereserveerd:'#8e44ad' };
  const total = Object.values(g.soorten).reduce((a,n)=>a+n,0);
  let html = '<table class="cmp-table"><tr><th>soort</th><th>plekken</th><th>%</th></tr>';
  Object.entries(g.soorten).forEach(function(entry) {
    var soort=entry[0], n=entry[1];
    var kleur = soortKleur[soort]||'var(--muted)';
    html += '<tr><td style="color:'+kleur+';font-weight:bold">'+soort+'</td><td style="text-align:right">'+n+'</td><td style="text-align:right;color:var(--muted)">'+Math.round(n/total*100)+'%</td></tr>';
  });
  html += '<tr class="sum-row"><td>totaal</td><td style="text-align:right">'+total+'</td><td></td></tr></table>';
  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('detail-panel').classList.remove('hidden');

  // Ruim vorige spot-markers op
  capSpotLayers.forEach(function(m){ map.removeLayer(m); });
  capSpotLayers = [];

  // Teken individuele vakken op de kaart
  var rows = (sid && capTelData[sid]) ? capTelData[sid] : [];
  rows = rows.filter(function(r){ return r.osm_way_id === g.wayId || !g.wayId; });
  rows.forEach(function(r) {
    var la = parseFloat(r.lat_marker), lo = parseFloat(r.lon_marker);
    if (isNaN(la)||isNaN(lo)) return;
    var type = (r.type||'').toLowerCase();
    var kleur = soortKleur[type] || '#888';
    var m = L.circleMarker([la,lo], {
      radius: 8, color: '#fff', weight: 2,
      fillColor: kleur, fillOpacity: 0.92,
      pane: 'clusters'
    }).bindTooltip(type + (r.zijde?' · zijde '+r.zijde:'') + (r.straat?' · '+r.straat:''),
        {direction:'top', offset:[0,-6]});
    m.addTo(map);
    capSpotLayers.push(m);
  });
}

// ── LOAD ZIP ─────────────────────────────────────────────────────
async function loadZip(file) {
  const zip=await JSZip.loadAsync(file);
  const F={};
  await Promise.all(Object.entries(zip.files).map(([p,e])=>{
    if (e.dir) return;
    return e.async('text').then(t=>{ F[p.split('/').pop()]=t; });
  }));

  const get=suf=>{ const k=Object.keys(F).find(k=>k.endsWith(suf)); return k?F[k]:null; };
  const sessieCSV=get('_sessie.csv'), stratenCSV=get('_straten.csv'),
        netCSV=get('_netwerk.csv'), gpsCSV=get('_gps.csv'), telCSV=get('_telregels.csv'),
        capCSV=get('_capaciteit.csv');

  if (!sessieCSV) { alert(`Geen sessie.csv gevonden in ${file.name}`); return; }

  const sm=parseCSV(sessieCSV)[0];
  const sid=sm.sessie_id;
  if (sessions[sid]) return;

  const appType = (sm.app_type||'').trim() === 'auto' ? 'auto'
                : (sm.app_type||'').trim() === 'capaciteit' ? 'capaciteit'
                : 'fiets';

  // Capaciteitssessie: apart pad
  if (appType === 'capaciteit') {
    loadCapaciteitZip(sid, sm, capCSV, gpsCSV, netCSV, telCSV);
    return;
  }

  if (!stratenCSV||!netCSV) { alert(`Bestanden niet gevonden in ${file.name}`); return; }
  const cfg = APP_CONFIG[appType];
  sessions[sid]={ meta:sm, visible:true, appType };

  // Geometrie laden
  parseCSV(netCSV).forEach(r=>{
    if (!wayData[r.osm_way_id])
      wayData[r.osm_way_id]={ geometry:parseWKT(r.geometrie_wkt), highway:r.highway, sessions:[] };
  });

  // Straten → ways
  parseCSV(stratenCSV).forEach(r=>{
    const naam = cleanNaam(r.naam || r.straat);  // naam (v1.4+) of straat (compat)
    const wids = String(r.osm_way_ids||'').split('|').map(s=>s.trim()).filter(Boolean);
    if (!wids.length) return;
    const factor = 1 / wids.length;
    wids.forEach(wid=>{
      const wd=wayData[wid]; if (!wd) return;
      const entry = { sid, naam, appType };
      if (appType === 'fiets') {
        entry.fiets   = Math.round((+r.fiets  ||0)*factor);
        entry.wrak    = Math.round((+r.wrak   ||0)*factor);
        entry.brommer = Math.round((+r.brommer||0)*factor);
        entry.breed   = Math.round((+r.breed  ||0)*factor);
        entry.totaal  = Math.round((+r.totaal ||0)*factor);
      } else {
        entry.goed    = Math.round((+r.goed   ||0)*factor);
        entry.fout    = Math.round((+r.fout   ||0)*factor);
        entry.leeg    = Math.round((+r.leeg   ||0)*factor);
        entry.spec    = Math.round((+r.spec   ||0)*factor);
        entry.bezet   = Math.round((+r.bezet  ||0)*factor);
        entry.vrij    = Math.round((+r.vrij   ||0)*factor);
        entry.bezettingsgraad_pct = +(r.bezettingsgraad_pct||0);
      }
      wd.sessions.push(entry);
    });
  });

  // Wegvak-polylijnen
  Object.entries(wayData).forEach(([wid,wd])=>{
    if (!wayLayers[wid]) {
      wayLayers[wid]=L.polyline(wd.geometry,{color:'#3a3d42',weight:2,opacity:0.5})
        .on('click',()=>showWegvakDetail(wid))
        .on('mouseover', function(e) {
          this.setStyle({weight:6,opacity:1});
          const wd2 = wayData[wid];
          const naam = wd2.sessions[0] ? cleanNaam(wd2.sessions[0].naam) : wid;
          const visSess = wd2.sessions.filter(s=>sessions[s.sid]?.visible);
          const tellijnen = visSess.map(function(s) {
            const sm = sessions[s.sid].meta;
            const datum = fmtDatum(sm.datum, sm.start_tijd);
            const teller = sm.teller ? ' · ' + sm.teller : '';
            if (s.appType === 'fiets') {
              return datum + teller + ' — ' + (s.totaal||0) + ' fietsen';
            } else {
              const pct = s.bezettingsgraad_pct ? ' (' + Math.round(s.bezettingsgraad_pct) + '%)' : '';
              return datum + teller + ' — ' + (s.bezet||0) + ' bezet' + pct;
            }
          });
          const tip = '<strong>' + naam + '</strong><br>' + (tellijnen.length ? tellijnen.join('<br>') : 'geen zichtbare tellingen');
          this.bindTooltip(tip, {sticky:true, direction:'top', className:'way-hover-tip'}).openTooltip(e.latlng);
        })
        .on('mouseout', function() {
          this.closeTooltip();
          recolorOne(wid);
        })
        .addTo(map);
    }
  });

  // GPS-spoor
  if (gpsCSV) {
    const coords=parseCSV(gpsCSV).map(r=>[+r.lat,+r.lon]).filter(c=>!isNaN(c[0]));
    if (coords.length)
      gpsLayers[sid]=L.polyline(coords,{color:'#4a9eff',weight:1.5,opacity:0.35,dashArray:'4 4'}).addTo(map);
  }

  // Stipjes + telregels voor clustering
  if (telCSV) {
    const allRows=parseCSV(telCSV);
    const datum=fmtDatum(sm.datum, sm.start_tijd);
    telData[sid]=allRows.filter(r=>r.snapped==='1'||r.snapped===1);
    dotLayers[sid]={};
    allRows.forEach(r=>{
      const la=+r.lat_marker, lo=+r.lon_marker;
      const type=(r.type||'').toLowerCase();
      if (isNaN(la)||isNaN(lo)||!cfg.colors[type]) return;
      if (!dotLayers[sid][type]) dotLayers[sid][type]=[];
      const snapped=(r.snapped==='1'||r.snapped===1);
      const m=L.circleMarker([la,lo],{
        radius:4, color:'#111', weight:0.8,
        fillColor:cfg.colors[type], fillOpacity: snapped ? 0.85 : 0.35,
      }).bindTooltip(`${type}${snapped?'':' ⚠'} · ${cleanNaam(r.straat||r.naam)} · ${datum}`,
        {direction:'top',offset:[0,-4]});
      dotLayers[sid][type].push(m);
      if (dotVisible[type]) m.addTo(map);
    });
  }

  recolorAll();
  drawClusters(sid);
  renderSessions();
  updateUI();
  updateStats();
  map.fitBounds(Object.values(wayData).flatMap(w=>w.geometry),{padding:[30,30]});
  document.getElementById('empty-state').style.display='none';
}

// ── SESSIONS UI ───────────────────────────────────────────────────
function renderSessions() {
  const list=document.getElementById('sessions-list');
  list.innerHTML='';
  Object.keys(sessions).sort().reverse().forEach(sid=>{
    const s=sessions[sid];
    const datum=fmtDatum(s.meta.datum, s.meta.start_tijd);
    const typeLabel=s.appType==='auto'?'🚗':s.appType==='capaciteit'?'🅿':'🚲';
    const row=document.createElement('div');
    row.className='session-row';
    row.innerHTML=`
      <div class="session-toggle ${s.visible?'on':''}" data-sid="${sid}"></div>
      <div class="session-info">
        <div class="session-datum">${datum} <span style="color:var(--muted);font-size:10px">${typeLabel} ${s.meta.teller||''}</span></div>
        <div class="session-id">${sid}</div>
      </div>
      <div class="session-n">${s.meta.n_waarnemingen||''}</div>`;
    list.appendChild(row);
  });
  const has=Object.keys(sessions).length>0;
  document.getElementById('section-title').style.display=has?'block':'none';
}

document.getElementById('sessions-list').addEventListener('click',e=>{
  const t=e.target.closest('.session-toggle'); if (!t) return;
  const sid=t.dataset.sid;
  sessions[sid].visible=!sessions[sid].visible;
  t.classList.toggle('on',sessions[sid].visible);
  if (gpsLayers[sid]) sessions[sid].visible?gpsLayers[sid].addTo(map):map.removeLayer(gpsLayers[sid]);
  if (capLayers[sid]) capLayers[sid].forEach(m=>sessions[sid].visible?m.addTo(map):map.removeLayer(m));
  const cfg=APP_CONFIG[sessions[sid].appType]||APP_CONFIG.fiets;
  cfg.types.forEach(type=>showHideDots(sid,type,dotVisible[type]));
  drawClusters(sid);
  recolorAll();
  updateStats();
});

// ── TOGGLES ───────────────────────────────────────────────────────
document.querySelectorAll('.dot-btn[data-type]').forEach(btn=>{
  btn.addEventListener('click',function(){
    const type=this.dataset.type;
    dotVisible[type]=!dotVisible[type];
    this.classList.toggle('active',dotVisible[type]);
    Object.keys(dotLayers).forEach(sid=>showHideDots(sid,type,dotVisible[type]));
  });
});

document.getElementById('cluster-toggle').addEventListener('click',function(){
  clustersVisible=!clustersVisible;
  this.classList.toggle('active',clustersVisible);
  redrawAllClusters();
});

document.getElementById('gap-slider').addEventListener('input',function(){
  gapThreshold=+this.value;
  document.getElementById('gap-val').textContent=gapThreshold+' m';
  redrawAllClusters();
});

// ── UI ZICHTBAARHEID ─────────────────────────────────────────────
function updateUI() {
  const hasFiets=Object.values(sessions).some(s=>s.appType==='fiets');
  const hasAuto =Object.values(sessions).some(s=>s.appType==='auto');
  const hasCap  =Object.values(sessions).some(s=>s.appType==='capaciteit');
  const hasAny  =hasFiets||hasAuto||hasCap;

  document.getElementById('statsbar').style.display           = hasAny  ?'flex':'none';
  document.getElementById('toggles-fiets').style.display      = hasFiets?'block':'none';
  document.getElementById('toggles-auto').style.display       = hasAuto ?'block':'none';
  document.getElementById('cluster-toggle-row').style.display = hasAny  ?'block':'none';
  document.getElementById('gap-row').style.display            = hasAny  ?'flex':'none';
  document.getElementById('legend').style.display             = hasAny  ?'block':'none';
  document.getElementById('legend-fiets').style.display       = hasFiets?'block':'none';
  document.getElementById('legend-auto').style.display        = hasAuto ?'block':'none';
  document.getElementById('pill-fiets').style.display         = hasFiets?'block':'none';
  document.getElementById('pill-bezet').style.display         = hasAuto ?'block':'none';
}

// ── STATS ─────────────────────────────────────────────────────────
function updateStats() {
  const visSids=Object.keys(sessions).filter(s=>sessions[s].visible);
  document.getElementById('s-sessies').textContent=visSids.length;
  const totL=Object.values(clusterLayers).reduce((a,arr)=>a+arr.length,0);
  document.getElementById('s-locaties').textContent=totL;

  const totFiets=Object.values(wayData).reduce((a,wd)=>
    a+wd.sessions.filter(s=>s.appType==='fiets'&&sessions[s.sid]?.visible)
                 .reduce((b,s)=>b+(s.fiets||0),0),0);
  document.getElementById('s-fietsen').textContent=totFiets;

  const totBezet=Object.values(wayData).reduce((a,wd)=>
    a+wd.sessions.filter(s=>s.appType==='auto'&&sessions[s.sid]?.visible)
                 .reduce((b,s)=>b+(s.bezet||0),0),0);
  document.getElementById('s-bezet').textContent=totBezet;
}

// ── DROP ──────────────────────────────────────────────────────────
const dz=document.getElementById('dropzone'), fi=document.getElementById('file-input');
dz.addEventListener('click',()=>fi.click());
fi.addEventListener('change',e=>{ [...e.target.files].forEach(loadZip); fi.value=''; });
document.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('over'); });
document.addEventListener('dragleave',e=>{ if(!e.relatedTarget) dz.classList.remove('over'); });
document.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('over');
  [...e.dataTransfer.files].filter(f=>f.name.endsWith('.zip')).forEach(loadZip);
});
</script>
</body>
