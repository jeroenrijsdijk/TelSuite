// ── 7×24 HEATMAP voor pocket-segment ──────────────────────────────────────
// Per cel (dag-van-week, uur): aanwezigheidstijd in segment-meter-uren en
// aantal tikken in dat tijdvenster. Visits over uurgrenzen worden proportioneel
// gesplitst zodat een visit van 23:55–00:05 niet aan één uur wordt toegeschreven.
// Tikken worden via dezelfde proportie verdeeld (gebrek aan tijdstempel op
// tap-niveau in _bezocht.csv) — dat is een aanvaardbare benadering.
//
// Eenheid in cel: tikken per meter per uur (passages/m·u).
function buildWeeklyHeatmap(key) {
  const wd = wayData[key]; if (!wd) return null;
  const wid = wd.wayId || parseKey(key).wid;
  const segIdx = wd.segIdx || 0;
  const lenM = segmentLengthM(wd.geometry);
  if (lenM <= 0) return null;

  // cells[d][h] = { secs: aanwezigheid in s, taps: tikken }
  const cells = Array.from({length: 7}, () =>
    Array.from({length: 24}, () => ({ secs: 0, taps: 0 })));

  let anyVisit = false;
  Object.keys(visitData).forEach(function(sid) {
    if (!sessions[sid]?.visible) return;
    visitData[sid].forEach(function(v) {
      if (v.wid !== wid || (v.segIdx||0) !== segIdx) return;
      anyVisit = true;
      splitVisitIntoHourBuckets(v).forEach(function(bucket) {
        cells[bucket.dow][bucket.hour].secs += bucket.secs;
        cells[bucket.dow][bucket.hour].taps += bucket.taps;
      });
    });
  });

  if (!anyVisit) return null;

  // Cel-waarde uitrekenen + max bepalen voor kleurschaal
  let maxVal = 0;
  for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) {
    const c = cells[d][h];
    if (c.secs > 0) {
      const meterHours = lenM * (c.secs / 3600);
      c.value = c.taps / meterHours;   // tikken per meter per uur
      if (c.value > maxVal) maxVal = c.value;
    } else {
      c.value = null;
    }
  }
  return { cells: cells, lenM: lenM, maxVal: maxVal };
}

// Splitst een visit in stukken per (dag, uur)-bucket.
// Tikken worden naar rato van aanwezigheidstijd over de buckets verdeeld.
function splitVisitIntoHourBuckets(v) {
  const buckets = [];
  let cur = new Date(v.tStart.getTime());
  const totalSec = (v.tEnd - v.tStart) / 1000;
  if (totalSec <= 0) return buckets;
  while (cur < v.tEnd) {
    const nextHour = new Date(cur.getTime());
    nextHour.setMinutes(0, 0, 0);
    nextHour.setHours(nextHour.getHours() + 1);
    const chunkEnd = (nextHour < v.tEnd) ? nextHour : v.tEnd;
    const chunkSec = (chunkEnd - cur) / 1000;
    if (chunkSec > 0) {
      // dow: 0=ma, 1=di, ..., 6=zo  (JS standaard 0=zo → omzetten)
      const jsDay = cur.getDay();
      const dow = (jsDay + 6) % 7;
      buckets.push({
        dow: dow,
        hour: cur.getHours(),
        secs: chunkSec,
        taps: v.nTel * (chunkSec / totalSec)
      });
    }
    cur = chunkEnd;
  }
  return buckets;
}

// Rendert de 7×24 heatmap als HTML-string. Cellen krijgen heat-kleur via
// dezelfde √-schaal als de kaart (1 p/m·u = saturatie).
function renderWeeklyHeatmap(hm) {
  const DAGEN = ['ma','di','wo','do','vr','za','zo'];
  const HOURS = Array.from({length: 24}, (_, h) => h);
  // Som rij/kolom voor totalen
  const dayTot = Array(7).fill(null).map(() => ({ secs: 0, taps: 0 }));
  const hourTot = Array(24).fill(null).map(() => ({ secs: 0, taps: 0 }));
  let totSec = 0, totTap = 0;
  for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) {
    const c = hm.cells[d][h];
    dayTot[d].secs += c.secs; dayTot[d].taps += c.taps;
    hourTot[h].secs += c.secs; hourTot[h].taps += c.taps;
    totSec += c.secs; totTap += c.taps;
  }
  function valOf(secs, taps) {
    if (secs <= 0) return null;
    return taps / (hm.lenM * (secs / 3600));
  }
  // Slimme afronding: ≥10 → geheel getal (anders past 100+ niet in cel)
  //                    1..10 → één decimaal
  //                    <1    → één decimaal (incl. trailing 0)
  function fmtVal(v) {
    if (v === null || v === undefined) return '';
    if (v >= 10) return Math.round(v).toString();
    return v.toFixed(1);
  }
  // Hybride kleurschaal: saturatie bij max(100, observed max).
  // 100 p/m·u is "drukke centrumstoep", boven 100 schaalt mee zodat
  // extreem drukke segmenten ook nog kleurspreiding behouden.
  const SAT_MIN = 100;
  const saturation = Math.max(SAT_MIN, hm.maxVal || 0);
  function cellStyle(val) {
    if (val === null) return 'background:rgba(255,255,255,0.04);';
    const t = Math.sqrt(Math.min(1, val / saturation));
    const r = Math.round(255 * Math.min(2*t, 1));
    const g = Math.round(255 * Math.min(2*(1-t), 1));
    return `background:rgb(${r},${g},0);`;
  }

  let html = `<table class="hm-tbl"><thead><tr><th></th>`;
  HOURS.forEach(h => { html += `<th>${h}</th>`; });
  html += `<th class="hm-tot">∑</th></tr></thead><tbody>`;
  for (let d = 0; d < 7; d++) {
    html += `<tr><th>${DAGEN[d]}</th>`;
    for (let h = 0; h < 24; h++) {
      const c = hm.cells[d][h];
      const v = c.value;
      const title = (v !== null)
        ? `${DAGEN[d]} ${h}:00 · ${v.toFixed(2)} p/m·u (${Math.round(c.taps)} tikken in ${(c.secs/60).toFixed(1)} min)`
        : `${DAGEN[d]} ${h}:00 · niet gemeten`;
      const txt = (v !== null && v >= 0.5) ? fmtVal(v) : '';
      html += `<td style="${cellStyle(v)}" title="${title}">${txt}</td>`;
    }
    const rowVal = valOf(dayTot[d].secs, dayTot[d].taps);
    html += `<td class="hm-tot" title="${rowVal !== null ? rowVal.toFixed(2) + ' p/m·u' : 'geen data'}">${fmtVal(rowVal)}</td></tr>`;
  }
  // Footer met uur-totalen
  html += `<tr class="hm-foot"><th>∑</th>`;
  for (let h = 0; h < 24; h++) {
    const colVal = valOf(hourTot[h].secs, hourTot[h].taps);
    html += `<td title="${colVal !== null ? colVal.toFixed(2) + ' p/m·u' : 'geen data'}">${fmtVal(colVal)}</td>`;
  }
  const grandVal = valOf(totSec, totTap);
  html += `<td class="hm-tot">${fmtVal(grandVal)}</td></tr>`;
  html += `</tbody></table>`;
  // Compacte legenda onder de tabel
  const legSteps = [0, 10, 30, 60, 100, Math.max(saturation, 100)];
  let legHtml = '<div class="hm-legend">';
  for (let i = 0; i < legSteps.length - 1; i++) {
    const mid = (legSteps[i] + legSteps[i+1]) / 2;
    legHtml += `<span class="hm-leg-sw" style="${cellStyle(mid)}"></span>` +
               `<span class="hm-leg-lbl">${fmtVal(legSteps[i])}–${fmtVal(legSteps[i+1])}</span>`;
  }
  legHtml += '</div>';
  return html + legHtml;
}

// ── WEEKPROFIEL POPUP ─────────────────────────────────────────────────────
function openWeekprofile(key) {
  const wd = wayData[key]; if (!wd) return;
  const hm = buildWeeklyHeatmap(key);
  if (!hm) return;
  const wid = wd.wayId || parseKey(key).wid;
  const segIdx = wd.segIdx || 0;
  const namen = [...new Set(wd.sessions.map(s => s.naam).filter(s => s && s !== '—'))];
  const segLabel = (wd.segCount && wd.segCount > 1) ? ` · seg ${wd.segIdx+1}/${wd.segCount}` : '';
  document.getElementById('weekprofile-title').textContent =
    (namen.join(' / ') || `Way ${wid}`);
  document.getElementById('weekprofile-sub').textContent =
    `${wd.highway} · OSM ${wid}${segLabel} · ${Math.round(hm.lenM)} m`;

  let body = '<div class="hm-meta">' +
    'Cellen: <strong>passages per meter per uur</strong> ' +
    '(<code>tikken ÷ segmentlengte ÷ aanwezigheidstijd</code>). ' +
    'Visits over uurgrenzen worden proportioneel gesplitst. ' +
    'Lege cel = niet gemeten. Alleen zichtbare sessies tellen mee.' +
    '</div>';
  body += renderWeeklyHeatmap(hm);
  body += renderSegmentSessionTable(wd, wid, segIdx, hm.lenM);

  document.getElementById('weekprofile-body').innerHTML = body;
  document.getElementById('weekprofile-modal').classList.remove('hidden');
}

// Compacte sessie-tabel: per sessie de bijdrage aan dit segment.
// Toont datum, aanwezigheidstijd (uit visits), tikken, en p/m·u per sessie.
function renderSegmentSessionTable(wd, wid, segIdx, lenM) {
  const rows = [];
  Object.keys(visitData).forEach(function(sid) {
    if (!sessions[sid]?.visible) return;
    const matches = visitData[sid].filter(function(v) {
      return v.wid === wid && (v.segIdx||0) === segIdx;
    });
    if (!matches.length) return;
    const totSec = matches.reduce((a,v) => a + v.durSec, 0);
    const totTel = matches.reduce((a,v) => a + v.nTel, 0);
    const meterHours = lenM * (totSec / 3600);
    const pmh = meterHours > 0 ? totTel / meterHours : 0;
    const sm  = sessions[sid].meta || {};
    rows.push({
      datum: fmtDatum(sm.datum, sm.start_tijd),
      teller: sm.teller || '',
      visits: matches.length,
      secs: totSec,
      tel: totTel,
      pmh: pmh
    });
  });
  if (!rows.length) return '';
  rows.sort((a,b) => a.datum.localeCompare(b.datum));

  let html = '<div style="margin-top:18px;font-size:10px;color:var(--muted);' +
             'letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px">' +
             'Tellingen op dit segment</div>';
  html += '<table class="cmp-table"><tr>' +
          '<th>datum</th><th>visits</th><th>aanwezig</th><th>tikken</th><th>p/m·u</th>' +
          '</tr>';
  rows.forEach(r => {
    const minStr = (r.secs >= 60) ? (r.secs/60).toFixed(1) + ' min'
                                  : Math.round(r.secs) + ' s';
    html += `<tr><td>${r.datum}</td>` +
            `<td>${r.visits}</td>` +
            `<td>${minStr}</td>` +
            `<td>${r.tel}</td>` +
            `<td>${r.pmh.toFixed(2)}</td></tr>`;
  });
  if (rows.length > 1) {
    const totSec = rows.reduce((a,r) => a + r.secs, 0);
    const totTel = rows.reduce((a,r) => a + r.tel, 0);
    const totVis = rows.reduce((a,r) => a + r.visits, 0);
    const grand  = (lenM * (totSec/3600)) > 0 ? totTel / (lenM * (totSec/3600)) : 0;
    const minStr = (totSec >= 60) ? (totSec/60).toFixed(1) + ' min'
                                  : Math.round(totSec) + ' s';
    html += `<tr class="sum-row"><td>∑</td><td>${totVis}</td>` +
            `<td>${minStr}</td><td>${totTel}</td><td>${grand.toFixed(2)}</td></tr>`;
  }
  html += '</table>';
  return html;
}

// ── DETAIL PANEL ──────────────────────────────────────────────────
function showWegvakDetail(key) {
  const wd=wayData[key]; if (!wd) return;
  const wid = wd.wayId || parseKey(key).wid;
  const visSessions = wd.sessions.filter(s => sessions[s.sid]?.visible);

  // Pocket-only segment met visit-data: sla het kleine paneel over,
  // open de popup direct. Gemengde of niet-pocket segmenten: zie hieronder.
  const appTypesPresent = new Set(visSessions.map(s => s.appType));
  const isPocketOnly = appTypesPresent.size === 1 && appTypesPresent.has('pocket');
  if (isPocketOnly) {
    const hm = buildWeeklyHeatmap(key);
    if (hm) { openWeekprofile(key); return; }
    // Geen visit-data beschikbaar — val terug op het normale paneel
  }

  const namen=[...new Set(wd.sessions.map(s=>s.naam).filter(s=>s&&s!=='—'))];
  const segLabel = (wd.segCount && wd.segCount > 1) ? ` · seg ${wd.segIdx+1}/${wd.segCount}` : '';
  document.getElementById('detail-title').textContent = namen.join(' / ') || `Way ${wid}`;
  document.getElementById('detail-sub').textContent   = `${wd.highway} · OSM ${wid}${segLabel}`;

  const relevant=visSessions.sort((a,b)=>a.sid.localeCompare(b.sid));
  let html='';
  if (!relevant.length) {
    html='<div style="color:var(--muted);font-size:11px">Geen zichtbare sessies.</div>';
  } else {
    // Voeg p_per_m toe aan pocket-sessies op basis van bekende geometrie
    const lenM = segmentLengthM(wd.geometry);
    relevant.forEach(s => {
      if (s.appType === 'pocket' && lenM > 0) {
        s.p_per_m = ((s.totaal||0) / lenM).toFixed(3);
      }
    });
    // Groepeer per appType (kan gemengd zijn als map beide types heeft)
    const byType={};
    relevant.forEach(s=>{ (byType[s.appType]=byType[s.appType]||[]).push(s); });
    Object.entries(byType).forEach(([appType, slist]) => {
      const cfg=APP_CONFIG[appType]||APP_CONFIG.fiets;
      const cols=cfg.detailCols, labels=cfg.detailLabels, classes=cfg.detailClasses;
      if (Object.keys(byType).length>1)
        html+=`<div style="font-size:10px;color:var(--muted);margin:4px 0 2px">${appType}</div>`;
      html+=`<table class="cmp-table"><tr><th>datum</th>`;
      cols.forEach(c=>{ html+=`<th class="${classes[c]||''}">${labels[c]||c}</th>`; });
      html+=`</tr>`;
      slist.forEach(s=>{
        const d=fmtDatum(sessions[s.sid]?.meta?.datum, sessions[s.sid]?.meta?.start_tijd);
        html+=`<tr><td>${d}</td>`;
        cols.forEach(c=>{ html+=`<td class="${classes[c]||''}">${s[c]??''}</td>`; });
        html+=`</tr>`;
      });
      if (slist.length>1) {
        html+=`<tr class="sum-row"><td>∑</td>`;
        cols.forEach(c=>{
          if (c==='bezettingsgraad_pct') {
            const avg=Math.round(slist.reduce((a,s)=>a+(+s[c]||0),0)/slist.length);
            html+=`<td class="${classes[c]||''}">${avg}%</td>`;
          } else if (c==='p_per_m') {
            // Gewogen gemiddelde: totaal tikken / lengte (zelfde lengte voor alle sessies per segment)
            const totTot = slist.reduce((a,s)=>a+(+s.totaal||0),0);
            const lenM2  = segmentLengthM(wd.geometry);
            html+=`<td class="${classes[c]||''}">${(totTot/lenM2).toFixed(3)}</td>`;
          } else {
            html+=`<td class="${classes[c]||''}">${slist.reduce((a,s)=>a+(+s[c]||0),0)}</td>`;
          }
        });
        html+=`</tr>`;
      }
      html+=`</table>`;
    });

    // Pocket: knop tonen om weekprofiel-popup te openen als er visit-data is
    const isPocket = relevant.some(s => s.appType === 'pocket');
    if (isPocket && Object.keys(visitData).length) {
      // Quick-check: heeft dit segment überhaupt visits?
      const wid = wd.wayId || parseKey(key).wid;
      const segIdx = wd.segIdx || 0;
      const hasVisits = Object.keys(visitData).some(function(sid) {
        if (!sessions[sid]?.visible) return false;
        return visitData[sid].some(function(v) {
          return v.wid === wid && (v.segIdx||0) === segIdx;
        });
      });
      if (hasVisits) {
        html += `<button class="hm-btn" onclick="openWeekprofile('${key.replace(/'/g, "\\'")}')">Toon weekprofiel ›</button>`;
      }
    }
  }
  document.getElementById('detail-body').innerHTML=html;
  document.getElementById('detail-panel').classList.remove('hidden');
}

function showClusterDetail(counts, total, sid, appType) {
  if (appType === 'transect') {
    const sm = (sessions[sid] && sessions[sid].meta) ? sessions[sid].meta : {};
    const dirA = sm.dir_a || 'A', dirB = sm.dir_b || 'B';
    document.getElementById('detail-title').textContent = 'Transect';
    document.getElementById('detail-sub').textContent = fmtDatum(sm.datum, sm.start_tijd)+(sm.teller?' · '+sm.teller:'');
    var html2 = '<table class="cmp-table"><tr><th>type</th><th>'+dirA+'</th><th>'+dirB+'</th><th>tot</th></tr>';
    var totA=0, totB=0;
    TYPES_TRANSECT.forEach(function(t) {
      var a=counts[t+'_a']||0, b=counts[t+'_b']||0;
      totA+=a; totB+=b;
      if (a+b===0) return;
      html2 += '<tr><td>'+(APP_CONFIG.transect.labels[t]||t)+'</td>'
             + '<td style="text-align:right">'+a+'</td>'
             + '<td style="text-align:right">'+b+'</td>'
             + '<td style="text-align:right;font-weight:bold">'+(a+b)+'</td></tr>';
    });
    html2 += '<tr class="sum-row"><td>totaal</td><td style="text-align:right">'+totA+'</td><td style="text-align:right">'+totB+'</td><td style="text-align:right">'+(totA+totB)+'</td></tr></table>';
    document.getElementById('detail-body').innerHTML = html2;
    document.getElementById('detail-panel').classList.remove('hidden');
    return;
  }
  const datum=fmtDatum(sessions[sid]?.meta?.datum, sessions[sid]?.meta?.start_tijd);
  const cfg=APP_CONFIG[appType]||APP_CONFIG.fiets;
  document.getElementById('detail-title').textContent=`Parkeerlocatie · ${total} stuks`;
  document.getElementById('detail-sub').textContent=`${datum} · ${appType} · gap ${gapThreshold} m`;
  let html=`<table class="cmp-table"><tr><th>type</th><th>aantal</th><th>%</th></tr>`;
  cfg.types.forEach(t=>{
    if (!counts[t]) return;
    const cl=cfg.colors[t]?`style="color:${cfg.colors[t]};font-weight:bold"`:'';
    html+=`<tr><td ${cl}>${t}</td><td ${cl}>${counts[t]}</td>
      <td style="color:var(--muted)">${Math.round(100*counts[t]/total)}%</td></tr>`;
  });
  html+=`<tr class="sum-row"><td>totaal</td><td>${total}</td><td></td></tr></table>`;
  document.getElementById('detail-body').innerHTML=html;
  document.getElementById('detail-panel').classList.remove('hidden');
}

document.getElementById('detail-close').addEventListener('click',()=>
  document.getElementById('detail-panel').classList.add('hidden'));


/* ── Capaciteitssessies ──────────────────────────────────── */
function loadCapaciteitZip(sid, sm, capCSV, gpsCSV, netCSV, telCSV) {
  if (telCSV) capTelData[sid] = parseCSV(telCSV);
  sessions[sid] = { meta:sm, visible:true, appType:'capaciteit' };
  capLayers[sid] = [];

  if (!capCSV) { renderSessions(); updateUI(); return; }

  // Lees parkeer-polygonen uit netwerk.csv (highway='parking', WKT=POLYGON)
  const polyMap = {};
  if (netCSV) {
    parseCSV(netCSV).forEach(r => {
      if (r.highway === 'parking' && r.geometrie_wkt && r.geometrie_wkt.trim().startsWith('POLYGON')) {
        const inner = r.geometrie_wkt.trim().replace(/^POLYGON\s*\(\(/, '').replace(/\)\)$/, '');
        const coords = inner.split(',').map(p => {
          const parts = p.trim().split(' ').map(Number);
          return [parts[1], parts[0]]; // [lat, lon] voor Leaflet
        });
        polyMap[r.osm_way_id] = coords;
        globalPolyMap[r.osm_way_id] = coords;
      }
    });
  }

  // Auto-detectie column-offset: in oudere exports staat osmType als 3e kolom
  const SOORTEN = ['regulier','gehandicapt','laadpaal','gereserveerd'];
  const rows = parseCSV(capCSV);
  const groups = {};
  rows.forEach(r => {
    let naam, soort, cap;
    if (r.soort && !SOORTEN.includes(r.soort) && SOORTEN.includes(r.capaciteit)) {
      // Oud formaat: osmType in kolom 'naam', naam in 'zijde', soort in 'capaciteit', n in 'eerste_waarneming'
      naam = r.zijde || '—';
      soort = r.capaciteit;
      cap  = parseInt(r.eerste_waarneming) || 0;
    } else {
      naam = r.naam || '—';
      soort = r.soort;
      cap  = parseInt(r.capaciteit) || 0;
    }
    const key = r.osm_way_id || '_onbekend';
    if (!groups[key]) groups[key] = { naam, osmType:'way', soorten:{}, wayId:key };
    if (cap > 0 && soort) groups[key].soorten[soort] = (groups[key].soorten[soort]||0) + cap;
  });

  // GPS-centroïd als fallback
  let centLat=null, centLon=null;
  if (gpsCSV) {
    const gps = parseCSV(gpsCSV).filter(r=>r.lat&&r.lon);
    if (gps.length) {
      centLat = gps.reduce((a,r)=>a+parseFloat(r.lat),0)/gps.length;
      centLon = gps.reduce((a,r)=>a+parseFloat(r.lon),0)/gps.length;
    }
  }

  const datum = fmtDatum(sm.datum, sm.start_tijd);

  // Haal OSM-geometrie op voor alle way-IDs
  const wayIds = Object.values(groups)
    .filter(g=>g.osmType==='way' && g.wayId && g.wayId!=='_onbekend')
    .map(g=>g.wayId);

  const drawGroups = (geomMap) => {
    Object.values(groups).forEach((g, i) => {
      const total = Object.values(g.soorten).reduce((a,n)=>a+n,0);
      const geom  = polyMap[g.wayId] || geomMap[g.wayId];
      const labelHtml = '<div style="font-family:Oswald,sans-serif;background:#8e44ad;color:#fff;border-radius:50%;width:36px;height:36px;line-height:36px;text-align:center;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,0.4);transform:translate(-50%,-50%);cursor:pointer;">' + total + '</div>';

      if (geom && geom.length > 2) {
        // Polygoon tekenen
        const poly = L.polygon(geom, {
          color:'#8e44ad', weight:2.5, fillColor:'#8e44ad', fillOpacity:0.18
        })
        .on('mouseover', function(e) {
          this.setStyle({weight:4, fillOpacity:0.30});
          const poly = globalPolyMap[g.wayId] || geom;
          // Spatial join: tel stippen per sessie die binnen de polygoon vallen
          const sessieTips = [];
          Object.entries(sessions).forEach(function(entry) {
            const tsid = entry[0], sess = entry[1];
            if (!sess.visible) return;
            if (sess.appType === 'capaciteit') return;
            const rows = telData[tsid];
            if (!rows || !rows.length) return;
            const sm2 = sess.meta;
            const d2 = fmtDatum(sm2.datum, sm2.start_tijd);
            const tel2 = sm2.teller ? ' · ' + sm2.teller : '';
            const binnen = rows.filter(function(r) {
              var la = +r.lat_marker, lo = +r.lon_marker;
              return !isNaN(la) && !isNaN(lo) && pointInPolygon(la, lo, poly);
            });
            if (!binnen.length) return;
            const typeCounts = {};
            binnen.forEach(function(r) {
              var t = (r.type||'?').toLowerCase();
              typeCounts[t] = (typeCounts[t]||0) + 1;
            });
            const typeStr = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])
              .map(([t,n]) => t+':'+n).join(' · ');
            sessieTips.push(d2 + tel2 + ' — ' + binnen.length + ' obs (' + typeStr + ')');
          });
          const capTotal = Object.values(g.soorten).reduce((a,n)=>a+n,0);
          const capStr = Object.entries(g.soorten).sort((a,b)=>b[1]-a[1])
            .map(([s,n]) => s+':'+n).join(' · ');
          const teller = sm.teller ? ' · ' + sm.teller : '';
          var tip = '<strong>' + g.naam + '</strong><br>'
            + datum + teller + ' — capaciteit: ' + capTotal
            + (capStr ? ' (' + capStr + ')' : '');
          if (sessieTips.length) {
            tip += '<br><span style="opacity:0.7;font-size:11px;">geteld:</span><br>'
              + sessieTips.join('<br>');
          }
          this.bindTooltip(tip, {sticky:true, direction:'top', className:'way-hover-tip'}).openTooltip(e.latlng);
        })
        .on('mouseout', function() {
          this.closeTooltip();
          this.setStyle({weight:2.5, fillOpacity:0.18});
        })
        .on('click', ()=>showCapDetail(g, datum, sm.teller||'', sid));
        poly.addTo(map);
        poly.bringToBack();
        capLayers[sid].push(poly);

        // Label op centroïd van polygoon
        const bounds = poly.getBounds();
        const midLat = (bounds.getNorth()+bounds.getSouth())/2;
        const midLon = (bounds.getEast()+bounds.getWest())/2;
        const lbl = L.marker([midLat, midLon], {
          icon: L.divIcon({ className:'', html:labelHtml, iconSize:[0,0], iconAnchor:[0,0] })
        }).on('click', ()=>showCapDetail(g, datum, sm.teller||'', sid));
        lbl.addTo(map);
        capLayers[sid].push(lbl);
      } else {
        // Fallback: punt op GPS-centroïd
        const lat = centLat ? centLat+(i*0.00005) : 52.0;
        const lon = centLon ? centLon+(i*0.00005) : 4.5;
        const m = L.marker([lat,lon], {
          icon: L.divIcon({ className:'', html:labelHtml, iconSize:[0,0], iconAnchor:[0,0] })
        }).on('click', ()=>showCapDetail(g, datum, sm.teller||'', sid));
        m.addTo(map);
        capLayers[sid].push(m);
      }
    });

    if (capLayers[sid].length) {
      map.fitBounds(L.featureGroup(capLayers[sid]).getBounds().pad(0.4));
    }
    renderSessions(); updateUI(); updateStats();

  };

  // Filteren: alleen IDs ophalen die NIET in polyMap zitten
  const missingIds = wayIds.filter(id => !polyMap[id]);
  if (!missingIds.length) { drawGroups({}); return; }

  // Overpass: haal geometrie op voor ontbrekende way-IDs
  const query = '[out:json][timeout:10];way(id:'+missingIds.join(',')+');out geom;';
  const tryOverpass = (idx) => {
    if (idx >= ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'].length) {
      drawGroups({}); return;
    }
    const endpoints = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
    fetch(endpoints[idx]+'?data='+encodeURIComponent(query))
      .then(r=>r.json())
      .then(data => {
        const geomMap = {};
        (data.elements||[]).forEach(el => {
          if (el.type==='way' && el.geometry) {
            geomMap[String(el.id)] = el.geometry.map(p=>[p.lat, p.lon]);
          }
        });
        drawGroups(geomMap);
      })
      .catch(()=>tryOverpass(idx+1));
  };
  tryOverpass(0);
}

function showCapDetail(g, datum, teller, sid) {
  document.getElementById('detail-title').textContent = g.naam;
  document.getElementById('detail-sub').textContent = 'capaciteit · '+datum+(teller?' · '+teller:'');
  const soortKleur = { regulier:'#2471a3', gehandicapt:'#27ae60', laadpaal:'#e67e22', gereserveerd:'#8e44ad' };
  const total = Object.values(g.soorten).reduce((a,n)=>a+n,0);
  let html = '<table class="cmp-table"><tr><th>soort</th><th>plekken</th><th>%</th></tr>';
  Object.entries(g.soorten).forEach(function(entry) {
    var soort=entry[0], n=entry[1];
    var kleur = soortKleur[soort]||'var(--muted)';
    html += '<tr><td style="color:'+kleur+';font-weight:bold">'+soort+'</td><td style="text-align:right">'+n+'</td><td style="text-align:right;color:var(--muted)">'+Math.round(n/total*100)+'%</td></tr>';
  });
  html += '<tr class="sum-row"><td>totaal</td><td style="text-align:right">'+total+'</td><td></td></tr></table>';
  document.getElementById('detail-body').innerHTML = html;
  document.getElementById('detail-panel').classList.remove('hidden');

  // Ruim vorige spot-markers op
  capSpotLayers.forEach(function(m){ map.removeLayer(m); });
  capSpotLayers = [];

  // Teken individuele vakken op de kaart
  var rows = (sid && capTelData[sid]) ? capTelData[sid] : [];
  rows = rows.filter(function(r){ return r.osm_way_id === g.wayId || !g.wayId; });
  rows.forEach(function(r) {
    var la = parseFloat(r.lat_marker), lo = parseFloat(r.lon_marker);
    if (isNaN(la)||isNaN(lo)) return;
    var type = (r.type||'').toLowerCase();
    var kleur = soortKleur[type] || '#888';
    var m = L.circleMarker([la,lo], {
      radius: 8, color: '#fff', weight: 2,
      fillColor: kleur, fillOpacity: 0.92,
      pane: 'clusters'
    }).bindTooltip(type + (r.zijde?' · zijde '+r.zijde:'') + (r.straat?' · '+r.straat:''),
        {direction:'top', offset:[0,-6]});
    m.addTo(map);
    capSpotLayers.push(m);
  });
}

}

// ── LOAD ZIP ─────────────────────────────────────────────────────
async function loadZip(file) {
  const zip=await JSZip.loadAsync(file);
  const F={};
  await Promise.all(Object.entries(zip.files).map(([p,e])=>{
    if (e.dir) return;
    return e.async('text').then(t=>{ F[p.split('/').pop()]=t; });
  }));

  const get=suf=>{ const k=Object.keys(F).find(k=>k.endsWith(suf)); return k?F[k]:null; };
  const sessieCSV=get('_sessie.csv'), stratenCSV=get('_straten.csv'),
        netCSV=get('_netwerk.csv'), gpsCSV=get('_gps.csv'), telCSV=get('_telregels.csv'),
        bezCSV=get('_bezocht.csv'),
        capCSV=get('_capaciteit.csv');

  if (!sessieCSV) { alert(`Geen sessie.csv gevonden in ${file.name}`); return; }

  const sm=parseCSV(sessieCSV)[0];
  const sid=sm.sessie_id;
  if (sessions[sid]) return;

  const appType = (sm.app_type||'').trim() === 'auto' ? 'auto'
                : (sm.app_type||'').trim() === 'transect' ? 'transect'
                : (sm.app_type||'').trim() === 'pocket' ? 'pocket'
                : (sm.app_type||'').trim() === 'capaciteit' ? 'capaciteit'
                : 'fiets';

  // Capaciteitssessie: apart pad
  if (appType === 'capaciteit') {
    loadCapaciteitZip(sid, sm, capCSV, gpsCSV, netCSV, telCSV);
    return;
  }

  // Transect-sessie: apart pad
  if (appType === 'transect') {
    loadTransectZip(sid, sm, telCSV, gpsCSV);
    return;
  }

  // Pocket-sessie: apart pad
  if (appType === 'pocket') {
    loadPocketZip(sid, sm, telCSV, gpsCSV, netCSV, bezCSV);
    return;
  }

  if (!stratenCSV||!netCSV) { alert(`Bestanden niet gevonden in ${file.name}`); return; }
  const cfg = APP_CONFIG[appType];
  sessions[sid]={ meta:sm, visible:true, appType };

  // Geometrie laden — capaciteit/fiets/auto kennen geen segmenten, alles op segIdx=0
  parseCSV(netCSV).forEach(r=>{
    const wid = r.osm_way_id;
    const k = wkey(wid, 0);
    if (!wayData[k])
      wayData[k]={ geometry:parseWKT(r.geometrie_wkt), highway:r.highway,
                   sessions:[], osmName:'', wayId:wid, segIdx:0, segCount:1 };
  });

  // Straten → ways (alles segIdx=0)
  parseCSV(stratenCSV).forEach(r=>{
    const naam = cleanNaam(r.naam || r.straat);  // naam (v1.4+) of straat (compat)
    const wids = String(r.osm_way_ids||'').split('|').map(s=>s.trim()).filter(Boolean);
    if (!wids.length) return;
    const factor = 1 / wids.length;
    wids.forEach(wid=>{
      const wd=wayData[wkey(wid, 0)]; if (!wd) return;
      const entry = { sid, naam, appType };
      if (appType === 'fiets') {
        entry.fiets   = Math.round((+r.fiets  ||0)*factor);
        entry.wrak    = Math.round((+r.wrak   ||0)*factor);
        entry.brommer = Math.round((+r.brommer||0)*factor);
        entry.breed   = Math.round((+r.breed  ||0)*factor);
        entry.totaal  = Math.round((+r.totaal ||0)*factor);
      } else {
        entry.goed    = Math.round((+r.goed   ||0)*factor);
        entry.fout    = Math.round((+r.fout   ||0)*factor);
        entry.leeg    = Math.round((+r.leeg   ||0)*factor);
        entry.spec    = Math.round((+r.spec   ||0)*factor);
        entry.bezet   = Math.round((+r.bezet  ||0)*factor);
        entry.vrij    = Math.round((+r.vrij   ||0)*factor);
        entry.bezettingsgraad_pct = +(r.bezettingsgraad_pct||0);
      }
      wd.sessions.push(entry);
    });
  });

  // Wegvak-polylijnen
  Object.entries(wayData).forEach(([k,wd])=>{
    if (!wayLayers[k]) {
      wayLayers[k]=L.polyline(wd.geometry,{color:'#3a3d42',weight:2,opacity:0.5})
        .on('click',()=>showWegvakDetail(k))
        .on('mouseover', function(e) {
          this.setStyle({weight:6,opacity:1});
          const wd2 = wayData[k];
          const naam = wd2.sessions[0] ? cleanNaam(wd2.sessions[0].naam) : (wd2.wayId || k);
          const visSess = wd2.sessions.filter(s=>sessions[s.sid]?.visible);
          const tellijnen = visSess.map(function(s) {
            const sm = sessions[s.sid].meta;
            const datum = fmtDatum(sm.datum, sm.start_tijd);
            const teller = sm.teller ? ' · ' + sm.teller : '';
            if (s.appType === 'fiets') {
              return datum + teller + ' — ' + (s.totaal||0) + ' fietsen';
            } else {
              const pct = s.bezettingsgraad_pct ? ' (' + Math.round(s.bezettingsgraad_pct) + '%)' : '';
              return datum + teller + ' — ' + (s.bezet||0) + ' bezet' + pct;
            }
          });
          const tip = '<strong>' + naam + '</strong><br>' + (tellijnen.length ? tellijnen.join('<br>') : 'geen zichtbare tellingen');
          this.bindTooltip(tip, {sticky:true, direction:'top', className:'way-hover-tip'}).openTooltip(e.latlng);
        })
        .on('mouseout', function() {
          this.closeTooltip();
          recolorOne(k);
        })
        .addTo(map);
    }
  });

  // GPS-spoor
  if (gpsCSV) {
    const coords=parseCSV(gpsCSV).map(r=>[+r.lat,+r.lon]).filter(c=>!isNaN(c[0]));
    if (coords.length)
      gpsLayers[sid]=L.polyline(coords,{color:'#4a9eff',weight:1.5,opacity:0.35,dashArray:'4 4'}).addTo(map);
  }

  // Stipjes + telregels voor clustering
  // Transect: observaties als losse stippen op de kaart
  if (appType === 'transect' && telCSV) {
    const allRows = parseCSV(telCSV);
    const datum = fmtDatum(sm.datum, sm.start_tijd);
    const dirA = sm.dir_a || 'A', dirB = sm.dir_b || 'B';
    allRows.forEach(function(r) {
      const la = parseFloat(r.lat), lo = parseFloat(r.lon);
      if (isNaN(la)||isNaN(lo)) return;
      const type = r.type||'car';
      const richting = r.richting||'A';
      const kleur = APP_CONFIG.transect.colors[type]||'#888';
      const m = L.circleMarker([la,lo], {
        radius:5, color:'#fff', weight:1.5,
        fillColor: kleur, fillOpacity:0.8, pane:'clusters'
      }).bindTooltip(
        (APP_CONFIG.transect.labels[type]||type)+' '+richting+' · '+datum,
        {direction:'top'});
      m.addTo(map);
      if (!dotLayers[sid]) dotLayers[sid]={};
      if (!dotLayers[sid][type]) dotLayers[sid][type]=[];
      dotLayers[sid][type].push(m);
    });
    renderSessions(); updateUI(); updateStats();
    return;
  }

  if (telCSV) {
    const allRows=parseCSV(telCSV);
    const datum=fmtDatum(sm.datum, sm.start_tijd);
    telData[sid]=allRows.filter(r=>r.snapped==='1'||r.snapped===1);
    dotLayers[sid]={};
    allRows.forEach(r=>{
      const la=+r.lat_marker, lo=+r.lon_marker;
      const type=(r.type||'').toLowerCase();
      if (isNaN(la)||isNaN(lo)||!cfg.colors[type]) return;
      if (!dotLayers[sid][type]) dotLayers[sid][type]=[];
      const snapped=(r.snapped==='1'||r.snapped===1);
      const m=L.circleMarker([la,lo],{
        radius:4, color:'#111', weight:0.8,
        fillColor:cfg.colors[type], fillOpacity: snapped ? 0.85 : 0.35,
      }).bindTooltip(`${type}${snapped?'':' ⚠'} · ${cleanNaam(r.straat||r.naam)} · ${datum}`,
        {direction:'top',offset:[0,-4]});
      dotLayers[sid][type].push(m);
      if (dotVisible[type]) m.addTo(map);
    });
  }

  recolorAll();
  drawClusters(sid);
  renderSessions();
  updateUI();
  updateStats();
  map.fitBounds(Object.values(wayData).flatMap(w=>w.geometry),{padding:[30,30]});

}

// ── SESSIONS UI ───────────────────────────────────────────────────
function renderSessions() {
  const list = document.getElementById('sessions-list');
  list.innerHTML = '';
  const sids = Object.keys(sessions).sort().reverse();
  sids.forEach(sid => {
    const s = sessions[sid];
    const datum = fmtDatum(s.meta.datum, s.meta.start_tijd);
    const typeIcon = s.appType==='auto'?'🚗'
                   : s.appType==='capaciteit'?'🅿'
                   : s.appType==='transect'?'🚶'
                   : s.appType==='pocket'?'📷'
                   : s.appType==='standstill'?'📍'
                   : '🚲';
    const color = SESSION_COLORS[sid] || '#888';
    const teller = s.meta.teller ? s.meta.teller : '';
    const n = s.meta.n_waarnemingen || '';
    const row = document.createElement('div');
    row.className = 'session-row' + (s.visible ? '' : ' off');
    row.dataset.sid = sid;
    row.title = 'klik: aan/uit  ·  shift-klik: alles aan/uit  ·  rechtsklik: solo';
    row.style.setProperty('--sc', color);
    row.innerHTML =
      '<div class="session-color"></div>' +
      '<div class="session-content">' +
        '<div class="session-meta">' +
          '<div class="session-line1">' +
            '<span class="stype">' + typeIcon + '</span>' +
            '<span>' + datum + '</span>' +
            (teller ? '<span class="stell">' + teller + '</span>' : '') +
          '</div>' +
          '<div class="session-id">' + sid + '</div>' +
        '</div>' +
        (n ? '<div class="session-n">' + n + '</div>' : '') +
      '</div>';
    list.appendChild(row);
  });
  const has = sids.length > 0;
  document.getElementById('section-title').style.display = has ? 'flex' : 'none';
  document.getElementById('sessies-count').textContent = has ? sids.length : '';
}

// Past de visibility van één sessie toe op alle bijbehorende kaartlagen.
// Wordt aangeroepen door click (toggle één), shift-click (toggle all),
// en contextmenu (solo). Houdt de DOM-row in sync met de data.
function applySessionVisibility(sid) {
  const s = sessions[sid]; if (!s) return;
  const row = document.querySelector('.session-row[data-sid="'+sid+'"]');
  if (row) row.classList.toggle('off', !s.visible);

  // Stand-still: alleen marker + accuracy-ring. Geen wayData, geen dots, geen clusters.
  if (s.appType === 'standstill') {
    if (standStillMarkers[sid]) s.visible ? standStillMarkers[sid].addTo(map) : map.removeLayer(standStillMarkers[sid]);
    if (standStillRings[sid])   s.visible ? standStillRings[sid].addTo(map)   : map.removeLayer(standStillRings[sid]);
    return;
  }

  if (gpsLayers[sid]) s.visible ? gpsLayers[sid].addTo(map) : map.removeLayer(gpsLayers[sid]);
  if (capLayers[sid]) capLayers[sid].forEach(m => s.visible ? m.addTo(map) : map.removeLayer(m));
  const cfg = APP_CONFIG[s.appType] || APP_CONFIG.fiets;
  cfg.types.forEach(type => showHideDots(sid, type, dotVisible[type]));
  if (s.appType === 'transect' || s.appType === 'pocket') {
    Object.keys(dotLayers[sid] || {}).forEach(function(type) {
      showHideDots(sid, type, s.visible);
    });
  }
  drawClusters(sid);
}

document.getElementById('sessions-list').addEventListener('click', e => {
  const row = e.target.closest('.session-row'); if (!row) return;
  const sid = row.dataset.sid; if (!sessions[sid]) return;

  // Shift-klik: als alles aan staat → alles uit behalve deze; anders → alles aan
  if (e.shiftKey) {
    const allOn = Object.values(sessions).every(s => s.visible);
    if (allOn) {
      Object.keys(sessions).forEach(function(k) {
        sessions[k].visible = (k === sid);
        applySessionVisibility(k);
      });
    } else {
      Object.keys(sessions).forEach(function(k) {
        sessions[k].visible = true;
        applySessionVisibility(k);
      });
    }
  } else {
    // Normale klik: toggle deze ene
    sessions[sid].visible = !sessions[sid].visible;
    applySessionVisibility(sid);
  }
  recolorAll();
  updateStats();
  // Clear eventuele hangende hover-emphasis na actie
  setSessionEmphasis(null);
});

// Rechtermuisknop / contextmenu: solo-modus (alleen deze sessie zichtbaar).
// Nogmaals rechtsklikken op dezelfde solo-sessie → alles weer aan.
document.getElementById('sessions-list').addEventListener('contextmenu', e => {
  const row = e.target.closest('.session-row'); if (!row) return;
  e.preventDefault();
  const sid = row.dataset.sid; if (!sessions[sid]) return;
  const others = Object.keys(sessions).filter(k => k !== sid);
  const isSolo = sessions[sid].visible && others.every(k => !sessions[k].visible);
  Object.keys(sessions).forEach(function(k) {
    sessions[k].visible = isSolo ? true : (k === sid);
    applySessionVisibility(k);
  });
  recolorAll();
  updateStats();
  setSessionEmphasis(null);
});

// Hover: dim alle andere sessies (vergelijkbaar met cluster-hover).
// Gebruikt CSS opacity op de Leaflet-element-divs, geen layer-mutaties.
function setSessionEmphasis(focusSid) {
  Object.keys(sessions).forEach(function(sid) {
    const dim = (focusSid && sid !== focusSid);
    const op = dim ? '0.15' : '';
    // Dots
    Object.values(dotLayers[sid] || {}).forEach(function(arr) {
      arr.forEach(function(dot) {
        const el = dot.getElement && dot.getElement();
        if (el) el.style.opacity = op;
      });
    });
    // Clusters
    (clusterLayers[sid] || []).forEach(function(m) {
      const el = m.getElement && m.getElement();
      if (el) el.style.opacity = op;
    });
    // GPS-spoor
    if (gpsLayers[sid]) {
      const el = gpsLayers[sid].getElement && gpsLayers[sid].getElement();
      if (el) el.style.opacity = op;
    }
    // Capaciteits-polygonen
    (capLayers[sid] || []).forEach(function(m) {
      const el = m.getElement && m.getElement();
      if (el) el.style.opacity = op;
    });
  });
  // Highlight de gefocuste rij
  document.querySelectorAll('.session-row').forEach(function(r) {
    r.classList.toggle('highlighted', r.dataset.sid === focusSid);
  });
}

document.getElementById('sessions-list').addEventListener('mouseover', e => {
  const row = e.target.closest('.session-row'); if (!row) return;
  setSessionEmphasis(row.dataset.sid);
});
document.getElementById('sessions-list').addEventListener('mouseleave', () => {
  setSessionEmphasis(null);
});

// ── TOGGLES ───────────────────────────────────────────────────────
document.querySelectorAll('.dot-btn[data-type]').forEach(btn=>{
  btn.addEventListener('click',function(){
    const type=this.dataset.type;
    dotVisible[type]=!dotVisible[type];
    this.classList.toggle('active',dotVisible[type]);
    Object.keys(dotLayers).forEach(sid=>showHideDots(sid,type,dotVisible[type]));
  });
});

document.getElementById('cluster-toggle').addEventListener('click',function(){
  clustersVisible=!clustersVisible;
  this.classList.toggle('active',clustersVisible);
  redrawAllClusters();
});

function toggleCapNetwerk(btn) {
  const on = btn.classList.toggle('active');
  capNetwerkLayers.forEach(function(l) { on ? l.addTo(map) : map.removeLayer(l); });
}

function setBasemapOpacity(val) {
  tileLayer.setOpacity(val / 100);
  document.getElementById('basemap-pct').textContent = val + '%';
}

function resetAll() {
  if (!confirm('Alle geladen sessies verwijderen?')) return;
  // Verwijder alle kaartlagen
  Object.keys(wayLayers).forEach(function(k){ map.removeLayer(wayLayers[k]); });
  Object.keys(gpsLayers).forEach(function(sid){ map.removeLayer(gpsLayers[sid]); });
  Object.keys(clusterLayers).forEach(function(sid){
    (clusterLayers[sid]||[]).forEach(function(m){ map.removeLayer(m); });
  });
  Object.keys(capLayers).forEach(function(sid){
    (capLayers[sid]||[]).forEach(function(m){ map.removeLayer(m); });
  });
  Object.values(dotLayers).forEach(function(types){
    Object.values(types||{}).forEach(function(arr){
      arr.forEach(function(m){ map.removeLayer(m); });
    });
  });
  combinedClusterLayer.forEach(function(m){ map.removeLayer(m); });
  capSpotLayers.forEach(function(m){ map.removeLayer(m); });
  // Reset state
  Object.keys(sessions).forEach(function(k){ delete sessions[k]; });
  Object.keys(wayData).forEach(function(k){ delete wayData[k]; });
  Object.keys(wayLayers).forEach(function(k){ delete wayLayers[k]; });
  Object.keys(gpsLayers).forEach(function(k){ delete gpsLayers[k]; });
  Object.keys(clusterLayers).forEach(function(k){ delete clusterLayers[k]; });
  Object.keys(capLayers).forEach(function(k){ delete capLayers[k]; });
  Object.keys(dotLayers).forEach(function(k){ delete dotLayers[k]; });
  Object.keys(telData).forEach(function(k){ delete telData[k]; });
  Object.keys(visitData).forEach(function(k){ delete visitData[k]; });
  Object.keys(capTelData).forEach(function(k){ delete capTelData[k]; });
  Object.keys(globalPolyMap).forEach(function(k){ delete globalPolyMap[k]; });
  Object.keys(SESSION_COLORS).forEach(function(k){ delete SESSION_COLORS[k]; });
  SESSION_COLOR_IDX = 0;
  combinedClusterLayer = [];
  capSpotLayers = [];
  // UI reset
  document.getElementById('sessions-list').innerHTML = '';
  document.getElementById('statsbar').style.display = 'none';
  document.getElementById('detail-panel').classList.add('hidden');
  document.getElementById('section-title').style.display = 'none';
  // Accordion-groepen terug naar defaults: Tonen/Weergave open, Kaart dicht
  var gT = document.getElementById('grp-tonen');     if (gT) gT.open = true;
  var gW = document.getElementById('grp-weergave');  if (gW) gW.open = true;
  var gK = document.getElementById('grp-kaart');     if (gK) gK.open = true;
  // Capaciteitscontouren-toggle terug naar default (aan)
  var capBtn = document.getElementById('capnetwerk-toggle');
  if (capBtn && !capBtn.classList.contains('active')) {
    capBtn.classList.add('active');
    capNetwerkLayers.forEach(function(l) { l.addTo(map); });
  }
  // Basemap-opacity terug naar 100%
  var opSlider = document.getElementById('basemap-opacity');
  if (opSlider) { opSlider.value = 100; setBasemapOpacity(100); }
  // Basemap terug naar OSM
  if (currentBasemap !== 'osm') setBasemap('osm');
  updateUI(); updateStats();
}

document.getElementById('gap-slider').addEventListener('input',function(){
  gapThreshold=+this.value;
  document.getElementById('gap-val').textContent=gapThreshold+' m';
  redrawAllClusters();
});

// ── TIMEBAR ──────────────────────────────────────────────────────────────────
function sessionHour(sid) {
  const t = sessions[sid]?.meta?.start_tijd || '';
  const m = t.match(/(\d{1,2})[:h]/);
  return m ? parseInt(m[1]) : null;
}

// Dag-van-de-week uit sessie.meta.datum (YYYY-MM-DD of YYYYMMDD).
// Returns 0=zo, 1=ma, ..., 6=za — of null als parsen faalt.
function sessionDow(sid) {
  const d = sessions[sid]?.meta?.datum || '';
  let m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) m = d.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (!m) return null;
  const dt = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(dt) ? null : dt.getDay();
}

function sessionInDayFilter(sid) {
  if (currentDayFilter === 'all') return true;
  const dow = sessionDow(sid);
  if (dow === null) return true;  // onbekende datum → niet wegfilteren
  if (currentDayFilter === 'weekday')  return dow >= 1 && dow <= 5;
  if (currentDayFilter === 'saturday') return dow === 6;
  if (currentDayFilter === 'sunday')   return dow === 0;
  return true;
}

function sessionInTimeWindow(sid) {
  const h = sessionHour(sid);
  if (h === null) return true;
  const lo = (currentTimeHour - 1 + 24) % 24;
  const hi = (currentTimeHour + 1);
  // Venster: lo:00 – hi:59 (3 uur breed)
  if (lo <= hi) return h >= lo && h <= hi;
  return h >= lo || h <= hi; // over middernacht
}

function sessionInWindow(sid) {
  if (!timeFilterActive) return true;
  return sessionInTimeWindow(sid) && sessionInDayFilter(sid);
}

function applyTimeFilter() {
  const h = currentTimeHour;
  const lo = (h - 1 + 24) % 24;
  const hi = (h + 1);
  const hiStr = String(hi % 24).padStart(2,'0');
  document.getElementById('timebar-window').textContent =
    String(lo).padStart(2,'0') + ':00 – ' + hiStr + ':59';

  Object.keys(sessions).forEach(function(sid) {
    const inWin = sessionInWindow(sid);
    sessions[sid].visible = inWin;
    // Stand-still: alleen marker + ring
    if (sessions[sid].appType === 'standstill') {
      if (standStillMarkers[sid]) inWin ? standStillMarkers[sid].addTo(map) : map.removeLayer(standStillMarkers[sid]);
      if (standStillRings[sid])   inWin ? standStillRings[sid].addTo(map)   : map.removeLayer(standStillRings[sid]);
      return;
    }
    // GPS
    if (gpsLayers[sid]) inWin ? gpsLayers[sid].addTo(map) : map.removeLayer(gpsLayers[sid]);
    // Cap layers
    if (capLayers[sid]) capLayers[sid].forEach(function(m){
      inWin ? m.addTo(map) : map.removeLayer(m);
    });
    // Dots
    const cfg = APP_CONFIG[sessions[sid].appType] || APP_CONFIG.fiets;
    cfg.types.forEach(function(type){ showHideDots(sid, type, dotVisible[type] && inWin); });
  });

  // Session-list rij-states updaten (off-class)
  document.querySelectorAll('.session-row').forEach(function(el) {
    const sid = el.dataset.sid;
    el.classList.toggle('off', !(sessions[sid]?.visible));
  });

  redrawAllClusters();
  recolorAll();
  updateStats();
  drawTimeDots();
}

function drawTimeDots() {
  const canvas = document.getElementById('timebar-dots');
  if (!canvas) return;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const bounds = map.getBounds();
  const typeColor = { auto:'#c07800', fiets:'#2980b9', capaciteit:'#8e44ad' };

  // Highlight venster
  const lo = (currentTimeHour - 1 + 24) % 24;
  const hi = currentTimeHour + 1;
  const xLo = (lo / 23) * W;
  const xHi = Math.min((hi / 23) * W, W);
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(xLo, 0, xHi - xLo, H);

  Object.keys(sessions).forEach(function(sid) {
    const s = sessions[sid];
    const h = sessionHour(sid);
    if (h === null) return;

    // Bbox-check: heeft de sessie wayData binnen de kaartbbox?
    const inBbox = Object.keys(wayData).some(function(k) {
      const wd = wayData[k];
      if (!wd.sessions.some(function(ws){ return ws.sid === sid; })) return false;
      return wd.geometry && wd.geometry.some(function(pt) {
        return bounds.contains(L.latLng(pt[0], pt[1]));
      });
    }) || (capLayers[sid] && capLayers[sid].length > 0);

    if (!inBbox) return;

    const inWin = sessionInWindow(sid);
    if (inWin) return; // zichtbare sessies niet als stip tonen

    const x = (h / 23) * W;
    const color = typeColor[s.appType] || '#888';
    ctx.beginPath();
    ctx.arc(x, H/2, 5, 0, 2*Math.PI);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

document.getElementById('time-slider').addEventListener('input', function() {
  currentTimeHour = parseInt(this.value);
  applyTimeFilter();
});

// Dag-filter pills: één-actief, applyTimeFilter herevalueert venster
document.getElementById('day-pills').addEventListener('click', function(e) {
  const btn = e.target.closest('.day-pill'); if (!btn) return;
  currentDayFilter = btn.dataset.day;
  this.querySelectorAll('.day-pill').forEach(function(b) {
    b.classList.toggle('active', b === btn);
  });
  if (timeFilterActive) applyTimeFilter();
});

// Timebar toggle: knop in de sidebar
function toggleTimeFilter(active) {
  timeFilterActive = active;
  document.getElementById('timebar').style.display = active ? 'block' : 'none';
  if (active) {
    currentTimeHour = parseInt(document.getElementById('time-slider').value);
    applyTimeFilter();
  } else {
    // Alles weer zichtbaar
    Object.keys(sessions).forEach(function(sid) {
      sessions[sid].visible = true;
      if (sessions[sid].appType === 'standstill') {
        if (standStillMarkers[sid]) standStillMarkers[sid].addTo(map);
        if (standStillRings[sid])   standStillRings[sid].addTo(map);
        return;
      }
      if (gpsLayers[sid]) gpsLayers[sid].addTo(map);
      if (capLayers[sid]) capLayers[sid].forEach(function(m){ m.addTo(map); });
      const cfg = APP_CONFIG[sessions[sid].appType] || APP_CONFIG.fiets;
      cfg.types.forEach(function(type){ showHideDots(sid, type, dotVisible[type]); });
    });
    document.querySelectorAll('.session-row').forEach(function(el) {
      el.classList.remove('off');
    });
    redrawAllClusters(); recolorAll(); updateStats();
  }
}

map.on('moveend', function() { if (timeFilterActive) drawTimeDots(); });

// ── UI ZICHTBAARHEID ─────────────────────────────────────────────
function updateUI() {
  const hasFiets    =Object.values(sessions).some(s=>s.appType==='fiets');
  const hasAuto     =Object.values(sessions).some(s=>s.appType==='auto');
  const hasCap      =Object.values(sessions).some(s=>s.appType==='capaciteit');
  const hasTransect =Object.values(sessions).some(s=>s.appType==='transect');
  const hasPocket   =Object.values(sessions).some(s=>s.appType==='pocket');
  const hasAny  =hasFiets||hasAuto||hasCap||hasTransect||hasPocket;

  document.getElementById('statsbar').style.display      = hasAny  ?'flex':'none';
  // Tonen-groep: alleen relevant bij fiets/auto (die hebben type-toggles)
  document.getElementById('grp-tonen').style.display     = (hasFiets||hasAuto) ?'':'none';
  document.getElementById('toggles-fiets').style.display = hasFiets?'block':'none';
  document.getElementById('toggles-auto').style.display  = hasAuto ?'block':'none';
  // Weergave-groep: zinvol zodra er iéts geladen is
  document.getElementById('grp-weergave').style.display  = hasAny  ?'':'none';
  document.getElementById('legend').style.display        = hasAny  ?'block':'none';
  document.getElementById('legend-fiets').style.display  = hasFiets?'block':'none';
  document.getElementById('legend-auto').style.display   = hasAuto ?'block':'none';
  document.getElementById('pill-fiets').style.display    = hasFiets?'block':'none';
  document.getElementById('pill-bezet').style.display    = hasAuto ?'block':'none';
}

// ── STATS ─────────────────────────────────────────────────────────
function updateStats() {
  const visSids=Object.keys(sessions).filter(s=>sessions[s].visible);
  document.getElementById('s-sessies').textContent=visSids.length;
  const totL=Object.values(clusterLayers).reduce((a,arr)=>a+arr.length,0);
  document.getElementById('s-locaties').textContent=totL;

  const totFiets=Object.values(wayData).reduce((a,wd)=>
    a+wd.sessions.filter(s=>s.appType==='fiets'&&sessions[s.sid]?.visible)
                 .reduce((b,s)=>b+(s.fiets||0),0),0);
  document.getElementById('s-fietsen').textContent=totFiets;

  const totBezet=Object.values(wayData).reduce((a,wd)=>
    a+wd.sessions.filter(s=>s.appType==='auto'&&sessions[s.sid]?.visible)
                 .reduce((b,s)=>b+(s.bezet||0),0),0);
  document.getElementById('s-bezet').textContent=totBezet;
}

// ── DROP ──────────────────────────────────────────────────────────
function loadFile(file) {
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.csv')) return loadStandStillCsv(file);
  if (name.endsWith('.zip')) return loadZip(file);
  // Onbekend type: stil overslaan (multi-select kan andere bestanden bevatten)
}

const dz=document.getElementById('dropzone'), fi=document.getElementById('file-input');
dz.addEventListener('click',()=>fi.click());
fi.addEventListener('change',e=>{ [...e.target.files].forEach(loadFile); fi.value=''; });
document.addEventListener('dragover',e=>{ e.preventDefault(); dz.classList.add('over'); });
document.addEventListener('dragleave',e=>{ if(!e.relatedTarget) dz.classList.remove('over'); });
document.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('over');
  [...e.dataTransfer.files].filter(f=>{
    const n = f.name.toLowerCase();
    return n.endsWith('.zip') || n.endsWith('.csv');
  }).forEach(loadFile);
});
</script>
