<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kruispunttelling</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #f0f0ec;
  --surface: #ffffff;
  --border:  #b0b0a8;
  --text:    #1a1918;
  --muted:   #7a776f;
  --green:   #27ae60;
  --green-bg:#eaf7ef;
  --red:     #c0392b;
  --red-bg:  #fdecea;
  --font:    'Oswald', sans-serif;
}

body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }

header { background: var(--text); color: #fff; padding: 12px 16px 10px; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; flex: 1; }

.main { padding: 10px; max-width: 540px; margin: 0 auto; }

/* STATUS */
.status-bar { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.gps-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.3s; }
.gps-dot.active   { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
.gps-dot.searching { background: #e67e22; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-text { font-size: 12px; color: var(--muted); flex: 1; }
.wl-badge { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; background: var(--text); color: #fff; padding: 2px 6px; white-space: nowrap; }

/* LOCATION */
.loc-panel { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 8px; }
.loc-label  { font-size: 9px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.loc-name   { font-size: 18px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.loc-name.empty { color: var(--border); }
.loc-coords { font-size: 10px; font-weight: 300; color: var(--muted); margin-top: 2px; }

/* SESSION BAR */
.session-bar { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.session-timer { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--text); min-width: 82px; }
.session-timer.running { color: var(--green); }
.session-timer.ended   { color: #b35c00; }
.btn-ctrl { flex: 1; font-family: var(--font); font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 10px 0; border: 1px solid var(--border); cursor: pointer; background: var(--surface); transition: background 0.1s; }
.btn-ctrl.start { border-color: var(--green); color: var(--green); }
.btn-ctrl.start:hover:not(:disabled) { background: var(--green-bg); }
.btn-ctrl.stop  { border-color: var(--red);   color: var(--red); }
.btn-ctrl.stop:hover:not(:disabled)  { background: var(--red-bg); }
.btn-ctrl:disabled { opacity: 0.35; cursor: default; }

/* ARM TOTALS */
.arm-totals { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.at { background: var(--surface); border: 1px solid var(--border); padding: 6px 4px; text-align: center; }
.at-lbl { font-size: 9px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.at-num { font-size: 22px; font-weight: 700; line-height: 1.1; color: var(--text); transition: transform 0.1s; }
.at.totaal .at-lbl { color: var(--text); }

/* INTERSECTION */
.x-section { margin-bottom: 8px; }
.x-arm-lbl-h { text-align: center; font-size: 9px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 3px 0; }
.x-row { display: flex; align-items: stretch; }
.x-arm-lbl-v { writing-mode: vertical-rl; font-size: 9px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); width: 14px; display: flex; align-items: center; justify-content: center; }
.x-arm-lbl-v.west { transform: rotate(180deg); }

.xgrid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 111px 1fr;
  grid-template-rows: 81px 111px 81px;
  background: #c5c2b8;
}
.xroad   { background: #474745; pointer-events: none; }
.xcenter { background: #3a3a38; pointer-events: none; }

/* Arm button groups */
.arm-h { width: 100%; height: 100%; display: flex; flex-direction: row; }
.arm-v { width: 100%; height: 100%; display: flex; flex-direction: column; }

/* Individual tap buttons */
.ab {
  position: relative; flex: 1;
  background: #2e2e2c; color: #f0f0ec;
  border: none; border-right: 1px solid #4e4e4c;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; gap: 3px; font-family: var(--font);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: background 0.07s; -webkit-user-select: none; user-select: none;
}
.ab:last-child { border-right: none; }
.arm-v .ab { border-right: none; border-bottom: 1px solid #4e4e4c; }
.arm-v .ab:last-child { border-bottom: none; }
.ab:active, .ab.flash { background: var(--green) !important; border-color: #1a8a3c !important; }
.ab:disabled { opacity: 0.28; cursor: default; }
.ab .b-arr { font-size: 16px; line-height: 1; }
.ab .b-cnt { font-size: 22px; font-weight: 700; line-height: 1; }
.ab .b-mv  { position: absolute; top: 3px; right: 4px; font-size: 8px; color: #666; font-weight: 400; }

/* UNDO */
.btn-undo { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-family: var(--font); font-size: 11px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; padding: 7px; cursor: pointer; margin-bottom: 8px; }
.btn-undo:disabled { opacity: 0.35; cursor: default; }

/* LOG */
.log-panel { background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
.log-header { padding: 6px 12px 5px; border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.log-count { color: var(--text); font-weight: 600; }
.log-list { max-height: 180px; overflow-y: auto; }
.log-item { display: grid; grid-template-columns: 26px 22px 1fr auto; gap: 6px; align-items: center; padding: 5px 12px; border-bottom: 1px solid var(--bg); font-size: 11px; }
.log-item:last-child { border-bottom: none; }
.log-nr   { font-weight: 700; color: var(--muted); font-size: 10px; }
.log-mv   { font-size: 10px; font-weight: 700; color: var(--surface); background: var(--text); padding: 1px 4px; text-align: center; }
.log-desc { color: var(--text); }
.log-time { color: var(--muted); font-size: 10px; white-space: nowrap; }
.log-empty { padding: 14px 12px; font-size: 11px; color: var(--muted); text-align: center; }

/* DOWNLOAD */
.download-row { display: flex; gap: 6px; margin-bottom: 8px; }
.btn-dl { flex: 1; font-family: var(--font); font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 9px 0; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--muted); }
.btn-dl:disabled { opacity: 0.35; cursor: default; }

.footer-note { font-size: 10px; color: var(--muted); text-align: center; padding: 10px 12px 20px; font-weight: 300; }

/* RECOVERY OVERLAY */
.overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.ov-inner { width: 100%; max-width: 400px; }
.ov-logo  { font-size: 11px; font-weight: 300; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; text-align: center; margin-bottom: 36px; }
.ov-title { font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 16px; }
.rec-info { background: var(--surface); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 16px; }
.rec-row  { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--bg); }
.rec-row:last-child { border-bottom: none; }
.rec-key  { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.rec-val  { font-size: 13px; font-weight: 600; color: var(--text); }
.rec-btns { display: flex; flex-direction: column; gap: 8px; }
.btn-rec  { width: 100%; font-family: var(--font); font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 12px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text); }
.btn-rec.primary { background: var(--text); color: #fff; border-color: var(--text); }
.btn-rec.muted   { color: var(--muted); }
.btn-rec.danger  { color: var(--red); border-color: transparent; }
.ov-back  { text-align: center; margin-top: 24px; }
.ov-back a { font-size: 12px; font-weight: 300; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>

<header>

<script>
/* ── Bewegingsdata ─────────────────────────────────────── */
var MV = {
  1:{arm:'Oost', key:'O', dir:'R', label:'Rechts'},
  2:{arm:'Oost', key:'O', dir:'D', label:'Rechtdoor'},
  3:{arm:'Oost', key:'O', dir:'L', label:'Links'},
  4:{arm:'Zuid', key:'Z', dir:'R', label:'Rechts'},
  5:{arm:'Zuid', key:'Z', dir:'D', label:'Rechtdoor'},
  6:{arm:'Zuid', key:'Z', dir:'L', label:'Links'},
  7:{arm:'West', key:'W', dir:'R', label:'Rechts'},
  8:{arm:'West', key:'W', dir:'D', label:'Rechtdoor'},
  9:{arm:'West', key:'W', dir:'L', label:'Links'},
  10:{arm:'Noord',key:'N', dir:'R', label:'Rechts'},
  11:{arm:'Noord',key:'N', dir:'D', label:'Rechtdoor'},
  12:{arm:'Noord',key:'N', dir:'L', label:'Links'}
};

/* ── State ─────────────────────────────────────────────── */
var STORAGE_KEY    = 'rvmk_kruispunt_v1';
var sessionActive  = false;
var sessionStart   = null;
var sessionEnd     = null;
var timerInterval  = null;
var autoSaveTimer  = null;
var wakeLock       = null;

var counts   = {};
var entries  = [];
var totalNr  = 0;
for (var _i = 1; _i <= 12; _i++) counts[_i] = 0;

var watchId      = null;
var gpsLocked    = false;
var gpsLat       = null, gpsLon = null, gpsAcc = null;
var currentStreet = '—';

/* ── Wake Lock ─────────────────────────────────────────── */
function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(wl) {
    wakeLock = wl;
    wl.addEventListener('release', function(){ wakeLock=null; document.getElementById('wlBadge').style.display='none'; });
    document.getElementById('wlBadge').style.display='';
  }).catch(function(){});
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock=null; }
  document.getElementById('wlBadge').style.display='none';
}
document.addEventListener('visibilitychange', function(){
  if (sessionActive && document.visibilityState==='visible') acquireWakeLock();
});

/* ── Helpers ───────────────────────────────────────────── */
function pad(n) { return String(n).padStart(2,'0'); }
function timestamp() {
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+
    ' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function timeOnly() { var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function filestamp() { var d=new Date(); return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes()); }
function fmtDuration(ms) {
  var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return (h>0 ? h+':'+pad(m) : m)+':'+pad(ss);
}

/* ── GPS ───────────────────────────────────────────────── */
function startGPS() {
  if (!navigator.geolocation) { setStatus('GPS niet beschikbaar.','off'); return; }
  setStatus('GPS zoeken\u2026','searching');
  var started = Date.now();
  var bestAcc = Infinity;

  watchId = navigator.geolocation.watchPosition(function(pos) {
    var lat=pos.coords.latitude, lon=pos.coords.longitude, acc=Math.round(pos.coords.accuracy);
    document.getElementById('locCoords').textContent = lat.toFixed(5)+', '+lon.toFixed(5)+' (\u00b1'+acc+'m)';

    if (acc < bestAcc) {
      bestAcc = acc;
      gpsLat = lat; gpsLon = lon; gpsAcc = acc;
    }
    if (!gpsLocked) {
      if (acc <= 25) {
        lockGPS();
      } else if (Date.now()-started > 30000) {
        lockGPS(); // na 30s: best effort
      } else {
        setStatus('GPS verbeteren\u2026 \u00b1'+acc+'m (wacht op \u226425m)','searching');
      }
    }
  }, function(err) {
    var msgs=['GPS fout','GPS-toegang geweigerd','GPS niet beschikbaar','GPS time-out'];
    setStatus(msgs[err.code]||'GPS fout','off');
    document.getElementById('gpsDot').className='gps-dot';
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:2000});

  // veiligheidsnet
  setTimeout(function(){
    if (watchId!==null && !gpsLocked) lockGPS();
  }, 35000);
}

function lockGPS() {
  if (gpsLocked) return;
  gpsLocked = true;
  if (watchId!==null) { navigator.geolocation.clearWatch(watchId); watchId=null; }
  document.getElementById('gpsDot').className='gps-dot active';
  setButtonsEnabled(true);
  setStatus('GPS vergrendeld \u00b7 \u00b1'+gpsAcc+'m','active');
  doGeocode(gpsLat, gpsLon);
}

function doGeocode(lat, lon) {
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&zoom=17&addressdetails=1',
    {headers:{'Accept-Language':'nl','User-Agent':'rvmk-kruispunttelling/1.0'}})
  .then(function(r){ return r.json(); })
  .then(function(data){
    var a=data.address||{};
    currentStreet = a.road||a.pedestrian||a.path||a.footway||a.residential||data.display_name||'(onbekend)';
    var el=document.getElementById('locName');
    el.textContent=currentStreet; el.className='loc-name';
    var buurt=a.suburb||a.neighbourhood||a.town||a.village||a.city||'';
    if (gpsAcc!==null) setStatus('GPS vergrendeld'+(buurt?' \u00b7 '+buurt:''),'active');
  }).catch(function(){});
}

function setStatus(msg, state) {
  document.getElementById('statusText').textContent=msg;
  if      (state==='active')    document.getElementById('gpsDot').className='gps-dot active';
  else if (state==='searching') document.getElementById('gpsDot').className='gps-dot searching';
  else                          document.getElementById('gpsDot').className='gps-dot';
}

/* ── Sessie ────────────────────────────────────────────── */
function startSession() {
  sessionActive = true;
  sessionStart  = new Date();
  sessionEnd    = null;

  // reset
  for (var i=1;i<=12;i++){ counts[i]=0; document.getElementById('c'+i).textContent='0'; }
  entries=[]; totalNr=0;
  updateArmTotals(); updateLog();

  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnStop').disabled=false;
  document.getElementById('btnDlCsv').disabled=true;
  document.getElementById('btnUndo').disabled=true;
  document.getElementById('sessionTimer').className='session-timer running';

  timerInterval = setInterval(function(){
    var ms=Date.now()-sessionStart.getTime();
    document.getElementById('sessionTimer').textContent=fmtDuration(ms);
  }, 1000);

  gpsLocked=false; setButtonsEnabled(false);
  startGPS();
  acquireWakeLock();
  startAutoSave();
}

function stopSession() {
  sessionActive=false;
  sessionEnd=new Date();
  clearInterval(timerInterval);
  stopAutoSave();
  if (watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  releaseWakeLock();
  setButtonsEnabled(false);

  document.getElementById('btnStart').disabled=false;
  document.getElementById('btnStop').disabled=true;
  document.getElementById('btnUndo').disabled=true;
  document.getElementById('sessionTimer').className='session-timer ended';

  if (entries.length>0) {
    document.getElementById('btnDlCsv').disabled=false;
    setStatus(entries.length+' tellingen \u00b7 CSV downloaden\u2026','off');
    exportCSV();
    clearStorage();
  } else {
    clearStorage();
    setStatus('Sessie gestopt \u00b7 geen tellingen.','off');
  }
}

function setButtonsEnabled(en) {
  for (var i=1;i<=12;i++) document.getElementById('btn'+i).disabled=!en;
}

/* ── Tellen ────────────────────────────────────────────── */
function tap(mv) {
  if (!sessionActive) return;
  counts[mv]++;
  totalNr++;
  var el=document.getElementById('c'+mv);
  el.textContent=counts[mv];
  var btn=document.getElementById('btn'+mv);
  btn.classList.add('flash');
  setTimeout(function(){ btn.classList.remove('flash'); }, 130);

  entries.push({nr:totalNr, mv:mv, ts:timestamp(), time:timeOnly()});
  document.getElementById('btnUndo').disabled=false;
  updateArmTotals();
  updateLog();
  saveToStorage();
}

function undoLast() {
  if (!entries.length) return;
  var last=entries.pop();
  counts[last.mv]=Math.max(0,counts[last.mv]-1);
  document.getElementById('c'+last.mv).textContent=counts[last.mv];
  totalNr--;
  updateArmTotals();
  updateLog();
  if (!entries.length) document.getElementById('btnUndo').disabled=true;
  saveToStorage();
}

function updateArmTotals() {
  var a={N:0,W:0,O:0,Z:0};
  for (var i=1;i<=12;i++) a[MV[i].key]+=counts[i];
  document.getElementById('atN').textContent=a.N;
  document.getElementById('atW').textContent=a.W;
  document.getElementById('atO').textContent=a.O;
  document.getElementById('atZ').textContent=a.Z;
  document.getElementById('atT').textContent=a.N+a.W+a.O+a.Z;
}

function updateLog() {
  var n=entries.length;
  document.getElementById('logCount').textContent=n+' vermelding'+(n===1?'':'en');
  if (!n){ document.getElementById('logList').innerHTML='<div class="log-empty">Nog geen tellingen</div>'; return; }
  var html='';
  for (var i=n-1;i>=Math.max(0,n-25);i--) {
    var e=entries[i], m=MV[e.mv];
    html+='<div class="log-item">'+
      '<span class="log-nr">#'+e.nr+'</span>'+
      '<span class="log-mv">'+e.mv+'</span>'+
      '<span class="log-desc">'+m.arm+' &middot; '+m.label+'</span>'+
      '<span class="log-time">'+e.time+'</span>'+
      '</div>';
  }
  document.getElementById('logList').innerHTML=html;
}

/* ── CSV export ────────────────────────────────────────── */
function exportCSV() {
  var endTime   = sessionEnd || new Date();
  var startTime = sessionStart || new Date();
  var elapsedSec = Math.round((endTime.getTime()-startTime.getTime())/1000);
  var factor     = elapsedSec >= 30 ? 3600/elapsedSec : null;

  var lines=['sep=;'];
  lines.push('# Kruispunttelling \u00b7 rvmk.nl');
  lines.push('');
  lines.push('# Sessiegegevens');
  lines.push('straat;'+currentStreet);
  lines.push('lat;'   +(gpsLat!==null ? gpsLat.toFixed(6) : ''));
  lines.push('lon;'   +(gpsLon!==null ? gpsLon.toFixed(6) : ''));
  lines.push('nauwkeurigheid_m;'+(gpsAcc!==null ? gpsAcc : ''));
  lines.push('start;' +startTime.toLocaleString('nl-NL'));
  lines.push('stop;'  +endTime.toLocaleString('nl-NL'));
  lines.push('duur_sec;'+elapsedSec);
  lines.push('duur;'  +fmtDuration(elapsedSec*1000));
  lines.push('extrapfactor;'+(factor ? factor.toFixed(4) : 'n.v.t. (< 30s)'));
  lines.push('');

  // Per movement
  var hasPerUur = !!factor;
  lines.push('# Samenvatting per beweging');
  lines.push('beweging;tak;richting;telling'+(hasPerUur?';per_uur':''));
  for (var i=1;i<=12;i++) {
    var m=MV[i];
    var row=[i,m.arm,m.label,counts[i]];
    if (hasPerUur) row.push(Math.round(counts[i]*factor));
    lines.push(row.join(';'));
  }

  // Per arm (L/D/R)
  var armLDR = {
    'Oost': {L:3,D:2,R:1},
    'Zuid': {L:6,D:5,R:4},
    'West': {L:9,D:8,R:7},
    'Noord':{L:12,D:11,R:10}
  };
  lines.push('');
  lines.push('# Samenvatting per tak');
  lines.push('tak;L;D;R;totaal'+(hasPerUur?';L_uur;D_uur;R_uur;totaal_uur':''));
  ['Oost','Zuid','West','Noord'].forEach(function(arm) {
    var ldr=armLDR[arm];
    var l=counts[ldr.L], d=counts[ldr.D], r=counts[ldr.R], tot=l+d+r;
    var row=[arm,l,d,r,tot];
    if (hasPerUur) row.push(Math.round(l*factor),Math.round(d*factor),Math.round(r*factor),Math.round(tot*factor));
    lines.push(row.join(';'));
  });

  // Detail log
  lines.push('');
  lines.push('# Tellog');
  lines.push('nr;tijdstip;beweging;tak;richting');
  entries.forEach(function(e) {
    var m=MV[e.mv];
    lines.push([e.nr,e.ts,e.mv,m.arm,m.label].join(';'));
  });

  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='kruispunttelling_'+filestamp()+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ── Auto-save ─────────────────────────────────────────── */
function saveToStorage() {
  if (!sessionActive) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      counts:       Object.assign({},counts),
      entries:      entries.slice(),
      totalNr:      totalNr,
      sessionStart: sessionStart ? sessionStart.toISOString() : null,
      gpsLat:       gpsLat,
      gpsLon:       gpsLon,
      gpsAcc:       gpsAcc,
      currentStreet:currentStreet,
      savedAt:      new Date().toISOString()
    }));
  } catch(e) {}
}
function clearStorage() { try { localStorage.removeItem(STORAGE_KEY); } catch(e) {} }
function startAutoSave() { if (autoSaveTimer) clearInterval(autoSaveTimer); autoSaveTimer=setInterval(saveToStorage,30000); }
function stopAutoSave()  { if (autoSaveTimer){ clearInterval(autoSaveTimer); autoSaveTimer=null; } }

/* ── Recovery ──────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', function() {
  var saved=null;
  try { saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); } catch(e) {}
  if (saved && saved.entries && saved.entries.length>0) {
    window._saved=saved; showRecoveryOverlay(saved);
  }
});

function showRecoveryOverlay(s) {
  var d=new Date(s.savedAt);
  var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'  '+pad(d.getHours())+':'+pad(d.getMinutes());
  document.getElementById('recoveryInfo').innerHTML=
    '<div class="rec-row"><span class="rec-key">Opgeslagen op</span><span class="rec-val">'+ds+'</span></div>'+
    '<div class="rec-row"><span class="rec-key">Locatie</span><span class="rec-val">'+(s.currentStreet||'onbekend')+'</span></div>'+
    '<div class="rec-row"><span class="rec-key">Tellingen</span><span class="rec-val">'+s.entries.length+' vermeldingen</span></div>';
  document.getElementById('recoveryOverlay').style.display='flex';
}

function applyState(s) {
  counts={};
  for (var i=1;i<=12;i++) counts[i]=s.counts[i]||0;
  entries=s.entries.slice(); totalNr=s.totalNr||entries.length;
  gpsLat=s.gpsLat; gpsLon=s.gpsLon; gpsAcc=s.gpsAcc;
  currentStreet=s.currentStreet||'—';
  gpsLocked=(gpsLat!==null);
  sessionStart=s.sessionStart ? new Date(s.sessionStart) : new Date();

  for (var i=1;i<=12;i++) document.getElementById('c'+i).textContent=counts[i];
  updateArmTotals(); updateLog();
  var el=document.getElementById('locName'); el.textContent=currentStreet; el.className='loc-name';
  if (gpsLat!==null) {
    document.getElementById('locCoords').textContent=gpsLat.toFixed(5)+', '+gpsLon.toFixed(5)+' (\u00b1'+gpsAcc+'m)';
    document.getElementById('gpsDot').className='gps-dot active';
    setStatus('GPS vergrendeld \u00b7 \u00b1'+gpsAcc+'m','active');
  }
}

function restoreAndContinue() {
  applyState(window._saved);
  document.getElementById('recoveryOverlay').style.display='none';
  sessionActive=true; sessionEnd=null;
  document.getElementById('btnStart').disabled=true;
  document.getElementById('btnStop').disabled=false;
  document.getElementById('btnDlCsv').disabled=true;
  document.getElementById('btnUndo').disabled=(entries.length===0);
  document.getElementById('sessionTimer').className='session-timer running';
  timerInterval=setInterval(function(){
    document.getElementById('sessionTimer').textContent=fmtDuration(Date.now()-sessionStart.getTime());
  },1000);
  setButtonsEnabled(gpsLocked);
  if (!gpsLocked) startGPS();
  acquireWakeLock(); startAutoSave();
  window._saved=null;
}

function restoreAndExport() {
  applyState(window._saved);
  sessionEnd=new Date();
  exportCSV(); clearStorage();
  window._saved=null;
  document.getElementById('recoveryOverlay').style.display='none';
  // terugzetten naar beginstand
  for (var i=1;i<=12;i++){ counts[i]=0; document.getElementById('c'+i).textContent='0'; }
  entries=[]; totalNr=0; sessionStart=null; sessionEnd=null;
  updateArmTotals(); updateLog();
}

function discardAndReset() {
  clearStorage(); window._saved=null;
  document.getElementById('recoveryOverlay').style.display='none';
}
</script>
