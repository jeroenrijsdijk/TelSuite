<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Verkeer tellen vanaf een vast punt | telonline.org</title>
<meta name="description" content="Tel verkeer vanaf een vast punt: auto's, fietsers en voetgangers, per richting. Na afloop één ZIP met CSV's. Gratis, in je browser, zonder account.">
<link rel="canonical" href="https://telonline.org/traffic_counter.html">
<link href="fonts/fonts.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* v3.22: huisstijl van de parkeer-apps (kop, statusbalk, panelen, knoppen).
     De telkaarten zijn van Static zelf: twee richtingen per voertuigtype. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f0ec;
    --surface: #ffffff;
    --border: #b0b0a8;
    --text: #1a1918;
    --muted: #7a776f;
    --c-goed: #27ae60;
    --c-goed-bg: #eaf7ef;
    --c-fout: #c0392b;
    --c-fout-bg: #fdecea;
    --c-klaar: #b35c00;
    --font: 'Oswald', sans-serif;
    --mono: 'Share Tech Mono', monospace;
  }

  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }

  header { background: var(--text); color: #fff; padding: 12px 16px 10px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  header span { font-size: 12px; font-weight: 300; color: #aaa8a2; }
  header .hulp { margin-left: auto; color: #aaa8a2; text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid #55534e; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; align-self: center; }
  header .hulp:hover { color: #fff; border-color: #fff; }

  .main { padding: 10px; max-width: 540px; margin: 0 auto; }

  /* STATUS */
  .status-bar { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .gps-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.3s; }
  .gps-dot.active { background: var(--c-goed); box-shadow: 0 0 0 3px var(--c-goed-bg); }
  .gps-dot.searching { background: #e67e22; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 12px; color: var(--muted); flex: 1; }
  .wl-badge { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; background: var(--text); color: #fff; padding: 2px 6px; white-space: nowrap; }

  /* SESSIE: tijden, plek en de klok */
  .sessie-panel { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 8px; }
  .sessie-boven { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .rij { display: flex; gap: 8px; align-items: baseline; font-size: 12px; line-height: 1.5; }
  .rij .k { font-size: 9px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); width: 42px; flex-shrink: 0; }
  .rij .v { font-family: var(--mono); color: var(--text); }
  .rij .v.leeg { color: var(--border); }
  .rij.plek { margin-top: 2px; }
  .rij.plek .v { font-family: var(--font); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  /* v3.23: nauwkeurigheid van de plek in drie niveaus */
  .rij .v.niveau-nauwkeurig { color: var(--c-goed); }
  .rij .v.niveau-redelijk { color: var(--c-klaar); }
  .rij .v.niveau-grof { color: var(--c-fout); }
  .klok { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--muted); line-height: 1; }
  .klok.loopt { color: var(--c-goed); }
  .klok.klaar { color: var(--c-klaar); }

  /* CONTROLS */
  .controls { display: flex; gap: 6px; margin-bottom: 8px; }
  .btn-ctrl { flex: 1; font-family: var(--font); font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 9px 0; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text); transition: background 0.1s; touch-action: manipulation; }
  .btn-ctrl:disabled { opacity: 0.35; cursor: default; }
  .btn-ctrl.start { border-color: var(--c-goed); color: var(--c-goed); }
  .btn-ctrl.start:hover { background: var(--c-goed-bg); }
  .btn-ctrl.stop  { border-color: var(--c-fout); color: var(--c-fout); }
  .btn-ctrl.stop:hover  { background: var(--c-fout-bg); }

  /* VELDEN: notities en richtingen */
  .veld { background: var(--surface); border: 1px solid var(--border); padding: 7px 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .veld-k { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); flex-shrink: 0; white-space: nowrap; }
  .veld input { font-family: var(--font); font-size: 14px; font-weight: 500; border: none; background: transparent; flex: 1; min-width: 0; outline: none; color: var(--text); }
  .veld input::placeholder { color: var(--border); font-weight: 400; }
  .richtingen { display: flex; gap: 6px; margin-bottom: 8px; }
  .richtingen .veld { flex: 1; margin-bottom: 0; padding: 7px 8px; gap: 6px; min-width: 0; }
  .richtingen .veld input { text-align: center; }
  .btn-kompas { font-family: var(--font); font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: 0 8px; cursor: pointer; touch-action: manipulation; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-kompas.active { color: var(--c-goed); border-color: var(--c-goed); background: var(--c-goed-bg); }

  /* TOTAAL */
  .total-bar { background: var(--text); padding: 7px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .total-bar .label { font-size: 10px; letter-spacing: 2px; color: #aaa8a2; text-transform: uppercase; font-weight: 500; }
  .total-bar .value { font-family: var(--mono); font-size: 28px; font-weight: 700; color: #fff; line-height: 1; }

  /* TELKAARTEN: [+1 A] [aantal A] [-] [type] [-] [aantal B] [+1 B] */
  .counters { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .counter-card { background: var(--surface); border: 1px solid var(--border); display: flex; align-items: stretch; overflow: hidden; height: 72px; transition: opacity 0.2s; }
  .counter-card.locked { opacity: 0.35; pointer-events: none; }
  .btn-dir {
    width: 58px; min-width: 58px; height: 100%;
    border: none; background: var(--accent); color: var(--inkt);
    font-family: var(--font); font-weight: 700;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    transition: filter 0.1s, transform 0.1s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .btn-dir .dir-sym  { font-size: 0.65rem; font-family: var(--mono); opacity: 0.85; line-height: 1.3; }
  .btn-dir .dir-plus { font-size: 1.15rem; line-height: 1; }
  .btn-dir:active { transform: scale(0.92); filter: brightness(0.85); }
  .btn-min {
    width: 26px; min-width: 26px; height: 100%;
    border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    background: #eaeae6; color: var(--muted); font-family: var(--font); font-size: 1rem; font-weight: 700;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; flex-shrink: 0;
  }
  .btn-min:active { color: var(--c-fout); background: var(--c-fout-bg); }
  .side-count { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 4px; min-width: 0; }
  .dir-count { font-family: var(--mono); font-size: 2rem; font-weight: 700; line-height: 1; color: var(--text); transition: transform 0.1s ease; }
  .dir-count.bump { transform: scale(1.3); }
  .card-center {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 0 4px; background: #f7f7f3; border-top: 4px solid var(--accent);
    flex: 0 0 60px; overflow: hidden;   /* vaste breedte: alle rijen gelijk, ook met VOETGANGER */
  }
  .card-center .lbl { font-size: 1.5rem; line-height: 1; }
  .card-center .naam { font-size: 8px; font-weight: 600; letter-spacing: 0.2px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

  /* KNOPPEN ONDERAAN */
  .btn-undo { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-family: var(--font); font-size: 11px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; padding: 7px; cursor: pointer; margin-bottom: 8px; touch-action: manipulation; }
  .btn-undo:disabled { opacity: 0.35; cursor: default; }
  .btn-dl { width: 100%; font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 9px 0; border: 1px solid var(--text); cursor: pointer; background: var(--surface); color: var(--text); margin-bottom: 6px; touch-action: manipulation; }
  .btn-dl:disabled { opacity: 0.35; cursor: default; border-color: var(--border); color: var(--muted); }
  .btn-dl:hover:not(:disabled) { background: var(--bg); }
  .btn-wis { width: 100%; font-family: var(--font); font-size: 11px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; padding: 7px 0; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--muted); margin-bottom: 8px; touch-action: manipulation; }
  .btn-wis:hover { color: var(--c-fout); border-color: var(--c-fout); background: var(--c-fout-bg); }

  /* TELLOG */
  .log-panel { background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
  .log-header { padding: 6px 12px 5px; border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .log-count { color: var(--text); font-weight: 600; }
  .log-list { max-height: 200px; overflow-y: auto; }
  .log-item { display: grid; grid-template-columns: 9px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--bg); font-size: 11px; }
  .log-item:last-child { border-bottom: none; }
  .log-item.weg { opacity: 0.35; text-decoration: line-through; }
  .log-dot { width: 9px; height: 9px; border-radius: 50%; }
  .log-richting { color: var(--muted); }
  .log-time { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .log-empty { padding: 10px 12px; font-size: 11px; color: var(--muted); }

  /* RICHTINGEN-MELDING na het kompas */
  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
    background: var(--text); color: #fff; padding: 20px 24px; min-width: 280px; max-width: 360px;
    text-align: center; z-index: 9999; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast .toast-label { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #aaa8a2; margin-bottom: 12px; }
  #toast .toast-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  #toast .toast-row:last-child { margin-bottom: 0; }
  #toast .toast-dir { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #aaa8a2; min-width: 36px; text-align: right; }
  #toast .toast-val { font-size: 0.95rem; font-weight: 700; letter-spacing: 1px; color: #fff; text-align: left; line-height: 1.25; }
</style>
</head>
<body>

<header>
  <a href="index.html" style="color:#aaa8a2;text-decoration:none;font-size:13px;font-weight:300;margin-right:4px;">&#8592;</a>
  <h1>Stand Still and Count</h1>
  <span>telonline.org</span>
  <a class="hulp" href="traffic_counter_help.html#static" target="_blank" title="Handleiding">?</a>
</header>

<div class="main">

  <div class="status-bar">
    <div class="gps-dot" id="gpsDot"></div>
    <div class="status-text" id="statusText">Druk op Start om te beginnen</div>
    <span class="wl-badge" id="wlBadge" style="display:none">&#128274; aan</span>
  </div>

  <div id="herstel-melding" style="display:none;margin-bottom:8px;"></div>

  <div class="sessie-panel">
    <div class="sessie-boven">
      <div>
        <div class="rij"><span class="k">Start</span><span class="v leeg" id="disp-start">--</span></div>
        <div class="rij"><span class="k">Einde</span><span class="v leeg" id="disp-end">--</span></div>
      </div>
      <div class="klok" id="session-time">00:00:00</div>
    </div>
    <div class="rij plek"><span class="k">Plek</span><span class="v leeg" id="disp-gps">--</span></div>
    <div class="rij plek"><span class="k">GPS</span><span class="v leeg" id="disp-nauw">--</span></div>
  </div>

  <div class="controls">
    <button class="btn-ctrl start" id="btn-start" onclick="startSession()">&#9654; Start</button>
    <button class="btn-ctrl stop" id="btn-end" onclick="endSession()" disabled>&#9632; Stop</button>
  </div>

  <div class="veld">
    <span class="veld-k">Plek / notities</span>
    <input id="notes" placeholder="bijv. N57 bij de brug, zonnig, rustig" autocomplete="off">
  </div>

  <div class="richtingen">
    <div class="veld"><span class="veld-k">&#9664; A</span><input id="lbl-a" value="West" autocomplete="off"></div>
    <div class="veld"><span class="veld-k">B &#9654;</span><input id="lbl-b" value="Oost" autocomplete="off"></div>
    <button class="btn-kompas" id="btn-compass" onclick="autoDirections()" title="Richtingen invullen met het kompas">kompas</button>
  </div>

  <div class="total-bar">
    <span class="label">Totaal geteld</span>
    <span class="value" id="grand-total">0</span>
  </div>

  <div class="counters" id="counters"></div>

  <button class="btn-undo" id="btn-undo-last" onclick="undoLast()" disabled>&#8617; ongedaan maken</button>
  <button class="btn-dl" id="btn-zip" onclick="exportZip()" disabled>&#8595; Download ZIP</button>
  <button class="btn-wis" onclick="resetAll()">Wissen</button>

  <div class="log-panel">
    <div class="log-header">
      <span>Tellog</span>
      <span class="log-count" id="log-count">0 tikken</span>
    </div>
    <div class="log-list" id="log"><div class="log-empty">Nog geen tikken</div></div>
  </div>

</div>

<div id="toast">
  <div class="toast-label">Richtingen ingesteld</div>
  <div class="toast-row"><span class="toast-dir">&#9664; A</span><span class="toast-val" id="toast-a"></span></div>
  <div class="toast-row"><span class="toast-dir">B &#9654;</span><span class="toast-val" id="toast-b"></span></div>
</div>

<script>
  const SEP = ';';

  // label: Engels, voor het leesbare overzicht in de ZIP (telrapport leest
  // dat, ook van oude tellingen). naam: Nederlands, voor op het scherm (v3.22).
  const TYPES = [
    { id: 'car',   icon: '🚗', label: 'Car',        naam: 'Auto' },
    { id: 'truck', icon: '🚛', label: 'Truck',      naam: 'Vracht' },
    { id: 'moto',  icon: '🏍', label: 'Motorcycle', naam: 'Motor' },
    { id: 'bike',  icon: '🚲', label: 'Bicycle',    naam: 'Fiets' },
    { id: 'ped',   icon: '🚶', label: 'Pedestrian', naam: 'Voetganger' },
  ];
  // Kleur per voertuigtype, gelijk aan telrapport (SS_TYPE_COLOR; bewaakt door
  // valideer.py). Tot v3.22 had Static een eigen palet: een fiets was hier
  // blauwgroen en in telrapport paars.
  const TYPE_KLEUR = { car:'#cc0000', truck:'#e07800', moto:'#e6b800', bike:'#7700cc', ped:'#d4007a' };
  // Tekst op een gekleurde knop: wit, behalve op een lichte kleur (het geel
  // van de motor), waar wit in de zon niet te lezen is.
  function inktOp(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#1a1918' : '#ffffff';
  }

  const counts = {};
  TYPES.forEach(t => { counts[t.id] = { a: 0, b: 0 }; });

  let history = [], startTime = null, endTime = null, timerInterval = null, state = 'idle';
  let gpsLocation = null; // { lat, lon, accuracy, timestamp }

  // ── Local datetime formatter (no UTC drift) ──
  function fmtLocalDateTime(date) {
    if (!date) return 'n/a';
    const p = n => String(n).padStart(2,'0');
    return date.getFullYear() + '-' + p(date.getMonth()+1) + '-' + p(date.getDate())
      + ' ' + p(date.getHours()) + ':' + p(date.getMinutes()) + ':' + p(date.getSeconds());
  }

  // ── Statusbalk (v3.22, zoals de parkeer-apps) ──
  // stand: 'active' (GPS vast), 'searching' (GPS zoekt), anders de stip grijs.
  function setStatus(msg, stand) {
    document.getElementById('statusText').textContent = msg;
    if (stand !== undefined) document.getElementById('gpsDot').className = 'gps-dot' + (stand ? ' ' + stand : '');
  }

  // ── GPS: luisteren en middelen (v3.23) ──
  // Static wacht nooit op de GPS: je telt vanaf Start, en de plek wordt
  // ondertussen bepaald. Tot v3.23 nam de app binnen 30 s de beste losse
  // positie en stopte dan; "betrouwbaar" was 20 m. Wie Static gebruikt, staat
  // stil, en dat is de ideale situatie om te middelen:
  // - de app luistert hooguit 3 minuten, of korter zodra de schatting goed
  //   genoeg is (GPS_DOEL_M);
  // - de schatting is een gewogen gemiddelde (gewicht 1/afwijking²) over de
  //   laatste 2 minuten. Wie na Start nog naar zijn plek loopt, raakt die
  //   eerste metingen zo kwijt;
  // - een meting ver van de mediaan telt niet mee: uitschieters, en het
  //   stukje lopen. Ver is verder dan 2× zijn eigen afwijking én verder dan
  //   2,5× de mediane afstand tot de mediaan (minstens 8 m). Dat laatste
  //   omdat een GPS in de stad vaak te gunstig over zichzelf is: dan zou het
  //   filter de echte spreiding wegsnijden;
  // - de afwijking van het gemiddelde is eerlijk gerekend. GPS-fouten hangen
  //   samen over ongeveer een halve minuut, dus één onafhankelijke meting per
  //   30 s: typische afwijking / √(halve minuten), nooit beter dan 3 m. Een
  //   vaste fout (weerkaatsing tussen hoge gebouwen) middel je niet weg.
  // Jay: "grenzen van 8m en 15m. 3 minuten luisteren is prima".
  const GPS_NAUWKEURIG_M = 8;        // ≤ 8 m: nauwkeurig
  const GPS_REDELIJK_M   = 15;       // ≤ 15 m: redelijk (en "GPS reliable" in het overzicht); daarboven grof
  const GPS_LUISTER_MS   = 180000;   // hooguit 3 minuten luisteren
  const GPS_VENSTER_MS   = 120000;   // middelen over de laatste 2 minuten
  const GPS_SAMENHANG_S  = 30;       // één onafhankelijke meting per 30 s
  const GPS_ONDERGRENS_M = 3;        // nooit nauwkeuriger opgeven dan 3 m
  const GPS_DOEL_M       = 4;        // goed genoeg: eerder stoppen met luisteren
  const GPS_UITSCHIETER_MIN_M = 8;   // een meting binnen 8 m van de mediaan telt altijd mee
  const GPS_UITSCHIETER_SPREIDING = 2.5;   // ... en binnen 2,5× de mediane afstand ook
  const GPS_ADRES_NA_MS  = 30000;    // adres opzoeken zodra redelijk, of na 30 s hoe dan ook
  const GPS_ADRES_OPNIEUW_M = 15;    // opnieuw opzoeken als de schatting zoveel verschuift
  let gpsWatchId = null, gpsLuisterTimer = null, gpsStartT = 0, gpsMetingen = [];
  let gpsAdresBij = null, gpsAdresBezig = false, gpsAdresFoutT = 0;
  const GPS_ADRES_PAUZE_MS = 30000;  // na een mislukt verzoek eerst 30 s wachten (geen bereik: Nominatim niet bestoken)
  // De fout blijft Engels in de data (het overzicht in de ZIP is Engels); op
  // het scherm staat hij in het Nederlands.
  const GPS_FOUT_NL = {
    'Geolocation not supported': 'GPS niet beschikbaar in deze browser',
    'Permission denied': 'geen toestemming voor GPS',
    'Position unavailable': 'positie niet beschikbaar',
    'Timeout': 'GPS reageert niet', 'GPS timed out': 'GPS reageert niet',
    'Unknown error': 'onbekende GPS-fout'
  };

  function gpsNiveau(m) { return m <= GPS_NAUWKEURIG_M ? 'nauwkeurig' : m <= GPS_REDELIJK_M ? 'redelijk' : 'grof'; }

  function gpsAfstandM(a, b) {
    const kx = 111320 * Math.cos(a.lat * Math.PI / 180), ky = 110540;
    return Math.hypot((b.lon - a.lon) * kx, (b.lat - a.lat) * ky);
  }

  // De schatting uit de metingen [{t, lat, lon, acc}] (t in ms). Zonder
  // bijwerkingen, zodat hij los te testen is. Geeft {lat, lon, sigma, n} of null.
  function gpsSchatting(metingen, nu) {
    const venster = metingen.filter(m => nu - m.t <= GPS_VENSTER_MS);
    if (!venster.length) return null;
    const mediaan = a => { const s = a.slice().sort((x, y) => x - y), k = s.length >> 1;
                           return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
    const mid = { lat: mediaan(venster.map(m => m.lat)), lon: mediaan(venster.map(m => m.lon)) };
    const grens = Math.max(GPS_UITSCHIETER_MIN_M, GPS_UITSCHIETER_SPREIDING * mediaan(venster.map(m => gpsAfstandM(mid, m))));
    let goed = venster.filter(m => gpsAfstandM(mid, m) <= Math.max(2 * m.acc, grens));
    if (!goed.length) goed = venster;
    let sw = 0, sLat = 0, sLon = 0;
    goed.forEach(m => { const w = 1 / (m.acc * m.acc); sw += w; sLat += w * m.lat; sLon += w * m.lon; });
    const gem = { lat: sLat / sw, lon: sLon / sw };
    // Typische afwijking: wat de GPS zelf opgeeft (mediaan), of de werkelijke
    // spreiding rond het gemiddelde als die groter is. De spreiding weegt net
    // zo als het gemiddelde: één grove meting bederft een goede reeks niet.
    const spreiding = Math.sqrt(goed.reduce((s, m) => s + Math.pow(gpsAfstandM(gem, m), 2) / (m.acc * m.acc), 0) / sw);
    const typisch = Math.max(mediaan(goed.map(m => m.acc)), spreiding);
    const duurS = (Math.max(...goed.map(m => m.t)) - Math.min(...goed.map(m => m.t))) / 1000;
    const nEff = Math.max(1, Math.min(goed.length, duurS / GPS_SAMENHANG_S));
    return { lat: gem.lat, lon: gem.lon, sigma: Math.max(GPS_ONDERGRENS_M, typisch / Math.sqrt(nEff)), n: goed.length };
  }

  function gpsLuistert() { return gpsWatchId !== null; }

  function stopGPS() {
    if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
    if (gpsLuisterTimer) { clearTimeout(gpsLuisterTimer); gpsLuisterTimer = null; }
  }

  // Luisteren starten. zaad: een eerdere schatting (na Doortellen), die als
  // één meting meetelt; de teller staat nog op dezelfde plek.
  function requestGPS(zaad) {
    if (!navigator.geolocation) {
      gpsLocation = { error: 'Geolocation not supported' };
      updateGPSDisplay();
      return;
    }
    stopGPS();
    gpsMetingen = [];
    gpsStartT = Date.now();
    if (zaad && zaad.lat != null && zaad.accuracy) {
      gpsMetingen.push({ t: gpsStartT, lat: zaad.lat, lon: zaad.lon, acc: Math.max(1, zaad.accuracy) });
    }
    gpsWatchId = navigator.geolocation.watchPosition(
      pos => {
        const nu = Date.now();
        gpsMetingen.push({ t: nu, lat: pos.coords.latitude, lon: pos.coords.longitude,
                           acc: Math.max(1, pos.coords.accuracy || 1) });
        gpsMetingen = gpsMetingen.filter(m => nu - m.t <= GPS_VENSTER_MS);
        gpsBijwerken(nu, pos.coords.heading);
        if (gpsLocation.accuracy <= GPS_DOEL_M && nu - gpsStartT >= GPS_SAMENHANG_S * 1000) gpsKlaar();
      },
      err => {
        // Geen toestemming: stoppen. Anders blijven proberen tot de 3 minuten om
        // zijn; een eventuele schatting blijft staan.
        if (err.code === 1) { stopGPS(); if (!gpsLocation || gpsLocation.lat == null) gpsLocation = { error: 'Permission denied' }; }
        else if (!gpsLocation || gpsLocation.lat == null) gpsLocation = { error: err.code === 2 ? 'Position unavailable' : 'Timeout' };
        updateGPSDisplay();
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 }
    );
    gpsLuisterTimer = setTimeout(gpsKlaar, GPS_LUISTER_MS);
    updateGPSDisplay();
  }

  // Nieuwe schatting in gpsLocation. Straat en plaats blijven staan; die volgen
  // via adresBijwerken().
  function gpsBijwerken(nu, heading) {
    const s = gpsSchatting(gpsMetingen, nu);
    if (!s) return;
    const oud = (gpsLocation && !gpsLocation.error) ? gpsLocation : {};
    gpsLocation = {
      lat: s.lat, lon: s.lon, accuracy: Math.round(s.sigma), n: s.n,
      heading: heading != null ? heading : (oud.heading != null ? oud.heading : null),
      timestamp: new Date(nu), reliable: s.sigma <= GPS_REDELIJK_M, klaar: false,
      street: oud.street || null, city: oud.city || null, country: oud.country || null
    };
    updateGPSDisplay();
    adresBijwerken(nu);
  }

  // Klaar met luisteren: na 3 minuten, bij een goede schatting, of bij Stop.
  function gpsKlaar() {
    const luisterde = gpsLuistert();
    stopGPS();
    if (!luisterde) return;
    if (gpsLocation && gpsLocation.lat != null) gpsLocation.klaar = true;
    else gpsLocation = { error: (gpsLocation && gpsLocation.error) || 'GPS timed out' };
    updateGPSDisplay();
    adresBijwerken(Date.now());
    bewaarStatic();
  }

  // Straat en plaats opzoeken: zodra de schatting redelijk is (of na 30 s hoe
  // dan ook), en opnieuw als hij meer dan 15 m verschuift. Eén verzoek tegelijk.
  function adresBijwerken(nu) {
    if (gpsAdresBezig || !gpsLocation || gpsLocation.lat == null) return;
    if (gpsAdresFoutT && nu - gpsAdresFoutT < GPS_ADRES_PAUZE_MS) return;
    const g = gpsLocation;
    if (gpsAdresBij) {
      if (gpsAfstandM(gpsAdresBij, g) <= GPS_ADRES_OPNIEUW_M) return;
    } else if (!(g.reliable || g.klaar || nu - gpsStartT >= GPS_ADRES_NA_MS)) {
      return;
    }
    reverseGeocode(g.lat, g.lon);
  }

  function reverseGeocode(lat, lon) {
    gpsAdresBezig = true;
    gpsAdresBij = { lat: lat, lon: lon };
    const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=18&addressdetails=1';
    fetch(url, { headers: { 'Accept-Language': 'nl', 'User-Agent': 'TrafficCounter/1.0' } })
      .then(r => r.json())
      .then(data => {
        gpsAdresBezig = false;
        if (!gpsLocation || gpsLocation.lat == null) return;
        const a = data.address || {};
        const street = a.road || a.pedestrian || a.path || a.footway || a.cycleway || a.street || '';
        const city   = a.city || a.town || a.village || a.suburb || a.hamlet || a.municipality || '';
        // v3.23: op z'n Nederlands, Voorstraat 12 (was: 12 Voorstraat)
        gpsLocation.street  = (street + (a.house_number ? ' ' + a.house_number : '')).trim() || null;
        gpsLocation.city    = city || null;
        gpsLocation.country = a.country || null;
        updateGPSDisplay();
        adresBijwerken(Date.now());   // intussen verschoven? dan nog een keer
      })
      .catch(() => {
        gpsAdresBezig = false; gpsAdresBij = null; gpsAdresFoutT = Date.now();
        updateGPSDisplay();
        // Over 30 s nog een keer, ook als de app dan al klaar is met luisteren.
        setTimeout(() => adresBijwerken(Date.now()), GPS_ADRES_PAUZE_MS + 100);
      });
  }

  // Plek en nauwkeurigheid in het sessiepaneel, en de GPS-stip in de statusbalk.
  function updateGPSDisplay() {
    const el = document.getElementById('disp-gps');
    const nauw = document.getElementById('disp-nauw');
    const stip = document.getElementById('gpsDot');
    if (!el) return;
    const g = gpsLocation;
    if (!g || g.error || g.lat == null) {
      el.textContent = g && g.error ? (GPS_FOUT_NL[g.error] || g.error) : (gpsLuistert() ? 'wachten op GPS…' : '--');
      el.classList.add('leeg');
      nauw.textContent = gpsLuistert() && g && g.error ? 'blijft zoeken' : '--';
      nauw.className = 'v leeg';
      stip.className = gpsLuistert() ? 'gps-dot searching' : 'gps-dot';
      return;
    }
    el.textContent = (g.street || g.city) ? [g.street, g.city].filter(Boolean).join(', ')
                                          : g.lat.toFixed(5) + ', ' + g.lon.toFixed(5);
    el.classList.remove('leeg');
    const niveau = gpsNiveau(g.accuracy);
    let tekst = '±' + g.accuracy + ' m · ' + niveau;
    if (gpsLuistert()) {
      const rest = Math.max(0, Math.ceil((GPS_LUISTER_MS - (Date.now() - gpsStartT)) / 1000));
      tekst += ' · wordt beter, nog ' + Math.floor(rest / 60) + ':' + String(rest % 60).padStart(2, '0');
    }
    nauw.textContent = tekst;
    nauw.className = 'v niveau-' + niveau;
    stip.className = gpsLuistert() ? 'gps-dot searching' : (state === 'running' ? 'gps-dot active' : 'gps-dot');
  }

  function buildCards() {
    const container = document.getElementById('counters');
    container.innerHTML = '';
    TYPES.forEach(t => {
      const card = document.createElement('div');
      card.className = `counter-card ${t.id} locked`;

      card.innerHTML = `
        <button class="btn-dir" onclick="adjust('${t.id}','a',1)"><span class="dir-sym">&#9664; A</span><span class="dir-plus">+1</span></button>
        <div class="side-count"><div class="dir-count" id="cnt-${t.id}-a">0</div></div>
        <button class="btn-min" onclick="adjust('${t.id}','a',-1)">-</button>
        <div class="card-center"><div class="lbl">${t.icon}</div><div class="naam">${t.naam}</div></div>
        <button class="btn-min" onclick="adjust('${t.id}','b',-1)">-</button>
        <div class="side-count"><div class="dir-count" id="cnt-${t.id}-b">0</div></div>
        <button class="btn-dir" onclick="adjust('${t.id}','b',1)"><span class="dir-sym">B &#9654;</span><span class="dir-plus">+1</span></button>`;

  }

  function fmt(date) { return date ? date.toTimeString().slice(0,8) : '--'; }

  function fmtDuration(ms) {
    const s = Math.floor(ms / 1000);
    return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
      .map(n => String(n).padStart(2,'0')).join(':');
  }

  function zetTijd(id, d) {
    const el = document.getElementById(id);
    el.textContent = d ? fmt(d) : '--';
    el.classList.toggle('leeg', !d);
  }

  function startSession() {
    // v3.22: na Stop kan meteen een nieuwe telling, zoals in de parkeer-apps.
    // Is de vorige nog niet opgeslagen, dan eerst vragen.
    if (state === 'ended') {
      if (!geexporteerd && history.length &&
          !confirm('De vorige telling is nog niet opgeslagen. Toch een nieuwe beginnen?')) return;
      wisAlles();
    }
    if (state !== 'idle') return;
    startTime = new Date(); state = 'running';
    sessieId = maakSessieId(startTime);   // v2.73
    kopieNieuw();                         // v3.8: dit venster is eigenaar
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-end').disabled   = false;
    document.getElementById('btn-zip').disabled   = false;
    zetTijd('disp-start', startTime);
    zetTijd('disp-end', null);
    setStatus('Telling loopt…');
    document.getElementById('session-time').className = 'klok loopt';
    TYPES.forEach(t => document.getElementById(`card-${t.id}`).classList.remove('locked'));
    requestGPS();
    startKlok();
    acquireWakeLock();
    bewaarStatic();
  }

  // Loopt elke seconde. Toont de ACTIEVE teltijd: onderbrekingen (v2.72) tellen
  // niet mee, want in die tijd is er niet geteld.
  function startKlok() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      document.getElementById('session-time').textContent = fmtDuration(actieveMs(new Date()));
      if (gpsLuistert()) updateGPSDisplay();   // v3.23: aftellen van het luisteren
    }, 1000);
  }

  function endSession() {
    if (state !== 'running') return;
    endTime = new Date(); state = 'ended';
    clearInterval(timerInterval);
    gpsKlaar();   // v3.23: de schatting van nu gaat in de ZIP
    releaseWakeLock();
    bewaarStatic();
    toonAfgerond();
    setStatus('Telling gestopt na ' + fmtDuration(actieveMs(endTime)) + '. ZIP wordt gemaakt…', '');
    setTimeout(() => exportZip(), 300);
  }

  // Scherm van een afgeronde telling: klok stil, knoppen op slot, Start weer
  // beschikbaar voor de volgende.
  function toonAfgerond() {
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-end').disabled = true;
    zetTijd('disp-end', endTime);
    document.getElementById('session-time').textContent = fmtDuration(actieveMs(endTime));
    document.getElementById('session-time').className = 'klok klaar';
    TYPES.forEach(t => document.getElementById(`card-${t.id}`).classList.add('locked'));
  }

  // ── Compass & auto directions ──

  // Calculate a point at given distance (km) and bearing from a lat/lon
  function destinationPoint(lat, lon, bearingDeg, distanceKm) {
    const R    = 6371;
    const d    = distanceKm / R;
    const lat1 = lat * Math.PI / 180;
    const lon1 = lon * Math.PI / 180;
    const brng = bearingDeg * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(brng));
    const lon2 = lon1 + Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
    return { lat: lat2*180/Math.PI, lon: ((lon2*180/Math.PI)+540)%360-180 };
  }

  // Reverse geocode a point and return the nearest place name
  function placeNameAt(lat, lon) {
    const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=10&addressdetails=1';
    return fetch(url, { headers: { 'Accept-Language': 'nl', 'User-Agent': 'TrafficCounter/1.0' } })
      .then(r => r.json())
      .then(data => {
        const a = data.address || {};
        return a.city || a.town || a.village || a.hamlet || a.municipality || a.suburb || null;
      })
      .catch(() => null);
  }

  // 4-point Dutch cardinal names
  function cardinalNL(deg) {
    const dirs = ['Noord','Noordoost','Oost','Zuidoost','Zuid','Zuidwest','West','Noordwest'];
    return dirs[Math.round(((deg%360)+360)%360/45)%8];
  }

  function applyHeading(heading, lat, lon) {
    const btn = document.getElementById('btn-compass');
    const ahead  = (heading + 360) % 360;
    const behind = (heading + 180) % 360;
    const cardAhead  = cardinalNL(ahead);
    const cardBehind = cardinalNL(behind);

    function setLabels(placeAhead, placeBehind) {
      const a = placeAhead  || cardAhead;
      const b = placeBehind || cardBehind;
      // Dir B = compass direction = "Van [behind] naar [ahead]"
      // Dir A = opposite         = "Van [ahead]  naar [behind]"
      document.getElementById('lbl-b').value = 'Van ' + b + ' naar ' + a;
      document.getElementById('lbl-a').value = 'Van ' + a + ' naar ' + b;
      btn.textContent = a + ' / ' + b;
      btn.classList.add('active');
      showDirToast('Van ' + a + ' naar ' + b, 'Van ' + b + ' naar ' + a);
      bewaarStatic();
    }

    if (lat != null && lon != null) {
      btn.textContent = 'opzoeken…';
      const ptAhead  = destinationPoint(lat, lon, ahead,  5);
      const ptBehind = destinationPoint(lat, lon, behind, 5);
      Promise.all([placeNameAt(ptAhead.lat, ptAhead.lon), placeNameAt(ptBehind.lat, ptBehind.lon)])
        .then(([a, b]) => setLabels(a !== b ? a : null, a !== b ? b : null));
    } else {
      setLabels(null, null);
    }
  }

  function autoDirections() {
    const btn = document.getElementById('btn-compass');
    btn.textContent = 'lezen…';
    btn.classList.remove('active');

    const lat = gpsLocation && !gpsLocation.error ? gpsLocation.lat : null;
    const lon = gpsLocation && !gpsLocation.error ? gpsLocation.lon : null;

    if (gpsLocation && gpsLocation.heading != null && !isNaN(gpsLocation.heading)) {
      applyHeading(gpsLocation.heading, lat, lon);
      return;
    }

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(perm => {
          if (perm === 'granted') listenCompass(lat, lon);
          else { btn.textContent = 'kompas'; alert('Geen toestemming voor het kompas.'); }
        })
        .catch(() => { btn.textContent = 'kompas'; });
    } else {
      listenCompass(lat, lon);
    }
  }

  function listenCompass(lat, lon) {
    const btn = document.getElementById('btn-compass');
    let readings = [], done = false;

    function onOrientation(e) {
      if (done) return;
      let heading = null;
      if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) heading = e.webkitCompassHeading;
      else if (e.absolute && e.alpha != null) heading = (360 - e.alpha) % 360;
      else if (e.alpha != null) heading = (360 - e.alpha) % 360;
      if (heading == null) return;
      readings.push(heading);
      if (readings.length >= 5) {
        done = true;
        window.removeEventListener('deviceorientation', onOrientation, true);
        window.removeEventListener('deviceorientationabsolute', onOrientation, true);
        const sinSum = readings.reduce((s,h) => s + Math.sin(h*Math.PI/180), 0);
        const cosSum = readings.reduce((s,h) => s + Math.cos(h*Math.PI/180), 0);
        const mean   = (Math.atan2(sinSum, cosSum)*180/Math.PI+360)%360;
        applyHeading(mean, lat, lon);
      }
    }

    window.addEventListener('deviceorientationabsolute', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);

    setTimeout(() => {
      if (!done) {
        done = true;
        window.removeEventListener('deviceorientation', onOrientation, true);
        window.removeEventListener('deviceorientationabsolute', onOrientation, true);
        btn.textContent = 'kompas';
        alert('Geen kompasgegevens ontvangen. Dat werkt alleen op een telefoon, met toestemming voor beweging en richting.');
      }
    }, 4000);
  }
  function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function zetTotaal() {
    let total = 0;
    TYPES.forEach(t => { total += counts[t.id].a + counts[t.id].b; });
    document.getElementById('grand-total').textContent = total;
    document.getElementById('log-count').textContent = history.length + (history.length === 1 ? ' tik' : ' tikken');
    return total;
  }

  // ── Undo last tap ──
  function undoLast() {
    if (!history.length) return;
    const last = history.pop();
    counts[last.type][last.dir] = Math.max(0, counts[last.type][last.dir] - 1);
    document.getElementById('cnt-' + last.type + '-' + last.dir).textContent = counts[last.type][last.dir];
    zetTotaal();
    // Mark last log entry as undone
    const eerste = document.querySelector('#log .log-item:not(.weg)');
    if (eerste) eerste.classList.add('weg');
    document.getElementById('btn-undo-last').disabled = history.length === 0;
    vibrate(30);
    bewaarStatic();
  }

  function adjust(type, dir, delta) {
    if (state !== 'running') return;
    counts[type][dir] = Math.max(0, counts[type][dir] + delta);
    const el = document.getElementById(`cnt-${type}-${dir}`);
    el.textContent = counts[type][dir];
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 150);
    if (delta > 0) {
      vibrate(25);
      const ts = new Date().toTimeString().slice(0,8);
      history.push({ type, dir, ts, t: lokaalIso(new Date()) });   // v2.73: t = datum + tijd
      document.getElementById('btn-undo-last').disabled = false;
      addLog(type, dir, ts);
    } else {
      // Remove the most recent matching entry so it won't appear in CSV log
      const idx = history.map((h, i) => (h.type === type && h.dir === dir) ? i : -1)
                         .filter(i => i >= 0).pop();
      if (idx !== undefined) history.splice(idx, 1);
      document.getElementById('btn-undo-last').disabled = history.length === 0;
    }
    zetTotaal();
    bewaarStatic();
  }

  // Een regel in de tellog: kleur, type, richting, tijd. Nieuwste bovenaan.
  function addLog(type, dir, ts) {
    const log = document.getElementById('log');
    const leeg = log.querySelector('.log-empty');
    if (leeg) leeg.remove();
    const t = TYPES.find(x => x.id === type);
    const item = document.createElement('div');
    item.className = 'log-item';
    const delen = [['log-dot', ''], ['log-wat', t.naam],
                   ['log-richting', (dir === 'a' ? '\u25C0 ' : '') + document.getElementById('lbl-' + dir).value + (dir === 'b' ? ' \u25B6' : '')],
                   ['log-time', ts]];
    delen.forEach(([cls, tekst]) => {
      const s = document.createElement('span');
      s.className = cls; s.textContent = tekst;
      if (cls === 'log-dot') s.style.background = TYPE_KLEUR[type];
      item.appendChild(s);
    });
    log.prepend(item);
    while (log.children.length > 60) log.removeChild(log.lastChild);
  }

  function resetAll() {
    if (state === 'idle' && !herstelOpen()) return;
    const open = history.length && !geexporteerd;
    if (!confirm(open ? 'Deze telling is nog niet opgeslagen. Toch alles wissen?' : 'Alles wissen en opnieuw beginnen?')) return;
    wisAlles();
  }

  // Zonder bevestiging; resetAll(), startSession() en de herstelmelding vragen het zelf.
  function wisAlles() {
    clearInterval(timerInterval);
    releaseWakeLock();
    kopieAfsluiten(); geexporteerd = false;   // v3.8: weggegooid, en op de lijst
    onderbrekingen = []; laatstActief = null;
    herstelVerberg();                         // v3.22: gedeelde herstelmelding
    state = 'idle'; startTime = null; endTime = null; history = []; gpsLocation = null; sessieId = null;
    lastZipBlob = null; lastZipName = ''; lastZipCount = -1;   // vangnet vrijgeven — nieuwe telling
    stopGPS(); gpsMetingen = []; gpsAdresBij = null; gpsAdresFoutT = 0;
    TYPES.forEach(t => {
      counts[t.id] = { a: 0, b: 0 };
      document.getElementById(`cnt-${t.id}-a`).textContent = '0';
      document.getElementById(`cnt-${t.id}-b`).textContent = '0';
      document.getElementById(`card-${t.id}`).classList.add('locked');
    });
    document.getElementById('log').innerHTML = '<div class="log-empty">Nog geen tikken</div>';
    zetTotaal();
    document.getElementById('session-time').textContent = '00:00:00';
    document.getElementById('session-time').className = 'klok';
    zetTijd('disp-start', null); zetTijd('disp-end', null);
    updateGPSDisplay();
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-end').disabled   = true;
    document.getElementById('btn-zip').disabled   = true;
    document.getElementById('btn-undo-last').disabled = true;
    setStatus('Druk op Start om te beginnen', '');
  }

  function downloadBlob(blob, name) {
    // Het anker MOET in de DOM hangen, anders negeert Android de click().
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try { document.body.removeChild(a); } catch (e) {} URL.revokeObjectURL(url); }, 2000);
  }

/* ── ZIP bewaren (v2.77) ──────────────────────────────────────────────────
   Gedeeld blok: byte-identiek in parkeertelling, fietsparkeren,
   capaciteitstelling en (sinds v3.22) traffic_counter (bewaakt door
   valideer.py). Zelfde regel als pocket: de noodkopie gaat pas weg als de ZIP
   aantoonbaar is opgeslagen.
   - iOS: deelvenster voltooid -> bevestigd;
   - Android en desktop: download aan de browser overgedragen -> bevestigd;
   - deelvenster geannuleerd of mislukt (op de iPhone kan het tikgebaar na het
     inpakken verlopen zijn) -> de kopie blijft, geen ongevraagde download, en
     de ZIP-knop biedt dezelfde ZIP opnieuw aan, binnen de nieuwe tik;
   - ingebouwde browser van een app (Android-WebView, "; wv)" in de
     user-agent): de download gaat wel, maar telt niet als opgeslagen. Zo'n
     browser bewaart hem meestal niet, dus de kopie blijft.
   Tot v2.77 viel een geannuleerd deelvenster terug op een download-link en
   werd de kopie daarna altijd gewist, ook als die download niets opleverde.
   Tot v3.18 probeerde ook Android eerst het deelvenster. Chrome op Android
   deelt geen ZIP en weigerde meteen; de app meldde "niet opgeslagen", en elke
   tik op de ZIP-knop deed hetzelfde, zonder ooit te downloaden.
   De app levert setStatus(tekst), downloadBlob(blob, naam) en zipBewaard():
   true als de telling met deze ZIP af is (kopie weg, melding weg), false bij
   een tussentijdse ZIP (Static, terwijl hij telt). */
function bewaarZip(zipBlob, zipName) {
  vingerafdruk(zipBlob, zipName);   // v3.30: de SHA-256 van deze ZIP, onder de deelwaarschuwing
  telTelling(zipName);               // v3.37: deze telling telt mee op de voorpagina (één keer)
  var zipFile = new File([zipBlob], zipName, {type:'application/zip'});
  function bevestigd() {
    if (zipBewaard()) {
      kopieAfsluiten();   // v3.8: kopie weg, telling op de lijst
      herstelVerberg();   // v3.22: een herstelde telling is daarmee afgehandeld
    }
    setStatus('ZIP opgeslagen · ' + zipName);
  }
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
           || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && navigator.canShare && navigator.canShare({files:[zipFile]})) {
    return navigator.share({files:[zipFile], title:zipName}).then(bevestigd, function () {
      setStatus('ZIP niet opgeslagen — tik op ⬇ Download ZIP om het opnieuw te proberen. De telling blijft bewaard.');
    });
  }
  downloadBlob(zipBlob, zipName);
  if (/; wv\)/.test(navigator.userAgent)) {
    setStatus('ZIP aangeboden, maar de ingebouwde browser van deze app slaat hem meestal niet op. '
      + 'De telling blijft bewaard. Open de link in Chrome of Samsung Internet.');
    return Promise.resolve();
  }
  bevestigd();
  return Promise.resolve();
}
/* ── einde gedeeld blok ZIP bewaren ── */

  // bewaarZip: de ZIP is aantoonbaar opgeslagen. Tijdens het tellen is dat een
  // tussenstand: de telling loopt door en de kopie blijft (false). Na Stop, of
  // vanuit de herstelmelding, is de telling daarmee af (true). Een onderbroken
  // telling die zo wordt opgeslagen, eindigt op het laatst bekende moment.
  function zipBewaard() {
    if (state === 'running') return false;
    if (state === 'restored') {
      endTime = laatstActief; state = 'ended';
      toonAfgerond();
    }
    geexporteerd = true;
    return true;
  }

  // Bewaart de laatst gegenereerde ZIP zodat een tweede tik op Download ZIP
  // hem opnieuw kan aanbieden zonder hercompressie: het vangnet als het
  // iOS-deelblad weggeveegd is. Leeft tot de volgende export hem overschrijft.
  var lastZipBlob = null;
  var lastZipName = '';
  var lastZipCount = -1;   // history.length op het moment van genereren

  function exportZip() {
    if (!startTime) return;
    // Vangnet: is er al een ZIP van déze telstand, bied hem dan opnieuw aan (verse
    // gesture) zonder hercompressie. Is er intussen door- of teruggeteld, dan is
    // de bewaarde ZIP verlopen en bouwen we hem opnieuw. Wissen gooit alles weg.
    if (lastZipBlob && lastZipCount === history.length) {
      bewaarZip(lastZipBlob, lastZipName);
      return;
    }
    const D = SEP;
    const dirA = document.getElementById('lbl-a').value || 'Direction A';
    const dirB = document.getElementById('lbl-b').value || 'Direction B';
    const t0 = startTime;
    // Hersteld maar (nog) niet doorgeteld: de telling liep tot het laatste
    // bekende moment, niet tot nu.
    const t1 = endTime || (state === 'running' ? new Date() : (state === 'restored' ? laatstActief : null));
    const elapsedSec = (t0 && t1) ? actieveMs(t1) / 1000 : null;
    const factor = (elapsedSec && elapsedSec >= 30) ? 3600 / elapsedSec : null;
    const exportTs = fmtLocalDateTime(new Date());
    const row = (...cells) => cells.join(D) + '\n';

    // Het leesbare overzicht blijft Engels en ongewijzigd: telrapport leest het.
    let csv = 'sep=' + D + '\n';
    csv += row('Traffic Count Export');
    csv += row('Exported at', exportTs);
    csv += row('Location / Notes', document.getElementById('notes').value || 'n/a');
    csv += row('Start time', t0 ? fmtLocalDateTime(t0) : 'n/a');
    csv += row('End time',   t1 ? fmtLocalDateTime(t1) : 'n/a (session still running)');
    csv += row('Observed duration', elapsedSec ? fmtDuration(elapsedSec * 1000) : 'n/a');
    // v2.72: alleen als er onderbroken is, anders blijft de export zoals hij was.
    const onderbr = t1 ? onderbrekingen.filter(o => new Date(o.van) < t1) : [];
    if (onderbr.length) {
      const weg = onderbr.reduce((som, o) => som + (Math.min(+new Date(o.tot), +t1) - new Date(o.van)), 0);
      csv += row('Interruptions', onderbr.length, fmtDuration(weg) + ' not counted, excluded from duration and per-hour figures');
      onderbr.forEach((o, i) => {
        csv += row('Interruption ' + (i + 1), fmtLocalDateTime(new Date(o.van)), fmtLocalDateTime(new Date(o.tot)));
      });
    }
    if (gpsLocation && !gpsLocation.error) {
      csv += row('GPS latitude',  gpsLocation.lat.toFixed(6));
      csv += row('GPS longitude', gpsLocation.lon.toFixed(6));
      csv += row('GPS accuracy (m)', gpsLocation.accuracy);
      csv += row('GPS reliable', gpsLocation.reliable ? 'Yes (<= ' + GPS_REDELIJK_M + 'm)' : 'No (> ' + GPS_REDELIJK_M + 'm, best available)');
      csv += row('GPS street',  gpsLocation.street  || 'n/a');
      csv += row('GPS city',    gpsLocation.city    || 'n/a');
      csv += row('GPS country', gpsLocation.country || 'n/a');
      csv += row('GPS recorded at', fmtLocalDateTime(gpsLocation.timestamp));
    } else {
      csv += row('GPS', gpsLocation ? gpsLocation.error : 'Not available');
    }
    if (factor) {
      csv += row('Extrapolation factor', factor.toFixed(4), '= 3600 / ' + Math.round(elapsedSec) + ' seconds');
    } else {
      csv += row('Extrapolation', elapsedSec ? 'Not calculated (session < 30 seconds)' : 'Not calculated (no session recorded)');
    }
    csv += '\n';
    csv += row('Vehicle Type', dirA + ' counted', dirB + ' counted', 'Total counted',
               ...(factor ? [dirA + ' per hour', dirB + ' per hour', 'Total per hour'] : []));
    let sumA = 0, sumB = 0;
    TYPES.forEach(t => {
      const a = counts[t.id].a, b = counts[t.id].b;
      sumA += a; sumB += b;
      csv += row(t.label, a, b, a + b,
                 ...(factor ? [Math.round(a*factor), Math.round(b*factor), Math.round((a+b)*factor)] : []));
    });
    csv += row('TOTAL', sumA, sumB, sumA + sumB,
               ...(factor ? [Math.round(sumA*factor), Math.round(sumB*factor), Math.round((sumA+sumB)*factor)] : []));
    if (history.length) {
      csv += '\n' + row('Timestamp Log') + row('Time', 'Vehicle', 'Direction');
      history.forEach(h => {
        csv += row(h.ts, TYPES.find(t => t.id === h.type).label, h.dir === 'a' ? dirA : dirB);
      });
    }
    // v2.73: de ZIP heeft de vorm van de rest van de suite. <sid>_sessie.csv en
    // <sid>_telregels.csv (met datum per tik) voor KNIME en de keten;
    // <sid>_onderbrekingen.csv alleen als er onderbroken is; en het leesbare
    // overzicht van vóór v2.73 ongewijzigd als <sid>_overzicht.csv (Excel,
    // en telrapport leest dat). Alle vier komen uit dezelfde stand, op één moment.
    if (!sessieId) sessieId = maakSessieId(t0 || new Date());
    const sid  = sessieId, base = sid;
    const gpsOk = gpsLocation && !gpsLocation.error && gpsLocation.lat != null;
    const lat  = gpsOk ? gpsLocation.lat.toFixed(6) : '', lon = gpsOk ? gpsLocation.lon.toFixed(6) : '';
    const acc  = gpsOk ? gpsLocation.accuracy : '';
    const hms  = d => d ? d.toTimeString().slice(0, 8) : '';
    const dag  = t0 || new Date();
    let nTot = 0; TYPES.forEach(t => { nTot += counts[t.id].a + counts[t.id].b; });
    const sessieCsv =
      'sessie_id;datum;start_tijd;eind_tijd;app_type;type;n_waarnemingen;modus;richting_a;richting_b;lat;lon;nauwkeurigheid;straat;plaats;notities;actieve_duur_s;uurfactor\n'
      + [sid, lokaalIso(dag).slice(0, 10), hms(t0), hms(t1), 'standstill', 'verkeer', nTot, 'standstill',
         csvVeld(dirA), csvVeld(dirB), lat, lon, acc,
         csvVeld(gpsOk ? gpsLocation.street : ''), csvVeld(gpsOk ? gpsLocation.city : ''),
         csvVeld(document.getElementById('notes').value),
         elapsedSec ? Math.round(elapsedSec) : '', factor ? factor.toFixed(4) : ''].join(D) + '\n';
    let telCsv = 'sessie_id;nr;tijdstip;type;richting;lat;lon;nauwkeurigheid\n';
    tijdstippen(history, t0).forEach((t, i) => {
      telCsv += [sid, i + 1, t, history[i].type, history[i].dir, lat, lon, acc].join(D) + '\n';
    });
    const zip = new JSZip();
    zip.file(sid + '_sessie.csv', sessieCsv);
    zip.file(sid + '_telregels.csv', telCsv);
    if (onderbr.length) {
      let onCsv = 'sessie_id;nr;van;tot;duur_s\n';
      onderbr.forEach((o, i) => {
        const van = new Date(o.van), tot = new Date(Math.min(+new Date(o.tot), +t1));
        onCsv += [sid, i + 1, lokaalIso(van), lokaalIso(tot), Math.round((tot - van) / 1000)].join(D) + '\n';
      });
      zip.file(sid + '_onderbrekingen.csv', onCsv);
    }
    zip.file(sid + '_overzicht.csv', csv);
    zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } })
       .then(function(blob) {
         lastZipBlob = blob;
         lastZipName = base + '.zip';
         lastZipCount = history.length;
         bewaarZip(lastZipBlob, lastZipName);
       });
  }

  // ── Noodopslag en doortellen (v2.72) ─────────────────────────────────────
  // Zelfde vangnet als de parkeer-apps en pocket: de hele telling staat na elke
  // tik in localStorage, en elke 10 s een hartslag (laatstActief). Na een crash,
  // herladen of weggeveegde tab komt de telling terug met de herstelmelding
  // (sinds v3.22 het gedeelde blok): doortellen, downloaden of weggooien.
  //
  // Doortellen na een onderbreking: de tijd tussen laatstActief en het moment
  // van doortellen is niet geteld. Die gaat als onderbreking in de export en telt
  // niet mee in de geobserveerde duur en de uurfactor; anders zou een pauze de
  // intensiteit per uur omlaag trekken. Zonder onderbreking blijft de export
  // byte-gelijk aan die van vóór v2.72.
  const LS_STATIC = 'static_sessie';
  let onderbrekingen = [];     // [{van, tot}] als ISO-tekst
  let sessieId = null;         // v2.73: <jjjjmmdd>_<uummss>_<xxx>_sta, vast vanaf Start
  let laatstActief = null;     // Date: laatste moment dat de telling zeker liep
  let geexporteerd = false;    // na Stop: is de ZIP aantoonbaar opgeslagen?
  let wakeLock = null;

  function actieveMs(tot) {
    if (!startTime || !tot) return 0;
    let ms = tot - startTime;
    onderbrekingen.forEach(o => {
      const van = new Date(o.van), eind = new Date(Math.min(+new Date(o.tot), +tot));
      if (eind > van) ms -= (eind - van);
    });
    return Math.max(0, ms);
  }

  function bewaarStatic() {
    if (state === 'idle' || !startTime || geexporteerd) return;   // v2.76: na bevestigde export niet opnieuw
    if (!kopieMagSchrijven()) return;   // v3.8: alleen het venster dat eigenaar is
    if (state === 'running') laatstActief = new Date();
    try {
      kopieSchrijf({
        v: 1, state: state === 'restored' ? 'running' : state,
        startTime: startTime.toISOString(), endTime: endTime ? endTime.toISOString() : null,
        laatstActief: laatstActief ? laatstActief.toISOString() : null,
        counts: counts, history: history, onderbrekingen: onderbrekingen, sessieId: sessieId,
        gpsLocation: gpsLocation, geexporteerd: geexporteerd,
        notes: document.getElementById('notes').value,
        dirA: document.getElementById('lbl-a').value, dirB: document.getElementById('lbl-b').value,
        savedAt: new Date().toISOString()
      });
    } catch (e) {}
  }

  // ── Sessie-id en tijden (v2.73) ──
  // Zelfde vorm als de andere apps, met _sta als merkteken voor stilstaand.
  function maakSessieId(d) {
    const p = n => String(n).padStart(2, '0');
    const rnd = [0, 1, 2].map(() => 'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random() * 26)]).join('');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_'
         + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '_' + rnd + '_sta';
  }
  // Lokale tijd, zelfde vorm als pocket: 2026-09-23T14:05:31
  function lokaalIso(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
         + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  // Datum + tijd per tik. Tikken van vóór v2.73 (uit een herstelde telling)
  // hebben alleen HH:MM:SS: dan de startdatum, en een dag verder zodra de
  // klok terugspringt (telling over middernacht).
  function tijdstippen(hist, t0) {
    let dag = t0 ? new Date(t0.getFullYear(), t0.getMonth(), t0.getDate()) : new Date();
    let vorige = '';
    return hist.map(h => {
      if (h.t) return h.t;
      if (vorige && h.ts < vorige) dag = new Date(dag.getFullYear(), dag.getMonth(), dag.getDate() + 1);
      vorige = h.ts;
      return lokaalIso(dag).slice(0, 10) + 'T' + h.ts;
    });
  }
  function csvVeld(v) { return String(v == null ? '' : v).replace(/[;\r\n]+/g, ' ').trim(); }

  function wisStatic() {
    geexporteerd = false;
    try { localStorage.removeItem(LS_STATIC); } catch (e) {}
  }

  function herstelStatic() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(LS_STATIC) || 'null'); } catch (e) {}
    if (!d || !d.startTime) return;
    if (d.state === 'ended' && d.geexporteerd) { wisStatic(); return; }   // netjes afgerond (kopie uit v2.72–v2.75)
    if (!kopieHerstelbaar(d.sessieId)) return;   // v3.8: elders al opgeslagen of weggegooid

    startTime = new Date(d.startTime);
    sessieId = d.sessieId || maakSessieId(startTime);   // v2.72-opslag had er nog geen
    endTime = d.endTime ? new Date(d.endTime) : null;
    laatstActief = d.laatstActief ? new Date(d.laatstActief) : new Date(d.savedAt || d.startTime);
    onderbrekingen = d.onderbrekingen || [];
    history = d.history || [];
    gpsLocation = d.gpsLocation || null;
    if (gpsLocation && gpsLocation.timestamp) gpsLocation.timestamp = new Date(gpsLocation.timestamp);
    if (gpsLocation && gpsLocation.street) gpsAdresBij = { lat: gpsLocation.lat, lon: gpsLocation.lon };   // v3.23

    if (d.dirA) document.getElementById('lbl-a').value = d.dirA;
    if (d.dirB) document.getElementById('lbl-b').value = d.dirB;
    TYPES.forEach(t => {
      counts[t.id] = (d.counts && d.counts[t.id]) || { a: 0, b: 0 };
      document.getElementById(`cnt-${t.id}-a`).textContent = counts[t.id].a;
      document.getElementById(`cnt-${t.id}-b`).textContent = counts[t.id].b;
    });
    const total = zetTotaal();
    history.slice(-60).forEach(h => addLog(h.type, h.dir, h.ts));

    const afgerond = d.state === 'ended';
    state = afgerond ? 'ended' : 'restored';
    const tot = afgerond ? endTime : laatstActief;
    zetTijd('disp-start', startTime);
    if (afgerond) zetTijd('disp-end', endTime);
    document.getElementById('session-time').textContent = fmtDuration(actieveMs(tot));

    } catch (e) {}

    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ── Noodkopie: één venster schrijft (v3.8) ──────────────────────────────

   Een telling kan in twee vensters openstaan: een oud venster met de afgebroken
   stand, en een nieuw venster dat hem herstelde en doortelt. Tot v3.8 schreef het
   oude venster zijn stand terug zodra het verborgen werd, ook nadat het nieuwe
   venster de telling had opgeslagen; Static overschreef zelfs elke 10 s een
   telling die elders liep. Nu:
   - de kopie draagt het id van het venster dat hem schreef. Alleen dat venster

// Eén vingerafdruk versturen. Geen verbinding, of de server zegt "later" (429,
// 502, 503, 504): dan wacht hij. Elk ander antwoord, ook een weigering of een
// server zonder teller, is voor deze kant genoeg.
function tellerStuur(h) {
  return fetch(TELLER_URL, { method: 'POST', body: new URLSearchParams({ h: h }), keepalive: true, credentials: 'omit' })
    .then(function (r) {
      if ([429, 502, 503, 504].indexOf(r.status) >= 0) throw new Error('later');
      tellerWachtZet(tellerWachtLees().filter(function (x) { return x !== h; }));
    })
    .catch(function () {
      var w = tellerWachtLees();
      if (w.indexOf(h) < 0) { w.push(h); tellerWachtZet(w); }
    });
}
function telTelling(naam) {
  try {
    if (!tellerMag()) return Promise.resolve(null);
    var tekst = new TextEncoder().encode('telonline.org teller ' + String(naam || '').replace(/\.zip$/i, ''));
    return crypto.subtle.digest('SHA-256', tekst).then(function (buf) {
      var b = new Uint8Array(buf), h = '';
      for (var i = 0; i < b.length; i++) h += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      return tellerStuur(h).then(function () { return h; });
    }).catch(function () { return null; });
  } catch (e) { return Promise.resolve(null); }
}
// Bij het openen: wat nog wacht, alsnog versturen (hooguit 5 per keer).
function tellerInhalen() {
  if (!tellerMag()) return;
  tellerWachtLees().slice(0, 5).forEach(tellerStuur);
}
window.addEventListener('load', function () { setTimeout(tellerInhalen, 4000); });
