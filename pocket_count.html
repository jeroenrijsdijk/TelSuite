function startTelling(type, icon, label) {
  if (!magNieuwStarten()) return;   // v2.72
  exportAfgerond = false;           // v2.76: nieuwe telling, noodopslag weer aan
  clearSession();
  telType    = type;
  telLabel   = label;
  telIcon    = icon;
  telCount    = 0;
  telHistory  = [];
  snap.elements = {};
  routeLog    = [];
  lastRouteLat = null; lastRouteLon = null;
  startTime  = new Date();

  var color = getComputedStyle(document.documentElement).getPropertyValue('--c-' + type).trim();
  var screen = document.getElementById('count-screen');
  screen.style.background = color;
  screen.classList.add('active');
  document.getElementById('big-count').textContent = '0';
  document.getElementById('type-label').textContent = label;
  snap.confScore = null; snap.confLevel = 'none'; snap.confName = '';
  snap.gpsFixWin = []; snap.gpsStabScore = null; snap.gpsStabLevel = 'none';
  renderSnapConf();
  initBattery();
  document.getElementById('choose-screen').style.display = 'none';
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('btn-back').style.display = '';

  // Touch handlers
  screen.ontouchstart = function(e){ e.preventDefault(); startHold(); };
  screen.ontouchend   = function(e){ e.preventDefault(); endHold(); };
  screen.ontouchcancel= function(){ cancelHold(); };
  screen.onmousedown  = function(){ startHold(); };
  screen.onmouseup    = function(){ endHold(); };

  acquireWakeLock();
  startGps();
}

function backToChoose() {
  if (telCount > 0 && !confirm(t('confirmBack')(telCount))) return;
  closeTelScreen();
  backToModes();
  document.getElementById('choose-screen').style.display = '';
}

function closeTelScreen() {
  var screen = document.getElementById('count-screen');
  screen.classList.remove('active');
  screen.ontouchstart = screen.ontouchend = screen.ontouchcancel = null;
  screen.onmousedown  = screen.onmouseup  = null;
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-back').style.display = 'none';
  releaseWakeLock();
  stopGps();
  cancelHold();
}

// ── Tellen ────────────────────────────────────────────────────────────────────
function startHold() {
  holdStart = Date.now();
  var bar  = document.getElementById('undo-bar');
  var fill = document.getElementById('undo-fill');
  bar.style.width = '130px';
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(function() {
    fill.style.transition = 'width ' + HOLD_MS + 'ms linear';
    fill.style.width = '100%';
  });
  holdTimer = setTimeout(doUndo, HOLD_MS);
}

function endHold() {
  var held = Date.now() - (holdStart || Date.now());
  cancelHold();
  if (held < HOLD_MS - 50) doTap();
}

function cancelHold() {
  if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
  var bar  = document.getElementById('undo-bar');
  var fill = document.getElementById('undo-fill');
  bar.style.width = '0';
  fill.style.transition = 'none';
  fill.style.width = '0%';
}


// Gedeelde snap-resolutie voor één tik (simpel én transect): erft het GPS-anker,
// projecteert read-only, valt terug op dichtstbijzijnde way, en duwt de entry in
// telHistory (of de wachtrij als snap nog niet klaar is). Eén bron van waarheid.
function snapResolveTap(tapEntry) {
  if (snap.ready) {
    if (lastLat !== null) {
      var r = null;
      if (snap.anchorWayId !== null) {
        r = snapProjectOnto(lastLat, lastLon, snap.anchorWayId);
        if (r) {
          traceWrite({type:'tap', tijdstip:tapEntry.ts, tap_nr:telCount}, lastLat, lastLon,
                     'inherit', snap.anchorWayId, r.wayId, null, r.d, []);
        } else if (snap.elements[snap.anchorWayId]) {
          r = { wayId: snap.anchorWayId, segIdx: snap.anchorSegIdx,
                osmName: snap.elements[snap.anchorWayId].osmName || '' };
          traceWrite({type:'tap', tijdstip:tapEntry.ts, tap_nr:telCount}, lastLat, lastLon,
                     'inherit_nogeo', snap.anchorWayId, snap.anchorWayId, null, null, []);
        }
      }
      if (!r) {
        r = snapNearestAny(lastLat, lastLon);
        traceWrite({type:'tap', tijdstip:tapEntry.ts, tap_nr:telCount}, lastLat, lastLon,
                   r ? 'tap_bootstrap' : 'no_candidate', snap.anchorWayId, r?r.wayId:null, null, r?r.d:null, []);
      }
      if (r) { tapEntry.wayId = r.wayId; tapEntry.segIdx = r.segIdx; tapEntry.osmName = r.osmName; }
    }
    tapEntry.conf = (snap.confScore === null) ? '' : snap.confScore.toFixed(2);
    tapEntry.confLevel = snap.confLevel;
    tapEntry.gpsStab = (snap.gpsStabScore === null) ? '' : snap.gpsStabScore.toFixed(2);
    tapEntry.gpsLevel = snap.gpsStabLevel;
    telHistory.push(tapEntry);
  } else {
    tapEntry.gpsStab = (snap.gpsStabScore === null) ? '' : snap.gpsStabScore.toFixed(2);
    tapEntry.gpsLevel = snap.gpsStabLevel;
    snap.pendingQueue.push(tapEntry);
    telHistory.push(tapEntry);
  }
}

function doTap() {
  telCount++;
  var tapEntry = { ts: nowIso(), lat: lastLat, lon: lastLon, wayId: '', segIdx: 0, osmName: '' };
  snapResolveTap(tapEntry);
  document.getElementById('big-count').textContent = telCount;
  if (navigator.vibrate) navigator.vibrate(25);
  var s = document.getElementById('count-screen');
  s.classList.add('flash');
  setTimeout(function(){ s.classList.remove('flash'); }, 80);
  saveSession();
}

// Werk de zekerheidsstip + straatnaam onder de teller bij.
function _median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){ return a-b; });
  var m = s.length >> 1;
  return (s.length % 2) ? s[m] : (s[m-1] + s[m]) / 2;
}

// Werk de GPS-stabiliteitsscore bij met één nieuwe fix.
// Zelf-kalibrerend: een "sprong" is een snelheid die ver boven het eigen
// recente mediaan-tempo ligt (mediaan + K·MAD), niet een vaste m/s-drempel.
// Retourneert niets; zet snap.gpsStabScore / snap.gpsStabLevel.
function gpsUpdateStability(lat, lon, acc, tsMs) {
  var win = snap.gpsFixWin;
  // Identieke/gecachete fix (maximumAge) overslaan: vervuilt mediaan niet.
  var last = win.length ? win[win.length - 1] : null;
  if (last && (tsMs - last.ts) < 200) return;
  if (last && last.lat === lat && last.lon === lon) return;

  win.push({ ts: tsMs, lat: lat, lon: lon, acc: acc });
  while (win.length && (tsMs - win[0].ts) > GPS_WIN_MS) win.shift();

  if (win.length < GPS_WIN_MIN) {        // nog te weinig om iets te zeggen
    snap.gpsStabScore = null; snap.gpsStabLevel = 'none'; return;
  }

  // Stapsnelheden (m/s) en koerswijzigingen over het venster.
  var speeds = [], turns = [], prevBrg = null;
  for (var i = 1; i < win.length; i++) {
    var a = win[i-1], b = win[i];
    var dt = (b.ts - a.ts) / 1000;
    if (dt <= 0) continue;
    var cos = Math.cos(a.lat * Math.PI / 180);
    var dx  = (b.lon - a.lon) * 111320 * cos;
    var dy  = (b.lat - a.lat) * 111320;
    var dist = Math.sqrt(dx*dx + dy*dy);
    speeds.push(dist / dt);
    var brg = Math.atan2(dx, dy) * 180 / Math.PI;
    if (prevBrg !== null && dist > 1) {  // koers alleen zinvol bij echte stap
      var d = Math.abs(brg - prevBrg) % 360;
      turns.push(d > 180 ? 360 - d : d);
    }
    if (dist > 1) prevBrg = brg;
  }
  if (!speeds.length) { snap.gpsStabScore = null; snap.gpsStabLevel = 'none'; return; }

  // 1. Sprong: robuuste z-score van de laatste stap t.o.v. mediaan + K·MAD.
  var med  = _median(speeds);
  var devs = speeds.map(function(v){ return Math.abs(v - med); });
  var mad  = _median(devs);
  var band = med + GPS_JUMP_K * (mad > 0.3 ? mad : 0.3);  // vloer tegen 0-MAD
  var vLast = speeds[speeds.length - 1];
  var jumpScore = vLast <= band ? 1 : Math.max(0, 1 - (vLast - band) / band);

  // 2. Koers-consistentie: gemiddelde koerswijziging; recht lopen = stabiel.
  var turnScore = 1;
  if (turns.length) {
    var avgTurn = turns.reduce(function(s,v){ return s+v; }, 0) / turns.length;
    turnScore = Math.max(0, 1 - avgTurn / GPS_TURN_DEG);
  }

  // 3. Nauwkeurigheid: lineair tussen GOOD en BAD.
  var accScore = acc <= GPS_ACC_GOOD ? 1
               : acc >= GPS_ACC_BAD  ? 0
               : 1 - (acc - GPS_ACC_GOOD) / (GPS_ACC_BAD - GPS_ACC_GOOD);

  // Zwakste schakel — zelfde logica als de snap-stip.
  var raw = Math.min(jumpScore, turnScore, accScore);

  snap.gpsStabScore = (snap.gpsStabScore === null)
               ? raw
               : (GPS_STAB_EMA * raw + (1 - GPS_STAB_EMA) * snap.gpsStabScore);
  snap.gpsStabLevel = (snap.gpsStabScore >= GPS_STAB_GREEN) ? 'green'
               : (snap.gpsStabScore >= GPS_STAB_AMBER) ? 'amber' : 'red';
}

function renderSnapConf() {
  var dot  = document.getElementById('snap-dot');
  var name = document.getElementById('snap-name');
  if (!dot || !name) return;
  dot.className = '';
  if (snap.confLevel === 'green' || snap.confLevel === 'amber' || snap.confLevel === 'red') {
    dot.classList.add(snap.confLevel);
  }
  name.textContent = snap.confName || '—';

  var gdot = document.getElementById('gps-dot');
  if (gdot) {
    gdot.className = 'gps-dot';
    if (snap.gpsStabLevel === 'green' || snap.gpsStabLevel === 'amber' || snap.gpsStabLevel === 'red') {
      gdot.classList.add(snap.gpsStabLevel);
    }
  }
}

// ── Batterij-indicator ────────────────────────────────────────────────────────
// Alleen actief als de Battery Status API bestaat (ontbreekt op iOS Safari);
// daar blijft het element verborgen. Event-gedreven, niet pollend.
var battMgr = null;

function renderBattery() {
  var el = document.getElementById('batt-ind');
  if (!el || !battMgr) return;
  el.style.display = '';
  var fill = el.querySelector('.batt-fill');
  var pct  = Math.round(battMgr.level * 100);
  if (fill) fill.style.width = Math.max(8, pct) + '%';   // min. zichtbaar streepje
  el.className = 'batt-ind';
  // Bij opladen geen rode paniek: toon laadstatus, kleur op niveau maar amber-vloer.
  if (battMgr.charging) el.classList.add('charging');
  var level = (pct > 30) ? 'green' : (pct >= 15) ? 'amber' : (battMgr.charging ? 'amber' : 'red');
  el.classList.add(level);
  el.title = pct + '%' + (battMgr.charging ? ' (opladen)' : '');
}

function initBattery() {
  if (battMgr || !navigator.getBattery) return;   // al gedaan, of niet ondersteund
  navigator.getBattery().then(function(b) {
    battMgr = b;
    b.addEventListener('levelchange',    renderBattery);
    b.addEventListener('chargingchange', renderBattery);
    renderBattery();
  }).catch(function(){ /* geen batterij-info: laat element verborgen */ });
}

function doUndo() {
  if (telCount <= 0) { cancelHold(); return; }
  telCount--;
  telHistory.pop();
  document.getElementById('big-count').textContent = telCount;
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
  var s = document.getElementById('count-screen');
  s.classList.add('shake');
  setTimeout(function(){ s.classList.remove('shake'); }, 200);
  cancelHold();
  saveSession();
}

// ── Export ZIP ────────────────────────────────────────────────────────────────

// Knip een polyline-geometrie in segmenten van ~SEGMENT_TARGET_M.
// Geometry mag [{lat,lon},...] of [[lat,lon],...] zijn.
// Returns: array sub-polylines (elk [[lat,lon],...]) — minstens één.
function splitWayIntoSegments(geom) {
  if (!geom || geom.length < 2) return [geom ? geom.map(_normPt) : []];
  var pts = geom.map(_normPt);
  var refLat = pts[0][0];
  var cos = Math.cos(refLat * Math.PI / 180);
  // Cumulatieve afstand per knoop
  var cum = [0];
  for (var i = 1; i < pts.length; i++) {
    var dx = (pts[i][1] - pts[i-1][1]) * 111320 * cos;
    var dy = (pts[i][0] - pts[i-1][0]) * 111320;
    cum.push(cum[i-1] + Math.sqrt(dx*dx + dy*dy));
  }
  var total = cum[cum.length-1];
  if (total < SEGMENT_MIN_M) return [pts];
  var N = Math.max(1, Math.round(total / SEGMENT_TARGET_M));
  if (N === 1) return [pts];
  var segLen = total / N;
  var result = [];
  var curSeg = [pts[0]];
  var nextCut = segLen;
  var done = 0;
  for (var j = 1; j < pts.length; j++) {
    var dStart = cum[j-1], dEnd = cum[j], edge = dEnd - dStart;
    // Eén edge kan meerdere cuts bevatten als segLen < edge-lengte (zeldzaam)
    while (done < N - 1 && dEnd >= nextCut && edge > 0) {
      var t = (nextCut - dStart) / edge;
      var cutLat = pts[j-1][0] + t * (pts[j][0] - pts[j-1][0]);
      var cutLon = pts[j-1][1] + t * (pts[j][1] - pts[j-1][1]);
      curSeg.push([cutLat, cutLon]);
      result.push(curSeg);
      curSeg = [[cutLat, cutLon]];
      nextCut += segLen;
      done++;
    }
    curSeg.push(pts[j]);
  }
  result.push(curSeg);
  return result;
}

function _normPt(p) {
  return (p && p.lat !== undefined) ? [p.lat, p.lon] : p;
}

function buildNetwerkCsv(sid) {
  var lines = ['osm_way_id;segment_index;segment_count;highway;geometrie_wkt'];
  Object.keys(snap.elements).forEach(function(wayId) {
    var el = snap.elements[wayId];
    var subs = splitWayIntoSegments(el.geometry);
    subs.forEach(function(sub, idx) {
      var coords = sub.map(function(p){
        return p[1].toFixed(6)+' '+p[0].toFixed(6);
      }).join(', ');
      lines.push([wayId, idx, subs.length, el.highway,
                  'LINESTRING ('+coords+')'].join(';'));
    });
  });
  return lines.join('\n');
}

// Debug-trace: één regel per GPS-fix en per tap, in chronologische volgorde.
// Per regel: ruwe positie + interne snap-state (anchor voor/na, gekozen pad,
// afstanden tot anker en gekozen way, top-3 alternatieve kandidaten).
//
// snap_path waarden:
//   bootstrap            — eerste snap van de sessie (geen anker)
//   d1                   — anker bestaat, depth-1 lookup koos een way
//   d1_hold              — hysterese: anker behouden ondanks dichterbij liggende buur
//   d2                   — depth-1 leeg, depth-2 koos een way
//   reset                — anker te ver weg, opnieuw geïnitialiseerd
//   reset_no_candidate   — reset triggerde maar er was geen alternatief in 50m
//   glitch_hold          — anker dichtbij, geen verbonden kandidaat → null gereturnd
//   null_no_candidate    — geen anker én geen kandidaat in 50m
//   no_network           — netwerk nog niet geladen
function buildSnapTraceCsv(sid) {
  var lines = ['sessie_id;seq;tijdstip;event;lat;lon;accuracy;anchor_before;snap_path;chosen_way;d_anchor;d_chosen;alternatives;anchor_after;tap_nr;conf;conf_level;gps_stab;gps_level'];
  snap.trace.forEach(function(r) {
    lines.push([sid, r.seq, r.tijdstip, r.event, r.lat, r.lon, r.accuracy,
                r.anchor_before, r.snap_path, r.chosen_way,
                r.d_anchor, r.d_chosen, r.alternatives,
                r.anchor_after, r.tap_nr,
                r.conf != null ? r.conf : '', r.conf_level != null ? r.conf_level : '',
                r.gps_stab != null ? r.gps_stab : '', r.gps_level != null ? r.gps_level : ''].join(';'));
  });
  return lines.join('\n');
}

// Leidt 'visits' (aaneengesloten verblijven op één wegsegment) af uit routeLog.
// Regels:
//   - opeenvolgende routepunten met dezelfde (wayId, segIdx) vormen één visit
//   - een gat van >MAX_GAP_SEC seconden breekt een visit, ook bij gelijke key
//   - visits met <MIN_VISIT_SEC seconden of <MIN_VISIT_PTS punten worden weggefilterd
//     (vluchtige snap-flips bij kruisingen of segmentgrenzen)
// Per visit wordt geteld hoeveel tellingen erin vielen (matching op key + tijdsbereik).
function buildBezochtCsv(sid, telHist) {
  var MAX_GAP_SEC   = 30;
  var MIN_VISIT_SEC = 5;
  var MIN_VISIT_PTS = 3;

  function tsParse(s) { return new Date(s).getTime(); }
  function keyOf(wayId, segIdx) { return wayId + ':' + (segIdx || 0); }

  // Tellingen sorteren op timestamp voor snelle range-toewijzing
  var taps = telHist.filter(function(h){ return h.wayId; })
                    .map(function(h){ return { wayId:h.wayId, segIdx:h.segIdx||0, t:tsParse(h.ts) }; })
                    .sort(function(a,b){ return a.t - b.t; });

  var visits = [];
  var cur = null;
  for (var i = 0; i < routeLog.length; i++) {
    var p   = routeLog[i];
    var t   = tsParse(p.ts);
    var wayId = p.wayId || '';
    var seg = p.segIdx || 0;
    if (!wayId) {                       // geen snap → breek
      if (cur) { visits.push(cur); cur = null; }
      continue;
    }
    var sameKey = cur && cur.wayId === wayId && cur.segIdx === seg;
    if (!sameKey || (t - cur.tEnd) > MAX_GAP_SEC*1000) {
      if (cur) visits.push(cur);
      cur = { wayId: wayId, segIdx: seg, osmName: p.osmName || '',
              tStart: t, tEnd: t, nPts: 1 };
    } else {
      cur.tEnd = t;
      cur.nPts += 1;
      if (p.osmName && !cur.osmName) cur.osmName = p.osmName;
    }
  }
  if (cur) visits.push(cur);

  // Filter te korte visits weg
  visits = visits.filter(function(v) {
    var dur = (v.tEnd - v.tStart) / 1000;
    return dur >= MIN_VISIT_SEC && v.nPts >= MIN_VISIT_PTS;
  });

  // Tellingen per visit toewijzen (lineaire pass — taps zijn gesorteerd)
  visits.forEach(function(v) { v.nTel = 0; });
  var ti = 0;
  visits.forEach(function(v) {
    while (ti < taps.length && taps[ti].t < v.tStart) ti++;
    var j = ti;
    while (j < taps.length && taps[j].t <= v.tEnd) {
      if (taps[j].wayId === v.wayId && taps[j].segIdx === v.segIdx) v.nTel++;
      j++;
    }
  });

  // segment_count per way bepalen via splitWayIntoSegments op snap.elements
  var segCountFor = {};
  Object.keys(snap.elements).forEach(function(wayId) {
    var subs = splitWayIntoSegments(snap.elements[wayId].geometry);
    segCountFor[wayId] = subs.length;
  });

  function fmtTs(ms) {
    var d = new Date(ms);
    return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  var datum = fmtDate(startTime);
  var lines = ['sessie_id;datum;osm_way_id;segment_index;segment_count;straat;start_tijd;eind_tijd;duur_sec;n_gps;n_tellingen'];
  visits.forEach(function(v) {
    var dur = Math.round((v.tEnd - v.tStart) / 1000);
    var segCount = segCountFor[v.wayId] || 1;
    lines.push([sid, datum, v.wayId, v.segIdx, segCount, v.osmName,
                fmtTs(v.tStart), fmtTs(v.tEnd),
                dur, v.nPts, v.nTel].join(';'));
  });
  return lines.join('\n');
}

// ── BESTAND OPSLAAN — platform-robuust ────────────────────────────────────────
// Twee paden. Op iOS gebruikt de <a download>-route het download-attribuut niet
// en opent Safari de blob vaak in een tab i.p.v. op te slaan; daarom gaat iOS via
// de Web Share API (deelblad → "Bewaar in Bestanden"). Op desktop/Android, waar
// file-sharing meestal niet kan, valt 'ie terug op de klassieke download-link.
//
// LET OP: navigator.share vereist net als <a>.click() een verse user-gesture.
// Wordt saveBlob aangeroepen ná een async (zoals zip.generateAsync), dan kan dat
// gebaar verlopen zijn en faalt de poging stil — daarvoor is de expliciete
// opslaan-knop in de preview-overlay het vangnet (elke knoptik is vers).
// Generiek gehouden zodat de andere tools 'm 1-op-1 kunnen overnemen (2.8-migratie).
function saveBlob(blob, filename, mime) {
  mime = mime || 'application/octet-stream';
  // Alleen iOS via het deelblad (daar slaat een download-link slecht op).
  // Android kent navigator.share OOK, maar wil juist een echte download — en
  // share eist een levende user-gesture die na het comprimeren verlopen kan zijn.
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
           || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) {
    try {
      if (navigator.canShare) {
        var file = new File([blob], filename, { type: mime });
        if (navigator.canShare({ files: [file] })) {
          // v2.76: de uitkomst telt. Opgeslagen/gedeeld -> true; geannuleerd of
          // gebaar verlopen -> false (vangnet is de preview-knop).
          return navigator.share({ files: [file] }).then(
            function(){ return true; }, function(){ return false; });
        }
      }
    } catch (e) { /* val door naar de download-link */ }
  }
  // desktop/Android: klassieke download-link. Het anker MOET in de DOM hangen,
  // anders negeert Android de programmatische click().
  var url = URL.createObjectURL(blob);
  var a   = document.createElement('a');
  a.href  = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ try { document.body.removeChild(a); } catch (e) {} URL.revokeObjectURL(url); }, 2000);
  return Promise.resolve(true);   // v2.76: aan de browser overgedragen
}

// Bewaart de laatst gegenereerde ZIP zodat de preview-knop 'm opnieuw kan
// aanbieden zonder hercompressie. Leeft tot de volgende telling 'm overschrijft.
var lastZipBlob = null;
var lastZipName = '';

// ── TRAJECTORIE-HERTOEKENNING (vóór export) ──────────────────────────────────
// De live snap is plakkerig (anchoring tempert jitter, maar kan tikken aan een
// verre anker-way toekennen) en kent de toekomst niet. Vlak vóór de ZIP-bouw,
// als de hele trajectorie bekend is, hertoekennen we tikken én aanwezigheid op
// basis van een topologie-eerste Viterbi over routeLog. Dezelfde fix-bron voedt
// tik en aanwezigheid, dus ze landen gegarandeerd op hetzelfde (way,segment).
// Muteert routeLog[].wayId/segIdx en telHistory[].wayId/segIdx in place; de ruwe
// lat/lon blijven ongemoeid. De live-teller is al afgerond. De originele live-
// keuze blijft traceerbaar in _snap_trace.csv.
function reassignTrajectory() {
  if (!routeLog.length || !Object.keys(snap.elements).length) return;

  var LAT_M = 111320;
  function lonM(lat){ return LAT_M * Math.cos(lat*Math.PI/180); }
  function hav(la1,lo1,la2,lo2){ var lm=lonM((la1+la2)/2); return Math.hypot((lo2-lo1)*lm,(la2-la1)*LAT_M); }

  // Projecteer punt op way-geometrie (lat/lon-array), geef afstand + snap-punt.
  function project(plat, plon, geom){
    var lm=lonM(geom[0].lat); var px=plon*lm, py=plat*LAT_M;
    var best=Infinity, bLat=geom[0].lat, bLon=geom[0].lon, bBrg=0;
    for (var i=0;i<geom.length-1;i++){
      var ax=geom[i].lon*lm, ay=geom[i].lat*LAT_M, bx=geom[i+1].lon*lm, by=geom[i+1].lat*LAT_M;
      var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
      var t=(l2===0)?0:Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
      var cx=ax+t*dx, cy=ay+t*dy, d=Math.hypot(px-cx,py-cy);
      if (d<best){ best=d; bLat=cy/LAT_M; bLon=cx/lm; bBrg=Math.atan2(dx,dy)*180/Math.PI; }
    }
    return { dist:best, lat:bLat, lon:bLon, brg:((bBrg%360)+360)%360 };
  }

  // hop-klasse via de bestaande, exacte node-ID-adjacency (snap.adjacency)
  function hopClass(a, b){
    if (a===b) return 0;
    if (snap.adjacency[a] && snap.adjacency[a][b]) return 1;
    if (snap.adjacency[a]){ for (var m in snap.adjacency[a]) if (snap.adjacency[m] && snap.adjacency[m][b]) return 2; }
    return Infinity;
  }

  var wayIds = Object.keys(snap.elements);
  var SR=40, SIG_MIN=5, HOP1=4, HOP2=12, GAMMA=0.02, BETA=2, HEAD_REF_M=10;
  // koersverschil mod 180 (een way heeft geen looprichting)
  function angDiff180(a,b){ var d=Math.abs(a-b)%180; return Math.min(d,180-d); }

  // kolommen: per fix de kandidaat-ways binnen SR, met emissiekost
  var cols = [];
  for (var f=0; f<routeLog.length; f++){
    var fx=routeLog[f];
    var sigma=Math.max(SIG_MIN, fx.acc||SIG_MIN), cands=[];
    for (var w=0; w<wayIds.length; w++){
      var g=snap.elements[wayIds[w]].geometry; if(!g||g.length<2) continue;
      var pr=project(fx.lat, fx.lon, g);
      if (pr.dist<=SR){ var z=pr.dist/sigma; cands.push({wayId:wayIds[w], plat:pr.lat, plon:pr.lon, emit:0.5*z*z, brg:pr.brg}); }
    }
    cols.push(cands);
  }

  // Viterbi forward (topologie-eerst, gedeelde-knoop wint)
  var V=[], back=[];
  for (var col=0; col<cols.length; col++){
    V[col]={}; back[col]={};
    var cur=cols[col];
    if (col===0){ for(var a=0;a<cur.length;a++) V[0][cur[a].wayId]=cur[a].emit; continue; }
    var prev=cols[col-1];
    var gpsStep=hav(routeLog[col-1].lat,routeLog[col-1].lon,routeLog[col].lat,routeLog[col].lon);
    // GPS-stap-koers; gewicht ~ staplengte zodat korte (ruizige) stappen weinig meetellen
    var _lm=lonM(routeLog[col].lat);
    var _dx=(routeLog[col].lon-routeLog[col-1].lon)*_lm, _dy=(routeLog[col].lat-routeLog[col-1].lat)*LAT_M;
    var gpsBrg=((Math.atan2(_dx,_dy)*180/Math.PI)%360+360)%360;
    var headW=Math.min(1, gpsStep/HEAD_REF_M);
    for (var c=0;c<cur.length;c++){
      var cw=cur[c], bestCost=Infinity, bestPrev=null;
      var headCost=BETA*headW*(angDiff180(gpsBrg, cw.brg)/90);
      for (var p=0;p<prev.length;p++){
        var pw=prev[p]; if(V[col-1][pw.wayId]===undefined) continue;
        var hc=hopClass(pw.wayId, cw.wayId);
        if(!isFinite(hc)) continue;
        var base=(hc===0)?0:(hc===1)?HOP1:HOP2;
        var projStep=hav(pw.plat,pw.plon,cw.plat,cw.plon);
        var tot=V[col-1][pw.wayId]+base+GAMMA*Math.abs(projStep-gpsStep);
        if(tot<bestCost){ bestCost=tot; bestPrev=pw.wayId; }
      }
      if(bestPrev!==null){ V[col][cw.wayId]=bestCost+cw.emit+headCost; back[col][cw.wayId]=bestPrev; }
    }
    if(Object.keys(V[col]).length===0){ for(var g2=0;g2<cur.length;g2++){ V[col][cur[g2].wayId]=cur[g2].emit; back[col][cur[g2].wayId]=null; } }
  }
  // Beste staat van één kolom (laagste kost), of null als de kolom leeg is.
  function bestStateOf(colObj){
    var bw=null, bc=Infinity;
    for (var ww in colObj) if(colObj[ww]<bc){ bc=colObj[ww]; bw=ww; }
    return bw;
  }
  // Stuksgewijze backtrack. Een reset-kolom zet back=null als bewuste
  // segment-grens; daar starten we een NIEUWE backtrack vanaf de beste staat
  // van de bovenliggende kolom, i.p.v. de hele voorgeschiedenis als null weg te
  // gooien. Zo behoudt elk verbonden stuk z'n eigen Viterbi-oplossing.
  var path=new Array(cols.length).fill(null), last=cols.length-1;
  while(last>=0 && Object.keys(V[last]).length===0) last--;
  if(last<0) return;
  path[last]=bestStateOf(V[last]);
  for (var col2=last;col2>0;col2--){
    var cw2=path[col2];
    var pv=(cw2!=null) ? back[col2][cw2] : null;   // cw2 null kan niet meer voorkomen, maar veilig
    if (pv!=null){ path[col2-1]=pv; }
    else        { path[col2-1]=bestStateOf(V[col2-1]); }  // segment-grens → nieuw stuk
  }

  // segIdx per fix bepalen via splitWayIntoSegments (zelfde segmentatie als export)
  function segCountOf(wayId){
    var el=snap.elements[wayId]; if(!el) return 1;
    if (el._segCount==null) el._segCount = splitWayIntoSegments(el.geometry).length;
    return el._segCount;
  }
  function segIdxFor(wayId, plat, plon){
    var el=snap.elements[wayId]; if(!el||!el.geometry) return 0;
    var g=el.geometry, lm=lonM(g[0].lat), px=plon*lm, py=plat*LAT_M;
    // cumulatieve afstand tot projectie + totale lengte
    var cum=0, bestCum=0, best=Infinity, total=0;
    for (var i=0;i<g.length-1;i++){
      var ax=g[i].lon*lm, ay=g[i].lat*LAT_M, bx=g[i+1].lon*lm, by=g[i+1].lat*LAT_M;
      var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy, segLen=Math.sqrt(l2);
      var t=(l2===0)?0:Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
      var cx=ax+t*dx, cy=ay+t*dy, d=Math.hypot(px-cx,py-cy);
      if (d<best){ best=d; bestCum=cum+t*segLen; }
      cum+=segLen;
    }
    total=cum;
    var n=segCountOf(wayId); if(n<=1||total===0) return 0;
    return Math.min(n-1, Math.floor(bestCum / (total/n)));
  }

  // 1. routeLog corrigeren: way + segment per fix uit de trajectorie
  var fixWay=new Array(routeLog.length).fill(null), fixSeg=new Array(routeLog.length).fill(0);
  for (var i=0;i<routeLog.length;i++){
    var wayId=path[i];
    if (wayId && snap.elements[wayId]){
      var pr2=project(routeLog[i].lat, routeLog[i].lon, snap.elements[wayId].geometry);
      var seg=segIdxFor(wayId, pr2.lat, pr2.lon);
      fixWay[i]=wayId; fixSeg[i]=seg;
      routeLog[i].wayId=wayId; routeLog[i].segIdx=seg; routeLog[i].osmName=snap.elements[wayId].osmName||'';
    }
  }

  // 2. telHistory corrigeren: elke tik erft way+segment van de fix die qua tijd
  // het dichtst ligt — zo landen tik én aanwezigheid op hetzelfde (way,segment).
  function ms(s){ return new Date(s).getTime(); }
  for (var h=0;h<telHistory.length;h++){
    var tap=telHistory[h]; if(tap.lat==null) continue;
    var tt=ms(tap.ts), bi=-1, bg=Infinity;
    for (var ff=0; ff<routeLog.length; ff++){
      var d=Math.abs(ms(routeLog[ff].ts)-tt);
      if (d<bg){ bg=d; bi=ff; }
    }
    if (bi>=0 && fixWay[bi]){
      tap.wayId=fixWay[bi]; tap.segIdx=fixSeg[bi]; tap.osmName=snap.elements[fixWay[bi]].osmName||'';
    }
  }
}

function stopTelling() {
  var endTime = new Date();
  // modus-code in de sid → zichtbaar in de bestandsnaam én de sessie_id, zodat de
  // reconstructor (die op sessie_id naamt) de code vanzelf behoudt.
  var modusCode = ({ simpel: 's', transect: 't', winkelstraat: 'w', parkeren: 'p' })[currentModus] || 's';
  var sid     = genSid() + '_pkt_' + modusCode;
  var datum   = fmtDate(startTime);
  var start   = fmtTime(startTime);
  var eind    = fmtTime(endTime);

  // sessie.csv
  var csvType = (telType === 'other') ? telLabel : telType;
  var sessieCsv = 'sessie_id;datum;start_tijd;eind_tijd;app_type;type;n_waarnemingen;modus;richting_a;richting_b\n'
    + [sid, datum, start, eind, 'pocket', csvType, telCount, currentModus,
       currentModus === 'transect' ? tcRichtingA : '',
       currentModus === 'transect' ? tcRichtingB : ''].join(';');

  // Trajectorie-hertoekenning: corrigeer way+segment van fixes en tikken op basis
  // van de volledige trajectorie (topologie-eerst), vóór alle CSV's worden gebouwd.
  // Zo zijn telregels, gps én bezocht meteen bij de bron consistent.
  // Guard: zonder live netwerk (bv. na sessieherstel) overslaan — de tikken
  // behouden dan hun reeds-gesnapte wayId i.p.v. te worden leeggemaakt.
  if (Object.keys(snap.elements).length) reassignTrajectory();

  // telregels.csv — conf/conf_level + gps_stab/gps_level achteraan zodat
  // bestaande kolomvolgorde intact blijft; telrapport leest op header-naam
  // en negeert onbekende kolommen.
  var telregelsCsv = 'sessie_id;nr;tijdstip;type;lat;lon;osm_way_id;segment_index;straat;conf;conf_level;gps_stab;gps_level;richting;snelheid\n';
  telHistory.forEach(function(h, i) {
    telregelsCsv += [sid, i+1, h.ts, h.type || csvType,
      h.lat !== null ? h.lat.toFixed(6) : '',
      h.lon !== null ? h.lon.toFixed(6) : '',
      h.wayId  || '',
      h.wayId  ? (h.segIdx || 0) : '',
      h.osmName|| '',
      h.conf != null ? h.conf : '',
      h.confLevel || '',
      h.gpsStab != null ? h.gpsStab : '',
      h.gpsLevel || '',
      h.richting || '',
      h.snelheid || ''
    ].join(';') + '\n';
  });

  var zip = new JSZip();
  // GPS-track CSV (met wayId/segment_index per punt voor transparantie/debug)
  var gpsCsv = 'sessie_id;tijdstip;lat;lon;nauwkeurigheid;osm_way_id;segment_index;straat\n';
  routeLog.forEach(function(p) {
    gpsCsv += [sid, p.ts, p.lat.toFixed(6), p.lon.toFixed(6), p.acc,
               p.wayId || '',
               p.wayId ? (p.segIdx || 0) : '',
               p.osmName || ''].join(';') + '\n';
  });

  zip.file(sid + '_sessie.csv',    sessieCsv);
  zip.file(sid + '_telregels.csv', telregelsCsv);
  if (routeLog.length) {
    zip.file(sid + '_gps.csv', gpsCsv);
    zip.file(sid + '_bezocht.csv', buildBezochtCsv(sid, telHistory));
  }
  if (Object.keys(snap.elements).length) {
    zip.file(sid + '_netwerk.csv', buildNetwerkCsv(sid));
  }
  if (snap.trace.length) {
    zip.file(sid + '_snap_trace.csv', buildSnapTraceCsv(sid));
  }

  zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } }).then(function(blob) {
    // Bewaar voor het preview-vangnet (geen hercompressie nodig)
    lastZipBlob = blob;
    lastZipName = sid + '.zip';
    // Automatische poging — werkt waar de user-gesture nog leeft
    saveBlob(blob, lastZipName, 'application/zip').then(function (ok) { if (ok) exportBevestigd(); });
    // Preview pas tonen als de blob klaar is (niet via blinde timer); zo botst
    // 'ie niet met een eventueel geopend share-deelblad.
    showPreview();
  });

  if (currentModus === 'transect') closeTransectScreen();
  else if (currentModus === 'winkelstraat') closeWinkelScreen();
  else if (currentModus === 'parkeren') closeParkeerScreen();
  else closeTelScreen();
  backToModes();
  document.getElementById('choose-screen').style.display = '';
}

// ── POST-TELLING PREVIEW ──────────────────────────────────────────────────────
function heatColorPreview(t) {
  var r = Math.round(255 * Math.min(2*t, 1));
  var g = Math.round(255 * Math.min(2*(1-t), 1));
  return 'rgb('+r+','+g+',0)';
}

function polyLenM(pts) {
  if (!pts || pts.length < 2) return 0;
  var LAT_M = 111320;
  var total = 0;
  for (var i = 1; i < pts.length; i++) {
    var cos = Math.cos(pts[i-1][0] * Math.PI / 180);
    var dx = (pts[i][1] - pts[i-1][1]) * LAT_M * cos;
    var dy = (pts[i][0] - pts[i-1][0]) * LAT_M;
    total += Math.sqrt(dx*dx + dy*dy);
  }
  return total;
}

function showPreview() {
  // Segmenten bouwen per (wayId, segIdx) inclusief sub-geometrie en tikken
  var segMap = {};
  Object.keys(snap.elements).forEach(function(wayId) {
    var subs = splitWayIntoSegments(snap.elements[wayId].geometry);
    subs.forEach(function(sub, idx) {
      segMap[wayId + ':' + idx] = { geom: sub, taps: 0, lenM: polyLenM(sub) };
    });
  });

  telHistory.forEach(function(h) {
    if (!h.wayId) return;
    var key = h.wayId + ':' + (h.segIdx || 0);
    if (segMap[key]) segMap[key].taps++;
  });

  var gpsTrack = routeLog.map(function(p) { return [p.lat, p.lon]; });

  // Bezochte segmenten via GPS-hits (ook zero-visited tonen)
  var GPS_SNAP_M = 15, MIN_HITS = 3;
  var gpsHits = {};
  if (gpsTrack.length && Object.keys(segMap).length) {
    var refLat0 = gpsTrack[0][0];
    var cos0 = Math.cos(refLat0 * Math.PI / 180);
    var LAT_M0 = 111320;
    gpsTrack.forEach(function(pt) {
      var bestKey = null, bestD = GPS_SNAP_M;
      Object.keys(segMap).forEach(function(key) {
        var geom = segMap[key].geom;
        var px = pt[1]*LAT_M0*cos0, py = pt[0]*LAT_M0;
        for (var i = 0; i < geom.length - 1; i++) {
          var ax=geom[i][1]*LAT_M0*cos0,   ay=geom[i][0]*LAT_M0;
          var bx=geom[i+1][1]*LAT_M0*cos0, by=geom[i+1][0]*LAT_M0;
          var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
          var t2=l2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2)):0;
          var d=Math.sqrt(Math.pow(px-(ax+t2*dx),2)+Math.pow(py-(ay+t2*dy),2));
          if (d<bestD) { bestD=d; bestKey=key; }
        }
      });
      if (bestKey) gpsHits[bestKey] = (gpsHits[bestKey]||0)+1;
    });
  }

  var segKeys = Object.keys(segMap).filter(function(k) {
    return segMap[k].taps > 0 || (gpsHits[k]||0) >= MIN_HITS;
  });

  if (!segKeys.length && !gpsTrack.length) return;

  // Bounding box over alle punten
  var allPts = gpsTrack.slice();
  segKeys.forEach(function(k) { segMap[k].geom.forEach(function(p) { allPts.push(p); }); });
  if (!allPts.length) return;

  var minLat=allPts[0][0], maxLat=allPts[0][0], minLon=allPts[0][1], maxLon=allPts[0][1];
  allPts.forEach(function(p) {
    if (p[0]<minLat) minLat=p[0]; if (p[0]>maxLat) maxLat=p[0];
    if (p[1]<minLon) minLon=p[1]; if (p[1]>maxLon) maxLon=p[1];
  });

  // Canvas
  var cvs = document.getElementById('preview-canvas');
  var W   = cvs.offsetWidth || 360;
  var PAD = Math.round(W * 0.07);
  cvs.width = W; cvs.height = W;
  var ctx = cvs.getContext('2d');
  ctx.fillStyle = '#f0f0ec';
  ctx.fillRect(0, 0, W, W);

  // Projectie met aspect-correctie
  var midLat  = (minLat+maxLat)/2;
  var cosCorr = Math.cos(midLat*Math.PI/180);
  var dLatM   = (maxLat-minLat)*111320 || 10;
  var dLonM   = (maxLon-minLon)*111320*cosCorr || 10;
  var drawW   = W-2*PAD, drawH = W-2*PAD;
  var scale   = Math.min(drawW/dLonM, drawH/dLatM);
  var offX    = (drawW-dLonM*scale)/2;
  var offY    = (drawH-dLatM*scale)/2;

  function proj(lat, lon) {
    return [PAD+offX+(lon-minLon)*111320*cosCorr*scale,
            PAD+offY+(maxLat-lat)*111320*scale];
  }

  function drawLine(pts, color, width, dash) {
    if (!pts||pts.length<2) return;
    ctx.beginPath();
    ctx.setLineDash(dash||[]);
    ctx.strokeStyle=color; ctx.lineWidth=width;
    ctx.lineCap='round'; ctx.lineJoin='round';
    var p0=proj(pts[0][0],pts[0][1]);
    ctx.moveTo(p0[0],p0[1]);
    for (var i=1;i<pts.length;i++) { var p=proj(pts[i][0],pts[i][1]); ctx.lineTo(p[0],p[1]); }
    ctx.stroke();
  }

  // Tekenen: GPS-spoor, zero-visited, getelde segmenten
  if (gpsTrack.length>1) drawLine(gpsTrack,'rgba(140,140,160,0.4)',Math.max(1,W/300),[4,4]);
  segKeys.forEach(function(k) { if (segMap[k].taps===0) drawLine(segMap[k].geom,'rgba(60,61,66,0.3)',Math.max(2,W/160),[5,5]); });

  var maxD=0;
  segKeys.forEach(function(k) { if (segMap[k].taps>0&&segMap[k].lenM>0) { var d=segMap[k].taps/segMap[k].lenM; if(d>maxD) maxD=d; } });
  segKeys.forEach(function(k) {
    var s=segMap[k]; if (s.taps===0) return;
    var t=Math.sqrt(Math.min(1, s.lenM>0?s.taps/s.lenM:0));
    drawLine(s.geom, heatColorPreview(t), Math.max(3,W/100), null);
  });

  // Stats
  var nGeteld = segKeys.filter(function(k){return segMap[k].taps>0;}).length;
  var kmStr   = gpsTrack.length>1?(polyLenM(gpsTrack)/1000).toFixed(2):'—';
  document.getElementById('pstat-tikken').textContent = telCount;
  document.getElementById('pstat-segs').textContent   = nGeteld+'/'+segKeys.length;
  document.getElementById('pstat-km').textContent     = kmStr;
  document.getElementById('pstat-max').textContent    = maxD>0?maxD.toFixed(2):'—';
  document.getElementById('preview-overlay').classList.add('visible');
}

function closePreview() {
  document.getElementById('preview-overlay').classList.remove('visible');
  exportBevestigd();   // export bevestigd gezien \u2192 herstelkopie weg, en weg houden (v2.76)
  if (pkDirect) startParkeren();   // v2.70: directe ingang, geen keuzemenu
}

// Vangnet: biedt de laatst gegenereerde ZIP opnieuw aan. Deze tik is een verse
// user-gesture, dus dit slaagt ook als de automatische poging in stopTelling
// faalde door een verlopen gebaar (typisch iOS na de async zip-generatie).
function savePreviewZip() {
  if (lastZipBlob) saveBlob(lastZipBlob, lastZipName, 'application/zip')
    .then(function (ok) { if (ok) exportBevestigd(); });
}

// Stuur de zojuist gebouwde ZIP door naar de reconstructor en open die.
function openReconstructie() {
  if (!lastZipBlob) { alert('Nog geen ZIP beschikbaar \u2014 stop eerst de telling.'); return; }
  stuurNaarReconstructie(lastZipBlob, lastZipName)
    .catch(function () { alert('Doorsturen mislukt \u2014 sla de ZIP op en sleep hem in telreconstructie.html.'); });
}

// ── OSM SNAP MODULE (transect/pocket variant) ─────────────────────────────────
// Vereenvoudigd t.o.v. parkeertelling: geen L/R weging, geen minimap,
// geen kompas-fusie. Graceful degradeert als Overpass niet bereikbaar is.

var SNAP_ROAD_FETCH_RADIUS = 250;
// Snap-netwerk highway-filter — HOUD GELIJK over alle tools (grep HIGHWAY_RE).
var HIGHWAY_RE = 'residential|living_street|primary|secondary|tertiary|unclassified|service|pedestrian|footway|cycleway|path|track|bridleway|steps|corridor';

/* ---- Gedeelde OSM-tegelcache (zelfde IndexedDB als telreconstructie.html) ----
   Wat hier tijdens het tellen wordt opgehaald, hoeft de reconstructor later niet
   opnieuw te fetchen. Formaat identiek: { key:'t_<ty>_<tx>', ts, ways:[...] }.
   BELANGRIJK: we schrijven alleen tegels weg die VOLLEDIG binnen de opgehaalde
   cirkel liggen. Een half gevulde tegel zou de reconstructor als 'vers' lezen en
   dan wegen missen. */
var TILE_DEG_SHARED = 0.01, TILE_DB = 'telsuite_osm', TILE_STORE = 'tiles';
function _tileDb() {
  return new Promise(function (res, rej) {
    if (typeof indexedDB === 'undefined' || !indexedDB) return rej(new Error('geen IndexedDB'));
    var q = indexedDB.open(TILE_DB, 1);
    q.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(TILE_STORE))  db.createObjectStore(TILE_STORE, { keyPath: 'key' });
      if (!db.objectStoreNames.contains('handoff'))   db.createObjectStore('handoff', { keyPath: 'key' });
    };
    q.onsuccess = function (e) { res(e.target.result); };
    q.onerror = function () { rej(q.error); };
  });
}
// Bewaar ways per tegel, maar pas als een tegel VOLLEDIG gedekt is door de
// opgehaalde cirkels van deze sessie. Eén fetch (r=250m) dekt nooit een hele
// tegel (~1,1km); al lopend groeit de dekking en komt de tegel alsnog compleet.
// We rasteren elke tegel in 8x8 cellen en markeren welke cellen binnen een
// fetch-cirkel liggen; bij 64/64 is de tegel compleet en gaat hij de cache in.
var _tileCov = {};      // tegelsleutel -> { cells:Set, ways:{id:way} }
var _TILE_N = 8;
function cacheWaysInTiles(elements, lat, lon, radiusM) {
  try {
    if (!elements || !elements.length) return;
    var mPerLat = 111320, mPerLon = 111320 * Math.cos(lat * Math.PI / 180) || 1;
    var dLat = radiusM / mPerLat, dLon = radiusM / mPerLon;
    // 1) dekking bijwerken voor elke tegel die de cirkel raakt
    var ty0 = Math.floor((lat - dLat) / TILE_DEG_SHARED), ty1 = Math.floor((lat + dLat) / TILE_DEG_SHARED);
    var tx0 = Math.floor((lon - dLon) / TILE_DEG_SHARED), tx1 = Math.floor((lon + dLon) / TILE_DEG_SHARED);
    var raak = [];
    for (var ty = ty0; ty <= ty1; ty++) {
      for (var tx = tx0; tx <= tx1; tx++) {
        var key = 't_' + ty + '_' + tx;
        var rec = _tileCov[key] || (_tileCov[key] = { cells: {}, n: 0, ways: {} });
        for (var i = 0; i < _TILE_N; i++) {
          for (var j = 0; j < _TILE_N; j++) {
            var ci = i * _TILE_N + j;
            if (rec.cells[ci]) continue;
            var cLat = (ty + (i + 0.5) / _TILE_N) * TILE_DEG_SHARED;
            var cLon = (tx + (j + 0.5) / _TILE_N) * TILE_DEG_SHARED;
            var dy = (cLat - lat) * mPerLat, dx = (cLon - lon) * mPerLon;

        raak.push(key);

    }
    // 2) ways toewijzen aan de tegels die ze raken
    var norm = elements.filter(function (el) { return el.type === 'way' && el.geometry && el.geometry.length >= 2; })
      .map(function (el) {
        return { type: 'way', id: el.id, nodes: el.nodes || [], geometry: el.geometry,
                 tags: { highway: (el.tags && el.tags.highway) || '',
                         name:    (el.tags && el.tags.name)    || '' } };
      });
    norm.forEach(function (w) {
      w.geometry.forEach(function (p) {
        var k = 't_' + Math.floor(p.lat / TILE_DEG_SHARED) + '_' + Math.floor(p.lon / TILE_DEG_SHARED);
        if (_tileCov[k]) _tileCov[k].ways[w.id] = w;
      });
    });

    var klaar = raak.filter(function (k) { return _tileCov[k] && _tileCov[k].n >= _TILE_N * _TILE_N; });
    if (!klaar.length) return;
    var now = Date.now();
    var recs = klaar.map(function (k) {

      return { key: k, ts: now, v: TEGEL_SCHEMA, ways: ws };
    });
    klaar.forEach(function (k) { _tileCov[k].opgeslagen = 1; delete _tileCov[k].ways; });
    _tileDb().then(function (db) {
      var tx2 = db.transaction(TILE_STORE, 'readwrite'), st = tx2.objectStore(TILE_STORE);
      recs.forEach(function (r) { st.put(r); });
    }).catch(function () {});
  } catch (e) { /* cache is best-effort: nooit het tellen verstoren */ }
}

/* ---- Tegel-cache LEZEN (v2.49) --------------------------------------------

   Sinds v2.43 schrijven de veld-apps hun opgehaalde netwerk in tegels, maar
   las alleen de reconstructor ze terug. Wie dezelfde straat voor de derde keer
   telt, haalde hem dus ook voor de derde keer op. Nu kijken we eerst.

   Alles-of-niets: de fetch wordt alleen overgeslagen als ÁLLE tegels die de
   fetch-cirkel raken aanwezig én vers zijn. Deelresultaten mengen we niet —
   een half gedekte cirkel zou stil wegen missen, precies de fout die de
   schrijfkant met het 8x8-raster al vermijdt.

   TTL is hier korter dan de 60 dagen van de reconstructor. Daar ziet de
   gebruiker de tegelouderdom in beeld en kan hij verversen; hier gebeurt het
   stil, en stille veroudering verdient een strakkere grens.

   Schemaversie: tegels van vóór v2.49 dragen geen straatnaam. Die tellen als
   misser, worden opnieuw opgehaald en meteen mét naam teruggeschreven — dus
   geen migratie, de cache geneest zichzelf.                                   */
var TEGEL_TTL_MS  = 14 * 24 * 3600 * 1000;
var TEGEL_SCHEMA  = 2;
function leesTegels(lat, lon, radiusM) {
  return new Promise(function (res) {
    try {
      var mPerLat = 111320, mPerLon = 111320 * Math.cos(lat * Math.PI / 180) || 1;
      var dLat = radiusM / mPerLat, dLon = radiusM / mPerLon;
      var ty0 = Math.floor((lat - dLat) / TILE_DEG_SHARED), ty1 = Math.floor((lat + dLat) / TILE_DEG_SHARED);
      var tx0 = Math.floor((lon - dLon) / TILE_DEG_SHARED), tx1 = Math.floor((lon + dLon) / TILE_DEG_SHARED);
      var keys = [];
      for (var ty = ty0; ty <= ty1; ty++) {
        for (var tx = tx0; tx <= tx1; tx++) keys.push('t_' + ty + '_' + tx);
      }
      if (!keys.length) return res(null);
      _tileDb().then(function (db) {
        var st = db.transaction(TILE_STORE, 'readonly').objectStore(TILE_STORE);
        var grens = Date.now() - TEGEL_TTL_MS;
        var pending = keys.length, mis = false, seen = {}, out = [];
        keys.forEach(function (k) {
          var r = st.get(k);
          r.onsuccess = function () {
            var rec = r.result;
            if (!rec || !rec.ts || rec.ts < grens || (rec.v || 1) < TEGEL_SCHEMA) {
              mis = true;
            } else {
              // Een way die twee tegels raakt staat in beide: ontdubbelen op id.
              (rec.ways || []).forEach(function (w) {
                if (!seen[w.id]) { seen[w.id] = 1; out.push(w); }
              });
            }
            if (--pending === 0) res(mis ? null : out);
          };
          r.onerror = function () { mis = true; if (--pending === 0) res(null); };
        });
      }).catch(function () { res(null); });
    } catch (e) { res(null); }   // cache is best-effort: nooit het tellen blokkeren
  });
}


// Geef de zojuist gebouwde ZIP door aan telreconstructie.html en open die.
function stuurNaarReconstructie(blob, naam) {
  return _tileDb().then(function (db) {
    return new Promise(function (res, rej) {
      if (!db.objectStoreNames.contains('handoff')) return rej(new Error('geen handoff-store'));
      var tx = db.transaction('handoff', 'readwrite');
      tx.objectStore('handoff').put({ key: 'zip', blob: blob, naam: naam || 'telling.zip', ts: Date.now() });
      tx.oncomplete = function () { res(); };
      tx.onerror = function () { rej(tx.error); };
    });
  }).then(function () {
    location.href = 'telreconstructie.html?handoff=1';
  });
}

var SNAP_MAX_M             = 50;   // max snap-afstand voor verse fixes

var CONF_ACC_LO    = 10, CONF_ACC_HI    = 30;   // m GPS-accuracy-straal

var GPS_ACC_GOOD   = 12;      // m: acc ≤ dit telt als goed
var GPS_ACC_BAD    = 35;      // m: acc ≥ dit telt als slecht
var GPS_STAB_EMA   = 0.4;     // smoothing van de stabiliteitsscore
var GPS_STAB_GREEN = 0.66, GPS_STAB_AMBER = 0.33;
/* ---- Verse-data-garantie -------------------------------------------------
   Elk Overpass-antwoord draagt osm3s.timestamp_osm_base: het moment waarop de
   dataset van die server voor het laatst is bijgewerkt. Een mirror die achter-
   loopt levert stilzwijgend verouderde wegen — nieuwe of gewijzigde straten
   ontbreken dan zonder dat je het merkt. We keuren daarom elk antwoord zelf.

var OSM_MAX_LAG_DAGEN = 7;
function dataIsVers(data) {
  try {
    var ts = data && data.osm3s && data.osm3s.timestamp_osm_base;
    if (!ts) return true;                       // geen stempel → niet afkeuren
    var lag = (Date.now() - new Date(ts).getTime()) / 86400000;
    if (isNaN(lag)) return true;
    return lag <= OSM_MAX_LAG_DAGEN;
  } catch (e) { return true; }                  // nooit het tellen blokkeren op een parseerfout

var SNAP_OVERPASS          = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];

/* ---- Overpass-antwoord classificeren (v2.49) ------------------------------

   Vóór v2.49 ging élk niet-ideaal antwoord door dezelfde catch: een gebied
   zónder wegen liet de app net zo hard opnieuw vragen als een netwerkstoring.
   Erger nog: Overpass meldt rate-limiting niet altijd als HTTP 429, maar soms
   als een 200 met de melding in data.remark. Die zagen wij als 'geen wegen' en
   dus als reden om meteen de andere mirror te proberen — precies wanneer de
   servers vol zitten, sloegen wij er het hardst op. En een geweigerd verzoek
   is niet gratis: Overpass voert de query eerst uit en meldt de limiet daarna.

   Vijf uitkomsten, elk met eigen gedrag:
     ok     -> verwerken
     leeg   -> geldig antwoord; hier liggen geen wegen. NIET opnieuw vragen.
     oud    -> deze mirror loopt achter (> OSM_MAX_LAG_DAGEN). Andere proberen.
     limiet -> server wijst ons af of zit vol. Lang wachten, niets proberen.
     fout   -> netwerk-/HTTP-storing. Kort exponentieel wachten.               */
var OVP_OK = 'ok', OVP_LEEG = 'leeg', OVP_OUD = 'oud',
    OVP_LIMIET = 'limiet', OVP_FOUT = 'fout';
var OVP_LIMIET_WACHT_MS = 30000;      // rate-limit: slots komen per ~minuut vrij
var OVP_OUD_WACHT_MS    = 300000;     // alle mirrors achter: lost niet op in seconden
function ovpStatusUitHttp(status) {
  return (status === 429 || status === 503 || status === 504) ? OVP_LIMIET : OVP_FOUT;
}
function ovpKeur(data) {
  if (!data || typeof data !== 'object') return OVP_FOUT;
  var rem = '' + (data.remark || '');
  if (rem) {
    // Overpass legt runtime-meldingen in 'remark' bij een verder normale 200.
    if (/rate_?limit|too many requests|Dispatcher_Client/i.test(rem)) return OVP_LIMIET;
    return OVP_FOUT;
  }
  if (!dataIsVers(data)) return OVP_OUD;
  if (!data.elements || !data.elements.length) return OVP_LEEG;

// Exponentieel wachten met plafond: 500 . 2^(n-1), max 8s. Lang genoeg om een
// overbelaste server te ontzien, kort genoeg om terug te zijn zodra het kan.
function ovpBackoffMs(n) { return Math.min(500 * Math.pow(2, Math.max(0, n - 1)), 8000); }

var SEGMENT_TARGET_M       = 40;
var SEGMENT_MIN_M          = 60;

  cacheLon:     null,

  pendingQueue: [],      // tikken die wachten op eerste snap-respons

  fetchCooldownUntil: 0, // ms-timestamp: vóór dit moment geen nieuwe fetch starten
  fetchFailStreak: 0,    // opeenvolgende mislukte logische aanvragen (voedt backoff)
