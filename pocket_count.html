function snapToXY(lat, lon, refLat, refLon) {
  var cos = Math.cos(refLat * Math.PI / 180);
  return { x:(lon-refLon)*111320*cos, y:(lat-refLat)*111320 };
}

function snapClosest(px,py,ax,ay,bx,by) {
  var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if (l2===0) return {x:ax,y:ay};
  var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
  return {x:ax+t*dx, y:ay+t*dy};
}

function snapBuildSegs(elements, refLat, refLon) {
  var segs=[];
  elements.forEach(function(el) {
    if (el.type!=='way'||!el.geometry||el.geometry.length<2) return;
    var xy = el.geometry.map(function(p){ return snapToXY(p.lat, p.lon, refLat, refLon); });
    // Cumulatieve afstand per knoop (in meters)
    var cum = [0];
    for (var k=1; k<xy.length; k++) {
      var ex = xy[k].x - xy[k-1].x, ey = xy[k].y - xy[k-1].y;
      cum.push(cum[k-1] + Math.sqrt(ex*ex + ey*ey));
    }
    var totalLen = cum[cum.length-1];
    var nSeg   = (totalLen < SEGMENT_MIN_M) ? 1 : Math.max(1, Math.round(totalLen / SEGMENT_TARGET_M));
    var segLen = (nSeg > 0) ? (totalLen / nSeg) : totalLen;
    for (var i=0; i<xy.length-1; i++) {
      segs.push({
        ax:xy[i].x,   ay:xy[i].y,
        bx:xy[i+1].x, by:xy[i+1].y,
        wayId:String(el.id),
        cumStart: cum[i],          // m langs way tot deze edge begint
        edgeLen:  cum[i+1]-cum[i], // m van deze edge
        segLen:   segLen,          // m per segment van deze way
        nSeg:     nSeg,
        osmName:(el.tags&&el.tags.name)||'',
        highway:(el.tags&&el.tags.highway)||''
      });
    }
  });
  return segs;
}

// Registreer een way in de adjacency-administratie. Idempotent: bij refetch
// van overlappend gebied gaan er geen dubbele edges in. Voegt zowel ‘way zit
// op deze nodes’ als ‘deze ways zijn nu aan elkaar verbonden’ toe.
function snapRegisterWay(el) {
  if (!el.nodes || el.nodes.length < 2) return;
  var wayId = String(el.id);
  for (var i = 0; i < el.nodes.length; i++) {
    var nid = el.nodes[i];
    if (!snap.nodeToWays[nid]) snap.nodeToWays[nid] = {};
    if (snap.nodeToWays[nid][wayId]) continue;  // al geregistreerd
    snap.nodeToWays[nid][wayId] = true;
    if (!snap.adjacency[wayId]) snap.adjacency[wayId] = {};
    // Verbind wayId met alle ways die deze node ook delen
    Object.keys(snap.nodeToWays[nid]).forEach(function(other) {
      if (other === wayId) return;
      snap.adjacency[wayId][other] = true;
      if (!snap.adjacency[other]) snap.adjacency[other] = {};
      snap.adjacency[other][wayId] = true;
    });
  }
}

// Bouw een Overpass-achtige elements-lijst uit het CUMULATIEVE snap.elements,
// beperkt tot ways waarvan minstens één knoop binnen SNAP_SEGS_RADIUS van
// (lat,lon) ligt. Het huidige anker wordt altijd meegenomen, ongeacht
// knoopafstand — zo verliest de way waarop je staat nooit z'n segs, ook niet
// als 't een lange weg met ver uiteenliggende knopen is.
// snapBuildSegs herprojecteert de output tegen (lat,lon), dus er is geen
// frame-menging: oude en nieuwe ways krijgen hetzelfde origin.
function snapElementsNear(lat, lon) {
  var cos = Math.cos(lat * Math.PI / 180);
  var R2  = SNAP_SEGS_RADIUS * SNAP_SEGS_RADIUS;
  var anchorId = (snap.anchorWayId != null) ? String(snap.anchorWayId) : null;
  var out = [];
  var ids = Object.keys(snap.elements);
  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    var el = snap.elements[id];
    var keep = (id === anchorId);
    if (!keep) {
      var g = el.geometry;
      for (var k = 0; k < g.length; k++) {
        var dx = (g[k].lon - lon) * 111320 * cos;
        var dy = (g[k].lat - lat) * 111320;
        if (dx*dx + dy*dy <= R2) { keep = true; break; }
      }
    }
    if (keep) out.push({
      type: 'way', id: id, geometry: el.geometry,
      tags: { name: el.osmName, highway: el.highway }
    });
  }
  return out;
}

// Geef de set van wayIds die binnen ‘depth’ sprongen bereikbaar is vanaf wayId.
// depth=1 = anker + directe buren. depth=2 = ook buren-van-buren (voor het geval
// een korte tussen-way nooit een eigen fix kreeg, bijv. bij snelheid).
function snapAdjacencySet(wayId, depth) {
  var result = {};
  result[wayId] = true;
  var frontier = [wayId];
  for (var d = 0; d < depth; d++) {
    var next = [];
    for (var i = 0; i < frontier.length; i++) {
      var adj = snap.adjacency[frontier[i]];
      if (!adj) continue;
      var keys = Object.keys(adj);
      for (var j = 0; j < keys.length; j++) {
        if (!result[keys[j]]) { result[keys[j]] = true; next.push(keys[j]); }
      }
    }
    frontier = next;
    if (!frontier.length) break;
  }
  return result;
}

// Minimum-afstand van punt p naar een specifieke way (zonder SNAP_MAX_M-cutoff).
// Nodig om te beslissen of het anker echt onbereikbaar ver weg is (→ reset)
// of slechts tijdelijk net buiten 50m valt door GPS-jitter (→ anker behouden).
function snapDistanceToWay(p, wayId) {
  var best = Infinity;
  for (var i = 0; i < snap.segs.length; i++) {
    var s = snap.segs[i];
    if (s.wayId !== wayId) continue;
    var dx = s.bx - s.ax, dy = s.by - s.ay, l2 = dx*dx + dy*dy;
    var t = (l2 === 0) ? 0 : Math.max(0, Math.min(1, ((p.x-s.ax)*dx + (p.y-s.ay)*dy) / l2));
    var cx = s.ax + t*dx, cy = s.ay + t*dy;
    var d = Math.sqrt((cx-p.x)*(cx-p.x) + (cy-p.y)*(cy-p.y));
    if (d < best) best = d;
  }
  return best;
}

// Read-only: projecteer een punt loodrecht op één specifieke way en geef
// {lat, lon, wayId, segIdx, osmName, d} terug (of null). Muteert GEEN anker-state.
// Gebruikt door taps om het GPS-anker te erven i.p.v. zelf opnieuw te beslissen.
function snapProjectOnto(lat, lon, wayId) {
  if (!snap.segs.length || snap.cacheLat===null) return null;
  var p = snapToXY(lat, lon, snap.cacheLat, snap.cacheLon);
  var best=null;
  for (var i=0;i<snap.segs.length;i++) {
    var s=snap.segs[i];
    if (s.wayId!==wayId) continue;
    var dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
    var t=(l2===0)?0:Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/l2));
    var cx=s.ax+t*dx, cy=s.ay+t*dy;
    var d=Math.sqrt((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y));
    if (!best || d<best.d) best={d:d, seg:s, cx:cx, cy:cy, t:t};
  }
  if (!best) return null;
  var s=best.seg;
  var snapM=s.cumStart + best.t*s.edgeLen;
  var segIdx=(s.nSeg<=1||s.segLen===0)?0:Math.min(s.nSeg-1,Math.floor(snapM/s.segLen));
  var cos=Math.cos(snap.cacheLat*Math.PI/180);
  return {
    lat: snap.cacheLat + best.cy/111320,
    lon: snap.cacheLon + best.cx/(111320*cos),
    wayId: wayId, segIdx: segIdx, osmName: s.osmName, d: best.d
  };
}

// Read-only: dichtstbijzijnde way overall binnen SNAP_MAX_M (geen adjacency, geen
// anker-mutatie). Voor cold-start taps en retro-snap van wachtrij-tikken.
function snapNearestAny(lat, lon) {
  if (!snap.segs.length || snap.cacheLat===null) return null;
  var p=snapToXY(lat, lon, snap.cacheLat, snap.cacheLon);
  var bestPerWay={};
  for (var i=0;i<snap.segs.length;i++) {
    var s=snap.segs[i];
    var dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
    var t=(l2===0)?0:Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/l2));
    var cx=s.ax+t*dx, cy=s.ay+t*dy;
    var d=Math.sqrt((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y));
    if (d>SNAP_MAX_M) continue;
    if (!bestPerWay[s.wayId] || d<bestPerWay[s.wayId]) bestPerWay[s.wayId]=d;
  }
  var bestId=null, bestD=Infinity;
  Object.keys(bestPerWay).forEach(function(w){ if (bestPerWay[w]<bestD){ bestD=bestPerWay[w]; bestId=w; } });
  return bestId ? snapProjectOnto(lat, lon, bestId) : null;
}

// Bereken een ruwe zekerheid in [0,1] uit de signalen die we per fix al hebben.
// rampUp:  >= hi → 1, <= lo → 0 (groter = beter, bijv. marge)
// rampDown: <= lo → 1, >= hi → 0 (kleiner = beter, bijv. afstand, accuracy)
function _ramp(v, lo, hi, up) {
  if (v == null || isNaN(v)) return 1;           // onbekend signaal telt niet mee
  var t = (v - lo) / (hi - lo);
  t = Math.max(0, Math.min(1, t));
  return up ? t : (1 - t);
}
// bestPerWay: {wayId→{d,...}} alle kandidaten; chosenWayId: gekozen way;
// chosenD: afstand tot gekozen; acc: GPS-accuracy; path: snapPath; pending: challenger actief
function snapComputeConfidence(bestPerWay, chosenWayId, chosenD, acc, path, pending) {
  // Harde gevallen: geen bruikbare fix
  if (path === 'no_network' || path === 'null_no_candidate' ||
      path === 'reset_no_candidate' || chosenWayId == null) {
    return { score: 0, level: 'red' };
  }
  // Marge tot de op-één-na-dichtste way (de échte ambiguïteitsmaat)
  var runnerUp = Infinity;
  var keys = Object.keys(bestPerWay);
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === chosenWayId) continue;
    if (bestPerWay[keys[i]].d < runnerUp) runnerUp = bestPerWay[keys[i]].d;
  }
  var margin = (runnerUp === Infinity) ? CONF_MARGIN_HI : (runnerUp - chosenD);

  var sMargin = _ramp(margin,  CONF_MARGIN_LO, CONF_MARGIN_HI, true);
  var sDist   = _ramp(chosenD, CONF_DIST_LO,   CONF_DIST_HI,   false);
  var sAcc    = _ramp(acc,     CONF_ACC_LO,    CONF_ACC_HI,    false);

  var raw = Math.min(sMargin, sDist, sAcc);   // zwakste schakel
  // Onopgeloste strijd of mislukte verse fix → niet hoger dan amber
  if (pending || path === 'glitch_hold') raw = Math.min(raw, CONF_AMBER + 0.001);

  return { score: raw, level: null };  // level wordt na EMA bepaald
}

// GPS-anker-pad. ENIGE schrijver van snap.anchorWayId / snap.challenger. Alleen de
// GPS-watcher roept dit aan; taps erven het anker via snapProjectOnto (read-only).
function snapNearestWay(lat, lon, eventInfo) {
  // eventInfo (optioneel): {type:'gps'|'tap', tijdstip, accuracy, tap_nr}
  //   gebruikt voor _snap_trace.csv schrijven. Zonder eventInfo wordt niet getraced.
  if (!snap.segs.length || snap.cacheLat===null) {
    // v2.71: hier ontbrak één argument (dChosen), waardoor alts undefined was en
    // traceWrite() op alts.map() crashte. Die fout brak de GPS-callback af vóór
    // routeLog.push(): zolang er geen wegennet was (start, of Overpass
    // onbereikbaar) werd er geen enkel routepunt bewaard.
    if (eventInfo) traceWrite(eventInfo, lat, lon, 'no_network', null, null, null, null, []);
    return null;
  }
  var p = snapToXY(lat, lon, snap.cacheLat, snap.cacheLon);
  var anchorBefore = snap.anchorWayId;

  // Stap 1: beste edge per way binnen SNAP_MAX_M verzamelen
  var bestPerWay = {};  // wayId → {d, seg, pt:{x,y}, t}
  for (var i=0;i<snap.segs.length;i++) {
    var s=snap.segs[i];
    var dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
    var t = (l2===0) ? 0 : Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/l2));
    var cx=s.ax+t*dx, cy=s.ay+t*dy;
    var d=Math.sqrt((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y));
    if (d>SNAP_MAX_M) continue;
    if (!bestPerWay[s.wayId] || d<bestPerWay[s.wayId].d) {
      bestPerWay[s.wayId] = {d:d, seg:s, pt:{x:cx,y:cy}, t:t};
    }
  }

  // Top-3 alternatieven (alle kandidaten exclusief de uiteindelijk gekozene)
  function topAlternatives(exceptWayId) {
    var arr = [];
    Object.keys(bestPerWay).forEach(function(w) {
      if (w !== exceptWayId) arr.push({wayId:w, d:bestPerWay[w].d});
    });
    arr.sort(function(a,b){return a.d-b.d;});
    return arr.slice(0,3);
  }

  // Helper: kies dichtstbijzijnde wayId uit een toegestane set
  function pickWithin(allowedSet) {
    var bestId=null, bestC=null;
    var keys = Object.keys(bestPerWay);
    for (var k=0;k<keys.length;k++) {
      if (!allowedSet[keys[k]]) continue;
      var c = bestPerWay[keys[k]];
      if (!bestC || c.d < bestC.d) { bestC=c; bestId=keys[k]; }
    }
    return bestId ? {info:bestC, wayId:bestId} : null;
  }

  // Helper: bouw return-object en update anker-state
  function buildResult(chosen) {
    var s = chosen.info.seg;
    var snapM = s.cumStart + chosen.info.t * s.edgeLen;
    var segIdx = (s.nSeg <= 1 || s.segLen === 0)
               ? 0
               : Math.min(s.nSeg - 1, Math.floor(snapM / s.segLen));
    var cos=Math.cos(snap.cacheLat*Math.PI/180);
    snap.anchorWayId  = chosen.wayId;
    snap.anchorSegIdx = segIdx;
    return {
      lat: snap.cacheLat + chosen.info.pt.y/111320,
      lon: snap.cacheLon + chosen.info.pt.x/(111320*cos),
      wayId: chosen.wayId,
      segIdx: segIdx,
      osmName: s.osmName,
      snapM: snapM   // v2.17: positie langs de link, input voor de stall-detector
    };
  }

  // Resultaat-variabelen voor de trace
  var result = null, snapPath = '', dAnchorTrace = null, dChosenTrace = null;

  // Stap 2: keuze op basis van anker-state
  // 2a: geen anker → globaal dichtstbijzijnde (initialisatie)
  if (snap.anchorWayId === null) {
    var all = {};
    var akeys = Object.keys(bestPerWay);
    for (var ak=0;ak<akeys.length;ak++) all[akeys[ak]] = true;
    var chosen = pickWithin(all);
    if (chosen) {
      snapPath = 'bootstrap';
      dChosenTrace = chosen.info.d;
      snap.challenger = null;
      result = buildResult(chosen);
    } else {
      snapPath = 'null_no_candidate';
    }
  } else {
    // 2b-pre: anker écht ver weg (> SNAP_RESET_M)?
    // Voorheen werd dit gemist als depth-1 toevallig een dichtbije buur vond:
    // een d1-wissel maskeerde dan dat de teller fysiek lang weg is van de
    // anker-way. Direct resetten geeft een schone bootstrap.
    var preAnchorD = snapDistanceToWay(p, snap.anchorWayId);
    if (preAnchorD > SNAP_RESET_M) {
      snap.anchorWayId  = null;
      snap.anchorSegIdx = 0;
      snap.challenger   = null;
      var preAll = {};
      var prekeys = Object.keys(bestPerWay);
      for (var pk=0;pk<prekeys.length;pk++) preAll[prekeys[pk]] = true;
      var preChosen = pickWithin(preAll);
      if (preChosen) {
        snapPath = 'reset';
        dChosenTrace = preChosen.info.d;
        result = buildResult(preChosen);
      } else {
        snapPath = 'reset_no_candidate';
      }
    } else {
    // 2b: anker bestaat → depth-1 (anker + directe buren) met hysterese + debounce
    var depth1Set = snapAdjacencySet(snap.anchorWayId, 1);
    var chosen1   = pickWithin(depth1Set);
    if (chosen1) {
      var anchorCand = bestPerWay[snap.anchorWayId];
      if (chosen1.wayId === snap.anchorWayId) {
        // Anker is zelf de dichtste → geen uitdager
        snap.challenger = null;
        snapPath = 'd1';
        dChosenTrace = chosen1.info.d;
        result = buildResult(chosen1);
      } else {
        // Een buur is het dichtst binnen depth-1
        var d_other = chosen1.info.d;
        var holdOnAnchor = false;
        if (anchorCand) {
          var d_anchor = anchorCand.d;
          dAnchorTrace = d_anchor;
          // Glijdende drempel: dichtbij anker volstaat 5m verschil, ver weg moet
          // het verschil substantieel zijn (30% van d_anchor). Boven
          // ANCHOR_PREFER_M vervalt de voorkeur volledig.
          var threshold = Math.max(HYSTERESIS_M, d_anchor * HYSTERESIS_RATIO);
          if (d_anchor <= ANCHOR_PREFER_M && (d_anchor - d_other) < threshold) {
            holdOnAnchor = true;  // buur niet substantieel beter
          }
        }
        if (holdOnAnchor) {
          // Vasthouden op anker; uitdager vervalt
          snap.challenger = null;
          snapPath = 'd1_hold';
          dChosenTrace = anchorCand.d;
          result = buildResult({info: anchorCand, wayId: snap.anchorWayId});
        } else {
          // Buur is substantieel dichterbij → confirmatie-debounce vóór omklap.
          // Eén jitter-fix laat de count niet vollopen; bij echte verplaatsing
          // klapt het anker na SWITCH_CONFIRM opeenvolgende fixes om.
          if (snap.challenger && snap.challenger.wayId === chosen1.wayId) {
            snap.challenger.count++;
          } else {
            snap.challenger = { wayId: chosen1.wayId, count: 1 };
          }
          dChosenTrace = d_other;
          if (snap.challenger.count >= SWITCH_CONFIRM) {
            // Bevestigd → omklap
            snap.challenger = null;
            snapPath = 'd1_switch';
            result = buildResult(chosen1);
          } else if (anchorCand) {
            // Nog niet bevestigd → blijf op anker (debounce)
            snapPath = 'd1_pending';
            result = buildResult({info: anchorCand, wayId: snap.anchorWayId});
          } else {
            // Randgeval: anker niet binnen SNAP_MAX_M maar nog niet ge-reset →
            // klap toch om (er is geen anker-punt om op te blijven)
            snap.challenger = null;
            snapPath = 'd1_switch_noanchor';
            result = buildResult(chosen1);
          }
        }
      }
    } else {
      // 2c: depth-2 (genuine sprong over een korte tussen-way; debounce n.v.t.)
      var chosen2 = pickWithin(snapAdjacencySet(snap.anchorWayId, 2));
      if (chosen2) {
        snapPath = 'd2';
        dChosenTrace = chosen2.info.d;
        snap.challenger = null;
        result = buildResult(chosen2);
      } else {
        // 2d/2e: geen verbonden kandidaat. Anker écht te ver weg?
        var anchorD = snapDistanceToWay(p, snap.anchorWayId);
        dAnchorTrace = anchorD;
        if (anchorD > SNAP_RESET_M) {
          snap.anchorWayId  = null;
          snap.anchorSegIdx = 0;
          snap.challenger   = null;
          var all2 = {};
          var bkeys = Object.keys(bestPerWay);
          for (var bk=0;bk<bkeys.length;bk++) all2[bkeys[bk]] = true;
          var chosen3 = pickWithin(all2);
          if (chosen3) {
            snapPath = 'reset';
            dChosenTrace = chosen3.info.d;
            result = buildResult(chosen3);
          } else {
            snapPath = 'reset_no_candidate';
          }
        } else {
          // Glitch hold: anker behouden, geen verse snap
          snapPath = 'glitch_hold';
        }
      }
    }
    }  // einde van pre-reset else-tak
  }

  // ── Zekerheid bijwerken (alleen op GPS-fixes; taps erven snapConf*) ──────────
  var chosenWay = result ? result.wayId : null;
  if (eventInfo && eventInfo.type === 'gps') {
    var chosenD  = (chosenWay && bestPerWay[chosenWay]) ? bestPerWay[chosenWay].d
                 : (result ? snapDistanceToWay(p, chosenWay) : null);
    var pending  = !!(snap.challenger && snap.challenger.count < SWITCH_CONFIRM);
    var conf     = snapComputeConfidence(bestPerWay, chosenWay, chosenD,
                                         eventInfo.accuracy, snapPath, pending);
    // EMA-smoothing: een enkele uitschieter trekt de stip niet meteen om
    snap.confScore = (snap.confScore === null)
                  ? conf.score
                  : (CONF_EMA * conf.score + (1 - CONF_EMA) * snap.confScore);
    snap.confLevel = (conf.level === 'red') ? 'red'
                  : (snap.confScore >= CONF_GREEN) ? 'green'
                  : (snap.confScore >= CONF_AMBER) ? 'amber' : 'red';
    snap.confName  = result ? (result.osmName || '') : '';
  }

  // Trace schrijven (alleen als event-info meegegeven)
  if (eventInfo) {
    var alts = topAlternatives(chosenWay);
    traceWrite(eventInfo, lat, lon, snapPath, anchorBefore, chosenWay, dAnchorTrace, dChosenTrace, alts);
  }

  return result;
}

// ── v2.17: stall-detector ────────────────────────────────────────────────────
// Pure tellerstap op de ~5m-routepunt-cadans (identiek aan de rig/replay):
// zelfde way ∧ stap ≥ STALL_S_MIN ∧ |ΔsnapM| < STALL_RATIO·stap → teller +1;
// anders teller = 0. Stilstand (stap < S_MIN) is geen bewijs: geen decay.
function snapStallStep(count, sameWay, stepM, dSnapAbs) {
  if (!sameWay) return 0;
  if (stepM < STALL_S_MIN) return count;
  return (dSnapAbs < STALL_RATIO * stepM) ? count + 1 : 0;
}

// Wrapper om de snap-aanroep, ná snapNearestWay op routepunt-cadans. Bij
// STALL_K opeenvolgende stalls: volledige anker-reset (hergebruik van het
// bestaande reset-pad) + herbootstrap binnen dezelfde fix. De herbootstrap mag
// dezelfde way herkiezen — dan vuurt de detector desnoods opnieuw; de trace
// maakt dat zichtbaar (snap_path 'stall_reset', anchor_before → chosen_way).
function snapStallCheck(lat, lon, res, stepM, evt) {
  if (!res) { snap.stallCount = 0; snap.stallPrev = null; return res; }
  var sameWay = !!(snap.stallPrev && snap.stallPrev.wayId === res.wayId);
  var dAbs = sameWay ? Math.abs(res.snapM - snap.stallPrev.snapM) : 0;
  snap.stallCount = snapStallStep(snap.stallCount, sameWay, stepM, dAbs);
  if (snap.stallCount >= STALL_K) {
    var oldWay = res.wayId;
    snap.anchorWayId = null; snap.anchorSegIdx = 0; snap.challenger = null;
    snap.stallCount = 0; snap.stallPrev = null;
    var res2 = snapNearestWay(lat, lon, null);  // herbootstrap, eigen trace hieronder
    traceWrite({ type:'stall', tijdstip:(evt && evt.tijdstip) || nowIso(),
                 accuracy:(evt && evt.accuracy != null) ? evt.accuracy : '' },
               lat, lon, 'stall_reset', oldWay, res2 ? res2.wayId : null,
               null, null, []);
    if (res2) res = res2;
  }
  snap.stallPrev = { wayId: res.wayId, snapM: res.snapM };
  return res;
}

// Schrijf één regel naar de snap-trace. anchor_after = snap.anchorWayId nú,
// na alle eventuele wijzigingen in deze snap-aanroep.
function traceWrite(evt, lat, lon, snapPath, anchorBefore, chosenWay, dAnchor, dChosen, alts) {
  snap.traceSeq++;
  // Vangnet (v2.71): een fout hier breekt de GPS-callback af en kost dan
  // routepunten. Een ontbrekende alternatievenlijst mag nooit veldgegevens kosten.
  alts = alts || [];
  var altStr = alts.map(function(a){ return a.wayId + ':' + a.d.toFixed(1); }).join('|');
  snap.trace.push({
    seq:            snap.traceSeq,
    tijdstip:       evt.tijdstip,
    event:          evt.type,
    lat:            lat.toFixed(6),
    lon:            lon.toFixed(6),
    accuracy:       evt.accuracy != null ? evt.accuracy : '',
    anchor_before:  anchorBefore != null ? anchorBefore : '',
    snap_path:      snapPath,
    chosen_way:     chosenWay != null ? chosenWay : '',
    d_anchor:       dAnchor != null ? dAnchor.toFixed(1) : '',
    d_chosen:       dChosen != null ? dChosen.toFixed(1) : '',
    alternatives:   altStr,
    anchor_after:   snap.anchorWayId != null ? snap.anchorWayId : '',
    tap_nr:         evt.tap_nr != null ? evt.tap_nr : '',
    conf:           (snap.confScore === null) ? "" : snap.confScore.toFixed(2),
    conf_level:     snap.confLevel,
    gps_stab:       (snap.gpsStabScore === null) ? "" : snap.gpsStabScore.toFixed(2),
    gps_level:      snap.gpsStabLevel
  });
}

// Compacte trace-regel voor fetch-lifecycle-events (fail/stale/giveup) —
// v2.17: mislukkingen waren voorheen volledig stil (autorit 13 juli: ~80
// stille misses onvindbaar in de export). snap_path draagt de details.
function traceFetchEvent(event, lat, lon, detail) {
  snap.traceSeq++;
  snap.trace.push({
    seq: snap.traceSeq, tijdstip: new Date().toISOString().slice(0,19),
    event: event, lat: lat.toFixed(7), lon: lon.toFixed(7), accuracy: '',
    anchor_before: snap.anchorWayId||'', snap_path: detail,
    chosen_way: '', d_anchor: '', d_chosen: '', alternatives: '',
    anchor_after: snap.anchorWayId||'', tap_nr: '',
    conf: (snap.confScore === null) ? "" : snap.confScore.toFixed(2),
    conf_level: snap.confLevel,
    gps_stab: (snap.gpsStabScore === null) ? "" : snap.gpsStabScore.toFixed(2),
    gps_level: snap.gpsStabLevel
  });
}

// v2.49: een verse aanvraag begint hier, niet in snapFetchNetwork. De poort
// (in-flight guard, cooldown, fid) is hierheen verhuisd omdat er vóór het
// eerste verzoek nog een goedkopere bron is: de gedeelde tegel-cache. Een
// treffer kost nul verzoeken en nul wachttijd. leesTegels geeft een lijst bij
// volledige dekking (ook een lege lijst — dan weten we dat hier geen wegen
// liggen) en null bij een misser.
function snapStartFetch(lat, lon) {
  if (snap.fetchInFlight) return;                 // één fetch tegelijk
  if (Date.now() < snap.fetchCooldownUntil) return; // nog in cooldown na fout
  snap.fetchInFlight = true;
  var fid = ++snap.fetchSeq;                      // v2.17: id per logische aanvraag
  leesTegels(lat, lon, SNAP_ROAD_FETCH_RADIUS).then(function(ways) {
    if (ways) {
      traceFetchEvent('tegelcache', lat, lon, 'fid:'+fid+'|n_ways:'+ways.length);
      snapVerwerkNetwerk(ways, lat, lon, fid, 'tegel');
      return;
    }
    snapFetchNetwork(lat, lon, 0, fid);
  }, function() { snapFetchNetwork(lat, lon, 0, fid); });
}

// v2.49: het tóépassen van een netwerk zit in één functie, want het komt sinds
// deze versie uit twee bronnen — een verse Overpass-fetch of de tegel-cache.
// 'bron' belandt in snap_path, zodat snap_trace.csv laat zien waar het vandaan
// kwam. Alle v2.17/v2.18-garanties (volgorde-guard, guard vrijgeven, backoff-
// teller) blijven ongewijzigd en gelden nu ook voor de cache-route.
function snapVerwerkNetwerk(elements, lat, lon, fid, bron) {
  // v2.17 volgorde-guard: is er intussen een níéuwere fetch toegepast, dan
  // is deze respons verouderd — cacheLat/Lon en segs niet overschrijven.
  if (fid <= snap.fetchApplied) {
    traceFetchEvent('fetch_stale', lat, lon, 'fid:'+fid+'|applied:'+snap.fetchApplied);
    snap.fetchInFlight = false;   // v2.18: verouderde respons, maar guard wel vrij
    return;
  }
  snap.fetchApplied = fid;
  // v2.18: geslaagd — guard vrij, backoff-teller terug naar nul.
  snap.fetchInFlight = false;
  snap.fetchFailStreak = 0;
  snap.fetchCooldownUntil = 0;
  snap.cacheLat=lat; snap.cacheLon=lon;
  // Stap 1 — accumuleer het nieuwe netwerk in snap.elements + adjacency ZODAT de
  // segs-herbouw hieronder de nieuwe ways al meeneemt. (Volgorde t.o.v. <2.8:
  // dit blok stond na de segs-bouw; nu ervóór.)
  elements.forEach(function(el) {
    if (el.type!=='way'||!el.geometry||el.geometry.length<2) return;
    snapRegisterWay(el);  // adjacency cumulatief bijwerken
    if (!snap.elements[String(el.id)]) {
      snap.elements[String(el.id)] = {
        highway: (el.tags&&el.tags.highway)||'',
        osmName: (el.tags&&el.tags.name)||'',
        geometry: el.geometry
      };
    }
  });
  // Stap 2 — herbouw snap.segs uit het CUMULATIEVE netwerk (niet alleen deze
  // fetch), beperkt tot SNAP_SEGS_RADIUS rond de huidige positie. snapBuildSegs
  // herprojecteert alles tegen (lat,lon) → geen frame-menging. Hiermee verliest
  // een way die net buiten de verse 250m-cirkel valt z'n snap-kandidatuur niet.
  var segElems = snapElementsNear(lat, lon);
  snap.segs = snapBuildSegs(segElems, lat, lon);
  // Log het event in snap_trace zodat de segs-herbouw traceerbaar is.
  // bron   = fetch | tegel | leeg
  // n_el   = ways uit deze bron
  // n_kept = cumulatieve ways binnen SNAP_SEGS_RADIUS (input voor segs)
  // n_segs = resulterende segmenten
  snap.traceSeq++;
  snap.trace.push({
    seq:            snap.traceSeq,
    tijdstip:       new Date().toISOString().slice(0,19),
    event:          'fetch',
    lat:            lat.toFixed(7),
    lon:            lon.toFixed(7),
    accuracy:       '',
    anchor_before:  snap.anchorWayId||'',
    snap_path:      'bron:'+bron+'|n_el:'+elements.length+'|n_kept:'+segElems.length+'|n_segs:'+snap.segs.length,
    chosen_way:     '',
    d_anchor:       '',
    d_chosen:       '',
    alternatives:   '',
    anchor_after:   snap.anchorWayId||'',
    tap_nr:         '',
    conf:           (snap.confScore === null) ? "" : snap.confScore.toFixed(2),
    conf_level:     snap.confLevel,
    gps_stab:       (snap.gpsStabScore === null) ? "" : snap.gpsStabScore.toFixed(2),
    gps_level:      snap.gpsStabLevel
  });
  snap.ready=true;
  // Retro-snap tikken die wachtten op het netwerk: dichtstbijzijnde way op
  // hun eigen historische positie (read-only, muteert het anker niet).
  if (snap.pendingQueue.length) {
    snap.pendingQueue.forEach(function(entry) {
      if (entry.lat===null) return;
      var s = snapNearestAny(entry.lat, entry.lon);
      if (s) { entry.wayId = s.wayId; entry.segIdx = s.segIdx; entry.osmName = s.osmName; }
      traceWrite({type:'tap_retro', tijdstip:entry.ts}, entry.lat, entry.lon,
                 s ? 'retro_nearest' : 'no_candidate', snap.anchorWayId, s?s.wayId:null, null, s?s.d:null, []);
    });
    snap.pendingQueue = [];
  }
}

function snapFetchNetwork(lat, lon, attempt, fid) {
  if (attempt===undefined) attempt=0;
  // v2.49: een aanroep zónder fid is een verse aanvraag en hoort via
  // snapStartFetch te lopen (eerst de tegel-cache, dan pas Overpass).
  if (fid===undefined) { snapStartFetch(lat, lon); return; }
  if (attempt>=SNAP_OVERPASS.length*2) {
    snap.fetchInFlight = false;
    snap.fetchFailStreak++;
    // v2.18: zolang er nog NOOIT een netwerk binnenkwam (cacheLat===null) is dit
    // fataal — zonder netwerk snapt niets. Dan NIET opgeven maar blijven proberen
    // met oplopende backoff (tot 8s). Pas als er ooit een netwerk was, geldt de
    // normale giveup: een mislukte refresh is dan niet fataal (oud netwerk blijft).
    if (snap.cacheLat===null) {
      traceFetchEvent('fetch_retry_first', lat, lon, 'fid:'+fid+'|streak:'+snap.fetchFailStreak);
      setTimeout(function(){ snapStartFetch(lat,lon); }, snapBackoffMs(snap.fetchFailStreak));
      return;
    }
    traceFetchEvent('fetch_giveup', lat, lon, 'fid:'+fid+'|attempts:'+attempt);
    snap.fetchCooldownUntil = Date.now() + snapBackoffMs(snap.fetchFailStreak);
    return;
  }
  var epIdx=attempt%SNAP_OVERPASS.length;
  // body geom: levert tags + node-IDs (el.nodes) + geometrie. Node-IDs zijn nodig
  // voor adjacency-detectie (twee ways grenzen aan elkaar via gedeelde node-ID).
  var query='[out:json][timeout:8];('
            +'way["highway"~"'+HIGHWAY_RE+'"]["area"!="yes"](around:'+SNAP_ROAD_FETCH_RADIUS+','+lat.toFixed(6)+','+lon.toFixed(6)+');'
            +'way["tunnel"="building_passage"](around:'+SNAP_ROAD_FETCH_RADIUS+','+lat.toFixed(6)+','+lon.toFixed(6)+');'
            +');out body geom;';
  fetch(SNAP_OVERPASS[epIdx]+'?data='+encodeURIComponent(query))
    .then(function(r){ return r.ok?r.json():Promise.reject(ovpStatusUitHttp(r.status)); })
    .then(function(data) {
      var uitkomst = ovpKeur(data);
      if (uitkomst === OVP_LEEG) {
        // v2.49: geldig antwoord — hier liggen geen wegen (polder, haven, water).
        // Vóór v2.49 ging dit door de catch, en zolang er nog nóóit een netwerk
        // was gerapporteerd bleef de 'fataal'-tak hierboven eindeloos doorvragen.
        // Nu accepteren we het lege netwerk: cacheLat komt te staan, en de
        // afstandspoort in snapCheckRefresh houdt z'n mond tot we verder zijn.
        traceFetchEvent('fetch_leeg', lat, lon, 'fid:'+fid+'|ep:'+epIdx);
        snapVerwerkNetwerk([], lat, lon, fid, 'leeg');
        return;
      }
      if (uitkomst !== OVP_OK) return Promise.reject(uitkomst);
      cacheWaysInTiles(data.elements, lat, lon, SNAP_ROAD_FETCH_RADIUS);   // deel met de reconstructor
      snapVerwerkNetwerk(data.elements, lat, lon, fid, 'fetch');
    })
    .catch(function(err){
      // v2.17: elke mislukte poging zichtbaar in de trace (was volledig stil).
      traceFetchEvent('fetch_fail', lat, lon,
        'fid:'+fid+'|ep:'+epIdx+'|attempt:'+attempt+'|err:'+String(err).slice(0,60));
      if (err === OVP_LIMIET) {
        // v2.49: de server wijst ons af of zit vol. Niet meteen de andere mirror
        // erbij halen — Overpass voert de query eerst uit en meldt de limiet
        // daarna, dus een geweigerd verzoek kost net zoveel als een geslaagd.
        snap.fetchInFlight = false;
        snap.fetchFailStreak++;
        snap.fetchCooldownUntil = Date.now() + OVP_LIMIET_WACHT_MS;
        return;
      }
      if (err === OVP_OUD && attempt + 1 >= SNAP_OVERPASS.length && snap.cacheLat !== null) {
        // v2.49: álle mirrors lopen achter op OSM. Dat lost zich niet op in
        // seconden. We hebben al een werkend netwerk, dus lang wachten mag.
        // Zónder netwerk (cacheLat===null) geldt de fataal-regel van v2.18 en
        // blijven we het gewoon proberen — verouderd nieuws is dan beter dan niets.
        snap.fetchInFlight = false;
        snap.fetchFailStreak++;
        snap.fetchCooldownUntil = Date.now() + OVP_OUD_WACHT_MS;
        return;
      }
      // v2.18: wacht vóór de volgende poging (exponentieel) i.p.v. onmiddellijk
      // opnieuw vuren. De in-flight guard blijft aan: dit is dezelfde logische
      // aanvraag die z'n volgende poging afwacht.
      setTimeout(function(){ snapFetchNetwork(lat,lon,attempt+1,fid); },
                 snapBackoffMs(attempt+1));
    });
}

// v2.18: exponentiële backoff met plafond. 500·2^(n-1), gemaximeerd op 8s, zodat
// een aanhoudend onbereikbaar netwerk de tool niet laat malen maar ook niet te
// lang blind blijft zodra de dekking terugkeert.
// v2.49: de formule zelf staat nu in het gedeelde Overpass-blok (ovpBackoffMs),
// zodat pocket en de parkeer-apps niet uit elkaar kunnen lopen.
function snapBackoffMs(n) {
  return ovpBackoffMs(n);
}

var _snapRefreshTimer = null;
function snapCheckRefresh(lat, lon) {
  if (snap.cacheLat===null) {
    // v2.18: eerste netwerk nog niet binnen. snapFetchNetwork weigert zelf nieuwe
    // aanvragen tijdens in-flight of cooldown, dus deze poort veroorzaakt geen
    // storm meer. We debouncen 'm bovendien, zodat een tros GPS-fixes samenvalt
    // tot één poging i.p.v. één per fix.
    if (snap.fetchInFlight || Date.now() < snap.fetchCooldownUntil) return;
    if (_snapRefreshTimer) clearTimeout(_snapRefreshTimer);
    _snapRefreshTimer = setTimeout(function(){ snapStartFetch(lat,lon); }, 600);
    return;
  }
  var cos=Math.cos(snap.cacheLat*Math.PI/180);
  var dx=(lon-snap.cacheLon)*111320*cos, dy=(lat-snap.cacheLat)*111320;
  if (Math.sqrt(dx*dx+dy*dy) > SNAP_ROAD_FETCH_RADIUS*0.6) {
    if (_snapRefreshTimer) clearTimeout(_snapRefreshTimer);
    _snapRefreshTimer = setTimeout(function(){ snapStartFetch(lat,lon); }, 600);
  }
}
// ── EINDE SNAP MODULE ─────────────────────────────────────────────────────────

// Sessieherstel (v2.11): veiligheids-opslag bij scherm-uit/wegnavigeren.
document.addEventListener('visibilitychange', function(){ if (document.hidden) saveSession(); });
window.addEventListener('pagehide', saveSession);

// Opstarten (v2.69): pas als de hele pagina er staat. Tot v2.69 stonden
// applyLang() en restoreSession() hier los in het script. Maar het
// voorbeeldscherm (#preview-title e.a.) staat pas NA dit script in de HTML;
// applyLang() liep daarop vast, het script stopte, en restoreSession() werd
// nooit bereikt. Een onderbroken telling werd dus nooit teruggeboden, en bij
// de volgende start stil gewist (start* roept clearSession() aan).
document.addEventListener('DOMContentLoaded', function () {
  // Pas de taal toe zodat het vertaalsysteem de enige bron van waarheid is
  // (ook de HTML-defaults lopen er dan doorheen).
  applyLang();
  // Een eventuele niet-afgeronde telling terugbieden.
  restoreSession();
});

// Directe ingang (v2.69, v2.70): de voorpagina linkt naar pocket_count.html#parkeren.
// Via deze ingang is pocket een parkeer-app; het keuzemenu met de vier modi
// verschijnt nooit (klasse .pk-ingang in <head> + pkDirect hieronder):
//   - niets te herstellen: meteen het parkeerscherm;
//   - een onderbroken telling: de herstelmelding met alleen de Parkeren-knop.
//     Eerst herstellen, dan pas starten, want startParkeren() wist de
//     noodopslag. Na Verwijder of na het voorbeeldscherm door naar parkeren;
//   - Terug op het parkeerscherm: naar de voorpagina;
//   - na Stop en het voorbeeldscherm: een verse parkeertelling.
// Deze listener staat NA die van het opstarten hierboven; listeners draaien in
// volgorde, dus restoreSession() heeft dan al beslist of de melding er staat.
// De hash blijft in de adresbalk, zodat je deze ingang als eigen icoon op het
// beginscherm kunt zetten.
var pkDirect = false;
function directeModus(hash, herstelOpen) {
  if (hash !== '#parkeren') return null;
  return herstelOpen ? 'herstel' : 'parkeren';
}
document.addEventListener('DOMContentLoaded', function () {
  var herstelOpen = document.getElementById('restore-banner').style.display !== 'none';
  var ingang = directeModus(location.hash, herstelOpen);
  if (!ingang) return;
  pkDirect = true;
  if (ingang === 'herstel') return;   // melding + alleen de Parkeren-knop (CSS)
  startParkeren();
  // Zonder tik vooraf kan de browser het scherm-aan-verzoek weigeren. De eerste
  // aanraking telt als gebaar en vraagt het dan opnieuw.
  document.addEventListener('pointerdown', function eenmalig() {
    document.removeEventListener('pointerdown', eenmalig);
    if (!wakeLock) acquireWakeLock();
  });
});
