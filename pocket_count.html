<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pocket Count</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --font: 'Oswald', sans-serif;
    --c-car:   #c0392b;
    --c-bike:  #2980b9;
    --c-ped:   #8e44ad;
  }

  body {
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
    background: #111;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Keuze-scherm ── */
  #choose-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: #1a1918;
    padding: 24px 20px;
  }

  #choose-screen h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 28px;
  }

  .type-btns {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .type-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.1s, filter 0.1s;
  }
  .type-btn:active { transform: scale(0.97); filter: brightness(0.85); }

  .type-btn .icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
  .type-btn .lbl  {
    font-family: var(--font);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  /* ── Tel-scherm ── */
  #count-screen {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    cursor: pointer;
  }

  #count-screen.active { display: flex; }

  #big-count {
    font-size: 38vw;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  #type-label {
    font-size: 5vw;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-top: 8px;
    pointer-events: none;
  }

  /* ── Zekerheidsindicator: stip + huidige OSM-straatnaam ── */
  #snap-conf {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    max-width: 80vw;
    pointer-events: none;
  }
  #snap-dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #888;            /* default/none */
    flex: none;
    box-shadow: 0 0 8px rgba(0,0,0,0.35);
    transition: background 0.4s ease;
  }
  #snap-dot.green { background: rgb(0,220,0); }
  #snap-dot.amber { background: rgb(255,200,0); }
  #snap-dot.red   { background: rgb(255,60,0); }
  #snap-name {
    font-size: 4vw;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Flash on tap */
  #count-screen.flash { filter: brightness(1.7); }

  /* Shake on undo */
  @keyframes shake {
    0%   { transform: scale(0.96); }
    50%  { transform: scale(1.02); }
    100% { transform: scale(1.00); }
  }
  #count-screen.shake { animation: shake 0.18s ease; }

  /* ── Undo balk ── */
  #undo-bar {
    position: fixed;
    top: 20px; left: 20px;
    height: 40px;
    width: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
  }
  #undo-fill {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,0.5);
  }
  #undo-lbl {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }

  /* ── Stop-knop ── */
  #btn-stop {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.6);
    font-family: var(--font);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
    white-space: nowrap;
  }
  #btn-stop:active { background: rgba(0,0,0,0.7); }

  /* ── Terug-knop keuze ── */
  #btn-back {
    position: fixed;
    top: 20px; right: 20px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.45);
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
  }
  /* ── Preview overlay ── */
  #preview-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.88);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #preview-overlay.visible { display: flex; }
  #preview-header {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  #preview-title {
    font-family: var(--font);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(240,240,236,0.6);
  }
  #preview-close {
    background: none;
    border: none;
    color: rgba(240,240,236,0.45);
    font-family: var(--font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 0;
    touch-action: manipulation;
  }
  #preview-canvas {
    width: 100%;
    max-width: 420px;
    border-radius: 6px;
    background: #f0f0ec;
    display: block;
  }
  #preview-stats {
    width: 100%;
    max-width: 420px;
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pstat {
    background: rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 10px 14px;
    flex: 1;
    min-width: 90px;
  }
  .pstat-val {
    font-family: var(--font);
    font-size: 1.5rem;
    font-weight: 700;
    color: #f0f0ec;
    line-height: 1;
  }
  .pstat-lbl {
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(240,240,236,0.4);
    margin-top: 4px;
  }
  #preview-legend {
    width: 100%;
    max-width: 420px;
    margin-top: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .pleg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(240,240,236,0.45);
  }
  .pleg-swatch { width: 20px; height: 4px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- Keuze-scherm -->
<div id="choose-screen">
  <h1>Wat tel je?</h1>
  <div class="type-btns">
    <button class="type-btn" style="background:var(--c-car)"   onclick="startTelling('car',  '&#x1F697;', 'Auto')">
      <span class="icon">&#x1F697;</span><span class="lbl">Auto</span>
    </button>
    <button class="type-btn" style="background:var(--c-bike)"  onclick="startTelling('bike', '&#x1F6B2;', 'Fiets')">
      <span class="icon">&#x1F6B2;</span><span class="lbl">Fiets</span>
    </button>
    <button class="type-btn" style="background:var(--c-ped)"   onclick="startTelling('ped',  '&#x1F6B6;', 'Voetganger')">
      <span class="icon">&#x1F6B6;</span><span class="lbl">Voetganger</span>
    </button>
    <button class="type-btn" style="background:#555"            onclick="chooseOther()">
      <span class="icon">&#x2753;</span><span class="lbl">Iets Anders</span>
    </button>

    <!-- Iets Anders invoer -->
    <div id="other-row" style="display:none; flex-direction:column; gap:8px;">
      <input id="other-input" type="text" placeholder="Wat tel je?"
        style="width:100%;padding:14px 16px;font-family:var(--font);font-size:1rem;font-weight:600;
               border:none;border-radius:6px;background:#333;color:#fff;outline:none;
               letter-spacing:1px;"
        oninput="updateOtherBtn()"
        onkeydown="if(event.key==='Enter') confirmOther()">
      <button id="other-confirm" onclick="confirmOther()"
        style="width:100%;padding:14px;background:#555;border:none;border-radius:6px;
               font-family:var(--font);font-size:0.85rem;font-weight:700;letter-spacing:2px;
               text-transform:uppercase;color:rgba(255,255,255,0.4);cursor:pointer;"
        disabled>
        &#9654; Start
      </button>
    </div>
  </div>
</div>

<!-- Tel-scherm -->
<div id="count-screen">
  <div id="big-count">0</div>
  <div id="type-label"></div>
  <div id="snap-conf"><span id="snap-dot"></span><span id="snap-name">—</span></div>
</div>

<div id="undo-bar"><div id="undo-fill"></div><div id="undo-lbl">Undo</div></div>
<button id="btn-stop" style="display:none" onclick="stopTelling()">&#9632; Stop &amp; Download</button>
<button id="btn-back" style="display:none" onclick="backToChoose()">&#8592; Terug</button>

<script>
var telType     = null;
var telLabel    = null;
var telIcon     = null;
var telCount    = 0;
var telHistory  = [];   // [{ts, lat, lon}]
var startTime   = null;
var holdTimer   = null;
var holdStart   = null;
var wakeLock    = null;
var watching    = null;
var lastLat     = null, lastLon = null;
var routeLog    = [];   // [{ts, lat, lon, acc, wayId, osmName}]
var lastRouteLat = null, lastRouteLon = null;
var ROUTE_MIN_DIST = 5; // meter
var HOLD_MS     = 600;

function pad(n){ return String(n).padStart(2,'0'); }

function nowIso() {
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
    +'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function fmtDate(d) {
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function fmtTime(d) {
  return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function genSid() {
  var d = new Date();
  var chars = 'abcdefghijklmnopqrstuvwxyz';
  var rnd = [0,1,2].map(function(){ return chars[Math.floor(Math.random()*26)]; }).join('');
  return pad(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate())
    +'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())
    +'_'+rnd;
}

// ── GPS ──────────────────────────────────────────────────────────────────────
function startGps() {
  if (!navigator.geolocation) return;
  watching = navigator.geolocation.watchPosition(    function(pos) {
      lastLat = pos.coords.latitude;
      lastLon = pos.coords.longitude;
      var acc = Math.round(pos.coords.accuracy || 0);
      snapCheckRefresh(lastLat, lastLon);
      // Huidige snap bepalen (kan null zijn als netwerk nog niet geladen is)
      var snapNow = snapNearestWay(lastLat, lastLon, {type:'gps', tijdstip:nowIso(), accuracy:acc});
      renderSnapConf();
      var widNow  = snapNow ? snapNow.wayId   : '';
      var nameNow = snapNow ? snapNow.osmName : '';
      var segNow  = snapNow ? snapNow.segIdx  : 0;
      // Route-punt opslaan bij voldoende verplaatsing
      if (lastRouteLat === null) {
        lastRouteLat = lastLat; lastRouteLon = lastLon;
        routeLog.push({ ts: nowIso(), lat: lastLat, lon: lastLon, acc: acc, wayId: widNow, segIdx: segNow, osmName: nameNow });
      } else {
        var cos = Math.cos(lastRouteLat * Math.PI / 180);
        var dx = (lastLon - lastRouteLon) * 111320 * cos;
        var dy = (lastLat - lastRouteLat) * 111320;
        if (Math.sqrt(dx*dx + dy*dy) >= ROUTE_MIN_DIST) {
          routeLog.push({ ts: nowIso(), lat: lastLat, lon: lastLon, acc: acc, wayId: widNow, segIdx: segNow, osmName: nameNow });
          lastRouteLat = lastLat; lastRouteLon = lastLon;
        }
      }
    },
    function(){},
    { enableHighAccuracy: true, maximumAge: 3000 }
  );
}

function stopGps() {
  if (watching !== null) { navigator.geolocation.clearWatch(watching); watching = null; }
}

// ── Wake Lock ─────────────────────────────────────────────────────────────────
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

// ── Scherm-beheer ─────────────────────────────────────────────────────────────
function chooseOther() {
  var row = document.getElementById('other-row');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
  if (row.style.display === 'flex') {
    setTimeout(function(){ document.getElementById('other-input').focus(); }, 80);
  }
}

function updateOtherBtn() {
  var val = document.getElementById('other-input').value.trim();
  var btn = document.getElementById('other-confirm');
  btn.disabled = !val;
  btn.style.background = val ? '#333' : '#555';
  btn.style.color = val ? '#fff' : 'rgba(255,255,255,0.4)';
}

function confirmOther() {
  var val = document.getElementById('other-input').value.trim();
  if (!val) return;
  document.getElementById('other-row').style.display = 'none';
  document.getElementById('other-input').value = '';
  updateOtherBtn();
  startTelling('other', '❓', val);
}

function startTelling(type, icon, label) {
  telType    = type;
  telLabel   = label;
  telIcon    = icon;
  telCount    = 0;
  telHistory  = [];
  snapElements = {};
  routeLog    = [];
  lastRouteLat = null; lastRouteLon = null;
  startTime  = new Date();

  var color = getComputedStyle(document.documentElement).getPropertyValue('--c-' + type).trim();
  var screen = document.getElementById('count-screen');
  screen.style.background = color;
  screen.classList.add('active');
  document.getElementById('big-count').textContent = '0';
  document.getElementById('type-label').textContent = label;
  snapConfScore = null; snapConfLevel = 'none'; snapConfName = '';
  renderSnapConf();
  document.getElementById('choose-screen').style.display = 'none';
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('btn-back').style.display = '';

  // Touch handlers
  screen.ontouchstart = function(e){ e.preventDefault(); startHold(); };
  screen.ontouchend   = function(e){ e.preventDefault(); endHold(); };
  screen.ontouchcancel= function(){ cancelHold(); };
  screen.onmousedown  = function(){ startHold(); };
  screen.onmouseup    = function(){ endHold(); };

  acquireWakeLock();
  startGps();
}

function backToChoose() {
  if (telCount > 0 && !confirm('Weet je zeker? De telling (' + telCount + ') gaat verloren.')) return;
  closeTelScreen();
  document.getElementById('choose-screen').style.display = '';
}

function closeTelScreen() {
  var screen = document.getElementById('count-screen');
  screen.classList.remove('active');
  screen.ontouchstart = screen.ontouchend = screen.ontouchcancel = null;
  screen.onmousedown  = screen.onmouseup  = null;
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-back').style.display = 'none';
  releaseWakeLock();
  stopGps();
  cancelHold();
}

// ── Tellen ────────────────────────────────────────────────────────────────────
function startHold() {
  holdStart = Date.now();
  var bar  = document.getElementById('undo-bar');
  var fill = document.getElementById('undo-fill');
  bar.style.width = '130px';
  fill.style.transition = 'none';
  fill.style.width = '0%';
  requestAnimationFrame(function() {
    fill.style.transition = 'width ' + HOLD_MS + 'ms linear';
    fill.style.width = '100%';
  });
  holdTimer = setTimeout(doUndo, HOLD_MS);
}

function endHold() {
  var held = Date.now() - (holdStart || Date.now());
  cancelHold();
  if (held < HOLD_MS - 50) doTap();
}

function cancelHold() {
  if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
  var bar  = document.getElementById('undo-bar');
  var fill = document.getElementById('undo-fill');
  bar.style.width = '0';
  fill.style.transition = 'none';
  fill.style.width = '0%';
}

var snapPendingQueue = [];  // tikken die wachten op eerste snap-respons

function doTap() {
  telCount++;
  var tapEntry = { ts: nowIso(), lat: lastLat, lon: lastLon, wayId: '', segIdx: 0, osmName: '' };
  if (snapReady) {
    if (lastLat !== null) {
      var r = null;
      if (snapAnchorWayId !== null) {
        // Tap erft het GPS-anker — één bron van waarheid. Projecteer het huidige
        // GPS-punt loodrecht op de anker-way (read-only: muteert het anker niet).
        r = snapProjectOnto(lastLat, lastLon, snapAnchorWayId);
        if (r) {
          traceWrite({type:'tap', tijdstip:tapEntry.ts, tap_nr:telCount}, lastLat, lastLon,
                     'inherit', snapAnchorWayId, r.wayId, null, r.d, []);
        } else if (snapElements[snapAnchorWayId]) {
          // Anker-way valt buiten het huidige fetch-venster: erf metadata,
          // marker blijft op het ruwe GPS-punt.
          r = { wayId: snapAnchorWayId, segIdx: snapAnchorSegIdx,
                osmName: snapElements[snapAnchorWayId].osmName || '' };
          traceWrite({type:'tap', tijdstip:tapEntry.ts, tap_nr:telCount}, lastLat, lastLon,
                     'inherit_nogeo', snapAnchorWayId, snapAnchorWayId, null, null, []);
        }
      }
      if (!r) {
        // Cold start: nog geen anker → eenmalig dichtstbijzijnde way (read-only).
        r = snapNearestAny(lastLat, lastLon);
        traceWrite({type:'tap', tijdstip:tapEntry.ts, tap_nr:telCount}, lastLat, lastLon,
                   r ? 'tap_bootstrap' : 'no_candidate', snapAnchorWayId, r?r.wayId:null, null, r?r.d:null, []);
      }
      if (r) { tapEntry.wayId = r.wayId; tapEntry.segIdx = r.segIdx; tapEntry.osmName = r.osmName; }
    }
    // Tik erft de live zekerheid van het anker waarop hij landt (voor analyse).
    tapEntry.conf = (snapConfScore === null) ? '' : snapConfScore.toFixed(2);
    tapEntry.confLevel = snapConfLevel;
    telHistory.push(tapEntry);
  } else {
    // Snap nog niet beschikbaar — in wachtrij plaatsen
    snapPendingQueue.push(tapEntry);
    telHistory.push(tapEntry);
  }
  document.getElementById('big-count').textContent = telCount;
  if (navigator.vibrate) navigator.vibrate(25);
  var s = document.getElementById('count-screen');
  s.classList.add('flash');
  setTimeout(function(){ s.classList.remove('flash'); }, 80);
}

// Werk de zekerheidsstip + straatnaam onder de teller bij.
function renderSnapConf() {
  var dot  = document.getElementById('snap-dot');
  var name = document.getElementById('snap-name');
  if (!dot || !name) return;
  dot.className = '';
  if (snapConfLevel === 'green' || snapConfLevel === 'amber' || snapConfLevel === 'red') {
    dot.classList.add(snapConfLevel);
  }
  name.textContent = snapConfName || '—';
}

function doUndo() {
  if (telCount <= 0) { cancelHold(); return; }
  telCount--;
  telHistory.pop();
  document.getElementById('big-count').textContent = telCount;
  if (navigator.vibrate) navigator.vibrate([30,40,30]);
  var s = document.getElementById('count-screen');
  s.classList.add('shake');
  setTimeout(function(){ s.classList.remove('shake'); }, 200);
  cancelHold();
}

// ── Export ZIP ────────────────────────────────────────────────────────────────

// Knip een polyline-geometrie in segmenten van ~SEGMENT_TARGET_M.
// Geometry mag [{lat,lon},...] of [[lat,lon],...] zijn.
// Returns: array sub-polylines (elk [[lat,lon],...]) — minstens één.
function splitWayIntoSegments(geom) {
  if (!geom || geom.length < 2) return [geom ? geom.map(_normPt) : []];
  var pts = geom.map(_normPt);
  var refLat = pts[0][0];
  var cos = Math.cos(refLat * Math.PI / 180);
  // Cumulatieve afstand per knoop
  var cum = [0];
  for (var i = 1; i < pts.length; i++) {
    var dx = (pts[i][1] - pts[i-1][1]) * 111320 * cos;
    var dy = (pts[i][0] - pts[i-1][0]) * 111320;
    cum.push(cum[i-1] + Math.sqrt(dx*dx + dy*dy));
  }
  var total = cum[cum.length-1];
  if (total < SEGMENT_MIN_M) return [pts];
  var N = Math.max(1, Math.round(total / SEGMENT_TARGET_M));
  if (N === 1) return [pts];
  var segLen = total / N;
  var result = [];
  var curSeg = [pts[0]];
  var nextCut = segLen;
  var done = 0;
  for (var j = 1; j < pts.length; j++) {
    var dStart = cum[j-1], dEnd = cum[j], edge = dEnd - dStart;
    // Eén edge kan meerdere cuts bevatten als segLen < edge-lengte (zeldzaam)
    while (done < N - 1 && dEnd >= nextCut && edge > 0) {
      var t = (nextCut - dStart) / edge;
      var cutLat = pts[j-1][0] + t * (pts[j][0] - pts[j-1][0]);
      var cutLon = pts[j-1][1] + t * (pts[j][1] - pts[j-1][1]);
      curSeg.push([cutLat, cutLon]);
      result.push(curSeg);
      curSeg = [[cutLat, cutLon]];
      nextCut += segLen;
      done++;
    }
    curSeg.push(pts[j]);
  }
  result.push(curSeg);
  return result;
}

function _normPt(p) {
  return (p && p.lat !== undefined) ? [p.lat, p.lon] : p;
}

function buildNetwerkCsv(sid) {
  var lines = ['osm_way_id;segment_index;segment_count;highway;geometrie_wkt'];
  Object.keys(snapElements).forEach(function(wid) {
    var el = snapElements[wid];
    var subs = splitWayIntoSegments(el.geometry);
    subs.forEach(function(sub, idx) {
      var coords = sub.map(function(p){
        return p[1].toFixed(6)+' '+p[0].toFixed(6);
      }).join(', ');
      lines.push([wid, idx, subs.length, el.highway,
                  'LINESTRING ('+coords+')'].join(';'));
    });
  });
  return lines.join('\n');
}

// Debug-trace: één regel per GPS-fix en per tap, in chronologische volgorde.
// Per regel: ruwe positie + interne snap-state (anchor voor/na, gekozen pad,
// afstanden tot anker en gekozen way, top-3 alternatieve kandidaten).
//
// snap_path waarden:
//   bootstrap            — eerste snap van de sessie (geen anker)
//   d1                   — anker bestaat, depth-1 lookup koos een way
//   d1_hold              — hysterese: anker behouden ondanks dichterbij liggende buur
//   d2                   — depth-1 leeg, depth-2 koos een way
//   reset                — anker te ver weg, opnieuw geïnitialiseerd
//   reset_no_candidate   — reset triggerde maar er was geen alternatief in 50m
//   glitch_hold          — anker dichtbij, geen verbonden kandidaat → null gereturnd
//   null_no_candidate    — geen anker én geen kandidaat in 50m
//   no_network           — netwerk nog niet geladen
function buildSnapTraceCsv(sid) {
  var lines = ['sessie_id;seq;tijdstip;event;lat;lon;accuracy;anchor_before;snap_path;chosen_way;d_anchor;d_chosen;alternatives;anchor_after;tap_nr;conf;conf_level'];
  snapTrace.forEach(function(r) {
    lines.push([sid, r.seq, r.tijdstip, r.event, r.lat, r.lon, r.accuracy,
                r.anchor_before, r.snap_path, r.chosen_way,
                r.d_anchor, r.d_chosen, r.alternatives,
                r.anchor_after, r.tap_nr,
                r.conf != null ? r.conf : '', r.conf_level != null ? r.conf_level : ''].join(';'));
  });
  return lines.join('\n');
}

// Leidt 'visits' (aaneengesloten verblijven op één wegsegment) af uit routeLog.
// Regels:
//   - opeenvolgende routepunten met dezelfde (wayId, segIdx) vormen één visit
//   - een gat van >MAX_GAP_SEC seconden breekt een visit, ook bij gelijke key
//   - visits met <MIN_VISIT_SEC seconden of <MIN_VISIT_PTS punten worden weggefilterd
//     (vluchtige snap-flips bij kruisingen of segmentgrenzen)
// Per visit wordt geteld hoeveel tellingen erin vielen (matching op key + tijdsbereik).
function buildBezochtCsv(sid, telHist) {
  var MAX_GAP_SEC   = 30;
  var MIN_VISIT_SEC = 5;
  var MIN_VISIT_PTS = 3;

  function tsParse(s) { return new Date(s).getTime(); }
  function keyOf(wid, segIdx) { return wid + ':' + (segIdx || 0); }

  // Tellingen sorteren op timestamp voor snelle range-toewijzing
  var taps = telHist.filter(function(h){ return h.wayId; })
                    .map(function(h){ return { wid:h.wayId, segIdx:h.segIdx||0, t:tsParse(h.ts) }; })
                    .sort(function(a,b){ return a.t - b.t; });

  var visits = [];
  var cur = null;
  for (var i = 0; i < routeLog.length; i++) {
    var p   = routeLog[i];
    var t   = tsParse(p.ts);
    var wid = p.wayId || '';
    var seg = p.segIdx || 0;
    if (!wid) {                       // geen snap → breek
      if (cur) { visits.push(cur); cur = null; }
      continue;
    }
    var sameKey = cur && cur.wayId === wid && cur.segIdx === seg;
    if (!sameKey || (t - cur.tEnd) > MAX_GAP_SEC*1000) {
      if (cur) visits.push(cur);
      cur = { wayId: wid, segIdx: seg, osmName: p.osmName || '',
              tStart: t, tEnd: t, nPts: 1 };
    } else {
      cur.tEnd = t;
      cur.nPts += 1;
      if (p.osmName && !cur.osmName) cur.osmName = p.osmName;
    }
  }
  if (cur) visits.push(cur);

  // Filter te korte visits weg
  visits = visits.filter(function(v) {
    var dur = (v.tEnd - v.tStart) / 1000;
    return dur >= MIN_VISIT_SEC && v.nPts >= MIN_VISIT_PTS;
  });

  // Tellingen per visit toewijzen (lineaire pass — taps zijn gesorteerd)
  visits.forEach(function(v) { v.nTel = 0; });
  var ti = 0;
  visits.forEach(function(v) {
    while (ti < taps.length && taps[ti].t < v.tStart) ti++;
    var j = ti;
    while (j < taps.length && taps[j].t <= v.tEnd) {
      if (taps[j].wid === v.wayId && taps[j].segIdx === v.segIdx) v.nTel++;
      j++;
    }
  });

  // segment_count per way bepalen via splitWayIntoSegments op snapElements
  var segCountFor = {};
  Object.keys(snapElements).forEach(function(wid) {
    var subs = splitWayIntoSegments(snapElements[wid].geometry);
    segCountFor[wid] = subs.length;
  });

  function fmtTs(ms) {
    var d = new Date(ms);
    return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }
  var datum = fmtDate(startTime);
  var lines = ['sessie_id;datum;osm_way_id;segment_index;segment_count;straat;start_tijd;eind_tijd;duur_sec;n_gps;n_tellingen'];
  visits.forEach(function(v) {
    var dur = Math.round((v.tEnd - v.tStart) / 1000);
    var segCount = segCountFor[v.wayId] || 1;
    lines.push([sid, datum, v.wayId, v.segIdx, segCount, v.osmName,
                fmtTs(v.tStart), fmtTs(v.tEnd),
                dur, v.nPts, v.nTel].join(';'));
  });
  return lines.join('\n');
}

function stopTelling() {
  var endTime = new Date();
  var sid     = genSid() + '_pkt';
  var datum   = fmtDate(startTime);
  var start   = fmtTime(startTime);
  var eind    = fmtTime(endTime);

  // sessie.csv
  var csvType = (telType === 'other') ? telLabel : telType;
  var sessieCsv = 'sessie_id;datum;start_tijd;eind_tijd;app_type;type;n_waarnemingen\n'
    + [sid, datum, start, eind, 'pocket', csvType, telCount].join(';');

  // telregels.csv — conf/conf_level achteraan zodat bestaande kolomvolgorde
  // intact blijft; telrapport leest op header-naam en negeert onbekende kolommen.
  var telregelsCsv = 'sessie_id;nr;tijdstip;type;lat;lon;osm_way_id;segment_index;straat;conf;conf_level\n';
  telHistory.forEach(function(h, i) {
    telregelsCsv += [sid, i+1, h.ts, csvType,
      h.lat !== null ? h.lat.toFixed(6) : '',
      h.lon !== null ? h.lon.toFixed(6) : '',
      h.wayId  || '',
      h.wayId  ? (h.segIdx || 0) : '',
      h.osmName|| '',
      h.conf != null ? h.conf : '',
      h.confLevel || ''
    ].join(';') + '\n';
  });

  var zip = new JSZip();
  // GPS-track CSV (met wayId/segment_index per punt voor transparantie/debug)
  var gpsCsv = 'sessie_id;tijdstip;lat;lon;nauwkeurigheid;osm_way_id;segment_index;straat\n';
  routeLog.forEach(function(p) {
    gpsCsv += [sid, p.ts, p.lat.toFixed(6), p.lon.toFixed(6), p.acc,
               p.wayId || '',
               p.wayId ? (p.segIdx || 0) : '',
               p.osmName || ''].join(';') + '\n';
  });

  zip.file(sid + '_sessie.csv',    sessieCsv);
  zip.file(sid + '_telregels.csv', telregelsCsv);
  if (routeLog.length) {
    zip.file(sid + '_gps.csv', gpsCsv);
    zip.file(sid + '_bezocht.csv', buildBezochtCsv(sid, telHistory));
  }
  if (Object.keys(snapElements).length) {
    zip.file(sid + '_netwerk.csv', buildNetwerkCsv(sid));
  }
  if (snapTrace.length) {
    zip.file(sid + '_snap_trace.csv', buildSnapTraceCsv(sid));
  }

  zip.generateAsync({ type: 'blob' }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a   = document.createElement('a');
    a.href  = url;
    a.download = sid + '.zip';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    // Preview tonen na korte vertraging (download-dialoog eerst)
    setTimeout(function(){ showPreview(); }, 400);
  });

  closeTelScreen();
  document.getElementById('choose-screen').style.display = '';
}

// ── POST-TELLING PREVIEW ──────────────────────────────────────────────────────
function heatColorPreview(t) {
  var r = Math.round(255 * Math.min(2*t, 1));
  var g = Math.round(255 * Math.min(2*(1-t), 1));
  return 'rgb('+r+','+g+',0)';
}

function polyLenM(pts) {
  if (!pts || pts.length < 2) return 0;
  var LAT_M = 111320;
  var total = 0;
  for (var i = 1; i < pts.length; i++) {
    var cos = Math.cos(pts[i-1][0] * Math.PI / 180);
    var dx = (pts[i][1] - pts[i-1][1]) * LAT_M * cos;
    var dy = (pts[i][0] - pts[i-1][0]) * LAT_M;
    total += Math.sqrt(dx*dx + dy*dy);
  }
  return total;
}

function showPreview() {
  // Segmenten bouwen per (wayId, segIdx) inclusief sub-geometrie en tikken
  var segMap = {};
  Object.keys(snapElements).forEach(function(wid) {
    var subs = splitWayIntoSegments(snapElements[wid].geometry);
    subs.forEach(function(sub, idx) {
      segMap[wid + ':' + idx] = { geom: sub, taps: 0, lenM: polyLenM(sub) };
    });
  });

  telHistory.forEach(function(h) {
    if (!h.wayId) return;
    var key = h.wayId + ':' + (h.segIdx || 0);
    if (segMap[key]) segMap[key].taps++;
  });

  var gpsTrack = routeLog.map(function(p) { return [p.lat, p.lon]; });

  // Bezochte segmenten via GPS-hits (ook zero-visited tonen)
  var GPS_SNAP_M = 15, MIN_HITS = 3;
  var gpsHits = {};
  if (gpsTrack.length && Object.keys(segMap).length) {
    var refLat0 = gpsTrack[0][0];
    var cos0 = Math.cos(refLat0 * Math.PI / 180);
    var LAT_M0 = 111320;
    gpsTrack.forEach(function(pt) {
      var bestKey = null, bestD = GPS_SNAP_M;
      Object.keys(segMap).forEach(function(key) {
        var geom = segMap[key].geom;
        var px = pt[1]*LAT_M0*cos0, py = pt[0]*LAT_M0;
        for (var i = 0; i < geom.length - 1; i++) {
          var ax=geom[i][1]*LAT_M0*cos0,   ay=geom[i][0]*LAT_M0;
          var bx=geom[i+1][1]*LAT_M0*cos0, by=geom[i+1][0]*LAT_M0;
          var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
          var t2=l2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2)):0;
          var d=Math.sqrt(Math.pow(px-(ax+t2*dx),2)+Math.pow(py-(ay+t2*dy),2));
          if (d<bestD) { bestD=d; bestKey=key; }
        }
      });
      if (bestKey) gpsHits[bestKey] = (gpsHits[bestKey]||0)+1;
    });
  }

  var segKeys = Object.keys(segMap).filter(function(k) {
    return segMap[k].taps > 0 || (gpsHits[k]||0) >= MIN_HITS;
  });

  if (!segKeys.length && !gpsTrack.length) return;

  // Bounding box over alle punten
  var allPts = gpsTrack.slice();
  segKeys.forEach(function(k) { segMap[k].geom.forEach(function(p) { allPts.push(p); }); });
  if (!allPts.length) return;

  var minLat=allPts[0][0], maxLat=allPts[0][0], minLon=allPts[0][1], maxLon=allPts[0][1];
  allPts.forEach(function(p) {
    if (p[0]<minLat) minLat=p[0]; if (p[0]>maxLat) maxLat=p[0];
    if (p[1]<minLon) minLon=p[1]; if (p[1]>maxLon) maxLon=p[1];
  });

  // Canvas
  var cvs = document.getElementById('preview-canvas');
  var W   = cvs.offsetWidth || 360;
  var PAD = Math.round(W * 0.07);
  cvs.width = W; cvs.height = W;
  var ctx = cvs.getContext('2d');
  ctx.fillStyle = '#f0f0ec';
  ctx.fillRect(0, 0, W, W);

  // Projectie met aspect-correctie
  var midLat  = (minLat+maxLat)/2;
  var cosCorr = Math.cos(midLat*Math.PI/180);
  var dLatM   = (maxLat-minLat)*111320 || 10;
  var dLonM   = (maxLon-minLon)*111320*cosCorr || 10;
  var drawW   = W-2*PAD, drawH = W-2*PAD;
  var scale   = Math.min(drawW/dLonM, drawH/dLatM);
  var offX    = (drawW-dLonM*scale)/2;
  var offY    = (drawH-dLatM*scale)/2;

  function proj(lat, lon) {
    return [PAD+offX+(lon-minLon)*111320*cosCorr*scale,
            PAD+offY+(maxLat-lat)*111320*scale];
  }

  function drawLine(pts, color, width, dash) {
    if (!pts||pts.length<2) return;
    ctx.beginPath();
    ctx.setLineDash(dash||[]);
    ctx.strokeStyle=color; ctx.lineWidth=width;
    ctx.lineCap='round'; ctx.lineJoin='round';
    var p0=proj(pts[0][0],pts[0][1]);
    ctx.moveTo(p0[0],p0[1]);
    for (var i=1;i<pts.length;i++) { var p=proj(pts[i][0],pts[i][1]); ctx.lineTo(p[0],p[1]); }
    ctx.stroke();
  }

  // Tekenen: GPS-spoor, zero-visited, getelde segmenten
  if (gpsTrack.length>1) drawLine(gpsTrack,'rgba(140,140,160,0.4)',Math.max(1,W/300),[4,4]);
  segKeys.forEach(function(k) { if (segMap[k].taps===0) drawLine(segMap[k].geom,'rgba(60,61,66,0.3)',Math.max(2,W/160),[5,5]); });

  var maxD=0;
  segKeys.forEach(function(k) { if (segMap[k].taps>0&&segMap[k].lenM>0) { var d=segMap[k].taps/segMap[k].lenM; if(d>maxD) maxD=d; } });
  segKeys.forEach(function(k) {
    var s=segMap[k]; if (s.taps===0) return;
    var t=Math.sqrt(Math.min(1, s.lenM>0?s.taps/s.lenM:0));
    drawLine(s.geom, heatColorPreview(t), Math.max(3,W/100), null);
  });

  // Stats
  var nGeteld = segKeys.filter(function(k){return segMap[k].taps>0;}).length;
  var kmStr   = gpsTrack.length>1?(polyLenM(gpsTrack)/1000).toFixed(2):'—';
  document.getElementById('pstat-tikken').textContent = telCount;
  document.getElementById('pstat-segs').textContent   = nGeteld+'/'+segKeys.length;
  document.getElementById('pstat-km').textContent     = kmStr;
  document.getElementById('pstat-max').textContent    = maxD>0?maxD.toFixed(2):'—';
  document.getElementById('preview-overlay').classList.add('visible');
}

function closePreview() {
  document.getElementById('preview-overlay').classList.remove('visible');
}

// ── OSM SNAP MODULE (transect/pocket variant) ─────────────────────────────────
// Vereenvoudigd t.o.v. parkeertelling: geen L/R weging, geen minimap,
// geen kompas-fusie. Graceful degradeert als Overpass niet bereikbaar is.

var SNAP_ROAD_FETCH_RADIUS = 250;
// Een way blijft snap-kandidaat zolang z'n geometrie binnen deze straal van de
// huidige fetch-positie ligt. Afgeleid: fetch-radius + de max. drift vóór een
// re-fetch (re-fetch triggert bij 0.6×fetch-radius = 150m), dus precies het
// gebied vanwaar een way bij de vórige fetch nog snapbaar geweest kán zijn.
// Voorkomt dat ways net buiten de verse 250m-cirkel hun segs verliezen.
var SNAP_SEGS_RADIUS       = Math.round(SNAP_ROAD_FETCH_RADIUS * 1.6);  // 400 m
var SNAP_MAX_M             = 50;   // max snap-afstand voor verse fixes
var SNAP_RESET_M           = 50;   // boven deze afstand tot huidig anker → anker breekt (gelijk aan SNAP_MAX_M: een anker dat buiten snap-bereik ligt is irrelevant)
var ANCHOR_PREFER_M        = 50;   // boven deze afstand vervalt anker-voorkeur (= SNAP_MAX_M; voorkeur geldt over hele kandidatenbereik)
var HYSTERESIS_M           = 5;    // minimum-meterdrempel: buur moet ≥ deze meters dichterbij zijn
var HYSTERESIS_RATIO       = 0.3;  // bovendien: ≥ deze fractie van d_anchor moet het verschil zijn
var SWITCH_CONFIRM         = 2;    // jitter-debounce: een buur moet zóveel opeenvolgende GPS-fixes substantieel dichterbij zijn vóór het anker omklapt (1 = direct, oude gedrag)

// ── Zekerheids-heuristiek ────────────────────────────────────────────────────
// Drie deelscores in [0,1] (marge tot runner-up, afstand tot gekozen way, GPS-
// accuracy). We nemen de ZWAKSTE schakel (min) — een snap is maar zo zeker als
// zijn slechtste signaal. Pending challenger of glitch_hold deksel op amber.
// Resultaat wordt met EMA gladgestreken zodat de stip niet flikkert.
var CONF_MARGIN_LO = 6,  CONF_MARGIN_HI = 20;   // m verschil chosen↔runner-up
var CONF_DIST_LO   = 10, CONF_DIST_HI   = 40;   // m afstand tot gekozen way
var CONF_ACC_LO    = 10, CONF_ACC_HI    = 30;   // m GPS-accuracy-straal
var CONF_GREEN     = 0.66, CONF_AMBER = 0.33;   // tier-drempels
var CONF_EMA       = 0.5;                        // smoothing (1 = geen smoothing)
var SNAP_OVERPASS          = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];

// Wegvakken worden bij export opgeknipt in segmenten van ~SEGMENT_TARGET_M.
// Wegen korter dan SEGMENT_MIN_M blijven heel (één segment).
// Toewijzing van segIdx per snap gebeurt via midpoint van elke OSM-edge.
var SEGMENT_TARGET_M       = 40;
var SEGMENT_MIN_M          = 60;

var snapSegs     = [];
var snapCacheLat = null, snapCacheLon = null;
var snapElements = {};  // wayId → {highway, osmName, geometry} — voor netwerk.csv en anker-erven
var snapReady    = false;

// ── Adjacency-state ─────────────────────────────────────────────────────────
// Twee ways zijn topologisch verbonden als ze een OSM-node delen. We bouwen
// cumulatief (groeit met elke Overpass-fetch) want anker moet over refetches
// heen blijven werken.
var snapNodeToWays = {};   // nodeId → {wayId1:true, wayId2:true, ...}
var snapAdjacency  = {};   // wayId  → {wayId2:true, wayId3:true, ...}

// Huidige anker — de way waarvan we zeker zijn dat de teller er ‘zit’.
// Verspringt alleen naar adjacent ways (depth-1 → depth-2). Wordt null bij
// reset (anker > SNAP_RESET_M weg) of bij sessie-start (eerste fix wint).
var snapAnchorWayId  = null;
var snapAnchorSegIdx = 0;

// Uitdager-debounce: de buur die het anker uitdaagt over opeenvolgende GPS-fixes.
// Het anker klapt pas om als dezelfde buur SWITCH_CONFIRM keer op rij substantieel
// dichterbij is. Eén jitter-fix laat de count niet vollopen → anker blijft staan.
// Wordt null bij elke niet-incrementele anker-wijziging (bootstrap/reset/depth-2/hold).
var snapChallenger   = null;   // {wayId, count}

// Live zekerheidstoestand. Door de GPS-keten bijgewerkt, gelezen door de UI en
// geërfd door taps (een tik is zo zeker als het anker waarop hij landt).
var snapConfScore = null;      // gesmoothed [0,1], of null = nog onbekend
var snapConfLevel = 'none';    // 'green' | 'amber' | 'red' | 'none'
var snapConfName  = '';        // OSM-naam van de huidige gekozen way ('' = onbekend)

// ── Debug trace ────────────────────────────────────────────────────────────
// Per GPS-fix en per tap één regel met ruwe data + interne state.
// Wordt geschreven als <sessieID>_snap_trace.csv in de ZIP. Telrapport
// kent dit bestand niet en negeert het bij inlezen.
var snapTrace = [];      // {seq, tijdstip, event, lat, lon, accuracy, anchor_before,
                         //  snap_path, chosen_way, d_anchor, d_chosen, alternatives, anchor_after, tap_nr}
var snapTraceSeq = 0;

function snapToXY(lat, lon, refLat, refLon) {
  var cos = Math.cos(refLat * Math.PI / 180);
  return { x:(lon-refLon)*111320*cos, y:(lat-refLat)*111320 };
}

function snapClosest(px,py,ax,ay,bx,by) {
  var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if (l2===0) return {x:ax,y:ay};
  var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
  return {x:ax+t*dx, y:ay+t*dy};
}

function snapBuildSegs(elements, refLat, refLon) {
  var segs=[];
  elements.forEach(function(el) {
    if (el.type!=='way'||!el.geometry||el.geometry.length<2) return;
    var xy = el.geometry.map(function(p){ return snapToXY(p.lat, p.lon, refLat, refLon); });
    // Cumulatieve afstand per knoop (in meters)
    var cum = [0];
    for (var k=1; k<xy.length; k++) {
      var ex = xy[k].x - xy[k-1].x, ey = xy[k].y - xy[k-1].y;
      cum.push(cum[k-1] + Math.sqrt(ex*ex + ey*ey));
    }
    var totalLen = cum[cum.length-1];
    var nSeg   = (totalLen < SEGMENT_MIN_M) ? 1 : Math.max(1, Math.round(totalLen / SEGMENT_TARGET_M));
    var segLen = (nSeg > 0) ? (totalLen / nSeg) : totalLen;
    for (var i=0; i<xy.length-1; i++) {
      segs.push({
        ax:xy[i].x,   ay:xy[i].y,
        bx:xy[i+1].x, by:xy[i+1].y,
        wayId:String(el.id),
        cumStart: cum[i],          // m langs way tot deze edge begint
        edgeLen:  cum[i+1]-cum[i], // m van deze edge
        segLen:   segLen,          // m per segment van deze way
        nSeg:     nSeg,
        osmName:(el.tags&&el.tags.name)||'',
        highway:(el.tags&&el.tags.highway)||''
      });
    }
  });
  return segs;
}

// Registreer een way in de adjacency-administratie. Idempotent: bij refetch
// van overlappend gebied gaan er geen dubbele edges in. Voegt zowel ‘way zit
// op deze nodes’ als ‘deze ways zijn nu aan elkaar verbonden’ toe.
function snapRegisterWay(el) {
  if (!el.nodes || el.nodes.length < 2) return;
  var wid = String(el.id);
  for (var i = 0; i < el.nodes.length; i++) {
    var nid = el.nodes[i];
    if (!snapNodeToWays[nid]) snapNodeToWays[nid] = {};
    if (snapNodeToWays[nid][wid]) continue;  // al geregistreerd
    snapNodeToWays[nid][wid] = true;
    if (!snapAdjacency[wid]) snapAdjacency[wid] = {};
    // Verbind wid met alle ways die deze node ook delen
    Object.keys(snapNodeToWays[nid]).forEach(function(other) {
      if (other === wid) return;
      snapAdjacency[wid][other] = true;
      if (!snapAdjacency[other]) snapAdjacency[other] = {};
      snapAdjacency[other][wid] = true;
    });
  }
}

// Bouw een Overpass-achtige elements-lijst uit het CUMULATIEVE snapElements,
// beperkt tot ways waarvan minstens één knoop binnen SNAP_SEGS_RADIUS van
// (lat,lon) ligt. Het huidige anker wordt altijd meegenomen, ongeacht
// knoopafstand — zo verliest de way waarop je staat nooit z'n segs, ook niet
// als 't een lange weg met ver uiteenliggende knopen is.
// snapBuildSegs herprojecteert de output tegen (lat,lon), dus er is geen
// frame-menging: oude en nieuwe ways krijgen hetzelfde origin.
function snapElementsNear(lat, lon) {
  var cos = Math.cos(lat * Math.PI / 180);
  var R2  = SNAP_SEGS_RADIUS * SNAP_SEGS_RADIUS;
  var anchorId = (snapAnchorWayId != null) ? String(snapAnchorWayId) : null;
  var out = [];
  var ids = Object.keys(snapElements);
  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    var el = snapElements[id];
    var keep = (id === anchorId);
    if (!keep) {
      var g = el.geometry;
      for (var k = 0; k < g.length; k++) {
        var dx = (g[k].lon - lon) * 111320 * cos;
        var dy = (g[k].lat - lat) * 111320;
        if (dx*dx + dy*dy <= R2) { keep = true; break; }
      }
    }
    if (keep) out.push({
      type: 'way', id: id, geometry: el.geometry,
      tags: { name: el.osmName, highway: el.highway }
    });
  }
  return out;
}

// Geef de set van wayIds die binnen ‘depth’ sprongen bereikbaar is vanaf wayId.
// depth=1 = anker + directe buren. depth=2 = ook buren-van-buren (voor het geval
// een korte tussen-way nooit een eigen fix kreeg, bijv. bij snelheid).
function snapAdjacencySet(wayId, depth) {
  var result = {};
  result[wayId] = true;
  var frontier = [wayId];
  for (var d = 0; d < depth; d++) {
    var next = [];
    for (var i = 0; i < frontier.length; i++) {
      var adj = snapAdjacency[frontier[i]];
      if (!adj) continue;
      var keys = Object.keys(adj);
      for (var j = 0; j < keys.length; j++) {
        if (!result[keys[j]]) { result[keys[j]] = true; next.push(keys[j]); }
      }
    }
    frontier = next;
    if (!frontier.length) break;
  }
  return result;
}

// Minimum-afstand van punt p naar een specifieke way (zonder SNAP_MAX_M-cutoff).
// Nodig om te beslissen of het anker echt onbereikbaar ver weg is (→ reset)
// of slechts tijdelijk net buiten 50m valt door GPS-jitter (→ anker behouden).
function snapDistanceToWay(p, wayId) {
  var best = Infinity;
  for (var i = 0; i < snapSegs.length; i++) {
    var s = snapSegs[i];
    if (s.wayId !== wayId) continue;
    var dx = s.bx - s.ax, dy = s.by - s.ay, l2 = dx*dx + dy*dy;
    var t = (l2 === 0) ? 0 : Math.max(0, Math.min(1, ((p.x-s.ax)*dx + (p.y-s.ay)*dy) / l2));
    var cx = s.ax + t*dx, cy = s.ay + t*dy;
    var d = Math.sqrt((cx-p.x)*(cx-p.x) + (cy-p.y)*(cy-p.y));
    if (d < best) best = d;
  }
  return best;
}

// Read-only: projecteer een punt loodrecht op één specifieke way en geef
// {lat, lon, wayId, segIdx, osmName, d} terug (of null). Muteert GEEN anker-state.
// Gebruikt door taps om het GPS-anker te erven i.p.v. zelf opnieuw te beslissen.
function snapProjectOnto(lat, lon, wayId) {
  if (!snapSegs.length || snapCacheLat===null) return null;
  var p = snapToXY(lat, lon, snapCacheLat, snapCacheLon);
  var best=null;
  for (var i=0;i<snapSegs.length;i++) {
    var s=snapSegs[i];
    if (s.wayId!==wayId) continue;
    var dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
    var t=(l2===0)?0:Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/l2));
    var cx=s.ax+t*dx, cy=s.ay+t*dy;
    var d=Math.sqrt((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y));
    if (!best || d<best.d) best={d:d, seg:s, cx:cx, cy:cy, t:t};
  }
  if (!best) return null;
  var s=best.seg;
  var snapM=s.cumStart + best.t*s.edgeLen;
  var segIdx=(s.nSeg<=1||s.segLen===0)?0:Math.min(s.nSeg-1,Math.floor(snapM/s.segLen));
  var cos=Math.cos(snapCacheLat*Math.PI/180);
  return {
    lat: snapCacheLat + best.cy/111320,
    lon: snapCacheLon + best.cx/(111320*cos),
    wayId: wayId, segIdx: segIdx, osmName: s.osmName, d: best.d
  };
}

// Read-only: dichtstbijzijnde way overall binnen SNAP_MAX_M (geen adjacency, geen
// anker-mutatie). Voor cold-start taps en retro-snap van wachtrij-tikken.
function snapNearestAny(lat, lon) {
  if (!snapSegs.length || snapCacheLat===null) return null;
  var p=snapToXY(lat, lon, snapCacheLat, snapCacheLon);
  var bestPerWay={};
  for (var i=0;i<snapSegs.length;i++) {
    var s=snapSegs[i];
    var dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
    var t=(l2===0)?0:Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/l2));
    var cx=s.ax+t*dx, cy=s.ay+t*dy;
    var d=Math.sqrt((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y));
    if (d>SNAP_MAX_M) continue;
    if (!bestPerWay[s.wayId] || d<bestPerWay[s.wayId]) bestPerWay[s.wayId]=d;
  }
  var bestId=null, bestD=Infinity;
  Object.keys(bestPerWay).forEach(function(w){ if (bestPerWay[w]<bestD){ bestD=bestPerWay[w]; bestId=w; } });
  return bestId ? snapProjectOnto(lat, lon, bestId) : null;
}

// Bereken een ruwe zekerheid in [0,1] uit de signalen die we per fix al hebben.
// rampUp:  >= hi → 1, <= lo → 0 (groter = beter, bijv. marge)
// rampDown: <= lo → 1, >= hi → 0 (kleiner = beter, bijv. afstand, accuracy)
function _ramp(v, lo, hi, up) {
  if (v == null || isNaN(v)) return 1;           // onbekend signaal telt niet mee
  var t = (v - lo) / (hi - lo);
  t = Math.max(0, Math.min(1, t));
  return up ? t : (1 - t);
}
// bestPerWay: {wayId→{d,...}} alle kandidaten; chosenWayId: gekozen way;
// chosenD: afstand tot gekozen; acc: GPS-accuracy; path: snapPath; pending: challenger actief
function snapComputeConfidence(bestPerWay, chosenWayId, chosenD, acc, path, pending) {
  // Harde gevallen: geen bruikbare fix
  if (path === 'no_network' || path === 'null_no_candidate' ||
      path === 'reset_no_candidate' || chosenWayId == null) {
    return { score: 0, level: 'red' };
  }
  // Marge tot de op-één-na-dichtste way (de échte ambiguïteitsmaat)
  var runnerUp = Infinity;
  var keys = Object.keys(bestPerWay);
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === chosenWayId) continue;
    if (bestPerWay[keys[i]].d < runnerUp) runnerUp = bestPerWay[keys[i]].d;
  }
  var margin = (runnerUp === Infinity) ? CONF_MARGIN_HI : (runnerUp - chosenD);

  var sMargin = _ramp(margin,  CONF_MARGIN_LO, CONF_MARGIN_HI, true);
  var sDist   = _ramp(chosenD, CONF_DIST_LO,   CONF_DIST_HI,   false);
  var sAcc    = _ramp(acc,     CONF_ACC_LO,    CONF_ACC_HI,    false);

  var raw = Math.min(sMargin, sDist, sAcc);   // zwakste schakel
  // Onopgeloste strijd of mislukte verse fix → niet hoger dan amber
  if (pending || path === 'glitch_hold') raw = Math.min(raw, CONF_AMBER + 0.001);

  return { score: raw, level: null };  // level wordt na EMA bepaald
}

// GPS-anker-pad. ENIGE schrijver van snapAnchorWayId / snapChallenger. Alleen de
// GPS-watcher roept dit aan; taps erven het anker via snapProjectOnto (read-only).
function snapNearestWay(lat, lon, eventInfo) {
  // eventInfo (optioneel): {type:'gps'|'tap', tijdstip, accuracy, tap_nr}
  //   gebruikt voor _snap_trace.csv schrijven. Zonder eventInfo wordt niet getraced.
  if (!snapSegs.length || snapCacheLat===null) {
    if (eventInfo) traceWrite(eventInfo, lat, lon, 'no_network', null, null, null, []);
    return null;
  }
  var p = snapToXY(lat, lon, snapCacheLat, snapCacheLon);
  var anchorBefore = snapAnchorWayId;

  // Stap 1: beste edge per way binnen SNAP_MAX_M verzamelen
  var bestPerWay = {};  // wayId → {d, seg, pt:{x,y}, t}
  for (var i=0;i<snapSegs.length;i++) {
    var s=snapSegs[i];
    var dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
    var t = (l2===0) ? 0 : Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/l2));
    var cx=s.ax+t*dx, cy=s.ay+t*dy;
    var d=Math.sqrt((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y));
    if (d>SNAP_MAX_M) continue;
    if (!bestPerWay[s.wayId] || d<bestPerWay[s.wayId].d) {
      bestPerWay[s.wayId] = {d:d, seg:s, pt:{x:cx,y:cy}, t:t};
    }
  }

  // Top-3 alternatieven (alle kandidaten exclusief de uiteindelijk gekozene)
  function topAlternatives(exceptWayId) {
    var arr = [];
    Object.keys(bestPerWay).forEach(function(w) {
      if (w !== exceptWayId) arr.push({wayId:w, d:bestPerWay[w].d});
    });
    arr.sort(function(a,b){return a.d-b.d;});
    return arr.slice(0,3);
  }

  // Helper: kies dichtstbijzijnde wayId uit een toegestane set
  function pickWithin(allowedSet) {
    var bestId=null, bestC=null;
    var keys = Object.keys(bestPerWay);
    for (var k=0;k<keys.length;k++) {
      if (!allowedSet[keys[k]]) continue;
      var c = bestPerWay[keys[k]];
      if (!bestC || c.d < bestC.d) { bestC=c; bestId=keys[k]; }
    }
    return bestId ? {info:bestC, wayId:bestId} : null;
  }

  // Helper: bouw return-object en update anker-state
  function buildResult(chosen) {
    var s = chosen.info.seg;
    var snapM = s.cumStart + chosen.info.t * s.edgeLen;
    var segIdx = (s.nSeg <= 1 || s.segLen === 0)
               ? 0
               : Math.min(s.nSeg - 1, Math.floor(snapM / s.segLen));
    var cos=Math.cos(snapCacheLat*Math.PI/180);
    snapAnchorWayId  = chosen.wayId;
    snapAnchorSegIdx = segIdx;
    return {
      lat: snapCacheLat + chosen.info.pt.y/111320,
      lon: snapCacheLon + chosen.info.pt.x/(111320*cos),
      wayId: chosen.wayId,
      segIdx: segIdx,
      osmName: s.osmName
    };
  }

  // Resultaat-variabelen voor de trace
  var result = null, snapPath = '', dAnchorTrace = null, dChosenTrace = null;

  // Stap 2: keuze op basis van anker-state
  // 2a: geen anker → globaal dichtstbijzijnde (initialisatie)
  if (snapAnchorWayId === null) {
    var all = {};
    var akeys = Object.keys(bestPerWay);
    for (var ak=0;ak<akeys.length;ak++) all[akeys[ak]] = true;
    var chosen = pickWithin(all);
    if (chosen) {
      snapPath = 'bootstrap';
      dChosenTrace = chosen.info.d;
      snapChallenger = null;
      result = buildResult(chosen);
    } else {
      snapPath = 'null_no_candidate';
    }
  } else {
    // 2b-pre: anker écht ver weg (> SNAP_RESET_M)?
    // Voorheen werd dit gemist als depth-1 toevallig een dichtbije buur vond:
    // een d1-wissel maskeerde dan dat de teller fysiek lang weg is van de
    // anker-way. Direct resetten geeft een schone bootstrap.
    var preAnchorD = snapDistanceToWay(p, snapAnchorWayId);
    if (preAnchorD > SNAP_RESET_M) {
      snapAnchorWayId  = null;
      snapAnchorSegIdx = 0;
      snapChallenger   = null;
      var preAll = {};
      var prekeys = Object.keys(bestPerWay);
      for (var pk=0;pk<prekeys.length;pk++) preAll[prekeys[pk]] = true;
      var preChosen = pickWithin(preAll);
      if (preChosen) {
        snapPath = 'reset';
        dChosenTrace = preChosen.info.d;
        result = buildResult(preChosen);
      } else {
        snapPath = 'reset_no_candidate';
      }
    } else {
    // 2b: anker bestaat → depth-1 (anker + directe buren) met hysterese + debounce
    var depth1Set = snapAdjacencySet(snapAnchorWayId, 1);
    var chosen1   = pickWithin(depth1Set);
    if (chosen1) {
      var anchorCand = bestPerWay[snapAnchorWayId];
      if (chosen1.wayId === snapAnchorWayId) {
        // Anker is zelf de dichtste → geen uitdager
        snapChallenger = null;
        snapPath = 'd1';
        dChosenTrace = chosen1.info.d;
        result = buildResult(chosen1);
      } else {
        // Een buur is het dichtst binnen depth-1
        var d_other = chosen1.info.d;
        var holdOnAnchor = false;
        if (anchorCand) {
          var d_anchor = anchorCand.d;
          dAnchorTrace = d_anchor;
          // Glijdende drempel: dichtbij anker volstaat 5m verschil, ver weg moet
          // het verschil substantieel zijn (30% van d_anchor). Boven
          // ANCHOR_PREFER_M vervalt de voorkeur volledig.
          var threshold = Math.max(HYSTERESIS_M, d_anchor * HYSTERESIS_RATIO);
          if (d_anchor <= ANCHOR_PREFER_M && (d_anchor - d_other) < threshold) {
            holdOnAnchor = true;  // buur niet substantieel beter
          }
        }
        if (holdOnAnchor) {
          // Vasthouden op anker; uitdager vervalt
          snapChallenger = null;
          snapPath = 'd1_hold';
          dChosenTrace = anchorCand.d;
          result = buildResult({info: anchorCand, wayId: snapAnchorWayId});
        } else {
          // Buur is substantieel dichterbij → confirmatie-debounce vóór omklap.
          // Eén jitter-fix laat de count niet vollopen; bij echte verplaatsing
          // klapt het anker na SWITCH_CONFIRM opeenvolgende fixes om.
          if (snapChallenger && snapChallenger.wayId === chosen1.wayId) {
            snapChallenger.count++;
          } else {
            snapChallenger = { wayId: chosen1.wayId, count: 1 };
          }
          dChosenTrace = d_other;
          if (snapChallenger.count >= SWITCH_CONFIRM) {
            // Bevestigd → omklap
            snapChallenger = null;
            snapPath = 'd1_switch';
            result = buildResult(chosen1);
          } else if (anchorCand) {
            // Nog niet bevestigd → blijf op anker (debounce)
            snapPath = 'd1_pending';
            result = buildResult({info: anchorCand, wayId: snapAnchorWayId});
          } else {
            // Randgeval: anker niet binnen SNAP_MAX_M maar nog niet ge-reset →
            // klap toch om (er is geen anker-punt om op te blijven)
            snapChallenger = null;
            snapPath = 'd1_switch_noanchor';
            result = buildResult(chosen1);
          }
        }
      }
    } else {
      // 2c: depth-2 (genuine sprong over een korte tussen-way; debounce n.v.t.)
      var chosen2 = pickWithin(snapAdjacencySet(snapAnchorWayId, 2));
      if (chosen2) {
        snapPath = 'd2';
        dChosenTrace = chosen2.info.d;
        snapChallenger = null;
        result = buildResult(chosen2);
      } else {
        // 2d/2e: geen verbonden kandidaat. Anker écht te ver weg?
        var anchorD = snapDistanceToWay(p, snapAnchorWayId);
        dAnchorTrace = anchorD;
        if (anchorD > SNAP_RESET_M) {
          snapAnchorWayId  = null;
          snapAnchorSegIdx = 0;
          snapChallenger   = null;
          var all2 = {};
          var bkeys = Object.keys(bestPerWay);
          for (var bk=0;bk<bkeys.length;bk++) all2[bkeys[bk]] = true;
          var chosen3 = pickWithin(all2);
          if (chosen3) {
            snapPath = 'reset';
            dChosenTrace = chosen3.info.d;
            result = buildResult(chosen3);
          } else {
            snapPath = 'reset_no_candidate';
          }
        } else {
          // Glitch hold: anker behouden, geen verse snap
          snapPath = 'glitch_hold';
        }
      }
    }
    }  // einde van pre-reset else-tak
  }

  // ── Zekerheid bijwerken (alleen op GPS-fixes; taps erven snapConf*) ──────────
  var chosenWay = result ? result.wayId : null;
  if (eventInfo && eventInfo.type === 'gps') {
    var chosenD  = (chosenWay && bestPerWay[chosenWay]) ? bestPerWay[chosenWay].d
                 : (result ? snapDistanceToWay(p, chosenWay) : null);
    var pending  = !!(snapChallenger && snapChallenger.count < SWITCH_CONFIRM);
    var conf     = snapComputeConfidence(bestPerWay, chosenWay, chosenD,
                                         eventInfo.accuracy, snapPath, pending);
    // EMA-smoothing: een enkele uitschieter trekt de stip niet meteen om
    snapConfScore = (snapConfScore === null)
                  ? conf.score
                  : (CONF_EMA * conf.score + (1 - CONF_EMA) * snapConfScore);
    snapConfLevel = (conf.level === 'red') ? 'red'
                  : (snapConfScore >= CONF_GREEN) ? 'green'
                  : (snapConfScore >= CONF_AMBER) ? 'amber' : 'red';
    snapConfName  = result ? (result.osmName || '') : '';
  }

  // Trace schrijven (alleen als event-info meegegeven)
  if (eventInfo) {
    var alts = topAlternatives(chosenWay);
    traceWrite(eventInfo, lat, lon, snapPath, anchorBefore, chosenWay, dAnchorTrace, dChosenTrace, alts);
  }

  return result;
}

// Schrijf één regel naar de snap-trace. anchor_after = snapAnchorWayId nú,
// na alle eventuele wijzigingen in deze snap-aanroep.
function traceWrite(evt, lat, lon, snapPath, anchorBefore, chosenWay, dAnchor, dChosen, alts) {
  snapTraceSeq++;
  var altStr = alts.map(function(a){ return a.wayId + ':' + a.d.toFixed(1); }).join('|');
  snapTrace.push({
    seq:            snapTraceSeq,
    tijdstip:       evt.tijdstip,
    event:          evt.type,
    lat:            lat.toFixed(6),
    lon:            lon.toFixed(6),
    accuracy:       evt.accuracy != null ? evt.accuracy : '',
    anchor_before:  anchorBefore != null ? anchorBefore : '',
    snap_path:      snapPath,
    chosen_way:     chosenWay != null ? chosenWay : '',
    d_anchor:       dAnchor != null ? dAnchor.toFixed(1) : '',
    d_chosen:       dChosen != null ? dChosen.toFixed(1) : '',
    alternatives:   altStr,
    anchor_after:   snapAnchorWayId != null ? snapAnchorWayId : '',
    tap_nr:         evt.tap_nr != null ? evt.tap_nr : '',
    conf:           (snapConfScore === null) ? '' : snapConfScore.toFixed(2),
    conf_level:     snapConfLevel
  });
}

function snapFetchNetwork(lat, lon, attempt) {
  if (attempt===undefined) attempt=0;
  if (attempt>=SNAP_OVERPASS.length*2) return;
  var epIdx=attempt%SNAP_OVERPASS.length;
  // body geom: levert tags + node-IDs (el.nodes) + geometrie. Node-IDs zijn nodig
  // voor adjacency-detectie (twee ways grenzen aan elkaar via gedeelde node-ID).
  var query='[out:json][timeout:8];way["highway"~"residential|living_street|primary|secondary|tertiary|unclassified|service|pedestrian|footway|cycleway|path|steps|corridor"]["area"!="yes"](around:'+SNAP_ROAD_FETCH_RADIUS+','+lat.toFixed(6)+','+lon.toFixed(6)+');out body geom;';
  fetch(SNAP_OVERPASS[epIdx]+'?data='+encodeURIComponent(query))
    .then(function(r){ return r.ok?r.json():Promise.reject(r.status); })
    .then(function(data) {
      if (!data.elements||!data.elements.length) throw new Error('geen wegen');
      snapCacheLat=lat; snapCacheLon=lon;
      // Stap 1 — accumuleer de verse fetch in snapElements + adjacency ZODAT de
      // segs-herbouw hieronder de nieuwe ways al meeneemt. (Volgorde t.o.v. <2.8:
      // dit blok stond na de segs-bouw; nu ervóór.)
      data.elements.forEach(function(el) {
        if (el.type!=='way'||!el.geometry||el.geometry.length<2) return;
        snapRegisterWay(el);  // adjacency cumulatief bijwerken
        if (!snapElements[String(el.id)]) {
          snapElements[String(el.id)] = {
            highway: (el.tags&&el.tags.highway)||'',
            osmName: (el.tags&&el.tags.name)||'',
            geometry: el.geometry
          };
        }
      });
      // Stap 2 — herbouw snapSegs uit het CUMULATIEVE netwerk (niet alleen deze
      // fetch), beperkt tot SNAP_SEGS_RADIUS rond de huidige positie. snapBuildSegs
      // herprojecteert alles tegen (lat,lon) → geen frame-menging. Hiermee verliest
      // een way die net buiten de verse 250m-cirkel valt z'n snap-kandidatuur niet.
      var segElems = snapElementsNear(lat, lon);
      snapSegs = snapBuildSegs(segElems, lat, lon);
      // Log fetch-event in snap_trace zodat de segs-herbouw traceerbaar is.
      // n_el  = ways uit deze Overpass-fetch
      // n_kept = cumulatieve ways binnen SNAP_SEGS_RADIUS (input voor segs)
      // n_segs = resulterende segmenten
      snapTraceSeq++;
      snapTrace.push({
        seq:            snapTraceSeq,
        tijdstip:       new Date().toISOString().slice(0,19),
        event:          'fetch',
        lat:            lat.toFixed(7),
        lon:            lon.toFixed(7),
        accuracy:       '',
        anchor_before:  snapAnchorWayId||'',
        snap_path:      'n_el:'+data.elements.length+'|n_kept:'+segElems.length+'|n_segs:'+snapSegs.length,
        chosen_way:     '',
        d_anchor:       '',
        d_chosen:       '',
        alternatives:   '',
        anchor_after:   snapAnchorWayId||'',
        tap_nr:         '',
        conf:           (snapConfScore === null) ? '' : snapConfScore.toFixed(2),
        conf_level:     snapConfLevel
      });
      snapReady=true;
      // Retro-snap tikken die wachtten op het netwerk: dichtstbijzijnde way op
      // hun eigen historische positie (read-only, muteert het anker niet).
      if (snapPendingQueue.length) {
        snapPendingQueue.forEach(function(entry) {
          if (entry.lat===null) return;
          var s = snapNearestAny(entry.lat, entry.lon);
          if (s) { entry.wayId = s.wayId; entry.segIdx = s.segIdx; entry.osmName = s.osmName; }
          traceWrite({type:'tap_retro', tijdstip:entry.ts}, entry.lat, entry.lon,
                     s ? 'retro_nearest' : 'no_candidate', snapAnchorWayId, s?s.wayId:null, null, s?s.d:null, []);
        });
        snapPendingQueue = [];
      }
    })
    .catch(function(){ snapFetchNetwork(lat,lon,attempt+1); });
}

var _snapRefreshTimer = null;
function snapCheckRefresh(lat, lon) {
  if (snapCacheLat===null) { snapFetchNetwork(lat,lon); return; }
  var cos=Math.cos(snapCacheLat*Math.PI/180);
  var dx=(lon-snapCacheLon)*111320*cos, dy=(lat-snapCacheLat)*111320;
  if (Math.sqrt(dx*dx+dy*dy) > SNAP_ROAD_FETCH_RADIUS*0.6) {
    if (_snapRefreshTimer) clearTimeout(_snapRefreshTimer);
    _snapRefreshTimer = setTimeout(function(){ snapFetchNetwork(lat,lon); }, 600);
  }
}
// ── EINDE SNAP MODULE ─────────────────────────────────────────────────────────

</script>
