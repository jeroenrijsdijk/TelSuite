<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pocket Count</title>
<script>
// Directe parkeer-ingang (v2.70): al vóór de eerste weergave, zodat het
// keuzemenu met de vier modi ook niet even zichtbaar is (zie .pk-ingang).
if (location.hash === '#parkeren') {
  document.documentElement.className += ' pk-ingang';
  document.title = 'Pocket Parkeren';
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --font: 'Oswald', sans-serif;
    --c-car:   #c0392b;
    --c-bike:  #2980b9;
    --c-ped:   #8e44ad;
  }

  body {
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
    background: #111;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Keuze-scherm ── */
  #choose-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: #1a1918;
    padding: 24px 20px;
    position: relative;
  }

  #choose-screen h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 28px;
  }

  .type-btns {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .type-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.1s, filter 0.1s;
  }
  .type-btn:active { transform: scale(0.97); filter: brightness(0.85); }

  .type-btn .icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
  .type-btn .lbl  {
    font-family: var(--font);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  /* ── Tel-scherm ── */
  #count-screen {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    cursor: pointer;
  }

  #count-screen.active { display: flex; }

  #big-count {
    font-size: 38vw;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -4px;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  #type-label {
    font-size: 5vw;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-top: 8px;
    pointer-events: none;
  }

  /* ── Zekerheidsindicator: stip + huidige OSM-straatnaam ── */
  #snap-conf {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    max-width: 88vw;
    pointer-events: none;
  }
  #snap-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #888;            /* default/none */
    flex: none;
    border: 2px solid rgba(255,255,255,0.85);   /* ring keeps the colour readable in bright light */
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
    transition: background 0.4s ease;
  }
  #snap-dot.green { background: rgb(0,200,0); }
  #snap-dot.amber { background: rgb(255,176,0); }
  #snap-dot.red   { background: rgb(240,40,0); }

  /* Tweede stip: GPS-signaalstabiliteit. Ring i.p.v. gevulde schijf, zodat
     hij visueel niet te verwarren is met de snap-stip ernaast. */
  .gps-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    box-sizing: border-box;
    background: transparent;
    border: 3px solid #888;          /* default/none */
    flex: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
    transition: border-color 0.4s ease;
  }
  .gps-dot.green { border-color: rgb(0,200,0); }
  .gps-dot.amber { border-color: rgb(255,176,0); }
  .gps-dot.red   { border-color: rgb(240,40,0); }

  /* Derde indicator: batterij. Een klein staafje (andere vorm dan de stippen)
     zodat het meteen als batterij leesbaar is. Alleen getoond als de Battery
     API bestaat (niet op iOS Safari). */
  .batt-ind {
    position: relative;
    width: 26px; height: 13px;
    border: 2px solid rgba(255,255,255,0.85);
    border-radius: 3px;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
    flex: none;
    box-sizing: border-box;
    overflow: hidden;
  }
  .batt-ind::after {            /* het plus-nubje rechts */
    content: '';
    position: absolute;
    right: -4px; top: 50%;
    transform: translateY(-50%);
    width: 2px; height: 6px;
    background: rgba(255,255,255,0.85);
    border-radius: 0 1px 1px 0;
  }
  .batt-fill {
    display: block;
    height: 100%;
    width: 100%;
    background: #888;
    transition: width 0.4s ease, background 0.4s ease;
  }
  .batt-ind.green .batt-fill { background: rgb(0,200,0); }
  .batt-ind.amber .batt-fill { background: rgb(255,176,0); }
  .batt-ind.red   .batt-fill { background: rgb(240,40,0); }
  .batt-ind.charging { border-color: #fff; }
  .batt-ind.charging::before {  /* bliksempje bij opladen */
    content: '\26A1';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 9px;
    line-height: 1;
    z-index: 1;
    text-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
  #snap-name {
    font-size: clamp(17px, 5vw, 26px);
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* dark outline keeps the name readable over any background colour in bright sunlight */
    text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 1px 2px rgba(0,0,0,0.9);
  }

  /* Flash on tap */
  #count-screen.flash { filter: brightness(1.7); }

  /* Shake on undo */
  @keyframes shake {
    0%   { transform: scale(0.96); }
    50%  { transform: scale(1.02); }
    100% { transform: scale(1.00); }
  }
  #count-screen.shake { animation: shake 0.18s ease; }

  /* ── Undo balk ── */
  #undo-bar {
    position: fixed;
    top: 20px; left: 20px;
    height: 40px;
    width: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
  }
  #undo-fill {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,0.5);
  }
  #undo-lbl {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }

  /* ── Stop-knop ── */
  #btn-stop {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.6);
    font-family: var(--font);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
    white-space: nowrap;
  }
  #btn-stop:active { background: rgba(0,0,0,0.7); }

  /* ── Terug-knop keuze ── */
  #btn-back {
    position: fixed;
    top: 20px; right: 20px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.45);
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
  }
  /* ── Preview overlay ── */
  #preview-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,10,0.88);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #preview-overlay.visible { display: flex; }
  #preview-header {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  #preview-title {
    font-family: var(--font);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(240,240,236,0.6);
  }
  #preview-save {
    background: rgba(240,240,236,0.1);
    border: 1px solid rgba(240,240,236,0.35);
    border-radius: 5px;
    color: rgba(240,240,236,0.85);
    font-family: var(--font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 5px 10px;
    margin-right: 10px;
    touch-action: manipulation;
  }
  #preview-recon {
    background: rgba(31,95,191,0.25);
    border: 1px solid #1f5fbf;
    border-radius: 5px;
    color: #cfe0ff;
    font-family: var(--font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 5px 10px;
    margin-right: 10px;
    touch-action: manipulation;
  }
  #preview-close {
    background: none;
    border: none;
    color: rgba(240,240,236,0.45);
    font-family: var(--font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 0;
    touch-action: manipulation;
  }
  #preview-canvas {
    width: 100%;
    max-width: 420px;
    border-radius: 6px;
    background: #f0f0ec;
    display: block;
  }
  #preview-stats {
    width: 100%;
    max-width: 420px;
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .pstat {
    background: rgba(255,255,255,0.07);
    border-radius: 4px;
    padding: 10px 14px;
    flex: 1;
    min-width: 90px;
  }
  .pstat-val {
    font-family: var(--font);
    font-size: 1.5rem;
    font-weight: 700;
    color: #f0f0ec;
    line-height: 1;
  }
  .pstat-lbl {
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(240,240,236,0.4);
    margin-top: 4px;
  }
  #preview-legend {
    width: 100%;
    max-width: 420px;
    margin-top: 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .pleg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(240,240,236,0.45);
  }
  .pleg-swatch { width: 20px; height: 4px; border-radius: 2px; flex-shrink: 0; }
  /* ── Transect-modus (v2.11) ── */
  #transect-screen {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: #1a1a1a; color: #fff; flex-direction: column; align-items: center;
    padding: 14px 12px calc(70px + env(safe-area-inset-bottom)); gap: 10px;
    overflow-y: auto; box-sizing: border-box;
  }
  #tc-dir-config { width: 100%; max-width: 520px; display: flex; gap: 8px; align-items: center; }
  #tc-dir-config input {
    flex: 1; min-width: 0; padding: 10px; border: 1px solid #444; border-radius: 5px;
    background: #2a2a2a; color: #fff; font-family: var(--font); font-size: 0.85rem;
    font-weight: 600; text-align: center; box-sizing: border-box;
  }
  #btn-compass {
    padding: 9px 12px; border: 1px solid #666; border-radius: 5px; background: #2a2a2a;
    color: rgba(255,255,255,0.75); font-family: var(--font); font-size: 0.7rem;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
    cursor: pointer; flex-shrink: 0;
  }
  #btn-compass.active { color: #6fcf7f; border-color: #6fcf7f; }
  #tc-total {
    width: 100%; max-width: 520px; background: #000; border-radius: 6px;
    padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
  }
  #tc-total .lbl { font-size: 0.7rem; letter-spacing: 2px; color: #888; text-transform: uppercase; }
  #tc-total .val { font-family: monospace; font-size: 1.8rem; font-weight: 700; }
  #tc-counters { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 7px; }
  .tc-card {
    background: #262626; border: 1px solid #3a3a3a; border-radius: 8px;
    display: flex; align-items: stretch; overflow: hidden; height: 68px;
  }
  .tc-dir {
    width: 78px; min-width: 78px; border: none; background: #3a7d44; color: #fff;
    font-family: var(--font); font-weight: 700; cursor: pointer; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .tc-dir:active { filter: brightness(0.8); }
  .tc-dir .tc-sym  { font-size: 0.7rem; font-family: monospace; opacity: 0.85; letter-spacing: -1px; }
  .tc-dir .tc-plus { font-size: 1.5rem; line-height: 1; }
  .tc-cnt {
    flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0;
    font-family: monospace; font-size: 2rem; font-weight: 700; color: #fff; transition: transform 0.1s ease;
  }
  .tc-cnt.bump { transform: scale(1.25); }
  .tc-min {
    width: 32px; min-width: 32px; border: none; background: #333;
    color: rgba(255,255,255,0.55); font-size: 1.1rem; font-weight: 700; cursor: pointer;
    flex-shrink: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .tc-min:active { background: #444; }
  .tc-mid {
    width: 40px; min-width: 40px; display: flex; align-items: center; justify-content: center;
    background: #1e1e1e; border-left: 1px solid #3a3a3a; border-right: 1px solid #3a3a3a;
    border-top: 3px solid #b07d2b; font-size: 1.3rem; flex-shrink: 0;
  }
  #tc-stop, #tc-back {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60;
    padding: 12px 18px; border: none; border-radius: 6px; font-family: var(--font);
    font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  #tc-stop { right: 14px; background: #c0392b; color: #fff; }
  #tc-back { left: 14px; background: #333; color: rgba(255,255,255,0.8); }
  /* ── Winkelstraat-modus (v2.11) ── */
  #winkel-screen {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: #1a1a1a; color: #fff; flex-direction: column;
    padding: 14px 12px calc(70px + env(safe-area-inset-bottom)); gap: 10px; box-sizing: border-box;
  }
  #ws-total, #pk-total {
    width: 100%; background: #000; border-radius: 6px; padding: 8px 16px;
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; box-sizing: border-box;
  }
  #ws-total .lbl, #pk-total .lbl { font-size: 0.7rem; letter-spacing: 2px; color: #888; text-transform: uppercase; }
  #ws-total .val, #pk-total .val { font-family: monospace; font-size: 1.8rem; font-weight: 700; }
  #ws-cards { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  /* Parkeren-modus (v2.17): zelfde kaartstijl, 2×2-grid — alle vier even groot. */
  #parkeer-screen {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: #1a1a1a; color: #fff; flex-direction: column;
    padding: 14px 12px calc(70px + env(safe-area-inset-bottom)); gap: 10px; box-sizing: border-box;
  }
  #pk-cards {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px;
  }
  .ws-card {
    flex: 1; position: relative; border-radius: 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden;
  }
  .ws-card:active { filter: brightness(0.85); }
  .ws-icon  { font-size: 2.4rem; line-height: 1; }
  .ws-label { font-family: var(--font); font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .ws-count { font-family: monospace; font-size: 3.5rem; font-weight: 700; line-height: 1; transition: transform 0.1s ease; }
  .ws-count.bump { transform: scale(1.2); }
  .ws-undo {
    position: absolute; top: 10px; right: 10px; width: 44px; height: 44px;
    background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; color: rgba(255,255,255,0.85); -webkit-tap-highlight-color: transparent;
  }
  .ws-undo:active { background: rgba(0,0,0,0.5); }
  #ws-stop, #ws-back, #pk-stop, #pk-back, #pk-map {
    position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60;
    padding: 12px 18px; border: none; border-radius: 6px; font-family: var(--font);
    font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
  }
  #ws-stop, #pk-stop { right: 14px; background: #c0392b; color: #fff; }
  #ws-back, #pk-back { left: 14px; background: #333; color: rgba(255,255,255,0.8); }
  #pk-map { background: #1f5fbf; color: #fff; }
  /* pk-knoppen in een flex-balk: verdelen zich, overlappen nooit (welke schermbreedte dan ook) */
  #pk-btnbar {
    position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 60; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  #pk-back, #pk-map, #pk-stop {
    position: static; left: auto; right: auto; transform: none; bottom: auto;
    padding: 11px 13px; font-size: 0.75rem;
  }

  /* Dekkingskaart-overlay (pocket parkeren) */
  #pk-map-overlay { position: fixed; inset: 0; z-index: 4000; background: #fff; display: none; flex-direction: column; }
  #pk-map-bar, #pk-map-legend { background: #1a1918; color: #fff; font-family: var(--font); padding: 10px 14px; display: flex; align-items: center; }
  #pk-map-bar { justify-content: space-between; font-weight: 600; font-size: 15px; }
  #pk-map-close { background: #c0392b; color: #fff; border: none; border-radius: 6px; padding: 6px 15px; font-size: 17px; font-weight: 700; cursor: pointer; }
  #pk-map-canvas { flex: 1; }
  #pk-map-legend { gap: 14px; flex-wrap: wrap; font-size: 13px; font-weight: 600; }
  #pk-map-legend .lg { display: flex; align-items: center; gap: 5px; }
  #pk-map-legend .dot { width: 15px; height: 15px; border-radius: 50%; box-sizing: border-box; }
  #pk-map-legend .ln { width: 18px; height: 4px; border-radius: 2px; }

  /* Directe parkeer-ingang (v2.70): van het keuzescherm blijft alleen de
     Parkeren-knop over. Nodig bij een herstelmelding, en als er na Stop geen
     voorbeeldscherm komt (bijv. zonder GPS-spoor): dan is er altijd een weg
     terug naar parkeren, nooit het menu met vier modi. */
  .pk-ingang #choose-heading,
  .pk-ingang #mode-note,
  .pk-ingang #mode-btns > .type-btn:not([onclick="chooseParkeren()"]) { display: none; }
</style>
</head>
<body>

<!-- Keuze-scherm -->
<div id="choose-screen">
  <button id="lang-btn" onclick="toggleLang()"
    style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.08);
           border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.5);
           font-family:var(--font);font-size:0.65rem;font-weight:700;letter-spacing:2px;
           text-transform:uppercase;padding:7px 13px;border-radius:20px;
           cursor:pointer;touch-action:manipulation;">EN</button>
  <h1 id="choose-heading">Wat tel je?</h1>

<script>
// ── Taal ──────────────────────────────────────────────────────────────────────
var LANG = 'nl';
var TRANSLATIONS = {

};

var telType     = null;
var telLabel    = null;
var telIcon     = null;
var lastHeading = null;
var lastAcc     = null;
var lastSpeed   = null;
var telCount    = 0;
var telHistory  = [];   // [{ts, lat, lon}]
var startTime   = null;
var holdTimer   = null;
var holdStart   = null;
var wakeLock    = null;
var watching    = null;
var lastLat     = null, lastLon = null;
var lastFixMs   = null;  // v2.17 tijdspoort: wandkloktijd van de vorige GPS-fix
var routeLog    = [];   // [{ts, lat, lon, acc, wayId, osmName}]
var lastRouteLat = null, lastRouteLon = null;
var ROUTE_MIN_DIST = 5; // meter
var HOLD_MS     = 600;

function pad(n){ return String(n).padStart(2,'0'); }

function nowIso() {
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
    +'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function fmtDate(d) {
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function fmtTime(d) {
  return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function genSid() {
  var d = new Date();
  var chars = 'abcdefghijklmnopqrstuvwxyz';
  var rnd = [0,1,2].map(function(){ return chars[Math.floor(Math.random()*26)]; }).join('');
  return pad(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate())
    +'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())
    +'_'+rnd;
}

// ── GPS ──────────────────────────────────────────────────────────────────────
function startGps() {
  if (!navigator.geolocation) return;
  watching = navigator.geolocation.watchPosition(    function(pos) {
      lastLat = pos.coords.latitude;
      lastLon = pos.coords.longitude;
      if (pos.coords.heading != null && !isNaN(pos.coords.heading)) lastHeading = pos.coords.heading;
      if (pos.coords.speed != null && !isNaN(pos.coords.speed)) lastSpeed = pos.coords.speed;
      var acc = Math.round(pos.coords.accuracy || 0);
      lastAcc = acc;
      // v2.17 tijdspoort: GPS-stilte langer dan TIME_GAP_RESET_S (gebouw-
      // passage) verbreekt de continuïteit net zo hard als een teleport.
      // Afstands-poorten zien dit niet (222s-gat met 25m verplaatsing gemeten).
      var nowMs = Date.now();
      if (lastFixMs !== null && (nowMs - lastFixMs) > TIME_GAP_RESET_S * 1000) {
        var gapAnchor = snap.anchorWayId;
        snap.anchorWayId = null; snap.anchorSegIdx = 0; snap.challenger = null;
        snap.stallCount = 0; snap.stallPrev = null;
        traceWrite({ type:'gps', tijdstip:nowIso(), accuracy:acc },
                   lastLat, lastLon, 'time_gap_reset', gapAnchor, null, null, null, []);
      }
      lastFixMs = nowMs;
      gpsUpdateStability(lastLat, lastLon, acc, Date.now());
      snapCheckRefresh(lastLat, lastLon);
      // Huidige snap bepalen (kan null zijn als netwerk nog niet geladen is)
      var snapNow = snapNearestWay(lastLat, lastLon, {type:'gps', tijdstip:nowIso(), accuracy:acc});
      renderSnapConf();
      var widNow  = snapNow ? snapNow.wayId   : '';
      var nameNow = snapNow ? snapNow.osmName : '';
      var segNow  = snapNow ? snapNow.segIdx  : 0;
      // Route-punt opslaan bij voldoende verplaatsing
      if (lastRouteLat === null) {
        lastRouteLat = lastLat; lastRouteLon = lastLon;
        routeLog.push({ ts: nowIso(), lat: lastLat, lon: lastLon, acc: acc, wayId: widNow, segIdx: segNow, osmName: nameNow });
      } else {
        var cos = Math.cos(lastRouteLat * Math.PI / 180);
        var dx = (lastLon - lastRouteLon) * 111320 * cos;
        var dy = (lastLat - lastRouteLat) * 111320;
        var routeStep = Math.sqrt(dx*dx + dy*dy);
        if (routeStep >= ROUTE_MIN_DIST) {
          // v2.17 stall-check op routepunt-cadans (≈5m, identiek aan de
          // gevalideerde replay). Kan snapNow vervangen na een stall-reset.
          snapNow = snapStallCheck(lastLat, lastLon, snapNow, routeStep,
                                   {type:'gps', tijdstip:nowIso(), accuracy:acc});
          widNow  = snapNow ? snapNow.wayId   : '';
          nameNow = snapNow ? snapNow.osmName : '';
          segNow  = snapNow ? snapNow.segIdx  : 0;
          routeLog.push({ ts: nowIso(), lat: lastLat, lon: lastLon, acc: acc, wayId: widNow, segIdx: segNow, osmName: nameNow });
          lastRouteLat = lastLat; lastRouteLon = lastLon;
        }
      }
    },
    function(){},
    { enableHighAccuracy: true, maximumAge: 3000 }
  );
}

function stopGps() {
  if (watching !== null) { navigator.geolocation.clearWatch(watching); watching = null; }
}

// ── Wake Lock ─────────────────────────────────────────────────────────────────
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

// ── Scherm-beheer ─────────────────────────────────────────────────────────────
// Modus-keuze (v2.11): simpel | transect | winkelstraat \u2014 gaat als 'modus' mee in sessie.csv.
// app_type blijft 'pocket' (telrapport blijft de familie herkennen); modus is de sub-discriminator.
var currentModus = 'simpel';
function chooseSimpel() {
  currentModus = 'simpel';
  document.getElementById('mode-note').textContent = '';
  document.getElementById('mode-btns').style.display = 'none';
  document.getElementById('simpel-panel').style.display = 'flex';
}
function backToModes() {
  document.getElementById('other-row').style.display = 'none';
  document.getElementById('simpel-panel').style.display = 'none';
  document.getElementById('mode-btns').style.display = 'flex';
}
// ── Transect-modus (v2.11) ────────────────────────────────────────────────────
// Moving-observer richtingstelling op pocket's snap-core. Een tik = telHistory-
// entry met type + richting (a/b); snap, export, herstel en reassignTrajectory
// erven zo mee. Géén live kaart (consistent met pocket) — visualisatie via de
// bestaande preview-canvas.
var TC_TYPES = [
  { id:'car',   icon:'\uD83D\uDE97' },
  { id:'truck', icon:'\uD83D\uDE9B' },
  { id:'moto',  icon:'\uD83C\uDFCD\uFE0F' },
  { id:'bike',  icon:'\uD83D\uDEB2' },
  { id:'ped',   icon:'\uD83D\uDEB6' }
];
var tcCounts = {};
var tcRichtingA = 'Richting A', tcRichtingB = 'Richting B';

function chooseTransect() { startTransect(); }

function startTransect() {
  if (!magNieuwStarten()) return;   // v2.72
  exportAfgerond = false;           // v2.76: nieuwe telling, noodopslag weer aan
  clearSession();
  currentModus = 'transect';
  telType = 'transect'; telLabel = 'Transect'; telIcon = '\u2194\uFE0F';
  telCount = 0; telHistory = []; routeLog = [];
  lastRouteLat = null; lastRouteLon = null;
  snap.elements = {};
  snap.confScore = null; snap.confLevel = 'none'; snap.confName = '';
  snap.gpsFixWin = []; snap.gpsStabScore = null; snap.gpsStabLevel = 'none';
  startTime = new Date();
  tcCounts = {};
  TC_TYPES.forEach(function(t){ tcCounts[t.id] = { a:0, b:0 }; });
  tcRichtingA = 'Richting A'; tcRichtingB = 'Richting B';

  document.getElementById('choose-screen').style.display = 'none';
  document.getElementById('transect-screen').style.display = 'flex';
  document.getElementById('grand-total').textContent = '0';
  document.getElementById('lbl-a').value = tcRichtingA;
  document.getElementById('lbl-b').value = tcRichtingB;
  var btn = document.getElementById('btn-compass');
  btn.textContent = 'Kompas'; btn.classList.remove('active');
  buildTransectCards();
  document.getElementById('tc-stop').style.display = '';
  document.getElementById('tc-back').style.display = '';
  initBattery();
  acquireWakeLock();
  startGps();
}

function buildTransectCards() {
  var c = document.getElementById('tc-counters');
  c.innerHTML = '';
  TC_TYPES.forEach(function(t){
    var card = document.createElement('div');
    card.className = 'tc-card';
    card.innerHTML =
      '<button class="tc-dir" onclick="adjustTransect(\'' + t.id + '\',\'a\',1)"><span class="tc-sym">&gt;&lt;</span><span class="tc-plus">+1</span></button>' +
      '<div class="tc-cnt" id="tc-' + t.id + '-a">0</div>' +
      '<button class="tc-min" onclick="adjustTransect(\'' + t.id + '\',\'a\',-1)">\u2212</button>' +
      '<div class="tc-mid">' + t.icon + '</div>' +
      '<button class="tc-min" onclick="adjustTransect(\'' + t.id + '\',\'b\',-1)">\u2212</button>' +
      '<div class="tc-cnt" id="tc-' + t.id + '-b">0</div>' +
      '<button class="tc-dir" onclick="adjustTransect(\'' + t.id + '\',\'b\',1)"><span class="tc-sym">&gt;&gt;</span><span class="tc-plus">+1</span></button>';
    c.appendChild(card);
  });
}

function adjustTransect(type, dir, delta) {
  if (!tcCounts[type]) return;
  tcCounts[type][dir] = Math.max(0, tcCounts[type][dir] + delta);
  var cel = document.getElementById('tc-' + type + '-' + dir);
  cel.textContent = tcCounts[type][dir];
  cel.classList.remove('bump'); void cel.offsetWidth; cel.classList.add('bump');

  if (delta > 0) {
    telCount++;
    var e = { ts: nowIso(), lat: lastLat, lon: lastLon, wayId:'', segIdx:0, osmName:'',
              type: type, richting: dir };
    snapResolveTap(e);
    if (navigator.vibrate) navigator.vibrate(25);
  } else {
    for (var i = telHistory.length - 1; i >= 0; i--) {
      if (telHistory[i].type === type && telHistory[i].richting === dir) {
        var rem = telHistory.splice(i, 1)[0];
        var qi = snap.pendingQueue.indexOf(rem);
        if (qi >= 0) snap.pendingQueue.splice(qi, 1);
        telCount = Math.max(0, telCount - 1);
        break;
      }
    }
  }
  var total = 0;
  TC_TYPES.forEach(function(t){ total += tcCounts[t.id].a + tcCounts[t.id].b; });
  document.getElementById('grand-total').textContent = total;
  saveSession();
}

function tcSetLabelA(v){ tcRichtingA = v; }
function tcSetLabelB(v){ tcRichtingB = v; }

  document.getElementById('transect-screen').style.display = 'none';
  document.getElementById('tc-stop').style.display = 'none';

  if (telCount > 0 && !confirm('Terug? ' + telCount + ' tikken gaan verloren als je niet eerst downloadt.')) return;
  closeTransectScreen();

  document.getElementById('choose-screen').style.display = '';
}

// ── Richting-inferentie (uit transect-tool, op pocket's GPS) ───────────────────
function tcDestinationPoint(lat, lon, bearingDeg, distanceKm) {
  var R = 6371, d = distanceKm / R;
  var lat1 = lat*Math.PI/180, lon1 = lon*Math.PI/180, brng = bearingDeg*Math.PI/180;
  var lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(brng));
  var lon2 = lon1 + Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
  return { lat: lat2*180/Math.PI, lon: ((lon2*180/Math.PI)+540)%360-180 };
}
function tcCardinalNL(deg) {
  var dirs = ['Noord','Noordoost','Oost','Zuidoost','Zuid','Zuidwest','West','Noordwest'];
  return dirs[Math.round(((deg%360)+360)%360/45)%8];
}
function tcPlaceNameAt(lat, lon) {
  var url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&zoom=10&addressdetails=1';
  return fetch(url, { headers: { 'Accept-Language': 'nl' } })
    .then(function(r){ return r.json(); })
    .then(function(data){ var a = data.address || {};
      return a.city || a.town || a.village || a.hamlet || a.municipality || a.suburb || null; })
    .catch(function(){ return null; });
}
function tcApplyHeading(heading, lat, lon) {
  var btn = document.getElementById('btn-compass');
  var ahead = (heading + 360) % 360, behind = (heading + 180) % 360;
  var cardA = tcCardinalNL(ahead), cardB = tcCardinalNL(behind);
  function setLabels(pa, pb) {
    var a = pa || cardA, b = pb || cardB;
    tcRichtingA = 'Van ' + b + ' naar ' + a;
    tcRichtingB = 'Van ' + a + ' naar ' + b;
    document.getElementById('lbl-a').value = tcRichtingA;
    document.getElementById('lbl-b').value = tcRichtingB;
    btn.textContent = a + ' / ' + b;
    btn.classList.add('active');
  }
  if (lat != null && lon != null) {
    btn.textContent = 'Zoeken\u2026';
    var pa = tcDestinationPoint(lat, lon, ahead, 5), pb = tcDestinationPoint(lat, lon, behind, 5);
    Promise.all([tcPlaceNameAt(pa.lat, pa.lon), tcPlaceNameAt(pb.lat, pb.lon)])
      .then(function(res){ var a=res[0], b=res[1]; setLabels(a!==b?a:null, a!==b?b:null); });
  } else { setLabels(null, null); }
}
function tcListenCompass(lat, lon) {
  var btn = document.getElementById('btn-compass');
  var readings = [], done = false;
  function onOri(e) {
    if (done) return;
    var h = null;
    if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
    else if (e.alpha != null) h = (360 - e.alpha) % 360;
    if (h == null) return;
    readings.push(h);
    if (readings.length >= 5) {
      done = true;
      window.removeEventListener('deviceorientation', onOri, true);
      window.removeEventListener('deviceorientationabsolute', onOri, true);
      var sinS = readings.reduce(function(s,v){ return s + Math.sin(v*Math.PI/180); }, 0);
      var cosS = readings.reduce(function(s,v){ return s + Math.cos(v*Math.PI/180); }, 0);
      tcApplyHeading((Math.atan2(sinS, cosS)*180/Math.PI+360)%360, lat, lon);
    }
  }
  window.addEventListener('deviceorientationabsolute', onOri, true);
  window.addEventListener('deviceorientation', onOri, true);
  setTimeout(function(){
    if (!done) { done = true;
      window.removeEventListener('deviceorientation', onOri, true);
      window.removeEventListener('deviceorientationabsolute', onOri, true);
      btn.textContent = 'Kompas';
      alert('Geen kompasdata beschikbaar.');
    }
  }, 3000);
}
function autoDirections() {
  var btn = document.getElementById('btn-compass');
  btn.textContent = 'Lezen\u2026'; btn.classList.remove('active');
  if (lastHeading != null && !isNaN(lastHeading)) { tcApplyHeading(lastHeading, lastLat, lastLon); return; }
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(function(p){ if (p === 'granted') tcListenCompass(lastLat, lastLon); else { btn.textContent = 'Kompas'; alert('Geen toestemming.'); } })
      .catch(function(){ btn.textContent = 'Kompas'; });
  } else { tcListenCompass(lastLat, lastLon); }
}

function adjustWinkel(cat, delta) {

// --- audio-feedback (proef, alleen parkeren-submodus) ---------------------
// Web Audio: klik wordt in code gesynthetiseerd, geen geluidsbestand/CDN nodig.
// iOS Safari: de audio-context wordt bij de eerste tik ontgrendeld (resume()).
var GELUID = true;          // zet op false om het klikje uit te zetten
var _actx = null;
function klik(freq, dur) {
  if (!GELUID) return;
  try {
    if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();   // iOS: ontgrendel op de tik-gesture
    var t = _actx.currentTime, osc = _actx.createOscillator(), g = _actx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq || 1100;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.005);          // snelle attack
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.03)); // snelle decay
    osc.connect(g); g.connect(_actx.destination);
    osc.start(t); osc.stop(t + (dur || 0.03) + 0.02);
  } catch (e) { /* audio niet beschikbaar → stil doorgaan */ }
}

var pkMap = null, pkMapLayers = null;
function openPkMap() {

    pkMap = L.map('pk-map-canvas', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(pkMap);
    pkMapLayers = L.layerGroup().addTo(pkMap);
  }
  setTimeout(function () { pkMap.invalidateSize(); tekenPkMap(); }, 60);
}
function closePkMap() {
  document.getElementById('pk-map-overlay').style.display = 'none';
}
function tekenPkMap() {
  if (!pkMapLayers) return;
  pkMapLayers.clearLayers();
  var pts = [];
  // gelopen/gereden route
  if (typeof routeLog !== 'undefined' && routeLog.length) {
    var rc = [];
    routeLog.forEach(function (p) { if (p.lat != null && p.lon != null) rc.push([p.lat, p.lon]); });
    if (rc.length >= 2) {
      L.polyline(rc, { color: '#1f5fbf', weight: 4, opacity: 0.85 }).addTo(pkMapLayers);
      rc.forEach(function (ll) { pts.push(ll); });
    }
  }
  // tik-stippen — de eerlijke laag: waar daadwerkelijk geteld is
  var STAT = { bezet: '#b0342b', leeg: '#3a7d44' };
  var RING = { links: '#ffffff', rechts: '#111111' };
  telHistory.forEach(function (t) {
    if (t.lat == null || t.lon == null) return;
    if (t.type !== 'bezet' && t.type !== 'leeg') return;    // alleen parkeren-tikken
    var m = L.circleMarker([t.lat, t.lon], {
      radius: 8, fillColor: STAT[t.type] || '#555', fillOpacity: 1,
      color: RING[t.richting] || '#111', weight: t.richting === 'links' ? 1.5 : 2.5
    });
    m.bindPopup('<b>' + (t.richting || '') + ' \u00b7 ' + (t.type || '') + '</b><br>' +
                (t.osmName || '') + '<br>' + (t.ts || ''));
    m.addTo(pkMapLayers);
    pts.push([t.lat, t.lon]);
  });
  if (pts.length) {
    pkMap.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 18 });
  }
}

function adjustParkeer(key, delta) {
  if (!(key in pkCounts)) return;
  var parts = key.split('_');            // side_status
  if (delta > 0) {
    pkCounts[key]++;
    telCount++;
    var e = { ts: nowIso(), lat: lastLat, lon: lastLon, wayId:'', segIdx:0, osmName:'',
              type: parts[1], richting: parts[0] };
    snapResolveTap(e);
    if (navigator.vibrate) navigator.vibrate(25);
    klik(parts[1] === 'bezet' ? 440 : 392, 0.05);  // bezet = A/440 (hoger), vrij = G/392 (lager)
  } else {
    if (pkCounts[key] <= 0) return;
    for (var i = telHistory.length - 1; i >= 0; i--) {
      if (telHistory[i].type === parts[1] && telHistory[i].richting === parts[0]) {
        var rem = telHistory.splice(i, 1)[0];
        var qi = snap.pendingQueue.indexOf(rem);
        if (qi >= 0) snap.pendingQueue.splice(qi, 1);
        telCount = Math.max(0, telCount - 1);
        pkCounts[key]--;
        klik(560, 0.05);         // lagere 'ongedaan'-toon
        break;
      }

// ── Sessieherstel (v2.11) ─────────────────────────────────────────────────────
// localStorage-vangnet: telt élke tik door zodat crash/scherm-uit geen
// veldgegevens kost. Bewust géén snap.elements (te groot + secundair); de tikken
// dragen hun eigen wayId, dus de export blijft volledig. Wissen pas ná bevestigd
// klaar (preview sluiten) of bij een nieuwe sessie \u2014 nooit blind na generateAsync.
var LS_KEY_POCKET = 'pocket_sessie';

// v2.76: is de telling afgerond en de ZIP bevestigd weggeschreven, dan hoort de
// noodkopie weg te blijven. Tot v2.76 schreef saveSession() hem bij de eerstvolgende
// app-wissel of paginawissel opnieuw (telHistory is na Stop nog gevuld), en bood
// pocket bij heropenen een telling aan die allang gedownload was.
var exportAfgerond = false;

// De ZIP is aantoonbaar weggeschreven (deelblad voltooid, download overgedragen)
// of de gebruiker sloot het voorbeeldscherm: noodkopie weg, en weg houden.
function exportBevestigd() {
  exportAfgerond = true;
  clearSession();
}

function saveSession() {
  if (!telHistory.length || exportAfgerond) return;
  try {
    localStorage.setItem(LS_KEY_POCKET, JSON.stringify({
      modus: currentModus, telType: telType, telLabel: telLabel, telIcon: telIcon,
      telCount: telCount, telHistory: telHistory, routeLog: routeLog,
      tcCounts: tcCounts, richtingA: tcRichtingA, richtingB: tcRichtingB,
      startTime: startTime ? startTime.toISOString() : null, savedAt: nowIso()
    }));
  } catch (e) {}
}

function clearSession() {
  try { localStorage.removeItem(LS_KEY_POCKET); } catch (e) {}
}

function restoreSession() {
  var raw;
  try { raw = localStorage.getItem(LS_KEY_POCKET); } catch (e) { return; }
  if (!raw) return;
  var data;
  try { data = JSON.parse(raw); } catch (e) { clearSession(); return; }
  if (!data.telHistory || !data.telHistory.length) { clearSession(); return; }

  currentModus = data.modus || 'simpel';
  telType = data.telType; telLabel = data.telLabel; telIcon = data.telIcon;
  telCount = (data.telCount != null) ? data.telCount : data.telHistory.length;
  telHistory = data.telHistory;
  routeLog = data.routeLog || [];
  tcRichtingA = data.richtingA || 'Richting A';
  tcRichtingB = data.richtingB || 'Richting B';
  tcCounts = data.tcCounts || {};
  startTime = data.startTime ? new Date(data.startTime) : new Date();

  document.getElementById('restore-text').textContent = '\u26A0\uFE0F ' + telCount +
    ' tikken hersteld van ' + (data.savedAt || '?') +
    ' (' + (data.telLabel || data.telType || currentModus) + ').';
  document.getElementById('restore-banner').style.display = '';
}

function restoreDownload() {
  document.getElementById('restore-banner').style.display = 'none';
  stopTelling();   // bouwt + biedt de ZIP aan uit de herstelde state
}

function restoreDiscard() {
  if (!confirm('Herstelde telling verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
  clearSession();

}

// ── Doortellen na herstel (v2.72) ───────────────────────────────────────
// Een herstelde telling kan verder, in dezelfde modus en met dezelfde tikken,
// route en starttijd. Werkwijze: de modus gewoon starten (scherm, GPS,
// scherm-aan), en daarna de telling terugzetten. De start*-functies wissen de
// noodopslag; saveSession() aan het eind schrijft hem meteen terug.
// De onderbreking blijft zichtbaar als gat in de GPS-route.
function herstelZichtbaar() {
  var b = document.getElementById('restore-banner');
  return !!(b && b.style.display !== 'none');
}

// Nieuwe telling terwijl er een herstelde klaarstaat: die zou stil gewist worden.
function magNieuwStarten() {
  if (!herstelZichtbaar()) return true;
  if (!confirm('Nieuwe telling starten? De herstelde telling (' + telCount + ' tikken) wordt dan gewist. '
               + 'Kies anders Doortellen of Download.')) return false;
  document.getElementById('restore-banner').style.display = 'none';
  return true;
}

function hervatTelling() {
  if (!herstelZichtbaar() || !telHistory.length) return;
  var bewaard = {
    modus: currentModus, telType: telType, telLabel: telLabel, telIcon: telIcon,
    telCount: telCount, telHistory: telHistory, routeLog: routeLog, startTime: startTime,
    tcCounts: tcCounts, tcRichtingA: tcRichtingA, tcRichtingB: tcRichtingB
  };
  document.getElementById('restore-banner').style.display = 'none';

  if (bewaard.modus === 'transect') startTransect();
  else if (bewaard.modus === 'winkelstraat') startWinkelstraat();
  else if (bewaard.modus === 'parkeren') startParkeren();
  else { currentModus = 'simpel'; startTelling(bewaard.telType, bewaard.telIcon, bewaard.telLabel); }

  telCount = bewaard.telCount; telHistory = bewaard.telHistory;
  routeLog = bewaard.routeLog; startTime = bewaard.startTime;
  var laatste = routeLog[routeLog.length - 1];
  if (laatste) { lastRouteLat = laatste.lat; lastRouteLon = laatste.lon; }

  if (currentModus === 'transect') {
    tcRichtingA = bewaard.tcRichtingA; tcRichtingB = bewaard.tcRichtingB;
    document.getElementById('lbl-a').value = tcRichtingA;
    document.getElementById('lbl-b').value = tcRichtingB;
    var totaal = 0;
    TC_TYPES.forEach(function (t) {
      var c = (bewaard.tcCounts && bewaard.tcCounts[t.id]) || { a: 0, b: 0 };
      tcCounts[t.id] = { a: c.a, b: c.b };
      ['a', 'b'].forEach(function (d) {
        var cel = document.getElementById('tc-' + t.id + '-' + d);
        if (cel) cel.textContent = c[d];
      });
      totaal += c.a + c.b;
    });
    document.getElementById('grand-total').textContent = totaal;
  } else if (currentModus === 'winkelstraat') {
    WS_CATS.forEach(function (c) { wsCounts[c.id] = 0; });
    telHistory.forEach(function (e) { if (e.type in wsCounts) wsCounts[e.type]++; });
    updateWinkelDisplay();
  } else if (currentModus === 'parkeren') {
    PK_CATS.forEach(function (c) { pkCounts[pkKey(c)] = 0; });
    telHistory.forEach(function (e) {
      var k = e.richting + '_' + e.type;
      if (k in pkCounts) pkCounts[k]++;
    });
    updateParkeerDisplay();
  } else {
    document.getElementById('big-count').textContent = telCount;
  }
  saveSession();
}
